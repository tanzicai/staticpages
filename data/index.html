<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>专业数据驾驶舱｜浅冰蓝动态科技增强版</title>
  <style>
    :root {
      --ice-top: #eef6ff;
      --ice-bottom: #d8eaff;
      --tech-blue: #3b9dff;
      --ink-blue: #12345d;
    }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: linear-gradient(145deg, var(--ice-top), var(--ice-bottom));
    }
    body {
      display: grid;
      place-items: center;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    }
    .stage {
      position: relative;
      display: grid;
      width: 100vw;
      height: 100vh;
      place-items: center;
      isolation: isolate;
      overflow: hidden;
    }
    .stage::before {
      position: absolute;
      inset: 0;
      z-index: -1;
      content: "";
      background:
        radial-gradient(circle at 18% 16%, rgb(255 255 255 / 68%), transparent 34%),
        radial-gradient(circle at 84% 82%, rgb(91 169 255 / 13%), transparent 36%);
      pointer-events: none;
    }
    .dashboard {
      display: block;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      object-position: center;
      image-rendering: auto;
      transform: translateZ(0);
      backface-visibility: hidden;
      user-select: none;
      -webkit-user-drag: none;
    }
    .loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-blue);
      font-size: clamp(14px, 1.2vw, 22px);
      letter-spacing: .12em;
      background: linear-gradient(145deg, var(--ice-top), var(--ice-bottom));
      transition: opacity .3s ease, visibility .3s ease;
    }
    .loading::before {
      width: 42px;
      height: 42px;
      margin-right: 14px;
      content: "";
      border: 3px solid rgb(59 157 255 / 20%);
      border-top-color: var(--tech-blue);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    .loading-inner { display: block; }
    .is-ready .loading {
      visibility: hidden;
      opacity: 0;
    }
    @keyframes spin { to { transform: rotate(1turn); } }

    /* 动态科技感Canvas背景（替代原GIF图，体积更小） */
    #bgCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }
    /* 数据面板覆盖层 - 用CSS绘制模拟驾驶舱UI，节省图片体积 */
    .overlay-panel {
      position: absolute;
      z-index: 1;
      pointer-events: none;
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows: 1fr 1fr 1fr;
      gap: 2%;
      padding: 3%;
      opacity: 0.85;
    }
    .panel-item {
      background: rgba(18, 52, 93, 0.08);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(59, 157, 255, 0.15);
      border-radius: 16px;
      padding: 12% 8%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--ink-blue);
      font-weight: 300;
      letter-spacing: 0.05em;
      box-shadow: 0 4px 30px rgba(59, 157, 255, 0.06);
    }
    .panel-item .label {
      font-size: clamp(10px, 0.8vw, 16px);
      opacity: 0.6;
      margin-bottom: 4px;
    }
    .panel-item .value {
      font-size: clamp(20px, 2.2vw, 48px);
      font-weight: 600;
      background: linear-gradient(135deg, var(--ink-blue), var(--tech-blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .panel-item .sub {
      font-size: clamp(8px, 0.5vw, 12px);
      opacity: 0.4;
      margin-top: 4px;
    }
    .panel-item:nth-child(1) { grid-column: 1; grid-row: 1; }
    .panel-item:nth-child(2) { grid-column: 2; grid-row: 1; }
    .panel-item:nth-child(3) { grid-column: 3; grid-row: 1; }
    .panel-item:nth-child(4) { grid-column: 1; grid-row: 2; }
    .panel-item:nth-child(5) { grid-column: 2; grid-row: 2; }
    .panel-item:nth-child(6) { grid-column: 3; grid-row: 2; }
    .panel-item:nth-child(7) { grid-column: 1; grid-row: 3; }
    .panel-item:nth-child(8) { grid-column: 2; grid-row: 3; }
    .panel-item:nth-child(9) { grid-column: 3; grid-row: 3; }

    @media (max-width: 768px) {
      .overlay-panel {
        grid-template-columns: 1fr 1fr;
        grid-template-rows: auto;
        gap: 1.5%;
        padding: 2%;
      }
      .panel-item:nth-child(1) { grid-column: 1; grid-row: 1; }
      .panel-item:nth-child(2) { grid-column: 2; grid-row: 1; }
      .panel-item:nth-child(3) { grid-column: 1; grid-row: 2; }
      .panel-item:nth-child(4) { grid-column: 2; grid-row: 2; }
      .panel-item:nth-child(5) { grid-column: 1; grid-row: 3; }
      .panel-item:nth-child(6) { grid-column: 2; grid-row: 3; }
      .panel-item:nth-child(7) { grid-column: 1; grid-row: 4; }
      .panel-item:nth-child(8) { grid-column: 2; grid-row: 4; }
      .panel-item:nth-child(9) { grid-column: 1; grid-row: 5; }
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="专业数据驾驶舱动态展示">
    <!-- 动态Canvas背景 - 替代原GIF，体积极小 -->
    <canvas id="bgCanvas"></canvas>

    <!-- 数据面板覆盖层 - CSS绘制，零图片体积 -->
    <div class="overlay-panel" id="panel">
      <div class="panel-item"><div class="label">总营收</div><div class="value" id="v1">¥8.42M</div><div class="sub">↑12.3%</div></div>
      <div class="panel-item"><div class="label">活跃用户</div><div class="value" id="v2">124.7K</div><div class="sub">↑8.1%</div></div>
      <div class="panel-item"><div class="label">转化率</div><div class="value" id="v3">23.6%</div><div class="sub">↑2.4%</div></div>
      <div class="panel-item"><div class="label">客单价</div><div class="value" id="v4">¥1,280</div><div class="sub">↑5.7%</div></div>
      <div class="panel-item"><div class="label">复购率</div><div class="value" id="v5">67.2%</div><div class="sub">↑3.1%</div></div>
      <div class="panel-item"><div class="label">新增用户</div><div class="value" id="v6">8.9K</div><div class="sub">↑18.6%</div></div>
      <div class="panel-item"><div class="label">DAU</div><div class="value" id="v7">32.4K</div><div class="sub">↑6.2%</div></div>
      <div class="panel-item"><div class="label">留存率</div><div class="value" id="v8">54.8%</div><div class="sub">↑1.9%</div></div>
      <div class="panel-item"><div class="label">好评率</div><div class="value" id="v9">98.3%</div><div class="sub">↑0.7%</div></div>
    </div>

    <!-- 加载提示 -->
    <div class="loading" id="loading"><span class="loading-inner">加载驾驶舱数据...</span></div>
  </main>

  <script>
    (function() {
      // ===== Canvas 动态科技感背景 =====
      const canvas = document.getElementById('bgCanvas');
      const ctx = canvas.getContext('2d');
      let w, h;
      let particles = [];
      const PARTICLE_COUNT = 60;
      const CONNECTION_DIST = 150;

      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      class Particle {
        constructor() { this.reset(); }
        reset() {
          this.x = Math.random() * w;
          this.y = Math.random() * h;
          this.vx = (Math.random() - 0.5) * 0.6;
          this.vy = (Math.random() - 0.5) * 0.6;
          this.r = Math.random() * 2 + 1.2;
          this.alpha = Math.random() * 0.5 + 0.2;
        }
        update() {
          this.x += this.vx;
          this.y += this.vy;
          if (this.x < 0 || this.x > w) this.vx *= -1;
          if (this.y < 0 || this.y > h) this.vy *= -1;
        }
        draw() {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(59, 157, 255, ${this.alpha})`;
          ctx.fill();
        }
      }

      function initParticles() {
        particles = [];
        for (let i = 0; i < PARTICLE_COUNT; i++) {
          particles.push(new Particle());
        }
      }
      initParticles();

      function drawLines() {
        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < CONNECTION_DIST) {
              const alpha = (1 - dist / CONNECTION_DIST) * 0.35;
              ctx.beginPath();
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              ctx.strokeStyle = `rgba(59, 157, 255, ${alpha})`;
              ctx.lineWidth = 0.8;
              ctx.stroke();
            }
          }
        }
      }

      // 额外光晕
      function drawGlow() {
        const grad = ctx.createRadialGradient(w * 0.2, h * 0.2, 0, w * 0.2, h * 0.2, w * 0.6);
        grad.addColorStop(0, 'rgba(59, 157, 255, 0.04)');
        grad.addColorStop(1, 'rgba(59, 157, 255, 0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
      }

      function animate() {
        ctx.clearRect(0, 0, w, h);
        drawGlow();
        particles.forEach(p => { p.update(); p.draw(); });
        drawLines();
        requestAnimationFrame(animate);
      }
      animate();

      // ===== 模拟数据动态更新 =====
      function randomRange(min, max) { return Math.round((Math.random() * (max - min) + min) * 10) / 10; }

      function updateData() {
        const data = [
          { el: 'v1', base: 8.42, unit: 'M', symbol: '¥', change: 12.3, range: 0.3 },
          { el: 'v2', base: 124.7, unit: 'K', symbol: '', change: 8.1, range: 3 },
          { el: 'v3', base: 23.6, unit: '%', symbol: '', change: 2.4, range: 0.8 },
          { el: 'v4', base: 1280, unit: '', symbol: '¥', change: 5.7, range: 40 },
          { el: 'v5', base: 67.2, unit: '%', symbol: '', change: 3.1, range: 0.8 },
          { el: 'v6', base: 8.9, unit: 'K', symbol: '', change: 18.6, range: 0.5 },
          { el: 'v7', base: 32.4, unit: 'K', symbol: '', change: 6.2, range: 1.2 },
          { el: 'v8', base: 54.8, unit: '%', symbol: '', change: 1.9, range: 0.7 },
          { el: 'v9', base: 98.3, unit: '%', symbol: '', change: 0.7, range: 0.3 }
        ];
        data.forEach(d => {
          const el = document.getElementById(d.el);
          if (!el) return;
          let val = d.base + (Math.random() - 0.5) * d.range;
          if (d.unit === 'M') val = (Math.round(val * 10) / 10).toFixed(2);
          else if (d.unit === 'K') val = Math.round(val * 10) / 10;
          else if (d.unit === '%') val = (Math.round(val * 10) / 10).toFixed(1);
          else val = Math.round(val);
          el.textContent = d.symbol + val + d.unit;
        });
      }

      // 初次显示后移除loading
      setTimeout(() => {
        document.getElementById('loading').parentElement.classList.add('is-ready');
      }, 600);

      // 每3.5秒更新一次数据
      setInterval(updateData, 3500);
      updateData();

      // ===== 窗口变化自适应 =====
      window.addEventListener('resize', () => {
        resize();
        initParticles();
      });

    })();
  </script>
</body>
</html>
