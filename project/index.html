<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>观澜赛事运营平台 · GUANLAN</title>
<style>
:root{
  --paper:#f5f2eb; --paper2:#fbf9f4; --card:#fffefa;
  --ink:#24211c; --ink2:#49443a; --muted:#797266; --faint:#a8a091;
  --line:#e5e0d5; --line2:#d4ccbc;
  --brand:#1e4b3d; --brand2:#2f6b57; --brand-soft:rgba(30,75,61,.09);
  --rust:#b1503a; --rust-soft:rgba(177,80,58,.10);
  --ochre:#a9792f; --ochre-soft:rgba(169,121,47,.13);
  --shadow:0 1px 2px rgba(40,35,25,.04),0 10px 34px rgba(40,35,25,.055);
  --r:8px; --r2:6px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--paper);color:var(--ink);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;outline:none}
button{cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#d3ccbc;border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:#bdb4a2}
::-webkit-scrollbar-track{background:transparent}
svg{display:block;flex:none}
.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ic-sm{width:15px;height:15px}.ic-lg{width:22px;height:22px}.ic-xl{width:30px;height:30px}
.serif{font-family:'Songti SC','Noto Serif SC',Georgia,serif}

/* ===== LOGIN ===== */
#loginView{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:var(--paper);overflow:hidden}
#loginView:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(36,33,28,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(36,33,28,.035) 1px,transparent 1px);background-size:54px 54px;-webkit-mask-image:linear-gradient(90deg,#000,transparent 80%);mask-image:linear-gradient(90deg,#000,transparent 80%)}
.login-page{position:relative;z-index:2;width:min(1120px,94vw);min-height:680px;display:grid;grid-template-columns:1.1fr .9fr;background:var(--card);border:1px solid var(--line);box-shadow:0 34px 90px rgba(40,35,25,.13)}
.login-editorial{position:relative;padding:52px 54px;display:flex;flex-direction:column;justify-content:space-between;background:#1d352c;color:#f4efe3;overflow:hidden}
.login-editorial:after{content:"";position:absolute;width:480px;height:480px;border:1px solid rgba(244,239,227,.08);border-radius:50%;right:-190px;bottom:-230px;box-shadow:0 0 0 60px rgba(244,239,227,.025),0 0 0 120px rgba(244,239,227,.015)}
.ed-top{display:flex;align-items:center;gap:13px;position:relative;z-index:2}
.ed-brand{font-family:'Songti SC','Noto Serif SC',Georgia,serif;font-size:20px;letter-spacing:2px}
.ed-brand span{font-family:-apple-system,sans-serif;font-size:10px;letter-spacing:3px;color:#a9bdb0;margin-left:8px}
.brand-mark{width:38px;height:38px;border-radius:5px;display:grid;place-items:center;background:#f0e6cf;color:#1d352c;flex:none}
.ed-body{position:relative;z-index:2;margin-top:26px}
.ed-kicker,.lb-kicker{font-size:10px;letter-spacing:3px;color:#c8a86a;font-weight:700}
.ed-body h1{font-family:'Songti SC','Noto Serif SC',Georgia,serif;font-size:40px;line-height:1.42;font-weight:600;letter-spacing:1px;margin:18px 0 16px}
.ed-body h1 em{font-style:normal;color:#e3bd79}
.ed-lede{color:#c3cec5;font-size:13px;line-height:2;max-width:430px}
.ed-line{width:52px;height:2px;background:#c8a86a;margin:30px 0 24px}
.ed-features{display:flex;flex-direction:column;gap:15px}
.ed-feat{display:flex;gap:15px;align-items:flex-start}
.ed-feat i{font-family:Georgia,serif;font-style:normal;font-size:12px;color:#c8a86a;padding-top:3px}
.ed-feat b{display:block;font-size:13.5px;font-weight:600;margin-bottom:3px}
.ed-feat span{font-size:11.5px;color:#9fb0a5}
.ed-foot{position:relative;z-index:2;margin-top:26px;font-size:9.5px;letter-spacing:1.6px;color:#8fa195}
.login-right{padding:54px 52px 40px;display:flex;flex-direction:column;justify-content:center;background:var(--card)}
.login-box{width:100%;max-width:360px;margin:0 auto}
.lb-kicker{color:var(--rust)}
.login-box h2{font-family:'Songti SC','Noto Serif SC',Georgia,serif;font-size:29px;font-weight:600;margin:12px 0 6px;letter-spacing:1px}
.lb-sub{color:var(--muted);font-size:12.5px;margin-bottom:30px}
.ltabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin-bottom:28px}
.ltab{padding:0 0 12px;font-size:13px;color:var(--faint);border-bottom:2px solid transparent;transition:.2s;position:relative;top:1px}
.ltab:hover{color:var(--ink2)}.ltab.on{color:var(--rust);border-color:var(--rust);font-weight:600}
.lform{display:flex;flex-direction:column;gap:17px;min-height:190px}
.fld label{display:block;font-size:11px;letter-spacing:.6px;color:var(--muted);margin-bottom:8px}
.inp{width:100%;height:44px;background:var(--paper2);border:1px solid var(--line);border-radius:var(--r2);padding:0 13px;color:var(--ink);transition:.2s}
.inp:focus{border-color:var(--rust);box-shadow:0 0 0 3px var(--rust-soft);background:#fff}
.inp::placeholder{color:#b2aa9c}
.inp-row{display:flex;gap:10px}.inp-row .inp{flex:1}
.code-btn{height:44px;padding:0 14px;border:1px solid var(--line2);border-radius:var(--r2);color:var(--rust);background:var(--rust-soft);white-space:nowrap;font-size:12.5px}
.code-btn:hover{border-color:var(--rust)}
.login-opts{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-top:-3px}
.chk{display:flex;align-items:center;gap:7px;cursor:pointer}
.chk input{appearance:none;width:15px;height:15px;border:1px solid var(--line2);border-radius:3px;background:var(--paper2);cursor:pointer}
.chk input:checked{background:var(--rust);border-color:var(--rust);box-shadow:inset 0 0 0 3px var(--paper2)}
.login-opts a{color:var(--rust);cursor:pointer}
.btn-main{height:46px;border-radius:var(--r2);background:var(--brand);color:#fff;font-weight:600;font-size:13px;letter-spacing:2px;transition:.2s}
.btn-main:hover{background:#173c31;transform:translateY(-1px);box-shadow:0 8px 22px rgba(30,75,61,.22)}
.sso-btn{width:100%;height:46px;border:1px solid var(--line2);border-radius:var(--r2);background:var(--paper2);display:flex;align-items:center;justify-content:center;gap:10px;color:var(--ink);font-size:13px}
.sso-btn:hover{border-color:var(--brand);background:var(--brand-soft)}
.sso-opts{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.sso-opt{display:flex;align-items:center;gap:8px;padding:11px 12px;border:1px solid var(--line);border-radius:var(--r2);background:var(--paper2);font-size:12px;color:var(--muted);cursor:pointer;transition:.15s}
.sso-opt:hover{border-color:var(--line2);color:var(--ink)}
.sso-opt.on{border-color:var(--rust);color:var(--rust);background:var(--rust-soft)}
.err{color:var(--rust);font-size:12px;min-height:16px}
.login-legal{text-align:center;font-size:10px;color:var(--faint);margin-top:28px;letter-spacing:.5px}

/* ===== APP SHELL ===== */
#appShell{display:none;height:100vh;width:100vw;flex-direction:column}
.masthead{flex:none;background:var(--card);border-bottom:1px solid var(--line)}
.mast-top{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 34px;border-bottom:1px solid var(--line)}
.mast-brand{display:flex;align-items:center;gap:11px}
.mast-brand .brand-mark{width:30px;height:30px;border-radius:4px;background:var(--brand);color:#f0e6cf}
.mast-brand b{font-family:'Songti SC','Noto Serif SC',Georgia,serif;font-size:18px;letter-spacing:2px}
.mast-brand small{display:block;font-size:8.5px;letter-spacing:2px;color:var(--faint);margin-top:-2px}
.mast-tools{display:flex;align-items:center;gap:9px}
.tb-search{height:32px;width:200px;background:var(--paper2);border:1px solid var(--line);border-radius:var(--r2);display:flex;align-items:center;gap:8px;padding:0 11px;color:var(--faint);font-size:12px}
.tb-search input{background:none;border:none;flex:1;color:var(--ink);font-size:12px}
.tb-icon{width:32px;height:32px;border-radius:var(--r2);display:grid;place-items:center;color:var(--muted);border:1px solid transparent}
.tb-icon:hover{background:var(--paper2);border-color:var(--line);color:var(--ink)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--brand);display:grid;place-items:center;color:#f0e6cf;font-weight:600;font-size:12px}
.user-meta{line-height:1.25;white-space:nowrap}.user-meta b{font-size:12px;display:block}.user-meta span{font-size:10px;color:var(--faint);display:block}
.mast-nav{height:50px;display:flex;align-items:center;gap:20px;padding:0 34px;overflow-x:auto;scrollbar-width:none}
.mast-nav::-webkit-scrollbar{display:none}
.nav-seg{display:flex;align-items:center;gap:4px;flex:none;padding-right:20px;border-right:1px solid var(--line)}
.nav-seg:last-child{border-right:none}
.nav-g{font-size:9.5px;letter-spacing:1.6px;color:var(--faint);margin-right:6px;white-space:nowrap;font-weight:600}
.nav-i{display:flex;align-items:center;gap:6px;padding:7px 11px;border-radius:var(--r2);font-size:12.5px;color:var(--ink2);white-space:nowrap;transition:.15s}
.nav-i:hover{background:var(--paper2);color:var(--ink)}
.nav-i.on{background:var(--brand);color:#fff;font-weight:600}
.stage{flex:1;display:flex;flex-direction:column;min-height:0}
.stage-head{flex:none;padding:24px 34px 20px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--paper2),var(--paper))}
.stage-kicker{font-size:9.5px;letter-spacing:2.6px;color:var(--rust);font-weight:700;text-transform:uppercase}
.stage-head h1{font-family:'Songti SC','Noto Serif SC',Georgia,serif;font-size:29px;font-weight:600;letter-spacing:1px;margin:5px 0 4px}
.stage-head p{color:var(--muted);font-size:12.5px;max-width:900px}
#mainContent{flex:1;overflow-y:auto;padding:24px 34px 60px}

/* ===== COMMON ===== */
.page{animation:fade .3s ease}@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.page-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:16px;padding-bottom:13px;border-bottom:1px dashed var(--line)}
.page-head h2{font-size:14px;font-weight:600;color:var(--ink2);letter-spacing:.5px}
.page-head p{color:var(--muted);font-size:12px;margin-top:3px}
.head-actions{display:flex;gap:9px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
.card-h h3{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px}
.card-h h3 .ic{color:var(--rust)}
.card-b{padding:18px}
.btn{height:34px;padding:0 13px;border-radius:var(--r2);border:1px solid var(--line2);background:var(--card);display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);transition:.16s;white-space:nowrap}
.btn:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
.btn.gold{background:var(--rust);color:#fff;border-color:var(--rust);font-weight:600}
.btn.gold:hover{background:#97412e;border-color:#97412e;color:#fff}
.btn.teal{background:var(--brand-soft);border-color:rgba(30,75,61,.3);color:var(--brand)}
.btn.teal:hover{background:rgba(30,75,61,.16)}
.btn.danger{color:var(--rust);border-color:rgba(177,80,58,.3)}
.btn.danger:hover{background:var(--rust-soft)}
.btn.sm{height:28px;padding:0 9px;font-size:11px;border-radius:5px}
.btn.icon{width:32px;padding:0;justify-content:center}
.grid{display:grid;gap:15px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1180px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:3px;font-size:10.5px;background:var(--paper2);border:1px solid var(--line);color:var(--muted)}
.tag.g{background:var(--brand-soft);color:var(--brand);border-color:rgba(30,75,61,.25)}
.tag.t{background:var(--ochre-soft);color:#8a6323;border-color:rgba(169,121,47,.28)}
.tag.r{background:var(--rust-soft);color:var(--rust);border-color:rgba(177,80,58,.28)}
.stat{padding:17px 18px;position:relative;overflow:hidden;border-left:2px solid var(--rust)}
.stat:nth-child(even){border-left-color:var(--brand)}
.stat .lbl{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:7px}
.stat .lbl .ic{color:var(--rust)}
.stat:nth-child(even) .lbl .ic{color:var(--brand)}
.stat .num{font-family:Georgia,'Songti SC',serif;font-size:29px;font-weight:600;margin:8px 0 3px;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.stat .sub{font-size:10.5px;color:var(--faint)}
.stat .sub b{color:var(--brand)}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;padding:10px 13px;color:var(--faint);font-weight:600;font-size:10px;letter-spacing:1px;border-bottom:1px solid var(--line2);white-space:nowrap;text-transform:uppercase}
.tbl td{padding:11px 13px;border-bottom:1px solid var(--line);color:var(--ink)}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr:hover{background:var(--paper2)}
.tbl .mini{color:var(--faint);font-size:10.5px}
.rowacts{display:flex;gap:5px}
.icobtn{width:26px;height:26px;border-radius:5px;display:grid;place-items:center;color:var(--muted);border:1px solid transparent}
.icobtn:hover{background:var(--paper2);color:var(--brand);border-color:var(--line)}
.icobtn.del:hover{color:var(--rust);background:var(--rust-soft)}
.empty{padding:40px;text-align:center;color:var(--faint);font-size:12px}
.empty .ic{margin:0 auto 12px;color:var(--line2)}
.divider{height:1px;background:var(--line);margin:17px 0}
.f-row{margin-bottom:13px}
.f-row>label{display:block;font-size:11.5px;color:var(--ink2);margin-bottom:7px;font-weight:600}
.f-row>label i{color:var(--rust);font-style:normal}
.inp2,.sel2,.ta2{width:100%;min-height:37px;background:var(--paper2);border:1px solid var(--line);border-radius:var(--r2);padding:8px 11px;color:var(--ink);transition:.16s}
.inp2:focus,.sel2:focus,.ta2:focus{border-color:var(--rust);box-shadow:0 0 0 3px var(--rust-soft);background:#fff}
.ta2{resize:vertical;min-height:78px;line-height:1.6}
.sel2{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23797266' stroke-width='2'><path d='m6 9 6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 10px center;padding-right:30px}
.switch{width:36px;height:20px;border-radius:20px;background:#cfc8b9;position:relative;transition:.2s;cursor:pointer;flex:none}
.switch:after{content:"";position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;left:3px;top:3px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.switch.on{background:var(--brand)}.switch.on:after{left:19px}
.seg{display:inline-flex;background:var(--paper2);border:1px solid var(--line);border-radius:var(--r2);padding:3px;gap:2px}
.seg button{padding:6px 12px;border-radius:5px;font-size:11.5px;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--card);color:var(--rust);box-shadow:0 1px 4px rgba(40,35,25,.1);font-weight:600}
.tabs{display:flex;gap:3px;border-bottom:1px solid var(--line);margin-bottom:17px;overflow-x:auto}
.tab{padding:9px 15px;font-size:12.5px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer;transition:.16s}
.tab:hover{color:var(--ink)}.tab.on{color:var(--rust);border-color:var(--rust);font-weight:600}
.bar{height:5px;border-radius:5px;background:#e8e2d6;overflow:hidden}.bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--rust),#d08a63)}
.bar.teal i{background:linear-gradient(90deg,var(--brand),#5b9a83)}

/* ===== MODAL / TOAST ===== */
#modalRoot{position:fixed;inset:0;z-index:80;display:none}
.mask{position:absolute;inset:0;background:rgba(36,33,28,.42);backdrop-filter:blur(3px)}
.modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,92vw);max-height:86vh;overflow:auto;background:var(--card);border:1px solid var(--line2);border-radius:var(--r);box-shadow:0 30px 80px rgba(40,35,25,.22);animation:pop .2s ease}
@keyframes pop{from{opacity:0;transform:translate(-50%,-47%) scale(.98)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.modal.wide{width:min(900px,94vw)}
.modal-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal-h h3{font-size:14px;font-weight:600}
.modal-b{padding:20px}
.modal-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px}
#toastRoot{position:fixed;top:20px;right:24px;z-index:100;display:flex;flex-direction:column;gap:9px;pointer-events:none}
.toast{min-width:220px;max-width:350px;padding:12px 15px;border-radius:var(--r2);background:var(--card);border:1px solid var(--line2);box-shadow:var(--shadow);display:flex;align-items:center;gap:9px;font-size:12.5px;animation:slidein .25s ease}
.toast.ok{border-left:3px solid var(--brand)}.toast.err{border-left:3px solid var(--rust)}.toast.info{border-left:3px solid var(--ochre)}
@keyframes slidein{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:6px 11px;border:1px solid var(--line);border-radius:5px;background:var(--paper2);font-size:11.5px;color:var(--muted);cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--line2);color:var(--ink)}
.chip.on{border-color:var(--rust);color:var(--rust);background:var(--rust-soft)}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:12px}
.kv:last-child{border:none}.kv span{color:var(--muted)}.kv b{font-weight:600}
.tip{font-size:11px;color:var(--faint);line-height:1.7}
.pill-num{font-variant-numeric:tabular-nums}
.hl{color:var(--rust)}
.mini-head{font-size:10px;letter-spacing:1.6px;color:var(--faint);margin-bottom:11px;font-weight:700;text-transform:uppercase}
</style>
</head>
<body>

<!-- ========== LOGIN ========== -->
<div id="loginView">
  <div class="login-page">
    <div class="login-editorial">
      <div class="ed-top"><div class="brand-mark" id="loginMark"></div><div class="ed-brand">观澜 <span>GUANLAN</span></div></div>
      <div class="ed-body">
        <div class="ed-kicker">COMPETITION OPERATIONS · 2026</div>
        <h1>以数据为尺，<br><em>丈量每一场竞技。</em></h1>
        <p class="ed-lede">从报名采集、流程审批到门户与大屏呈现，一套平台贯通赛事全周期，让运营有据可依。</p>
        <div class="ed-line"></div>
        <div class="ed-features">
          <div class="ed-feat"><i>01</i><div><b>多引擎业务支撑</b><span>表单 · 审批 · 图表协同联动</span></div></div>
          <div class="ed-feat"><i>02</i><div><b>可视化搭建能力</b><span>组件、内容与门户自由配置</span></div></div>
          <div class="ed-feat"><i>03</i><div><b>全场景赛事呈现</b><span>数据大屏与智能屏幕统一管理</span></div></div>
        </div>
      </div>
      <div class="ed-foot">GUANLAN COMPETITION OPERATING SYSTEM · V1.0</div>
    </div>
    <div class="login-right">
      <div class="login-box">
        <div class="lb-kicker">SECURE ACCESS</div>
        <h2>登录控制台</h2>
        <div class="lb-sub">请使用平台账号进入运营中心</div>
        <div class="ltabs" id="ltabs">

.big-title{text-align:center;padding:15px 0 4px;font-family:'Songti SC','Noto Serif SC',Georgia,serif;font-size:22px;font-weight:600;letter-spacing:5px;background:linear-gradient(90deg,#b08d5a,#e8d4a6,#b08d5a);-webkit-background-clip:text;background-clip:text;color:transparent}
.tpl-pick{display:flex;gap:9px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:var(--r2);margin-bottom:8px;cursor:pointer;transition:.15s}
.tpl-pick:hover{border-color:var(--line2);background:var(--paper2)}
.tpl-pick.on{border-color:var(--rust);background:var(--rust-soft)}
.tpl-pick-ico{width:30px;height:30px;border-radius:5px;background:var(--paper2);color:var(--rust);display:grid;place-items:center;flex:none}
.tpl-pick b{display:block;font-size:12px;margin-bottom:3px}.tpl-pick span{display:block;font-size:10px;color:var(--faint);line-height:1.5}
.tpl-meta{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:9px}
.tpl-desc{font-size:11px;color:var(--muted);line-height:1.7;margin:0 0 13px;padding:9px 11px;background:var(--paper2);border-left:2px solid var(--rust);border-radius:0 5px 5px 0}
.tpl-view{border:1px solid var(--line2);overflow:hidden;background:var(--paper2)}
/* 模板一：大屏数据门户 —— 深色数据密集网格 */
.tpl-screen{background:radial-gradient(600px 300px at 50% 0%,rgba(200,168,106,.10),transparent 70%),#16271f;color:#e8e2d5}
.tpl-screen-head{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid rgba(224,190,124,.18);font-size:10px;color:#b8b5a8}
.tpl-screen-title{text-align:center;font-family:'Songti SC',serif;font-size:16px;font-weight:600;letter-spacing:3px;padding:12px 0;color:#e8d4a6}
.tpl-screen-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;padding:0 14px 12px}
.tpl-metric{background:rgba(255,254,250,.05);border:1px solid rgba(224,190,124,.16);border-radius:5px;padding:9px 11px;display:flex;flex-direction:column;gap:3px;color:#e8e2d5}
.tpl-metric span{font-size:9.5px;color:#a9a79b}.tpl-metric b{font-size:19px;font-variant-numeric:tabular-nums;color:#e8d4a6}
.tpl-chartcell{background:rgba(255,254,250,.05);border:1px solid rgba(224,190,124,.16);border-radius:5px;padding:4px;overflow:hidden;height:118px}
.tpl-foot{text-align:center;font-size:9px;letter-spacing:1px;padding:8px;border-top:1px solid rgba(224,190,124,.16);color:#c8a86a}
/* 模板二：简约赛事门户 —— 米白编辑部风格 */
.tpl-simple{background:#faf8f2;padding:0;color:var(--ink)}
.tpl-simple-nav{display:flex;align-items:center;gap:15px;padding:12px 18px;border-bottom:1px solid var(--line);background:#fffefa}
.tpl-simple-nav b{font-family:'Songti SC',serif;font-size:15px;letter-spacing:2px}.tpl-simple-nav span{flex:1;font-size:10px;color:var(--muted)}
.tpl-simple-nav button{border:1px solid;border-radius:4px;padding:5px 11px;font-size:10px;background:transparent}
.tpl-simple-hero{padding:28px 26px;position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.tpl-simple-tag{display:inline-block;color:#fff;font-size:9px;font-weight:700;letter-spacing:1.5px;padding:3px 9px;border-radius:2px;margin-bottom:11px}
.tpl-simple-hero h2{font-family:'Songti SC','Noto Serif SC',serif;font-size:24px;line-height:1.45;font-weight:600}
.tpl-simple-hero p{font-size:11px;color:var(--muted);margin-top:9px}
.tpl-simple-body{padding:8px 18px 18px;display:flex;flex-direction:column;gap:8px}
.tpl-simple-item{display:flex;align-items:center;gap:12px;padding:11px 13px;background:#fff;border:1px solid var(--line);border-radius:5px}
.tpl-simple-ico{width:36px;height:36px;border-radius:5px;display:grid;place-items:center;flex:none}
.tpl-simple-item>div{flex:1}.tpl-simple-item b{font-size:12px}.tpl-simple-item p{font-size:10px;color:var(--faint);margin-top:2px}
.tpl-simple-item>span{font-size:16px}
/* 模板三：H5 移动门户 */
.tpl-h5wrap{display:flex;justify-content:center;padding:4px 0;background:var(--paper2)}
.tpl-h5phone{width:228px;background:#fffefa;border:2px solid var(--line2);overflow:hidden;box-shadow:0 12px 30px rgba(40,35,25,.12)}
.tpl-h5status{display:flex;justify-content:space-between;padding:6px 12px;font-size:8px;color:var(--faint);background:var(--paper2)}
.tpl-h5head{padding:14px 13px;color:#fff}.tpl-h5head b{font-size:15px;display:block;font-family:'Songti SC',serif;letter-spacing:2px}.tpl-h5head div{font-size:9px;opacity:.85;margin-top:3px}
.tpl-h5body{padding:10px;display:flex;flex-direction:column;gap:8px;min-height:190px;background:#faf8f2}
.tpl-h5banner{font-size:9.5px;padding:9px;border-radius:4px;font-weight:600}
.tpl-h5card{display:flex;gap:9px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:5px;padding:9px;color:var(--muted)}
.tpl-h5card b{display:block;font-size:10.5px;color:var(--ink)}.tpl-h5card span{font-size:8.5px;color:var(--faint)}
.tpl-h5tab{display:flex;justify-content:space-around;padding:8px 0;border-top:1px solid;background:#fffefa}
.tpl-h5tab>div{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:8px;color:var(--faint)}
.tpl-h5tab .ic{width:15px;height:15px}
/* 概览页重排样式 */
.ov-grid{display:grid;grid-template-columns:1.65fr 1fr;gap:15px}
.ov-grid2{display:grid;grid-template-columns:1fr 1.65fr;gap:15px}
.tl{display:flex;flex-direction:column;gap:2px}
.tl-i{display:flex;align-items:center;gap:12px;padding:9px 4px;border-bottom:1px solid var(--line)}
.tl-i:last-child{border-bottom:none}
.tl-d{width:9px;height:9px;border-radius:50%;background:var(--line2);flex:none}
.tl-i.done .tl-d{background:var(--brand)}.tl-i.now .tl-d{background:var(--rust);box-shadow:0 0 0 4px var(--rust-soft)}
.tl-t{flex:1;display:flex;align-items:baseline;gap:10px}.tl-t b{font-size:12.5px;font-weight:600}.tl-t span{font-size:10.5px;color:var(--faint)}
.cap{display:flex;align-items:center;gap:11px;padding:13px;border:1px solid var(--line);border-radius:var(--r2);background:var(--paper2);cursor:pointer;transition:.16s}
.cap:hover{border-color:var(--rust);background:#fff;transform:translateX(2px)}
.cap-i{width:32px;height:32px;border-radius:5px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.cap b{display:block;font-size:12px;margin-bottom:2px}.cap span{display:block;font-size:10px;color:var(--faint);line-height:1.4}
.cap>.ic:last-child{margin-left:auto;color:var(--faint)}
/* ====== 模块内部差异化重构样式 ====== */
/* 概览：社论封面式 */
.ov-cover{display:grid;grid-template-columns:minmax(0,1.85fr) minmax(260px,.85fr);gap:16px;margin-bottom:16px}
.ov-cover-main{display:flex;flex-direction:column;gap:14px}
.ov-hero{position:relative;overflow:hidden;border-radius:var(--r);border:1px solid var(--line);background:linear-gradient(115deg,#1e4b3d 0%,#173c31 55%,#123028 100%);color:#f2ecdf;padding:24px 28px 20px}
.ov-hero:before{content:"";position:absolute;right:-60px;top:-70px;width:250px;height:250px;border-radius:50%;border:1px solid rgba(224,190,124,.18);box-shadow:0 0 0 30px rgba(224,190,124,.05),0 0 0 60px rgba(224,190,124,.04)}
.ov-hero-tag{position:relative;font-size:9.5px;letter-spacing:2.2px;color:#d8bd82;margin-bottom:12px}
.ov-hero h3{position:relative;font-family:'Songti SC','Noto Serif SC',Georgia,serif;font-size:27px;line-height:1.4;font-weight:600;letter-spacing:1px;margin-bottom:8px}
.ov-hero p{position:relative;font-size:11.5px;color:#b9cbbd;margin-bottom:16px}
.ov-hero-bar{position:relative;height:3px;background:rgba(255,255,255,.12);border-radius:3px;margin-bottom:9px;overflow:hidden}
.ov-hero-bar i{display:block;height:100%;background:linear-gradient(90deg,#d8bd82,#e8d4a6)}
.ov-hero-meta{position:relative;display:flex;justify-content:space-between;font-size:10px;color:#93aa9b}
.ov-hero-meta b{color:#e8d4a6;font-weight:600}
.ov-strip{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:var(--r);background:var(--card);overflow:hidden}
.ov-strip-i{position:relative;padding:15px 16px 14px;border-right:1px solid var(--line)}
.ov-strip-i:last-child{border-right:none}
.ov-strip-n{position:absolute;right:10px;top:8px;font-size:9px;color:var(--line2);font-family:Georgia,serif}
.ov-strip-ic{color:var(--rust);margin-bottom:8px}.ov-strip-ic .ic{width:18px;height:18px}
.ov-strip-i b{display:block;font-size:22px;font-weight:650;line-height:1.1;margin-bottom:3px;font-variant-numeric:tabular-nums}
.ov-strip-i>span:last-child{font-size:10.5px;color:var(--muted)}
.ov-track{border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:14px 18px}
.ov-track-row{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:14px;position:relative}
.ov-track-row:before{content:"";position:absolute;left:8px;right:8px;top:5px;height:1px;background:var(--line)}
.ov-track-s{position:relative;padding-top:18px;display:flex;flex-direction:column;gap:3px}
.ov-track-s i{position:absolute;top:0;left:0;width:11px;height:11px;border-radius:50%;background:var(--paper);border:2px solid var(--line2);z-index:1}
.ov-track-s.done i{background:var(--brand);border-color:var(--brand)}
.ov-track-s.now i{background:var(--rust);border-color:var(--rust);box-shadow:0 0 0 4px var(--rust-soft)}
.ov-track-s b{font-size:12px}.ov-track-s span{font-size:10px;color:var(--faint)}
.ov-side{display:flex;flex-direction:column;gap:14px}
.ov-side-b{border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:13px 15px}
.ov-side-b .mini-head{margin-bottom:8px}
.ov-side-k{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}
.ov-log{display:flex;gap:9px;padding:7px 0;border-bottom:1px solid var(--line)}
.ov-log i{width:5px;height:5px;border-radius:50%;background:var(--rust);margin-top:5px;flex:none}
.ov-log b{display:block;font-size:11px;font-weight:550}
.ov-log span{font-size:9.5px;color:var(--faint)}
.ov-entry{border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:15px 18px}
.ov-entry-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:12px}
.ov-entry-i{position:relative;border:1px solid var(--line);border-radius:var(--r2);padding:14px;cursor:pointer;transition:.16s;background:var(--paper2)}
.ov-entry-i:hover{border-color:var(--rust);transform:translateY(-2px);box-shadow:var(--shadow)}
.ov-entry-i>span{font-family:Georgia,serif;font-size:10px;color:var(--line2)}
.ov-entry-i b{display:block;font-size:13px;margin:6px 0 3px}
.ov-entry-i small{font-size:10px;color:var(--faint)}
.ov-entry-i>.ic{position:absolute;right:12px;bottom:12px;color:var(--faint)}
/* 微应用：分类目录 + 横向条目 */
.app-shell{display:grid;grid-template-columns:210px minmax(0,1fr);gap:16px;align-items:start}
.app-cats{border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:14px 12px}
.app-cat{display:flex;align-items:center;gap:9px;padding:10px;border-radius:var(--r2);cursor:pointer;font-size:12px;color:var(--ink2);margin-bottom:3px}
.app-cat:hover{background:var(--paper2)}
.app-cat.on{background:var(--rust-soft);color:var(--rust);font-weight:600}
.app-cat .ic{width:15px;height:15px}.app-cat span{flex:1}.app-cat b{font-size:10px;color:var(--faint)}
.app-cat-new{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:10px;padding:10px;border:1px dashed var(--line2);border-radius:var(--r2);color:var(--muted);font-size:11.5px;cursor:pointer}
.app-cat-new:hover{border-color:var(--rust);color:var(--rust)}
.app-cat-new .ic{width:14px;height:14px}
.app-main{border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:16px 18px}
.app-main-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.app-main-h h3{font-family:'Songti SC',serif;font-size:17px;margin-bottom:3px}
.app-main-h p{font-size:11px;color:var(--muted)}
.app-quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.app-quick-i{text-align:left;border:1px solid var(--line);border-radius:var(--r2);background:var(--paper2);padding:12px;cursor:pointer;transition:.16s}
.app-quick-i:hover{border-color:var(--rust);background:#fff}
.app-quick-i>.ic{width:20px;height:20px;color:var(--rust);margin-bottom:8px}
.app-quick-i b{display:block;font-size:12px;margin-bottom:4px}
.app-quick-i span{font-size:9.5px;color:var(--faint);line-height:1.5;display:block}
.app-list{display:flex;flex-direction:column;gap:9px}
.app-row{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:var(--r2);padding:12px 14px;background:var(--paper2);transition:.16s}
.app-row:hover{border-color:var(--line2);box-shadow:var(--shadow);background:#fff}
.app-row-ico{width:44px;height:44px;border-radius:9px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.app-row-main{flex:1;min-width:0}
.app-row-main b{display:block;font-size:13.5px;margin-bottom:3px}
.app-row-main>span{font-size:10.5px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app-row-tags{display:flex;gap:5px;margin-top:7px}
.app-row-stat{text-align:center;min-width:64px}
.app-row-stat b{display:block;font-size:18px;font-weight:650;font-variant-numeric:tabular-nums}
.app-row-stat span{font-size:9.5px;color:var(--faint)}
.app-row-act{display:flex;gap:6px}
/* 表单设计：步骤导航 + 三栏 */
.fd-work{display:grid;grid-template-columns:118px minmax(0,1fr);gap:14px;align-items:start}
.fd-steps{border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:10px 8px}
.fd-step{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;padding:13px 6px;border-radius:var(--r2);cursor:pointer;color:var(--muted);margin-bottom:4px}
.fd-step:hover{background:var(--paper2)}
.fd-step.on{background:var(--rust-soft);color:var(--rust)}
.fd-step>span{font-family:Georgia,serif;font-size:10px;color:var(--line2)}
.fd-step .ic{width:20px;height:20px}
.fd-step b{font-size:11.5px;font-weight:600}
.fd-step-foot{display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 4px 4px;margin-top:6px;border-top:1px solid var(--line);color:var(--faint);font-size:9px;text-align:center;line-height:1.5}
.fd-step-foot .ic{width:16px;height:16px}
.fd-stage{border:1px solid var(--line);border-radius:var(--r);background:var(--paper2);padding:14px;min-height:520px}
.fd-canvas-layout{display:grid;grid-template-columns:190px minmax(0,1fr) 250px;gap:12px;align-items:start}
.fd-forms,.fd-prop{border:1px solid var(--line);border-radius:var(--r2);background:var(--card);padding:12px}
.fd-forms .mini-head,.fd-prop .mini-head{margin-bottom:10px}
.fd-form-i{display:flex;gap:8px;align-items:flex-start;padding:9px;border:1px solid var(--line);border-radius:var(--r2);margin-bottom:6px;cursor:pointer}
.fd-form-i:hover{border-color:var(--line2)}
.fd-form-i.on{border-color:var(--rust);background:var(--rust-soft)}
.fd-form-i .ic{width:15px;height:15px;color:var(--rust);flex:none;margin-top:1px}
.fd-form-i b{display:block;font-size:11.5px;line-height:1.4}
.fd-form-i span{font-size:9.5px;color:var(--faint)}
.fd-center{min-width:0}
.fd-toolbar{border:1px solid var(--line);border-radius:var(--r2);background:var(--card);padding:10px 12px;margin-bottom:10px}
.fd-toolbar>span{font-size:10px;color:var(--muted);display:block;margin-bottom:9px;letter-spacing:.5px}
.fd-tool-row{display:flex;flex-wrap:wrap;gap:6px}
.fd-tool-row .lib-item{font-size:11px;padding:6px 9px}
.fd-canvas{border:1px solid var(--line);border-radius:var(--r2);background:#fff;min-height:400px;padding:12px}
.fd-canvas-head{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:10px;margin-bottom:10px;border-bottom:2px solid var(--ink)}
.fd-canvas-head b{font-family:'Songti SC',serif;font-size:15px}
.fd-canvas-head span{font-size:10px;color:var(--faint)}
.fd-canvas .fitem{margin:0 0 8px;padding:9px 11px}
.fitem .fi-no{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:3px;background:var(--paper2);color:var(--faint);font-size:9px;margin-right:6px}
/* 审批：纵向流程 + 侧栏 */
.ap-work{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.ap-flow{border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:16px 18px}
.ap-flow-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line)}
.ap-flow-title{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;margin:16px 0 8px;color:var(--rust)}
.ap-flow-title .ic{width:16px;height:16px}
.ap-flow-title span{font-weight:400;color:var(--faint);font-size:10.5px;margin-left:auto}
.flow-canvas{display:flex;flex-direction:column;align-items:stretch;padding:6px 0;background:linear-gradient(90deg,transparent 28px,var(--line) 28px,var(--line) 29px,transparent 29px)}
.fnode{display:flex;align-items:center;gap:12px;min-width:0;margin-left:0;padding:11px 13px}
.fnode .fn-ord{width:26px;height:26px;border-radius:50%;background:var(--paper2);border:1px solid var(--line2);display:grid;place-items:center;font-family:Georgia,serif;font-size:11px;color:var(--muted);flex:none;z-index:1}
.fnode.sel .fn-ord{background:var(--rust);color:#fff;border-color:var(--rust)}
.fnode .fn-body{flex:1;min-width:0}
.fnode .nt{font-size:9px;letter-spacing:1.4px;color:var(--faint);margin-bottom:4px}
.fnode .nn{font-size:12.5px;font-weight:600;margin-bottom:6px}
.fnode .fn-meta{display:flex;align-items:center;gap:10px}
.fnode .fn-meta .tip{margin:0}
.fnode>.icobtn{align-self:flex-start}
.fconn{height:16px;width:29px;display:flex;justify-content:center;flex:none}
.fconn:after{content:"";width:1px;height:100%;background:var(--line2)}
.ap-add{width:100%;margin-top:10px;padding:11px;border:1px dashed var(--line2);border-radius:var(--r2);background:transparent;color:var(--muted);font-size:11.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.ap-add:hover{border-color:var(--rust);color:var(--rust)}
.ap-add .ic{width:14px;height:14px}
.ap-side{display:flex;flex-direction:column;gap:12px}
.ap-side-b{border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:14px 16px}
.ap-side-b .mini-head{margin-bottom:10px}
.ap-sign-list{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.ap-sign-i{display:flex;align-items:center;gap:7px;font-size:10px;color:var(--muted)}
.ap-sign-i .ic{width:13px;height:13px;color:var(--brand)}
.ap-path{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:10px}
.ap-path span{font-size:10px;padding:3px 8px;background:var(--paper2);border:1px solid var(--line);border-radius:3px}
.ap-path i{color:var(--faint);font-style:normal;font-size:10px}
/* 图表：图表集 + 舞台 + 配置 */
.chart-work{display:grid;grid-template-columns:200px minmax(0,1fr) 270px;gap:14px;align-items:start}
.chart-list,.chart-cfg{border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:14px}
.chart-list .mini-head,.chart-cfg .mini-head{margin-bottom:10px}
.chart-list-i{display:flex;gap:9px;align-items:center;padding:9px;border:1px solid var(--line);border-radius:var(--r2);margin-bottom:6px;cursor:pointer}
.chart-list-i:hover{border-color:var(--line2)}

/* ==================== MICRO APPS ==================== */
const APP_TYPES=[{t:'信息采集',n:'信息采集',i:'user',d:'报名登记、选手信息、现场签到等数据采集微应用'},
 {t:'问卷调查',n:'问卷调查',i:'star',d:'满意度调查、意见征集、在线投票等问卷微应用'},
 {t:'赛事管理',n:'赛事管理',i:'trophy',d:'项目申报、赛道管理、成绩录入等赛事业务微应用'},
 {t:'分组管理',n:'分组管理',i:'users',d:'选手分组、评委分配、场次编排等管理微应用'}];
let _appCat='全部';
R.apps=function(){
  const counts={};S.forms.forEach(f=>{const a=f.app||'其他';counts[a]=(counts[a]||0)+1});
  const cats=['全部'].concat(APP_TYPES.map(a=>a.t)).concat(Object.keys(counts).filter(x=>x!=='全部'&&!APP_TYPES.some(a=>a.t===x)));
  const list=S.forms.filter(f=>_appCat==='全部'||(f.app||'其他')===_appCat);
  let h='<div class="page-head"><div><h2>微应用中心</h2><p>信息采集、问卷调查等微应用统一目录，支持字段配置、数据采集与统计分析</p></div><div class="head-actions"><button class="btn gold" onclick="newMicroApp()">'+svg('plus','ic-sm')+'创建微应用</button></div></div>';
  h+='<div class="app-shell"><aside class="app-cats"><div class="mini-head">应用分类</div>';
  cats.forEach(c=>{const meta=APP_TYPES.find(a=>a.t===c);h+='<div class="app-cat '+(_appCat===c?'on':'')+'" onclick="setAppCat(\''+c+'\')">'+svg(meta?meta.i:'components','ic-sm')+'<span>'+esc(c)+'</span><b>'+(c==='全部'?S.forms.length:(counts[c]||0))+'</b></div>'});
  h+='<div class="app-cat-new" onclick="newMicroApp()">'+svg('plus','ic-sm')+'新建应用</div></aside>';
  h+='<div class="app-main"><div class="app-main-h"><div><h3>'+esc(_appCat)+(_appCat==='全部'?'微应用':'应用')+'</h3><p>按分类浏览与管理已创建的微应用</p></div><span class="tag g">'+list.length+' 个应用</span></div>';
  h+='<div class="app-quick">'+APP_TYPES.map(a=>'<button class="app-quick-i" onclick="newMicroApp(\''+a.t+'\')">'+svg(a.i)+'<b>'+a.n+'</b><span>'+a.d+'</span></button>').join('')+'</div>';
  h+='<div class="app-list">';
  list.forEach(f=>{const ic=f.icon||'form';
    h+='<div class="app-row"><div class="app-row-ico">'+svg(ic)+'</div><div class="app-row-main"><b>'+esc(f.name)+'</b><span>'+esc(f.desc)+'</span><div class="app-row-tags"><span class="tag g">'+esc(f.app||'其他')+'</span><span class="tag">'+f.fields.length+' 字段</span></div></div>';
    h+='<div class="app-row-stat"><b>'+f.records.length+'</b><span>采集数据</span></div><div class="app-row-stat"><b>'+f.fields.length+'</b><span>表单字段</span></div>';
    h+='<div class="app-row-act"><button class="btn sm" onclick="openApp(\''+f.id+'\')">'+svg('edit','ic-sm')+'设计</button><button class="btn sm" onclick="openAppData(\''+f.id+'\')">'+svg('table','ic-sm')+'数据</button><button class="btn sm icon" title="导出" onclick="selectAndExport(\''+f.id+'\')">'+svg('download','ic-sm')+'</button></div></div>';
  });
  h+='</div></div></div>';
  return h;
};
function setAppCat(c){_appCat=c;render()}

function openApp(id){_formId=id;_ftab='design';_selField=-1;go('formdesign')}
function openAppData(id){_formId=id;_ftab='data';_selField=-1;go('formdesign')}
function selectAndExport(id){_formId=id;exportFormData()}
function newMicroApp(preset){
  let opts=APP_TYPES.map(a=>'<option value="'+a.t+'" '+(preset===a.t?'selected':'')+'>'+a.n+'</option>').join('');
  modal('创建微应用','<div class="f-row"><label>应用类型</label><select class="sel2" id="maType">'+opts+'</select></div><div class="f-row"><label>应用名称</label><input class="inp2" id="maName" placeholder="如：新生报到信息采集"></div><div class="f-row"><label>应用说明</label><input class="inp2" id="maDesc" placeholder="简要描述该微应用用途"></div><div class="tip">创建后可在「表单设计引擎」中拖拽控件配置字段</div>','<button class="btn" onclick="closeModal()">取消</button><button class="btn gold" onclick="doCreateMicroApp()">创建并设计</button>');
}
function doCreateMicroApp(){
  const t=document.getElementById('maType').value,n=document.getElementById('maName').value.trim()||t+'微应用',desc=document.getElementById('maDesc').value.trim()||t+'场景采集应用';
  const meta=APP_TYPES.find(a=>a.t===t)||APP_TYPES[0];
  const presetFields={
    '信息采集':[{type:'text',label:'姓名',ph:'请输入姓名',req:true},{type:'phone',label:'联系电话',ph:'请输入手机号',req:true},{type:'text',label:'所属单位',ph:'请输入单位',req:false}],
    '问卷调查':[{type:'radio',label:'满意度',opts:['非常满意','满意','一般','不满意'],req:true},{type:'textarea',label:'建议',ph:'请填写建议',req:false}],
    '赛事管理':[{type:'text',label:'项目名称',ph:'请输入项目名称',req:true},{type:'date',label:'提交日期',req:false}],
    '分组管理':[{type:'text',label:'分组名称',ph:'如 A组',req:true},{type:'number',label:'人数',ph:'0',req:false}]
  };
  const f={id:uid(),name:n,app:t,icon:meta.i,desc:desc,fields:presetFields[t]||[],records:[]};
  S.forms.push(f);_formId=f.id;_ftab='design';_selField=-1;closeModal();save();render();log('创建微应用：'+n);toast('微应用创建成功，可拖拽控件配置字段');go('formdesign');
}
