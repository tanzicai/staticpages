let _formId=null,_ftab='design',_selField=-1;
const FIELD_TYPES=[{t:'text',n:'单行文本',i:'text'},{t:'textarea',n:'多行文本',i:'text'},{t:'select',n:'下拉选择',i:'sort'},{t:'radio',n:'单选框',i:'components'},{t:'number',n:'数字输入',i:'number'},{t:'phone',n:'手机号码',i:'phone'},{t:'date',n:'日期选择',i:'calendar'}];
function curForm(){if(!_formId||!S.forms.some(f=>f.id===_formId))_formId=S.forms[0]&&S.forms[0].id;return S.forms.find(f=>f.id===_formId)||S.forms[0]}
R.formdesign=function(){
  const f=curForm();if(!f)return '<div class="empty">暂无表单</div>';
  let h='<div class="page-head"><div><h2>表单设计引擎</h2><p>拖拽控件配置表单字段，支持数据采集、统计分析与导出</p></div><div class="head-actions">';
  h+='<select class="sel2" style="width:210px;min-height:36px" id="formSel" onchange="switchForm()">'+S.forms.map(x=>'<option value="'+x.id+'" '+(x.id===f.id?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select>';
  h+='<button class="btn" onclick="exportFormData()">'+svg('download','ic-sm')+'导出数据</button><button class="btn gold" onclick="saveForm()">'+svg('save','ic-sm')+'保存表单</button></div></div>';
  h+='<div class="fd-work"><nav class="fd-steps">'+[['design','01','设计表单','form'],['data','02','数据采集','table'],['stat','03','统计分析','chart']].map(x=>'<div class="fd-step '+(_ftab===x[0]?'on':'')+'" onclick="setFTab(\''+x[0]+'\')"><span>'+x[1]+'</span>'+svg(x[3],'ic-sm')+'<b>'+x[2]+'</b></div>').join('')+'<div class="fd-step-foot">'+svg('drag','ic-sm')+'<span>拖拽控件<br>即时配置</span></div></nav>';
  h+='<div class="fd-stage">';
  if(_ftab==='design')h+=formDesignHTML(f);
  else if(_ftab==='data')h+=formDataHTML(f);
  else h+=formStatHTML(f);
  h+='</div></div>';
  return h;
};

function switchForm(){_formId=document.getElementById('formSel').value;_selField=-1;render()}
function setFTab(t){_ftab=t;render()}
function saveForm(){save();log('保存表单配置：'+curForm().name);toast('表单配置已保存')}
function newForm(){modal('新建表单','<div class="f-row"><label>表单名称</label><input class="inp2" id="nfName" placeholder="如：志愿者信息登记表"></div><div class="f-row"><label>表单说明</label><input class="inp2" id="nfDesc" placeholder="简要描述用途"></div>','<button class="btn" onclick="closeModal()">取消</button><button class="btn gold" onclick="createForm()">创建</button>')}
function createForm(){const n=document.getElementById('nfName').value.trim();if(!n)return toast('请输入表单名称','err');const f={id:uid(),name:n,desc:document.getElementById('nfDesc').value.trim()||'自定义表单',fields:[],records:[]};S.forms.push(f);_formId=f.id;_ftab='design';closeModal();save();render();toast('表单创建成功')}
function formDesignHTML(f){
  let h='<div class="fd-canvas-layout"><aside class="fd-forms"><div class="mini-head">表单清单</div>';
  S.forms.forEach(x=>{h+='<div class="fd-form-i '+(x.id===f.id?'on':'')+'" onclick="switchFormTo(\''+x.id+'\')">'+svg(x.icon||'form','ic-sm')+'<div><b>'+esc(x.name)+'</b><span>'+x.fields.length+' 字段 · '+x.records.length+' 条数据</span></div></div>'});
  h+='<button class="btn sm" style="width:100%;margin-top:10px" onclick="newForm()">'+svg('plus','ic-sm')+'新建表单</button></aside>';
  h+='<div class="fd-center"><div class="fd-toolbar"><span>控件工具箱 · 拖入画布或点击添加</span><div class="fd-tool-row">';
  FIELD_TYPES.forEach(x=>{h+='<div class="lib-item" draggable="true" data-type="'+x.t+'" onclick="addField(\''+x.t+'\',null)">'+svg(x.i,'ic-sm')+x.n+'</div>'});
  h+='</div></div><div class="fd-canvas" id="formCanvas"><div class="fd-canvas-head"><b>'+esc(f.name)+'</b><span>'+f.fields.length+' 个字段</span></div>';
  if(!f.fields.length)h+='<div class="drop-hint">从上方拖拽控件到此处开始设计</div>';
  f.fields.forEach((fd,i)=>{
    let fake=fd.type==='textarea'?'多行文本域':fd.type==='select'?'下拉选择：'+(fd.opts||[]).join(' / '):fd.type==='radio'?'单选：'+(fd.opts||[]).join(' / '):fd.type==='date'?'日期选择器':fd.type==='number'?'数字输入':fd.type==='phone'?'手机号输入':'请输入'+(fd.ph||'');
    h+='<div class="fitem '+(i===_selField?'sel':'')+'" data-i="'+i+'" onclick="selField('+i+')"><div class="fl"><span class="fi-no">'+(i+1)+'</span>'+esc(fd.label)+(fd.req?'<i>*</i>':'')+'</div><div class="fake">'+esc(fake)+'</div><div class="fa"><button class="icobtn" title="上移" onclick="event.stopPropagation();moveField('+i+',-1)">'+svg('left','ic-sm')+'</button><button class="icobtn" title="下移" onclick="event.stopPropagation();moveField('+i+',1)">'+svg('right','ic-sm')+'</button><button class="icobtn del" title="删除" onclick="event.stopPropagation();delField('+i+')">'+svg('trash','ic-sm')+'</button></div></div>';
  });
  h+='<div class="drop-hint" id="dropZone" style="margin-top:4px">拖拽控件到此处追加到末尾</div></div></div>';
  h+='<aside class="fd-prop"><div class="mini-head">字段属性</div><div id="propBox">';
  if(_selField<0||!f.fields[_selField])h+='<div class="prop-empty">'+svg('settings')+'选中画布中的字段<br>即可在此配置属性</div>';
  else{const fd=f.fields[_selField];
    h+='<div class="f-row"><label>字段标题</label><input class="inp2" id="pLabel" value="'+esc(fd.label)+'" onchange="updField(\'label\',this.value)"></div>';
    h+='<div class="f-row"><label>占位提示</label><input class="inp2" id="pPh" value="'+esc(fd.ph||'')+'" onchange="updField(\'ph\',this.value)" placeholder="输入提示文字"></div>';
    h+='<div class="f-row"><label>选项配置（英文逗号分隔）</label><textarea class="ta2" id="pOpts" onchange="updField(\'opts\',this.value)" placeholder="选项一,选项二">'+(fd.opts||[]).join(',')+'</textarea></div>';
    h+='<div class="f-row" style="display:flex;justify-content:space-between;align-items:center"><label style="margin:0">必填字段</label><div class="switch '+(fd.req?'on':'')+'" onclick="toggleReq()"></div></div>';
    h+='<div class="f-row"><label>字段类型</label><input class="inp2" value="'+esc((FIELD_TYPES.find(x=>x.t===fd.type)||{}).n||fd.type)+'" disabled style="opacity:.6"></div>';
  }
  h+='</div></aside></div>';
  return h;
}
function switchFormTo(id){_formId=id;_selField=-1;save();render()}

function selField(i){_selField=i;render()}
function addField(type,idx){const f=curForm();const meta=FIELD_TYPES.find(x=>x.t===type)||FIELD_TYPES[0];const fd={type:type,label:meta.n,ph:'请输入'+meta.n,req:false};if(type==='select'||type==='radio')fd.opts=['选项一','选项二','选项三'];if(idx==null)f.fields.push(fd);else f.fields.splice(idx,0,fd);_selField=idx==null?f.fields.length-1:idx;save();render();toast('已添加控件：'+meta.n)}
function moveField(i,d){const f=curForm(),j=i+d;if(j<0||j>=f.fields.length)return;const t=f.fields[i];f.fields[i]=f.fields[j];f.fields[j]=t;_selField=j;save();render()}
function delField(i){const f=curForm();f.fields.splice(i,1);_selField=-1;save();render();toast('字段已删除')}
function updField(k,v){const f=curForm();if(!f.fields[_selField])return;if(k==='opts')f.fields[_selField].opts=v.split(/[,，]/).map(x=>x.trim()).filter(Boolean);else f.fields[_selField][k]=v;save()}
function toggleReq(){const fd=curForm().fields[_selField];fd.req=!fd.req;save();render()}
let _dragFieldFrom=null;
BIND.formdesign=function(){
  // 控件库拖拽：携带类型；画布内字段拖拽：携带字段名标记
  document.querySelectorAll('.lib-item').forEach(el=>{el.setAttribute('draggable','true');el.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',el.dataset.type);e.dataTransfer.setData('application/x-libcontrol',el.dataset.type);e.dataTransfer.effectAllowed='copy';el.style.opacity='.5'});el.addEventListener('dragend',()=>el.style.opacity='')});
  document.querySelectorAll('.fitem').forEach(el=>{el.setAttribute('draggable','true');el.addEventListener('dragstart',e=>{e.stopPropagation();_dragFieldFrom=parseInt(el.dataset.i);e.dataTransfer.setData('text/plain','__move__');e.dataTransfer.setData('application/x-movefield',el.dataset.i);e.dataTransfer.effectAllowed='move'});el.addEventListener('dragend',()=>{_dragFieldFrom=null;document.querySelectorAll('.fitem').forEach(x=>x.style.borderTopColor='')})});
  const cv=document.getElementById('formCanvas');if(!cv)return;
  const clearMark=()=>document.querySelectorAll('.fitem').forEach(x=>x.style.borderTopColor='');
  ['dragover','dragenter'].forEach(ev=>cv.addEventListener(ev,e=>{e.preventDefault();e.dataTransfer.dropEffect=(_dragFieldFrom!=null)?'move':'copy';clearMark();const it=e.target.closest('.fitem');if(it)it.style.borderTopColor='var(--gold)'}));
  cv.addEventListener('dragleave',e=>{if(!cv.contains(e.relatedTarget))clearMark()});
  cv.addEventListener('drop',e=>{
    e.preventDefault();clearMark();
    const move=e.dataTransfer.getData('application/x-movefield');
    const type=e.dataTransfer.getData('application/x-libcontrol')||e.dataTransfer.getData('text/plain');
    const it=e.target.closest('.fitem');let targetIdx=it?parseInt(it.dataset.i):null;
    if(move!==''&&move!=null&&_dragFieldFrom!=null){ // 画布内重排
      const f=curForm(),from=_dragFieldFrom;let to=(targetIdx==null?f.fields.length:targetIdx);
      if(from>=to)to--;if(to<0)to=0;if(from!==to){const item=f.fields.splice(from,1)[0];f.fields.splice(to,0,item);_selField=to;save();render();toast('字段顺序已调整')}
      _dragFieldFrom=null;return;
    }
    if(!type||type==='__move__')return;addField(type,targetIdx);
  });
};
function formDataHTML(f){
  let h='<div class="card"><div class="card-h"><h3>'+svg('table','ic-sm')+'「'+esc(f.name)+'」采集数据</h3><div style="display:flex;gap:8px"><button class="btn sm" onclick="openFill()">'+svg('plus','ic-sm')+'新增数据</button><button class="btn sm" onclick="exportFormData()">'+svg('download','ic-sm')+'导出 CSV</button></div></div><div class="card-b" style="padding:0 20px 14px">';
  if(!f.records.length)h+='<div class="empty">'+svg('table','ic-xl')+'暂无采集数据，点击「新增数据」录入</div>';
  else{const cols=Object.keys(f.records[0]);h+='<table class="tbl"><thead><tr><th>#</th>'+cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'<th>操作</th></tr></thead><tbody>';f.records.forEach((r,i)=>{h+='<tr><td class="mini">'+(i+1)+'</td>'+cols.map(c=>'<td>'+esc(r[c]||'-')+'</td>').join('')+'<td><button class="icobtn del" onclick="delRecord('+i+')">'+svg('trash','ic-sm')+'</button></td></tr>'});h+='</tbody></table>'}
  h+='</div></div>';return h;
}
function delRecord(i){confirmBox('确认删除第 '+(i+1)+' 条数据？',function(){curForm().records.splice(i,1);save();render();toast('数据已删除')})}
function openFill(){const f=curForm();if(!f.fields.length)return toast('请先在表单设计中添加字段','err');
  let b='<div class="frun">';f.fields.forEach((fd,i)=>{b+='<div><div class="lab">'+esc(fd.label)+(fd.req?' <i>*</i>':'')+'</div>';
    if(fd.type==='textarea')b+='<textarea class="ta2" id="ff'+i+'" placeholder="'+esc(fd.ph||'')+'"></textarea>';
    else if(fd.type==='select')b+='<select class="sel2" id="ff'+i+'">'+(fd.opts||[]).map(o=>'<option>'+esc(o)+'</option>').join('')+'</select>';
    else if(fd.type==='radio')b+='<div class="chips" id="ff'+i+'" data-val="'+(fd.opts||[])[0]+'">'+(fd.opts||[]).map((o,j)=>'<div class="chip '+(j===0?'on':'')+'" onclick="pickRadio('+i+',this,\''+esc(o)+'\')">'+esc(o)+'</div>').join('')+'</div>';
    else b+='<input class="inp2" id="ff'+i+'" type="'+(fd.type==='date'?'date':fd.type==='number'?'number':'text')+'" placeholder="'+esc(fd.ph||'')+'">';
    b+='</div>'});b+='</div>';
  modal('录入数据 · '+f.name,b,'<button class="btn" onclick="closeModal()">取消</button><button class="btn gold" onclick="submitFill()">提交数据</button>',true);
}
function pickRadio(i,el,v){el.parentNode.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));el.classList.add('on');document.getElementById('ff'+i).dataset.val=v}
function submitFill(){const f=curForm(),r={};for(let i=0;i<f.fields.length;i++){const fd=f.fields[i],el=document.getElementById('ff'+i),v=el.dataset.val!=null?el.dataset.val:el.value.trim();if(fd.req&&!v)return toast('请填写：'+fd.label,'err');r[fd.label]=v}f.records.push(r);closeModal();_ftab='data';save();render();log('录入表单数据：'+f.name);toast('数据提交成功')}
function formStatHTML(f){
  let h='<div class="grid g3" style="margin-bottom:16px"><div class="card stat"><div class="lbl">'+svg('users','ic-sm')+'采集数据总量</div><div class="num">'+f.records.length+'</div><div class="sub">当前表单记录数</div></div><div class="card stat"><div class="lbl">'+svg('form','ic-sm')+'表单字段数</div><div class="num">'+f.fields.length+'</div><div class="sub">含必填 '+f.fields.filter(x=>x.req).length+' 项</div></div><div class="card stat"><div class="lbl">'+svg('chart','ic-sm')+'数据完整度</div><div class="num">'+(f.records.length?Math.round(f.records.reduce((a,r)=>a+Object.values(r).filter(v=>v&&v!=='-').length,0)/(f.records.length*Math.max(1,f.fields.length))*100):0)+'%</div><div class="sub">字段有效填写比例</div></div></div>';
  h+='<div class="card"><div class="card-h"><h3>'+svg('chart','ic-sm')+'字段数据分布</h3></div><div class="card-b">';
  f.fields.forEach(fd=>{const vals={};f.records.forEach(r=>{const v=r[fd.label];if(v)vals[v]=(vals[v]||0)+1});const keys=Object.keys(vals).slice(0,6);const mx=Math.max(1,...Object.values(vals));
    h+='<div style="margin-bottom:16px"><div style="font-size:12.5px;margin-bottom:7px">'+esc(fd.label)+'</div>';
    if(!keys.length)h+='<div class="tip">暂无数据</div>';
    keys.forEach(k=>{h+='<div style="display:flex;align-items:center;gap:10px;margin-bottom:5px"><span style="width:110px;font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(k)+'</span><div class="bar teal" style="flex:1"><i style="width:'+(vals[k]/mx*100)+'%"></i></div><b style="width:24px;text-align:right;font-size:11px">'+vals[k]+'</b></div>'});h+='</div>'});
  h+='</div></div>';return h;
}
function exportFormData(){const f=curForm();if(!f.records.length)return toast('暂无数据可导出','err');const cols=Object.keys(f.records[0]);downloadText(f.name+'_数据.csv',toCSV(cols,f.records.map(r=>cols.map(c=>r[c]||''))),'text/csv;charset=utf-8');log('导出表单数据：'+f.name);toast('数据已导出为 CSV')}
/* ==================== APPROVAL ENGINE ==================== */
let _flowId=null,_selNode=-1;
function curFlow(){if(!_flowId||!S.flows.some(f=>f.id===_flowId))_flowId=S.flows[0]&&S.flows[0].id;return S.flows.find(f=>f.id===_flowId)||S.flows[0]}
R.approval=function(){
  const f=curFlow();if(!f)return '<div class="empty">暂无审批流程</div>';
  let h='<div class="page-head"><div><h2>审批引擎</h2><p>可视化配置审批流程，支持多级审批（会签/或签）、条件分支与手写签名</p></div><div class="head-actions"><button class="btn" onclick="openSign()">'+svg('pen','ic-sm')+'手写签名板</button><button class="btn gold" onclick="saveFlow()">'+svg('save','ic-sm')+'保存流程</button></div></div>';
  h+='<div class="ap-work"><section class="ap-flow"><div class="ap-flow-h"><select class="sel2" style="width:250px" id="flowSel" onchange="switchFlow()">'+S.flows.map(x=>'<option value="'+x.id+'" '+(x.id===f.id?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select><span class="tag g">'+f.nodes.length+' 节点</span><span class="tag t">会签 '+f.nodes.filter(n=>n.mode==='会签').length+'</span><span class="tag">或签 '+f.nodes.filter(n=>n.mode==='或签').length+'</span><span class="tag">分支 '+f.nodes.filter(n=>n.type==='branch').length+'</span></div>';
  h+='<div class="ap-flow-title">'+svg('branch','ic-sm')+' 流程编排 <span>点击节点编辑 · 拖拽调整顺序</span></div>';
  h+='<div class="flow-canvas" id="flowCanvas">';
  f.nodes.forEach((n,i)=>{
    const color=n.type==='start'?'t':n.type==='end'?'g':n.type==='branch'?'r':'';
    h+='<div class="fnode '+(i===_selNode?'sel':'')+'" draggable="true" data-i="'+i+'" onclick="selNode('+i+')"><div class="fn-ord">'+(i+1)+'</div><div class="fn-body"><div class="nt">'+({start:'发起',task:'审批节点',branch:'条件分支',end:'结束'}[n.type])+'</div><div class="nn">'+esc(n.name)+'</div><div class="fn-meta"><span class="tag '+color+'">'+esc(n.mode)+'</span><span class="tip">'+esc((n.who||[]).join('、'))+'</span></div></div><button class="icobtn del" onclick="event.stopPropagation();delNode('+i+')">'+svg('x','ic-sm')+'</button></div>';
    if(i<f.nodes.length-1)h+='<div class="fconn"></div>';
  });
  h+='</div><button class="ap-add" onclick="addNode()">'+svg('plus','ic-sm')+' 添加审批节点</button></section>';
  h+='<aside class="ap-side"><div class="ap-side-b"><div class="mini-head">节点属性</div><div id="nodeProp">';
  if(_selNode<0||!f.nodes[_selNode])h+='<div class="prop-empty">'+svg('branch')+'点击左侧节点<br>配置审批模式与人员</div>';
  else{const n=f.nodes[_selNode];
    h+='<div class="f-row"><label>节点名称</label><input class="inp2" value="'+esc(n.name)+'" onchange="updNode(\'name\',this.value)"></div>';
    h+='<div class="f-row"><label>审批模式</label><select class="sel2" onchange="updNode(\'mode\',this.value)">'+['单人','或签','会签','分支'].map(x=>'<option '+(n.mode===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div>';
    h+='<div class="f-row"><label>审批人 / 条件（逗号分隔）</label><textarea class="ta2" onchange="updNode(\'who\',this.value)">'+esc((n.who||[]).join(','))+'</textarea></div>';
    h+='<div class="tip">'+({单人:'由指定一人完成审批',或签:'多人中任一人同意即通过',会签:'需全部审批人同意方可通过',分支:'按条件表达式流转至不同节点'}[n.mode]||'')+'</div>';
  }
  h+='</div></div><div class="ap-side-b"><div class="mini-head">签名留痕</div><button class="btn sm" style="width:100%" onclick="openSign()">'+svg('pen','ic-sm')+'打开手写签名板</button><div class="ap-sign-list">'+S.signatures.slice(0,3).map(x=>'<div class="ap-sign-i">'+svg('check','ic-sm')+'<span>'+esc(x.t)+' · '+esc(x.u)+'</span></div>').join('')+'</div></div>';
  h+='<div class="ap-side-b"><div class="mini-head">流程说明</div><div class="tip" style="line-height:1.9">'+esc(f.desc)+'</div><div class="ap-path">'+f.nodes.map(n=>'<span>'+esc(n.name)+'</span>').join('<i>→</i>')+'</div></div></aside></div>';
  return h;
};

function switchFlow(){_flowId=document.getElementById('flowSel').value;_selNode=-1;render()}
function saveFlow(){save();log('保存审批流程：'+curFlow().name);toast('审批流程已保存')}
function selNode(i){_selNode=i;render()}
function addNode(){const f=curFlow();f.nodes.splice(Math.max(1,f.nodes.length-1),0,{id:uid(),type:'task',name:'新审批节点',mode:'或签',who:['审批人']});_selNode=Math.max(1,f.nodes.length-2);save();render();toast('已添加审批节点')}
function delNode(i){const f=curFlow();if(f.nodes[i].type==='start'||f.nodes[i].type==='end')return toast('起止节点不可删除','err');f.nodes.splice(i,1);_selNode=-1;save();render()}
function updNode(k,v){const f=curFlow();if(!f.nodes[_selNode])return;f.nodes[_selNode][k]=k==='who'?v.split(/[,，]/).map(x=>x.trim()).filter(Boolean):v;save()}
BIND.approval=function(){
  const cv=document.getElementById('flowCanvas');if(!cv)return;let dragIdx=null;
  cv.querySelectorAll('.fnode').forEach(el=>{el.addEventListener('dragstart',e=>{dragIdx=parseInt(el.dataset.i);e.dataTransfer.effectAllowed='move'});el.addEventListener('dragover',e=>e.preventDefault());el.addEventListener('drop',e=>{e.preventDefault();const to=parseInt(el.dataset.i);if(dragIdx==null||dragIdx===to)return;const arr=curFlow().nodes,it=arr.splice(dragIdx,1)[0];arr.splice(to,0,it);_selNode=to;save();render();toast('节点顺序已调整')})});
};
let _signCtx=null,_signEmpty=true;
function openSign(){
  modal('手写签名板','<div class="tip" style="margin-bottom:12px">请在此区域手写签名，签名将随审批节点一同留痕存证</div><div class="signpad"><canvas id="signCanvas"></canvas><div class="ph" id="signPh">请在此处手写签名</div></div><div style="display:flex;gap:8px;margin-top:12px"><button class="btn sm" onclick="clearSign()">'+svg('refresh','ic-sm')+'清除重签</button><span class="tag t" id="signState">未签名</span></div>','<button class="btn" onclick="closeModal()">取消</button><button class="btn gold" onclick="saveSign()">'+svg('save','ic-sm')+'保存签名</button>',true);
  setTimeout(initSign,60);
}
function initSign(){const c=document.getElementById('signCanvas');if(!c)return;const r=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1;c.width=r.width*dpr;c.height=r.height*dpr;const ctx=c.getContext('2d');ctx.scale(dpr,dpr);ctx.strokeStyle='#f0d493';ctx.lineWidth=2.5;ctx.lineCap='round';ctx.lineJoin='round';_signCtx=ctx;_signEmpty=true;let drawing=false;
  const pos=e=>{const b=c.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
  c.addEventListener('pointerdown',e=>{drawing=true;_signEmpty=false;document.getElementById('signPh').style.display='none';document.getElementById('signState').textContent='已签名';ctx.beginPath();ctx.moveTo.apply(ctx,pos(e));c.setPointerCapture(e.pointerId)});
  c.addEventListener('pointermove',e=>{if(!drawing)return;ctx.lineTo.apply(ctx,pos(e));ctx.stroke()});
  c.addEventListener('pointerup',()=>drawing=false);
}
function clearSign(){if(_signCtx){const c=document.getElementById('signCanvas');_signCtx.clearRect(0,0,c.width,c.height);_signEmpty=true;document.getElementById('signPh').style.display='grid';document.getElementById('signState').textContent='未签名'}}
function saveSign(){if(_signEmpty)return toast('请先手写签名','err');const c=document.getElementById('signCanvas');S.signatures.push({t:now(),u:S.user.name,img:c.toDataURL('image/png')});save();closeModal();log('保存手写签名');toast('手写签名已保存并留痕')}

/* ==================== CHART ENGINE ==================== */
let _chartId=null;
function curChart(){if(!_chartId||!S.charts.some(c=>c.id===_chartId))_chartId=S.charts[0]&&S.charts[0].id;return S.charts.find(c=>c.id===_chartId)||S.charts[0]}
R.chart=function(){
  const c=curChart();if(!c)return '<div class="empty">暂无图表</div>';
  let h='<div class="page-head"><div><h2>图表引擎</h2><p>多数据源接入，基于表单/审批数据或上传报表生成可视化图表</p></div><div class="head-actions"><button class="btn" onclick="uploadReport()">'+svg('upload','ic-sm')+'上传报表</button><button class="btn" onclick="addChart()">'+svg('plus','ic-sm')+'新建图表</button><button class="btn gold" onclick="saveChart()">'+svg('save','ic-sm')+'保存配置</button></div></div>';
  h+='<div class="chart-work"><aside class="chart-list"><div class="mini-head">图表集（'+S.charts.length+'）</div>';
  S.charts.forEach(x=>{h+='<div class="chart-list-i '+(x.id===c.id?'on':'')+'" onclick="switchChartById(\''+x.id+'\')"><div class="chart-list-ic">'+svg(x.type,'ic-sm')+'</div><div><b>'+esc(x.title)+'</b><span>'+esc(x.source)+' · '+x.data.length+' 项</span></div></div>'});
  h+='<button class="btn sm" style="width:100%;margin-top:8px" onclick="addChart()">'+svg('plus','ic-sm')+'新建图表</button></aside>';
  h+='<section class="chart-stage"><div class="chart-stage-h"><div><span class="chart-stage-k">CHART WORKSPACE</span><h3>'+esc(c.title)+'</h3></div><div class="chart-stage-tools"><div class="seg">'+[['bar','bar','柱状'],['line','line','折线'],['pie','pie','饼图']].map(x=>'<button class="'+(c.type===x[0]?'on':'')+'" onclick="updChart(\'type\',\''+x[0]+'\')">'+svg(x[1],'ic-sm')+' '+x[2]+'</button>').join('')+'</div><button class="btn sm" onclick="editChartData()">'+svg('edit','ic-sm')+'编辑数据</button></div></div>';
  h+='<div class="chart-stage-b"><div class="chart-box">'+drawChart(c)+'</div></div>';
  h+='<div class="chart-stage-f"><div><span>数据源</span><b>'+esc(c.source)+'</b></div><div><span>数据项</span><b>'+c.data.length+'</b></div><div><span>合计</span><b class="hl">'+c.data.reduce((a,d)=>a+d.v,0)+'</b></div><div><span>类型</span><b>'+({bar:'柱状图',line:'折线图',pie:'饼图'}[c.type])+'</b></div></div></section>';
  h+='<aside class="chart-cfg"><div class="mini-head">数据源与配置</div><select class="sel2" id="chartSel" onchange="switchChart()" style="width:100%;margin-bottom:12px">'+S.charts.map(x=>'<option value="'+x.id+'" '+(x.id===c.id?'selected':'')+'>'+esc(x.title)+'</option>').join('')+'</select>';
  h+='<div class="f-row"><label>图表标题</label><input class="inp2" value="'+esc(c.title)+'" onchange="updChart(\'title\',this.value)"></div>';
  h+='<div class="f-row"><label>图表类型</label><select class="sel2" onchange="updChart(\'type\',this.value)">'+[['bar','柱状图'],['line','折线图'],['pie','饼图']].map(x=>'<option value="'+x[0]+'" '+(c.type===x[0]?'selected':'')+'>'+x[1]+'</option>').join('')+'</select></div>';
  h+='<div class="f-row"><label>数据源</label><select class="sel2" onchange="updChart(\'source\',this.value)">'+['表单数据','审批数据','手动上传报表','外部接口'].map(x=>'<option '+(c.source===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div>';
  h+='<div class="divider"></div><div class="mini-head">数据预览</div><table class="tbl"><thead><tr><th>分类</th><th>数值</th></tr></thead><tbody>'+c.data.map(d=>'<tr><td>'+esc(d.n)+'</td><td class="hl">'+d.v+'</td></tr>').join('')+'</tbody></table></aside></div>';
  return h;
};
function switchChartById(id){_chartId=id;render()}

function switchChart(){_chartId=document.getElementById('chartSel').value;render()}
function updChart(k,v){curChart()[k]=v;save();if(k==='title')toast('标题已更新');render()}
function saveChart(){save();log('保存图表配置：'+curChart().title);toast('图表配置已保存')}
function addChart(){const c={id:uid(),title:'新建数据图表',type:'bar',source:'表单数据',data:[{n:'类别A',v:30},{n:'类别B',v:55},{n:'类别C',v:42}]};S.charts.push(c);_chartId=c.id;save();render();toast('图表已创建')}
function editChartData(){const c=curChart();modal('编辑图表数据 · '+c.title,'<div class="tip" style="margin-bottom:10px">每行一条数据：分类,数值</div><textarea class="ta2" id="chartData" style="min-height:220px;font-family:monospace">'+c.data.map(d=>esc(d.n)+','+d.v).join('\n')+'</textarea>','<button class="btn" onclick="closeModal()">取消</button><button class="btn gold" onclick="saveChartData()">应用数据</button>')}
function saveChartData(){const t=document.getElementById('chartData').value.split(/\n/).map(x=>x.split(/[,，]/)).filter(x=>x.length>=2&&x[0].trim());curChart().data=t.map(x=>({n:x[0].trim(),v:Number(x[1])||0}));closeModal();save();render();toast('图表数据已更新')}
function uploadReport(){modal('上传报表数据','<div class="tip" style="margin-bottom:12px">支持 CSV 文件或直接粘贴表格数据（首列为分类，次列为数值）</div><div class="f-row"><label>选择 CSV 文件</label><input class="inp2" type="file" id="reportFile" accept=".csv,.txt" onchange="readReportFile(event)"></div><div class="f-row"><label>或粘贴数据</label><textarea class="ta2" id="reportText" style="min-height:160px;font-family:monospace" placeholder="类别A,30\n类别B,55"></textarea></div>','<button class="btn" onclick="closeModal()">取消</button><button class="btn gold" onclick="applyReport()">导入并生成图表</button>')}
function readReportFile(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{document.getElementById('reportText').value=r.result};r.readAsText(f,'UTF-8')}
function applyReport(){const t=document.getElementById('reportText').value.trim();if(!t)return toast('请选择文件或粘贴数据','err');const rows=t.split(/\r?\n/).map(x=>x.split(/[,，\t]/)).filter(x=>x.length>=2);if(!rows.length)return toast('数据格式不正确','err');const c=curChart();c.data=rows.map(x=>({n:x[0].trim().replace(/^"|"$/g,''),v:Number(x[1])||0}));c.source='手动上传报表';closeModal();save();render();log('上传报表数据生成图表');toast('数据导入成功，图表已生成')}
function drawChart(c){
  const W=640,H=280,pad={l:50,r:20,t:24,b:42},data=c.data.slice(0,8),mx=Math.max(1,...data.map(d=>d.v));
  let s='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:100%">';
  if(c.type==='pie'){
    const cx=W/2,cy=H/2,R=100,total=data.reduce((a,d)=>a+d.v,0)||1;const cols=['#b1503a','#1e4b3d','#a9792f','#8a6f4e','#5b8f78','#cc8a63','#7d6b52','#d4b06a'];let a0=-Math.PI/2;
    data.forEach((d,i)=>{const a1=a0+d.v/total*Math.PI*2;const x0=cx+R*Math.cos(a0),y0=cy+R*Math.sin(a0),x1=cx+R*Math.cos(a1),y1=cy+R*Math.sin(a1),large=(a1-a0)>Math.PI?1:0;
      s+='<path d="M'+cx+' '+cy+' L'+x0+' '+y0+' A'+R+' '+R+' 0 '+large+' 1 '+x1+' '+y1+' Z" fill="'+cols[i%cols.length]+'" opacity=".88" stroke="#fffefa" stroke-width="2"/>';a0=a1});
    s+='<circle cx="'+cx+'" cy="'+cy+'" r="52" fill="#fffefa" stroke="#e5e0d5"/>';
    s+='<text x="'+cx+'" y="'+(cy-4)+'" text-anchor="middle" fill="#797266" font-size="11">合计</text><text x="'+cx+'" y="'+(cy+18)+'" text-anchor="middle" fill="#b1503a" font-size="20" font-weight="600">'+total+'</text>';
    data.forEach((d,i)=>{const y=28+i*22;s+='<rect x="20" y="'+(y-9)+'" width="10" height="10" rx="2" fill="'+cols[i%cols.length]+'"/><text x="38" y="'+y+'" fill="#797266" font-size="11">'+esc(d.n)+'</text>'});
  }else{
    for(let i=0;i<=4;i++){const y=pad.t+i*(H-pad.t-pad.b)/4;s+='<line x1="'+pad.l+'" y1="'+y+'" x2="'+(W-pad.r)+'" y2="'+y+'" stroke="#e5e0d5"/><text x="'+(pad.l-8)+'" y="'+(y+4)+'" text-anchor="end" fill="#a8a091" font-size="10">'+Math.round(mx*(4-i)/4)+'</text>'}
    const bw=(W-pad.l-pad.r)/data.length;
    if(c.type==='bar'){
      data.forEach((d,i)=>{const bh=(d.v/mx)*(H-pad.t-pad.b),x=pad.l+i*bw+bw*.22,y=H-pad.b-bh;
        s+='<rect x="'+x+'" y="'+y+'" width="'+(bw*.56)+'" height="'+bh+'" rx="4" fill="url(#bg1)"/><text x="'+(x+bw*.28)+'" y="'+(y-6)+'" text-anchor="middle" fill="#b1503a" font-size="11">'+d.v+'</text><text x="'+(pad.l+i*bw+bw/2)+'" y="'+(H-pad.b+18)+'" text-anchor="middle" fill="#797266" font-size="10">'+esc(d.n)+'</text>'});
    }else{
      const pts=data.map((d,i)=>[pad.l+i*bw+bw/2,H-pad.b-(d.v/mx)*(H-pad.t-pad.b)]);
      s+='<defs><linearGradient id="lg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b1503a" stop-opacity=".22"/><stop offset="1" stop-color="#b1503a" stop-opacity="0"/></linearGradient></defs>';
      s+='<polygon points="'+pts.map(p=>p[0]+','+p[1]).join(' ')+' '+(pad.l+(data.length-1)*bw+bw/2)+','+(H-pad.b)+' '+pad.l+','+(H-pad.b)+'" fill="url(#lg1)"/>';
      s+='<polyline points="'+pts.map(p=>p[0]+','+p[1]).join(' ')+'" fill="none" stroke="#b1503a" stroke-width="2.5" stroke-linejoin="round"/>';
      pts.forEach((p,i)=>{s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="4" fill="#fffefa" stroke="#b1503a" stroke-width="2"/><text x="'+p[0]+'" y="'+(p[1]-10)+'" text-anchor="middle" fill="#b1503a" font-size="10">'+data[i].v+'</text><text x="'+p[0]+'" y="'+(H-pad.b+18)+'" text-anchor="middle" fill="#797266" font-size="10">'+esc(data[i].n)+'</text>'});
    }
  }
  s+='<defs><linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b1503a"/><stop offset="1" stop-color="#8a3d2b"/></linearGradient></defs></svg>';
  return s;
}
/* ==================== COMPONENT LIBRARY ==================== */
let _selComp=null,_dsMode={},_compFilter='全部';

const COMP_META={number:['数字滚动','number'],text:['文本','text'],image:['图片','image'],table:['表格','table'],list:['图文列表','content'],pie:['饼图','pie'],bar:['柱状图','bar'],line:['折线图','line'],carousel:['轮播图','carousel']};
R.components=function(){
  const groups=[['全部','全部'],['数值文本','number,text,image'],['图表','pie,bar,line'],['内容','table,list,carousel']];
  const types=_compFilter==='全部'?Object.keys(COMP_META):({数值文本:['number','text','image'],图表:['pie','bar','line'],内容:['table','list','carousel']}[_compFilter]||Object.keys(COMP_META));
  let h='<div class="page-head"><div><h2>可视化组件库</h2><p>数字滚动、文本、图片、表格、图表等组件，支持样式修改与动态数据对接</p></div><div class="head-actions"><button class="btn" onclick="exportComponents()">'+svg('download','ic-sm')+'导出配置</button><button class="btn gold" onclick="saveComponents()">'+svg('save','ic-sm')+'保存配置</button></div></div>';
  h+='<div class="comp-top"><div class="chips">'+groups.map(g=>'<div class="chip '+(_compFilter===g[0]?'on':'')+'" onclick="setCompFilter(\''+g[0]+'\')">'+g[0]+'</div>').join('')+'</div><span style="flex:1"></span><span class="tag g">'+S.components.length+' 个组件</span><button class="btn sm gold" onclick="addComponent()">'+svg('plus','ic-sm')+'添加组件</button></div>';
  h+='<div class="comp-gallery">';
  S.components.filter(w=>types.indexOf(w.type)>=0).forEach(w=>{const m=COMP_META[w.type]||['组件','components'];
    h+='<div class="comp-card '+(w.id===_selComp?'sel':'')+'" onclick="selComp(\''+w.id+'\')"><div class="comp-preview" style="background:'+w.bg+';border:1px solid '+w.border+'">'+compPreview(w)+'</div><div class="comp-card-b"><b>'+esc(w.name)+'</b><span class="tag">'+m[0]+'</span></div><div class="tip">数据：'+(w.dynamic?'动态对接':'静态数据')+'</div></div>';
  });
  h+='</div>';
  const w=S.components.find(x=>x.id===_selComp);
  h+='<div class="comp-inspector"><div class="mini-head">组件检查器'+(w?' · '+esc(w.name):'')+'</div>';
  if(!w)h+='<div class="comp-empty">'+svg('palette')+' 选中上方组件，配置样式、颜色与数据对接</div>';
  else{
    h+='<div class="comp-insp-grid"><div class="f-row"><label>组件名称</label><input class="inp2" value="'+esc(w.name)+'" onchange="updComp(\'name\',this.value)"></div><div class="f-row"><label>文本 / 数值内容</label><input class="inp2" value="'+esc(w.value)+'" onchange="updComp(\'value\',this.value)"></div>';
    h+='<div class="f-row"><label>文字颜色</label><input type="color" value="'+w.color+'" style="width:100%;height:38px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:4px" onchange="updComp(\'color\',this.value)"></div>';
    h+='<div class="f-row"><label>背景颜色</label><input type="color" value="'+w.bg+'" style="width:100%;height:38px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:4px" onchange="updComp(\'bg\',this.value)"></div>';
    h+='<div class="f-row"><label>边框颜色</label><input type="color" value="'+w.border+'" style="width:100%;height:38px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:4px" onchange="updComp(\'border\',this.value)"></div>';
    h+='<div class="f-row" style="display:flex;justify-content:space-between;align-items:center"><div><div style="font-size:12.5px">动态数据对接</div><div class="tip">对接表单/审批数据或标准接口</div></div><div class="switch '+(w.dynamic?'on':'')+'" onclick="toggleDynamic()"></div></div></div>';
  }
  h+='</div>';
  return h;
};
function setCompFilter(g){_compFilter=g;render()}

function compPreview(w){const c=w.color;
  if(w.type==='number')return '<b style="font-size:26px;color:'+c+';font-variant-numeric:tabular-nums">'+esc(w.value)+'</b>';
  if(w.type==='text')return '<span style="color:'+c+';font-size:12px;text-align:center;padding:0 8px">'+esc(w.value)+'</span>';
  if(w.type==='image')return '<div style="text-align:center;color:'+c+'">'+svg('image','ic-xl')+'<div style="font-size:10px;margin-top:4px">'+esc(w.value)+'</div></div>';
  if(w.type==='table')return '<div style="width:80%;font-size:9px;color:'+c+'"><div style="display:flex;border-bottom:1px solid '+c+';padding:2px 0"><span style="flex:1">名称</span><span style="flex:1">状态</span></div><div style="display:flex;padding:3px 0"><span style="flex:1">项目A</span><span style="flex:1">进行中</span></div><div style="display:flex;padding:3px 0"><span style="flex:1">项目B</span><span style="flex:1">已完成</span></div></div>';
  if(w.type==='list')return '<div style="font-size:10px;color:'+c+'">'+svg('content','ic-lg')+'<div>图文列表 · 多级分类</div></div>';
  if(w.type==='carousel')return '<div style="display:flex;align-items:center;gap:10px;color:'+c+'">'+svg('left','ic-lg')+'<div style="width:80px;height:44px;border:1px solid '+c+';border-radius:5px;display:grid;place-items:center;font-size:9px">Banner 1</div>'+svg('right','ic-lg')+'</div>';
  const mini={pie:[[40,60,20],[160,50,30]],bar:[[20,70,20],[70,45,20],[120,55,20]],line:[[20,70],[70,40],[120,50],[170,25]]};
  if(w.type==='pie')return '<svg width="70" height="70" viewBox="0 0 70 70"><circle cx="35" cy="35" r="28" fill="'+c+'" opacity=".85"/><path d="M35 35 L35 7 A28 28 0 0 1 60 45 Z" fill="#1e4b3d" opacity=".8"/></svg>';
  if(w.type==='bar')return '<svg width="140" height="70" viewBox="0 0 140 70"><rect x="15" y="30" width="20" height="35" fill="'+c+'"/><rect x="55" y="15" width="20" height="50" fill="#1e4b3d"/><rect x="95" y="38" width="20" height="27" fill="'+c+'"/></svg>';
  return '<svg width="140" height="70" viewBox="0 0 140 70"><polyline points="10,55 45,30 80,42 115,15" fill="none" stroke="'+c+'" stroke-width="2.5"/><circle cx="115" cy="15" r="3" fill="'+c+'"/></svg>';
}
function selComp(id){_selComp=id;render()}
function updComp(k,v){const w=S.components.find(x=>x.id===_selComp);if(!w)return;w[k]=v;save();if(k==='name'||k==='value')render()}
function toggleDynamic(){const w=S.components.find(x=>x.id===_selComp);w.dynamic=!w.dynamic;save();render();toast(w.dynamic?'已切换为动态数据对接':'已切换为静态数据')}
function addComponent(){modal('添加可视化组件','<div class="f-row"><label>组件类型</label><select class="sel2" id="acType">'+Object.keys(COMP_META).map(k=>'<option value="'+k+'">'+COMP_META[k][0]+'</option>').join('')+'</select></div><div class="f-row"><label>组件名称</label><input class="inp2" id="acName" placeholder="如：报名人数统计"></div><div class="f-row"><label>显示内容 / 数值</label><input class="inp2" id="acVal" value="128"></div>','<button class="btn" onclick="closeModal()">取消</button><button class="btn gold" onclick="createComponent()">添加</button>')}
function createComponent(){const t=document.getElementById('acType').value,n=document.getElementById('acName').value.trim()||COMP_META[t][0],v=document.getElementById('acVal').value;S.components.push({id:uid(),type:t,name:n,value:v,color:'#a9792f',bg:'#fffefa',border:'#d4ccbc',dynamic:false});closeModal();save();render();toast('组件已添加')}
function saveComponents(){save();log('保存可视化组件配置');toast('组件配置已保存')}
function exportComponents(){downloadText('组件配置.json',JSON.stringify(S.components,null,2),'application/json');toast('组件配置已导出')}

/* ==================== CONTENT MANAGER ==================== */
let _catFilter='全部',_kw='';
R.content=function(){
  const cats=['全部'].concat(Array.from(new Set(S.contents.map(c=>c.cat))));
  let list=S.contents.filter(c=>(_catFilter==='全部'||c.cat===_catFilter)&&(!_kw||c.title.includes(_kw)||c.cat.includes(_kw))).slice().sort((a,b)=>(b.top?1:0)-(a.top?1:0));

  h+='<div class="ct-work"><aside class="ct-side"><div class="mini-head">内容分类</div>';
  cats.forEach(c=>{h+='<div class="ct-cat '+(_catFilter===c?'on':'')+'" onclick="setCat(\''+c+'\')">'+svg('content','ic-sm')+'<span>'+esc(c)+'</span><b>'+(c==='全部'?S.contents.length:S.contents.filter(x=>x.cat===c).length)+'</b></div>'});

BIND.content=function(){const i=document.getElementById('kwInput');if(!i)return;i.oninput=function(){_kw=this.value;const pos=this.selectionStart;render();const n=document.getElementById('kwInput');if(n){n.focus();n.setSelectionRange(pos,pos)}}};

function contentModal(c){modal(c?'编辑内容':'新增内容','<div class="f-row"><label>内容标题</label><input class="inp2" id="ctTitle" value="'+esc(c?c.title:'')+'" placeholder="请输入标题"></div><div class="f-row"><label>多级分类</label><select class="sel2" id="ctCat">'+['赛事动态','通知公告','评审公示','资料下载'].map(x=>'<option '+(c&&c.cat===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div class="f-row"><label>发布日期</label><input class="inp2" type="date" id="ctDate" value="'+(c?c.date:new Date().toISOString().slice(0,10))+'"></div><div class="f-row"><label>状态</label><select class="sel2" id="ctStatus">'+['已发布','草稿'].map(x=>'<option '+(c&&c.status===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div>','<button class="btn" onclick="closeModal()">取消</button><button class="btn gold" onclick="saveContent(\''+(c?c.id:'')+'\')">保存</button>')}

function importContent(){modal('批量导入内容','<div class="tip" style="margin-bottom:10px">每行一条：标题,分类,日期,状态（逗号分隔）</div><textarea class="ta2" id="impText" style="min-height:200px;font-family:monospace" placeholder="赛事新闻,赛事动态,2026-11-20,已发布"></textarea>','<button class="btn" onclick="closeModal()">取消</button><button class="btn gold" onclick="doImportContent()">导入</button>')}
function doImportContent(){const rows=document.getElementById('impText').value.split(/\n/).map(x=>x.split(/[,，]/)).filter(x=>x[0]&&x[0].trim());if(!rows.length)return toast('暂无可导入数据','err');rows.forEach(x=>S.contents.push({id:uid(),title:x[0].trim(),cat:(x[1]||'赛事动态').trim(),date:(x[2]||new Date().toISOString().slice(0,10)).trim(),status:(x[3]||'草稿').trim(),top:false}));closeModal();save();render();log('批量导入内容数据 '+rows.length+' 条');toast('成功导入 '+rows.length+' 条内容')}

  h+='<div class="sc-wall">';
  S.screens.forEach(sc=>{h+='<div class="sc-card"><div class="sc-card-h"><div class="sc-screen-ic">'+svg(sc.icon)+'</div><div class="switch '+(sc.online?'on':'')+'" onclick="toggleScreen(\''+sc.id+'\')"></div></div>';
    h+='<div class="sc-card-t"><b>'+esc(sc.name)+'</b><span>'+esc(sc.desc)+'</span></div>';
    h+='<div class="sc-card-domain">'+svg('link','ic-sm')+'<span>'+esc(sc.domain)+'</span></div>';
    h+='<div class="sc-card-tags"><span class="tag '+(sc.access==='login'?'g':'t')+'">'+(sc.access==='login'?'需登录访问':'无需权限')+'</span><span class="tag '+(sc.online?'t':'')+'">'+(sc.online?'在线':'已下线')+'</span><span class="tag">'+(sc.intranet?'仅内网':'IP '+sc.ip)+'</span></div>';
    h+='<div class="sc-card-f"><button class="btn sm" onclick="openScreen(\''+sc.id+'\')">'+svg('edit','ic-sm')+'编辑</button><button class="btn sm" onclick="copyDomain(\''+sc.id+'\')">'+svg('copy','ic-sm')+'复制域名</button><button class="btn sm icon del" onclick="delScreen(\''+sc.id+'\')">'+svg('trash','ic-sm')+'</button></div></div>'});
  h+='<button class="sc-add" onclick="addScreen()">'+svg('plus','ic-xl')+'<b>新建智能屏幕</b><span>挂接域名 · 配置访问权限</span></button></div>';
  return h;
};

function toggleScreen(id){const s=S.screens.find(x=>x.id===id);s.online=!s.online;save();render();toast(s.online?'屏幕已上线':'屏幕已下线')}
function copyDomain(id){const d=S.screens.find(x=>x.id===id).domain;if(navigator.clipboard)navigator.clipboard.writeText(d);toast('域名已复制：'+d)}
function delScreen(id){confirmBox('确认删除该智能屏幕？',function(){S.screens=S.screens.filter(x=>x.id!==id);save();render();toast('屏幕已删除')})}
function addScreen(){screenModal(null)}
function openScreen(id){screenModal(S.screens.find(x=>x.id===id))}
function screenModal(s){modal(s?'编辑智能屏幕':'新建智能屏幕','<div class="f-row"><label>屏幕名称</label><input class="inp2" id="scName" value="'+esc(s?s.name:'')+'"></div><div class="f-row"><label>访问域名（支持挂接自有域名）</label><input class="inp2" id="scDomain" value="'+esc(s?s.domain:'')+'" placeholder="screen.guanlan.cn/xxx"></div><div class="f-row"><label>简介</label><input class="inp2" id="scDesc" value="'+esc(s?s.desc:'')+'"></div><div class="f-row"><label>访问权限</label><select class="sel2" id="scAccess"><option value="free" '+(s&&s.access==='free'?'selected':'')+'>无需权限</option><option value="login" '+(s&&s.access==='login'?'selected':'')+'>需登录访问</option></select></div><div class="f-row"><label>网页图标</label><select class="sel2" id="scIcon">'+[['trophy','奖杯'],['chart','图表'],['users','用户'],['screen','屏幕']].map(x=>'<option value="'+x[0]+'" '+(s&&s.icon===x[0]?'selected':'')+'>'+x[1]+'</option>').join('')+'</select></div><div class="f-row"><label>IP 白名单</label><input class="inp2" id="scIp" value="'+esc(s?s.ip:'*')+'"></div><div class="f-row" style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:12.5px">仅内网访问</span><div class="switch '+(s&&s.intranet?'on':'')+'" id="scIntra"></div></div>','<button class="btn" onclick="closeModal()">取消</button><button class="btn gold" onclick="saveScreen(\''+(s?s.id:'')+'\')">保存</button>')}
function saveScreen(id){const n=document.getElementById('scName').value.trim();if(!n)return toast('请输入屏幕名称','err');const o={name:n,domain:document.getElementById('scDomain').value.trim()||'screen.guanlan.cn/'+uid().slice(0,6),desc:document.getElementById('scDesc').value.trim(),access:document.getElementById('scAccess').value,icon:document.getElementById('scIcon').value,ip:document.getElementById('scIp').value.trim()||'*',intranet:document.getElementById('scIntra').classList.contains('on')};if(id)Object.assign(S.screens.find(x=>x.id===id),o);else S.screens.push(Object.assign({id:uid(),online:false,guest:false},o));closeModal();save();render();log((id?'编辑':'新建')+'智能屏幕：'+n);toast('屏幕配置已保存')}

/* ==================== SECURITY ==================== */
R.security=function(){
  const s=S.sso,lm=s.loginMethods||{pwd:true,code:true,sso:true};
  let h='<div class="page-head"><div><h2>访问与安全</h2><p>多种登录方式、第三方系统账号对接（SSO）、IP 白名单与操作审计</p></div><div class="head-actions"><button class="btn" onclick="exportLogs()">'+svg('download','ic-sm')+'导出操作记录</button><button class="btn" onclick="downloadPackage()">'+svg('package','ic-sm')+'下载镜像包</button><button class="btn gold" onclick="saveSecurity()">'+svg('save','ic-sm')+'保存配置</button></div></div>';
  h+='<div class="sec-work"><section class="sec-main"><div class="sec-block"><div class="sec-block-h"><span class="sec-no">01</span><h3>登录方式</h3><span class="tag">登录页实时生效</span></div><div class="sec-block-b"><div class="sec-methods">';
  [['pwd','账号密码登录','user','用户名 + 密码，账号 root'],['code','手机验证码登录','phone','手机号 + 短信验证码'],['sso','第三方 / SSO 统一认证','shield','CAS / OAuth2 / LDAP 对接']].forEach(x=>{h+='<div class="sec-method '+(lm[x[0]]?'on':'')+'" onclick="toggleLoginMethod(\''+x[0]+'\')"><div class="sec-method-ic">'+svg(x[2])+'</div><div><b>'+x[1]+'</b><span>'+x[3]+'</span></div><div class="switch '+(lm[x[0]]?'on':'')+'"></div></div>'});
  h+='</div><div class="tip" style="margin-top:10px">停用的方式将不再出现在登录页；至少保留一种登录方式。</div></div></div>';
  h+='<div class="sec-block"><div class="sec-block-h"><span class="sec-no">02</span><h3>SSO 对接与网络策略</h3><div class="switch '+(s.enabled?'on':'')+'" onclick="toggleSSO()"></div></div><div class="sec-block-b"><div class="kv"><span>认证提供方</span><b>'+esc(s.provider)+'</b></div><div class="kv"><span>应用标识 ClientID</span><b class="hl">'+esc(s.clientId)+'</b></div><div class="kv"><span>单点登录状态</span><span class="tag '+(s.enabled?'t':'r')+'">'+(s.enabled?'已启用':'已停用')+'</span></div><div class="f-row"><label>IP 白名单</label><textarea class="ta2" id="secWhite">'+esc(s.whitelist)+'</textarea></div>';
  h+='<div class="sec-toggles">'+[['仅内网访问','限制外网直接访问管理后台',S.portal.intranet,'toggleIntra()'],['网站下线','临时下线后所有访问不可用',false,'toast(\'网站状态已切换\',\'info\')'],['访客模式','允许未登录用户浏览公开内容',S.screens[1].guest,'toggleGuest()']].map(x=>'<div class="sec-toggle"><div><b>'+x[0]+'</b><span>'+x[1]+'</span></div><div class="switch '+(x[2]?'on':'')+'" onclick="'+x[3]+'"></div></div>').join('')+'</div></div></div></section>';
  h+='<aside class="sec-audit"><div class="sec-audit-h"><div><h3>操作记录审计</h3><span>共 '+S.logs.length+' 条操作留痕</span></div><button class="btn sm" onclick="addGuide()">'+svg('guide','ic-sm')+'引导图</button></div><div class="sec-audit-list">';
  S.logs.forEach(l=>{h+='<div class="sec-log"><div class="sec-log-dot"></div><div class="sec-log-b"><b>'+esc(l.a)+'</b><span>'+esc(l.t)+' · '+esc(l.u)+' / '+esc(l.ip)+'</span></div></div>'});
  h+='</div><button class="btn" style="width:100%;margin-top:12px" onclick="exportLogs()">'+svg('download','ic-sm')+'导出全部操作记录</button></aside></div>';
  return h;
};

function toggleSSO(){S.sso.enabled=!S.sso.enabled;save();render();toast('SSO 单点登录'+(S.sso.enabled?'已启用':'已停用'))}
function toggleLoginMethod(k){const lm=S.sso.loginMethods||(S.sso.loginMethods={pwd:true,code:true,sso:true});const cnt=Object.values(lm).filter(Boolean).length;if(lm[k]&&cnt<=1)return toast('至少保留一种登录方式','err');lm[k]=!lm[k];save();render();toast('登录方式配置已更新，登录页实时生效')}
function toggleIntra(){S.portal.intranet=!S.portal.intranet;save();render();toast('内网访问限制已切换')}
function toggleGuest(){S.screens[1].guest=!S.screens[1].guest;save();render();toast('访客模式已切换')}
function saveSecurity(){S.sso.whitelist=document.getElementById('secWhite').value.trim();save();log('保存访问与安全配置');toast('安全配置已保存')}
function exportLogs(){downloadText('操作记录.csv',toCSV(['时间','操作人','操作内容','IP'],S.logs.map(l=>[l.t,l.u,l.a,l.ip])),'text/csv;charset=utf-8');toast('操作记录已导出')}
function downloadPackage(){const pkg={exportTime:now(),forms:S.forms,flows:S.flows,charts:S.charts,components:S.components,contents:S.contents,portal:S.portal,screens:S.screens,sso:S.sso,logs:S.logs};downloadText('观澜平台_镜像数据包.json',JSON.stringify(pkg,null,2),'application/json');log('下载镜像数据包');toast('镜像数据包已下载')}
function addGuide(){modal('新手引导图片','<div class="tip" style="margin-bottom:12px">为智能屏幕配置新手引导图片，首次访问时展示操作指引</div><div class="f-row"><label>引导图片名称</label><input class="inp2" id="gdName" value="平台使用引导图"></div><div class="f-row"><label>展示位置</label><select class="sel2"><option>首次登录时</option><option>每次访问时</option><option>不展示</option></select></div><div class="rs-grid"><div class="rs-item" style="border-color:var(--gold);color:var(--gold2)">'+svg('image','ic-lg')+'<br>默认引导图</div><div class="rs-item">'+svg('plus','ic-lg')+'<br>上传图片</div></div>','<button class="btn" onclick="closeModal()">取消</button><button class="btn gold" onclick="closeModal();toast(\'新手引导图片已配置\')">保存</button>')}
/* __APPEND_HERE__ */
</script>
</body>
</html>
