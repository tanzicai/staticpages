function index(){const q=el('search').value.toLowerCase();el('indexTable').querySelector('tbody').innerHTML=charts.filter(c=>`${c.course} ${c.metric} ${c.classid} ${c.type}`.toLowerCase().includes(q)).map(c=>`<tr><td>${c.type}</td><td>${c.classid}</td><td>${esc(c.course)}</td><td>${esc(c.metric)}</td><td>${c.rows.filter(r=>Number.isFinite(r.score)).length} / ${c.rows.length}</td><td class="pill">${esc(c.state)}</td><td><a href="?type=${c.type}&classid=${c.classid}">查看图表 ↗</a></td></tr>`).join('');}
el('search').oninput=index;
const params=new URLSearchParams(location.search),t=Number(params.get('type')||payload.type),id=params.get('classid')||payload.classid;
if(t&&id){const c=charts.find(c=>c.type===t&&c.classid===id);if(c){render(c);el('indexSection').hidden=true;}else el('content').textContent='未找到该指标或课程，请从索引选择。';}else{el('back').hidden=true;el('download').hidden=true;}

el('indexCSV').onclick=()=>{
 const records=[['type','classid','课程','指标','环节','记录数','有效得分数','状态','参数'],...charts.map(c=>[c.type,c.classid,c.course,c.metric,c.phase,c.rows.length,c.rows.filter(r=>Number.isFinite(r.score)).length,c.state,`?type=${c.type}&classid=${c.classid}`])];
 const text='\ufeff'+records.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));a.download='图表索引.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};

index();
</script></html>
