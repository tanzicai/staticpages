<style>

<script>
const TEST = {"resourceId":"P09-T04-H5-QUIZ-02","fileStem":"P09-T04-H5-QUIZ-02_提升任务_USB-TTL与PC通信_V2.1","title":"提升任务测一测：USB-TTL与PC通信","sectionLabel":"提升任务知识测试（8题）","questions":[{"stem":"USB-TTL模块与单片机连接时，正确做法是（　）。","options":[{"key":"A","text":"单片机TXD接模块RXD、RXD接TXD并共地"},{"key":"B","text":"TXD接TXD且不共地"},{"key":"C","text":"直接连接标准RS-232负电压"},{"key":"D","text":"带电随意更换接线"}],"type":"single","answer":["A"],"points":1,"tag":"USB-TTL与PC接口","explanation":"TTL串口仍需收发交叉、可靠共地并确认电平兼容。","id":1},{"stem":"PC串口助手开始通信前必须核对（　）。","options":[{"key":"A","text":"正确COM口"},{"key":"B","text":"9600 bit/s、8N1"},{"key":"C","text":"无校验、无流控"},{"key":"D","text":"OLED字体颜色"}],"type":"multiple","answer":["A","B","C"],"points":1,"tag":"COM口与通信参数","explanation":"端口和帧参数必须与单片机一致。","id":2},{"stem":"为形成可追溯温度证据，PC端日志应至少保留（　）。","options":[{"key":"A","text":"时间戳和连续温度记录"},{"key":"B","text":"只有窗口标题"},{"key":"C","text":"只有一条无时间数据"},{"key":"D","text":"开发电脑壁纸"}],"type":"single","answer":["A"],"points":1,"tag":"PC日志与一致性","explanation":"带时间戳日志可验证周期、连续性和异常时间点。","id":3},{"stem":"PC发送PING并以CR或LF结束后，单片机应返回（　）。","options":[{"key":"A","text":"PONG"},{"key":"B","text":"NO DATA"},{"key":"C","text":"0xAA"},{"key":"D","text":"OLED READY ONLY"}],"type":"single","answer":["A"],"points":1,"tag":"PC命令与文本边界","explanation":"PING/PONG用于快速验证PC到单片机再返回PC的双向链路。","id":4},{"stem":"PC发送STATUS命令的预期结果是（　）。","options":[{"key":"A","text":"返回当前温度文本"},{"key":"B","text":"清除程序存储器"},{"key":"C","text":"关闭串口"},{"key":"D","text":"改变晶振"}],"type":"single","answer":["A"],"points":1,"tag":"PC命令与文本边界","explanation":"STATUS复用当前温度变量并返回可读状态。","id":5},{"stem":"命令接收程序应在何处完成字符串比较和响应？","options":[{"key":"A","text":"主循环"},{"key":"B","text":"串口ISR中的长延时之后"},{"key":"C","text":"OLED字库"},{"key":"D","text":"ADC硬件寄存器"}],"type":"single","answer":["A"],"points":1,"tag":"中断与主循环分工","explanation":"ISR只收字节并标记完整行，主循环处理命令和发送响应。","id":6},{"stem":"串口完全无输出时，合理的排查顺序是（　）。","options":[{"key":"A","text":"供电/HEX→时钟→UART参数→接线共地→COM口→SBUF/TI"},{"key":"B","text":"先更换全部元件"},{"key":"C","text":"先修改OLED字模"},{"key":"D","text":"只反复重启PC"}],"type":"single","answer":["A"],"points":1,"tag":"分层诊断与日志","explanation":"按底层运行条件到串口发送链逐层收敛，能减少无依据修改。","id":7},{"stem":"提升任务合格证据包括（　）。","options":[{"key":"A","text":"USB-TTL实物接线图"},{"key":"B","text":"COM口参数截图"},{"key":"C","text":"PC温度日志与命令应答记录"},{"key":"D","text":"源码修改点和故障复测记录"}],"type":"multiple","answer":["A","B","C","D"],"points":1,"tag":"学习过程记录与评价边界","explanation":"接口、参数、运行结果和修改过程共同支撑提升任务验收。","id":8}]};
const SUGGESTIONS = {"三级任务需求与验收":"用一张表分别写出基础、进阶、提升任务的复用基线、新增功能、可观察指标和必交证据。","学习过程记录与评价边界":"区分T0诊断、阶段测试、T1唯一总评和T2同口径复测，检查每个评分点是否有对应证据。","UART工作方式与8N1帧":"重画方式1的起始位、8位数据和停止位，结合9600 bit/s计算单字符传输时间。","通信参数与波特率":"按11.0592 MHz、1T、SMOD=0、Timer1方式2重新计算TH1，并核对两端参数。","SCON与串口初始化":"逐位标注SCON的SM0、SM1、REN、TI和RI，按时钟、Timer1、SCON、TR1顺序复核初始化。","文本格式与行结束":"把temperature_x10转换成LM35=xx.xC字符序列，逐字节标出ASCII码和CR/LF边界。","参数校核与证据":"补齐参数计算表、接口图和终端设置截图，让每个配置值都有数据手册或实测依据。","虚拟终端接口":"检查单片机TXD到终端RXD；需要回显时再连接终端TXD到单片机RXD，并统一8N1。","双机串口接口":"重画U3与U4的TXD/RXD交叉线和公共地，核对两端电平及串口参数。","USB-TTL与PC接口":"按TTL电平、TXD/RXD交叉、共地、COM口、9600/8N1逐项检查并截图。","LM35与OLED基线":"确认LM35接P1.0/ADC0、OLED SCL/SDA接P2.0/P2.1，并用同一温度快照驱动显示与通信。","Proteus仿真与最小验证":"按HEX、供电复位、时钟、串口参数和连线顺序排查，再用固定短串完成最小验证。","电路绘制与证据":"在完整接口图中标出信号方向、引脚、公共地、电平和终端参数，避免无上下文截图。","SBUF与TI发送":"单步跟踪写SBUF、TI置位和软件清TI，确认轮询发送与串口中断不会争抢TI。","温度文本格式":"用256代表25.6 ℃完成整数、小数点和一位小数的ASCII转换，并核对CR/LF。","500 ms周期调度":"把周期控制放在主循环或定时调度中，记录连续20次输出间隔，不在ISR中长延时。","RI中断与字符回显":"按判断RI、读SBUF、清RI、置标志、主循环回显的顺序跟踪变量。","中断与主循环分工":"把ISR限制为收数和置标志，字符串比较、显示、日志及长耗时操作放入主循环。","定长帧与数据解析":"按教案画出AA 55帧头和14字节缓冲，标记收帧边界；字段映射以核实后的配套源码为准。","U3采集与发送":"用同一次LM35采样依次完成OLED显示、组帧发送和周期等待，记录关键变量。","RI中断与主循环":"在流程图中分开ISR字节投递和主循环整帧解析、显示，检查每一步的标志变化。","帧同步与边界保护":"模拟帧头前出现干扰字节、半帧和连续帧，验证识别AA 55帧头后开始且不会越界。","共享数据与快照":"检查volatile、缓冲边界和取帧临界区，确保主循环读取的是同一完整帧。","双机一致性测试":"用低、中、高三点比较U3与U4显示，并连续运行5分钟记录差异。","超时提示与恢复":"断开链路超过2 s观察NO DATA，再恢复发送并确认OLED自动回到温度显示。","COM口与通信参数":"在设备管理器确认COM号，在串口助手核对9600、8N1、无校验和无流控。","PC日志与一致性":"保存带时间戳日志，用低、中、高三点与OLED显示逐项对照。","PC命令与文本边界":"分别发送PING、STATUS、未知命令和连续命令，核对CR/LF边界及响应日志。","分层诊断与日志":"按供电/HEX到SBUF/TI、RI/缓冲区逐级排查，每次只改变一个变量并保留复测证据。"};
const startedAt = Date.now();
let submitted = false;
const answers = {};
const qBox = document.getElementById('questions');

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function answerText(q,keys){return keys.map(k=>`${k}．${q.options.find(o=>o.key===k)?.text||''}`).join('；');}
function render(){
 qBox.innerHTML = `<h2>${esc(TEST.sectionLabel)}</h2>` + TEST.questions.map((q,i)=>{
   const type=q.type==='multiple'?'checkbox':'radio'; const label=q.displayType||(q.type==='multiple'?'多项选择题':'单项选择题');
   return `<article class="question" id="q-${q.id}" data-id="${q.id}"><div class="qhead"><span class="qno">${i+1}</span><div class="qtext">${esc(q.stem)} <span class="badge">${label}</span></div></div><div class="options">${q.options.map(o=>`<label class="option"><input type="${type}" name="q${q.id}" value="${o.key}"><span class="option-key">${o.key}．</span><span>${esc(o.text)}</span></label>`).join('')}</div><div class="feedback" id="fb-${q.id}"></div></article>`;
 }).join('');
 qBox.querySelectorAll('input').forEach(input=>input.addEventListener('change',()=>{collectOne(input.name);updateProgress();}));
}
function collectOne(name){const id=Number(name.slice(1));answers[id]=[...document.querySelectorAll(`input[name="${name}"]:checked`)].map(x=>x.value).sort();}
function updateProgress(){const done=TEST.questions.filter(q=>(answers[q.id]||[]).length).length;document.getElementById('progressBar').style.width=`${done/TEST.questions.length*100}%`;document.getElementById('progressText').textContent=`已答${done}题，共${TEST.questions.length}题`;}
function same(a,b){return JSON.stringify([...a].sort())===JSON.stringify([...b].sort());}
function formatTime(ms){const total=Math.max(1,Math.round(ms/1000));return `${Math.floor(total/60)}分${total%60}秒`;}
function grade(p){return p>=90?'优秀':p>=80?'达标':'需要订正';}
function buildDiagnosis(results){
 const wrong=results.filter(r=>!r.correct); const box=document.getElementById('diagnosis');
 if(!wrong.length){box.innerHTML='<h3>学习诊断</h3><div class="weak-item all-good"><b>本次未发现明显薄弱点。</b><br>建议进入综合迁移练习：调整参数或边界条件，重新判断程序、接口和测试结论是否仍然成立。</div>';return;}
 const counts={}; wrong.forEach(r=>counts[r.q.tag]=(counts[r.q.tag]||0)+1);
 const weak=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
 box.innerHTML=`<h3>主要薄弱点与提升建议</h3><p>本次共答错${wrong.length}题。建议优先补强以下知识点，而不是只记忆正确选项。</p><div class="weak-list">${weak.map(([tag,count])=>`<div class="weak-item"><b>${esc(tag)}</b>：涉及${count}道错题<br><span>${esc(SUGGESTIONS[tag]||'重新阅读对应关键知识，完成一次操作验证并记录结果。')}</span></div>`).join('')}</div><h4>建议复习顺序</h4><ol class="suggestions">${weak.slice(0,5).map(([tag])=>`<li>先复习“${esc(tag)}”，再重新完成对应错题。</li>`).join('')}<li>复习后重新作答，比较两次结果并确认错误原因已经消除。</li></ol>`;
}
function submitTest(){
 if(submitted)return;
 const name=document.getElementById('studentName').value.trim(), sid=document.getElementById('studentId').value.trim();
 if(!name||!sid){alert('请先填写姓名和学号。');(!name?document.getElementById('studentName'):document.getElementById('studentId')).focus();return;}
 document.querySelectorAll('.question').forEach(x=>x.classList.remove('unanswered'));
 const unanswered=TEST.questions.filter(q=>!(answers[q.id]||[]).length);
 if(unanswered.length){unanswered.forEach(q=>document.getElementById(`q-${q.id}`).classList.add('unanswered'));document.getElementById(`q-${unanswered[0].id}`).scrollIntoView({behavior:'smooth'});alert(`还有${unanswered.length}题未作答。`);return;}
 submitted=true; let score=0;
 const results=TEST.questions.map(q=>{const selected=answers[q.id]||[];const correct=same(selected,q.answer);if(correct)score+=q.points;const card=document.getElementById(`q-${q.id}`);card.classList.add('submitted',correct?'correct':'wrong');card.querySelectorAll('input').forEach(x=>x.disabled=true);const fb=document.getElementById(`fb-${q.id}`);fb.classList.add(correct?'good':'bad');fb.innerHTML=`<b>${correct?'回答正确':'需要改进'}</b><br>你的答案：${esc(answerText(q,selected))}<br>正确答案：${esc(answerText(q,q.answer))}<br>解析：${esc(q.explanation)}`;return{q,selected,correct};});
 const max=TEST.questions.reduce((s,q)=>s+q.points,0), percent=Math.round(score/max*100), elapsed=Date.now()-startedAt;
 document.getElementById('score').textContent=score;document.getElementById('scoreBase').textContent=`满分${max}分`;document.getElementById('percent').textContent=`${percent}%`;document.getElementById('level').textContent=grade(percent);document.getElementById('duration').textContent=formatTime(elapsed);buildDiagnosis(results);document.getElementById('result').classList.add('show');document.getElementById('submitBtn').disabled=true;document.getElementById('exportBtn').disabled=false;window.__result={name,sid,clazz:document.getElementById('studentClass').value.trim(),score,max,percent,level:grade(percent),elapsed,results,submittedAt:new Date()};document.getElementById('result').scrollIntoView({behavior:'smooth'});
}
function exportResult(){
 const r=window.__result;if(!r){alert('请先提交测试。');return;}
 const wrong=r.results.filter(x=>!x.correct);const counts={};wrong.forEach(x=>counts[x.q.tag]=(counts[x.q.tag]||0)+1);const weak=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
 const rows=r.results.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.q.stem)}</td><td>${esc(answerText(x.q,x.selected))}</td><td>${esc(answerText(x.q,x.q.answer))}</td><td>${x.correct?'正确':'错误'}</td><td>${esc(x.q.explanation)}</td></tr>`).join('');
 const weakHtml=weak.length?`<ol>${weak.map(([tag,count])=>`<li><b>${esc(tag)}</b>（${count}题）：${esc(SUGGESTIONS[tag]||'重新阅读对应关键知识并完成操作验证。')}</li>`).join('')}</ol>`:'<p>本次未发现明显薄弱点，建议开展变式和迁移练习。</p>';
