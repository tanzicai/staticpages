--ink)}.tabs{display:flex;gap:8px;overflow:auto;padding:17px 0 12px}.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 14px;font-weight:800;color:var(--muted)}.tab.active{background:var(--blue);border-color:var(--blue);color:#fff}.layout{display:grid;grid-template-columns:minmax(0,1fr) 410px;gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:0 5px 17px rgba(23,50,71,.055);overflow:hidden}.cardh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.cardh h2,.cardh h3{margin:0;font-size:17px}.cardb{padding:17px 18px}.badge{padding:3px 9px;border-radius:99px;background:var(--blue2);color:var(--blue);font-size:12px;font-weight:800}.intro{padding:12px 14px;border-left:4px solid var(--blue);background:#f7fafb;border-radius:8px}.knowledge{margin:13px 0;padding:12px 14px;background:var(--orange2);border-radius:10px;display:grid;grid-template-columns:1fr 130px 105px;gap:12px;align-items:center}.knowledge b{display:block}.knowledge small{color:var(--muted)}.knowledge input{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center}.pass{font-weight:900;text-align:center}.pass.ok{color:var(--green)}.pass.bad{color:var(--red)}.item{display:grid;grid-template-columns:minmax(155px,.8fr) minmax(220px,1.25fr) minmax(260px,1.45fr) 110px;gap:13px;align-items:start;padding:15px 0;border-top:1px solid var(--line)}.item strong{display:block}.item small,.criterion{font-size:12px;color:var(--muted)}.criterion b,.ev b{display:block;color:var(--ink);font-size:12px;margin-bottom:4px}.ev{padding:9px;border:1px solid var(--line);background:#f8fafb;border-radius:9px}.need{font-size:12px;color:var(--green);font-weight:700;margin-bottom:6px}.ev input{width:100%;border:1px solid var(--line);border-radius:7px;padding:7px;background:#fff;font-size:12px}.ev input[type=file]{margin-top:6px;padding:5px}.score{text-align:right;padding-top:20px}.score input{width:64px;border:1px solid var(--line);border-radius:8px;padding:7px;text-align:center;font-weight:900}.sticky{position:sticky;top:78px;align-self:start;display:grid;gap:15px}.flow svg{width:100%;height:auto;background:linear-gradient(180deg,#fbfdfe,#f6fafb);border-radius:10px}.summary{display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px}.summary b{color:var(--blue)}.feedback{font-size:13px;background:var(--orange2);border-left:4px solid var(--orange);padding:11px 12px;border-radius:8px}.notice{font-size:12px;color:var(--muted)}.checklist{display:grid;gap:9px}.checkline{display:flex;align-items:flex-start;gap:9px;padding:9px;border:1px solid var(--line);border-radius:8px;background:#f8fafb}.checkline input{margin-top:5px}.empty{padding:25px;text-align:center;color:var(--muted)}
    @media(max-width:1120px){.layout{grid-template-columns:1fr}.sticky{position:static}.item{grid-template-columns:1fr 1.3fr}.score{text-align:left;padding-top:0}.meta{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){main,.topin{padding-left:11px;padding-right:11px}.actions{display:none}.hero{grid-template-columns:1fr}.total{text-align:left}.meta,.item,.knowledge{grid-template-columns:1fr}.cardb{padding:13px}}@media print{.top,.tabs,.no-print{display:none!important}body{background:#fff}main{max-width:none;margin:0;padding:0}.hero{border-radius:0;box-shadow:none}.layout{grid-template-columns:1fr}.sticky{position:static}.card{box-shadow:none}.item{break-inside:avoid}}

<body>
<header class="top"><div class="topin"><div class="brand"><div class="mark">P9</div><div><b>远程配电参数监控与通信终端</b><small>三级分任务考核评价 · P09-H5-STAGE-EVAL-FLOW-01</small></div></div><div class="actions"><button class="btn" id="saveBtn">保存本机</button><button class="btn" id="importBtn">导入记录</button><button class="btn primary" id="exportBtn">导出阶段JSON</button><button class="btn" onclick="print()">打印</button><button class="btn danger" id="resetBtn">清空</button><input id="importFile" type="file" accept="application/json" hidden></div></div></header>
<main>
  <section class="hero"><div><div class="eyebrow">T0诊断 → 基础任务20 → 进阶任务30 → 提升任务10 → T1唯一总评 → T2同口径复测</div><h1>三级分任务考核评价</h1><p>本页采集三级任务功能60分及阶段证据；知识测试用于即时订正，不重复计分。导出的JSON可直接导入项目总评H5。</p><div class="bar"><span id="bar"></span></div></div><div class="total"><strong id="total">0</strong> / 60<br><span id="grade">待验收</span></div></section>
  <section class="meta"><div class="field"><label>班级</label><input id="className" placeholder="如：物联网2301"></div><div class="field"><label>小组/工位</label><input id="teamName" placeholder="如：第3组 / A06"></div><div class="field"><label>学生姓名</label><input id="studentName" placeholder="姓名"></div><div class="field"><label>验收人</label><input id="evaluator" placeholder="教师/同伴/本人"></div></section>
  <nav class="tabs" id="tabs" aria-label="三级任务"></nav>
  <div class="layout"><section class="card"><div class="cardh"><h2 id="stageTitle"></h2><span class="badge" id="stageScore"></span></div><div class="cardb"><div class="intro" id="stageIntro"></div><div id="knowledge"></div><div id="items"></div></div></section>
  <aside class="sticky"><section class="card flow"><div class="cardh"><h3>本任务程序流程</h3><span class="badge" id="flowCode"></span></div><div class="cardb" id="flow"></div></section><section class="card"><div class="cardh"><h3>三级功能汇总</h3><span class="badge" id="evidenceCount">0/10项证据</span></div><div class="cardb" id="summary"></div></section><section class="card"><div class="cardh"><h3>阶段诊断</h3></div><div class="cardb"><div class="feedback" id="feedback">请选择任务并完成评分与证据提交。</div><p class="notice">文件选择仅记录文件名。正式归档时须连同源码、截图、日志和测试数据原文件一并提交。</p></div></section></aside></div>
</main>
<script>
const stages=[
 {id:'t0',title:'T0 课前诊断',code:'T0',max:0,intro:'理论自测正确率≥80%；能判断TXD/RXD交叉与可靠共地；能说明“采—传—收—显—诊”项目链路。T0只用于分层与支架配置，不计入100分。',test:{code:'P09-T01-H5-QUIZ-01 / P09-T03-H5-QUIZ-01',count:'6题+7题'},flow:['学习微课与手册','完成需求诊断','完成接口诊断','标注交叉与共地','上传截图和问题清单','形成T0画像'],checks:['理论与接口诊断均达到80%','已提交连线截图','已提交问题清单']},
 {id:'basic',title:'基础任务｜单机与虚拟终端通信',code:'基础 20分',max:20,intro:'保留上个项目LM35采集、ADC滤波和OLED显示，只叠加UART。完成上电主动输出、500 ms温度文本、虚拟终端稳定显示和字符回显。',test:{code:'P09-T04-H5-QUIZ-01',count:'8题'},flow:['复用LM35采集与OLED','配置11.0592 MHz 9600 8N1','U1 P3.1/TXD接终端RXD','上电输出状态文本','每500 ms输出LM35文本','连续20次一致？','修复并同口径复测','基础任务通过'],items:[
  ['f1','1.1 LM35采集与OLED显示复用',8,'原有采集、滤波和OLED功能完整，串口叠加不破坏本地显示。','复用清单；源码；OLED低中高三点截图'],
  ['f2','1.2 UART参数与主动输出',7,'11.0592 MHz、9600 bit/s、8N1正确，上电主动输出状态文本。','参数表；初始化代码；上电日志'],
  ['f3','1.3 虚拟终端稳定显示',5,'每500 ms显示LM35文本，连续20次与OLED一致且无乱码、丢行和重行；字符回显正确。','OLED与终端同屏截图；20次日志；异常统计']]},
 {id:'advanced',title:'进阶任务｜U3与U4双机通信',code:'进阶 30分',max:30,intro:'U3现场采集节点按0xAA＋TEMP_H＋TEMP_L发送三字节温度帧，U4值班显示节点以RI中断投递字节，在主循环完成帧头同步、固定长度解析、OLED同显和断线恢复；不使用CRC。',test:{code:'P09-T05-H5-QUIZ-01',count:'10题'},flow:['U3采集LM35并OLED本显','组织三字节温度帧','U3 TXD接U4 RXD并共地','U4 RI中断投递字节','主循环识别0xAA并收满3字节','还原温度并OLED同显','三点一致且2秒恢复？','修复并同功能复测','进阶任务通过'],items:[
  ['f4','1.4 U3三字节温度帧组帧与发送',8,'按0xAA＋TEMP_H＋TEMP_L组帧，高低字节拆分正确，每500 ms发送同源温度快照；不使用CRC。','U3发送源码；三字节帧记录；温度拆分与还原核对结果'],
  ['f5','1.5 U4中断接收与解析',8,'RI中断短小，帧同步、边界保护和快照解析正确。','ISR源码；RI/SBUF/rx_frame变量截图'],
  ['f6','1.6 双机温度同步显示',8,'低、中、高三点U3采集值与U4 OLED显示一致。','低中高三点一致性表；双节点同屏截图'],
  ['f7','1.7 超时提示与自动恢复',6,'连续运行不少于5分钟；断线2秒提示NO DATA，恢复后自动刷新。','5分钟运行记录；断线日志；恢复日志；故障闭环']]},
 {id:'enhance',title:'提升任务｜单片机与PC串口通信',code:'提升 10分',max:10,intro:'将已验证UART接口迁移至USB-TTL与PC串口助手，确认电平、交叉共地、COM口和参数，完成温度日志保存及测试命令回显或应答。',test:{code:'P09-T04-H5-QUIZ-02',count:'8题'},flow:['保留LM35 OLED与UART','连接USB-TTL并核对电平','TXD/RXD交叉且共地','PC配置9600 bit/s 8N1','稳定接收并保存时间戳日志','PC发送测试命令','单片机回显或应答？','诊断并复测','提升任务通过'],items:[
  ['f8','1.8 单片机与PC物理通信',4,'USB-TTL电平匹配，TXD/RXD交叉并共地，COM口可用。','USB-TTL实物接线图；COM口与参数截图'],
  ['f9','1.9 PC稳定接收与保存',4,'PC按9600 bit/s、8N1稳定接收并保存带时间戳日志。','PC串口日志；连续运行记录'],
  ['f10','1.10 PC命令回显与迁移',2,'PC下发测试命令，单片机能够回显或应答并完成复测。','命令应答记录；代码修改点；复测数据']]},
 {id:'t1',title:'T1总评与T2复测迁移',code:'T1/T2',max:0,intro:'T1由项目总评H5形成唯一100分成绩；本页功能60分与证据导入项目总评。T2仅对失分项同口径复测，或迁移湿度、电流、电压参数，不重复计分。',test:{code:'P09-H5-UNIT-01',count:'16题'},flow:['汇总三级任务证据','完成16题综合知识检测','导入项目总评H5','完成工程30 证据5 协作5','形成唯一100分总评','生成能力画像','失分项同口径复测或参数迁移'],checks:['已导出三级任务JSON','综合知识检测达到80%','课堂证据与T2新增证据分开归档']}
];
const taskStages=stages.filter(s=>s.items),all=taskStages.flatMap(s=>s.items),scores={},notes={},files={},tests={},checks={};let current='basic';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function stageTotal(s){return(s.items||[]).reduce((n,x)=>n+(scores[x[0]]||0),0)}function evidenceDone(id){return Boolean((notes[id]||'').trim()||(files[id]||[]).length)}
function renderTabs(){$('#tabs').innerHTML=stages.map(s=>`<button class="tab ${s.id===current?'active':''}" data-stage="${s.id}">${s.title}${s.max?` · ${stageTotal(s)}/${s.max}`:''}</button>`).join('')}
function flowSvg(s){const n=s.flow.length,w=390,h=Math.max(250,n*55+25),cx=195;let y=18,out=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(s.title)}流程图"><defs><marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7Z" fill="#617481"/></marker></defs>`;s.flow.forEach((x,i)=>{const d=x.includes('？');if(i)out+=`<path d="M${cx} ${y-14} V${y-3}" stroke="#617481" stroke-width="1.5" marker-end="url(#arr)"/>`;if(d){out+=`<polygon points="${cx},${y} ${cx+91},${y+23} ${cx},${y+46} ${cx-91},${y+23}" fill="#fff1e7" stroke="#b65c24" stroke-width="1.5"/><text x="${cx}" y="${y+27}" text-anchor="middle" font-size="11.5" fill="#173247">${esc(x)}</text>`;y+=62}else{out+=`<rect x="85" y="${y}" width="220" height="39" rx="10" fill="${i===0||i===n-1?'#e9f5ee':'#e8f3f8'}" stroke="${i===0||i===n-1?'#287052':'#176181'}" stroke-width="1.4"/><text x="${cx}" y="${y+24}" text-anchor="middle" font-size="11.5" fill="#173247">${esc(x)}</text>`;y+=55}});return out+'</svg>'}
function render(){const s=stages.find(x=>x.id===current);renderTabs();$('#stageTitle').textContent=s.title;$('#stageScore').textContent=s.max?`${stageTotal(s)} / ${s.max}分`:'诊断/复测节点';$('#stageIntro').textContent=s.intro;$('#flowCode').textContent=s.code;$('#flow').innerHTML=flowSvg(s);const pct=tests[s.id]??'';$('#knowledge').innerHTML=`<div class="knowledge"><div><b>对应知识测试</b><small>${s.test.code} · ${s.test.count} · 正确率≥80%，未达标返回本任务代码订正</small></div><input data-test="${s.id}" type="number" min="0" max="100" value="${esc(pct)}" placeholder="正确率 %"><div class="pass ${pct===''?'':pct>=80?'ok':'bad'}">${pct===''?'待检测':pct>=80?'已达标':'需订正'}</div></div>`;if(s.items){$('#items').innerHTML=s.items.map(([id,name,max,criterion,need])=>`<div class="item"><div><strong>${name}</strong><small>满分 ${max} 分</small></div><div class="criterion"><b>考核要求</b>${criterion}</div><div class="ev"><b>证据提交</b><div class="need">应交：${need}</div><input data-note="${id}" value="${esc(notes[id]||'')}" placeholder="填写文件名、参数、数据或证据位置"><input class="no-print" data-file="${id}" type="file" multiple><small id="fn-${id}">${esc((files[id]||[]).join('；')||'未选择文件')}</small></div><div class="score"><input data-score="${id}" type="number" min="0" max="${max}" value="${scores[id]||0}"> / ${max}</div></div>`).join('')}else{$('#items').innerHTML=`<div class="checklist">${s.checks.map((x,i)=>`<label class="checkline"><input type="checkbox" data-check="${s.id}-${i}" ${checks[`${s.id}-${i}`]?'checked':''}><span>${x}</span></label>`).join('')}</div>`}recalc(false)}
function recalc(redraw=true){const total=all.reduce((n,x)=>n+(scores[x[0]]||0),0),done=all.filter(x=>evidenceDone(x[0])).length;$('#total').textContent=total;$('#bar').style.width=`${total/60*100}%`;$('#grade').textContent=total===60?'三级功能达成':total>=36?'功能开发中':'待验收';$('#evidenceCount').textContent=`${done}/${all.length}项证据`;$('#summary').innerHTML=taskStages.map(s=>`<div class="summary"><span>${s.title.split('｜')[0]}</span><b>${stageTotal(s)} / ${s.max}</b></div>`).join('')+`<div class="summary"><span>知识测试达标</span><b>${taskStages.filter(s=>(tests[s.id]||0)>=80).length} / 3</b></div>`;const s=stages.find(x=>x.id===current);$('#stageScore').textContent=s.max?`${stageTotal(s)} / ${s.max}分`:'诊断/复测节点';if(s.items){const missing=s.items.filter(x=>!evidenceDone(x[0])).length,weak=s.items.filter(x=>(scores[x[0]]||0)<x[2]).map(x=>x[1]),testOk=(tests[s.id]||0)>=80;$('#feedback').textContent=stageTotal(s)===s.max&&!missing&&testOk?'本任务功能、证据和知识测试均达标，可进入下一任务。':`${weak.length?'功能待完善：'+weak.join('、')+'。':''}${missing?` 尚有${missing}项证据未提交。`:''}${testOk?'':' 知识测试未达到80%，需返回代码订正。'}`}else $('#feedback').textContent=s.id==='t0'?'T0不计分，完成诊断后用于分层和支架配置。':'T1只形成一次100分总评；T2按原标准复测，不重复计分。';if(redraw)renderTabs()}
$('#tabs').onclick=e=>{const b=e.target.closest('[data-stage]');if(b){current=b.dataset.stage;render()}};document.addEventListener('input',e=>{if(e.target.dataset.score){const item=all.find(x=>x[0]===e.target.dataset.score);scores[item[0]]=Math.max(0,Math.min(item[2],Number(e.target.value)||0));e.target.value=scores[item[0]];recalc()}if(e.target.dataset.note){notes[e.target.dataset.note]=e.target.value;recalc(false)}if(e.target.dataset.test){tests[e.target.dataset.test]=Math.max(0,Math.min(100,Number(e.target.value)||0));render()}});document.addEventListener('change',e=>{if(e.target.dataset.file){files[e.target.dataset.file]=[...e.target.files].map(f=>f.name);$(`#fn-${e.target.dataset.file}`).textContent=files[e.target.dataset.file].join('；')||'未选择文件';recalc(false)}if(e.target.dataset.check){checks[e.target.dataset.check]=e.target.checked}});
function meta(){return Object.fromEntries(['className','teamName','studentName','evaluator'].map(id=>[id,$('#'+id).value]))}function snapshot(){return{version:'P09-H5-STAGE-EVAL-FLOW-01/V2.0',source:'教案0914终极版',savedAt:new Date().toISOString(),weights:{basic:20,advanced:30,enhance:10},meta:meta(),scores,notes,files,tests,checks,total:Number($('#total').textContent)}}function restore(d){if(!d)return;Object.entries(d.meta||{}).forEach(([k,v])=>{if($('#'+k))$('#'+k).value=v||''});Object.assign(scores,d.scores||{});Object.assign(notes,d.notes||{});Object.assign(files,d.files||{});Object.assign(tests,d.tests||{});Object.assign(checks,d.checks||{});render()}
function download(name,data){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'}));a.download=name;a.click();URL.revokeObjectURL(a.href)}$('#saveBtn').onclick=()=>{localStorage.setItem('p09-stage-eval-v2',JSON.stringify(snapshot()));alert('三级任务评分和证据说明已保存。')};$('#exportBtn').onclick=()=>download(`项目9_三级分任务_${$('#studentName').value||$('#teamName').value||'未命名'}.json`,snapshot());$('#importBtn').onclick=()=>$('#importFile').click();$('#importFile').onchange=async e=>{try{restore(JSON.parse(await e.target.files[0].text()));alert('阶段记录导入成功。')}catch{alert('JSON格式无效，无法导入。')}};$('#resetBtn').onclick=()=>{if(confirm('确定清空全部分任务评分与证据记录吗？')){localStorage.removeItem('p09-stage-eval-v2');[scores,notes,files,tests,checks].forEach(o=>Object.keys(o).forEach(k=>delete o[k]));render()}};restore(JSON.parse(localStorage.getItem('p09-stage-eval-v2')||'null'));render();
</script>
</body>
</html>
