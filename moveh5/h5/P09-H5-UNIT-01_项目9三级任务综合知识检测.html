<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>项目9三级任务综合知识检测</title>
<style>
:root{--blue:#0b4f7c;--cyan:#0ea5c6;--light:#eef7fb;--line:#c9dce8;--good:#0a7b48;--bad:#b42318;--warn:#9a6700;--ink:#172b3a;--muted:#587080}
*{box-sizing:border-box}body{margin:0;background:#f2f6f8;color:var(--ink);font-family:"Microsoft YaHei","Noto Sans SC",Arial,sans-serif;line-height:1.65}
.hero{background:linear-gradient(130deg,#073b61,#0b6f91);color:white;padding:30px 20px}.hero-inner{max-width:1050px;margin:auto}.eyebrow{font-size:14px;opacity:.85;letter-spacing:.08em}.hero h1{font-size:clamp(25px,4vw,38px);margin:6px 0 5px}.hero p{margin:0;opacity:.9}
.wrap{max-width:1050px;margin:20px auto 60px;padding:0 16px}.panel{background:#fff;border:1px solid #dbe7ed;border-radius:14px;padding:20px;box-shadow:0 7px 24px rgba(18,55,75,.07);margin-bottom:18px}
.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field label{display:block;font-weight:700;margin-bottom:4px}.field input{width:100%;padding:10px 12px;border:1px solid #a9c1cf;border-radius:8px;font:inherit}.note{background:#f4fafc;border-left:4px solid var(--cyan);padding:12px 14px;border-radius:6px;margin-top:14px;color:#274b5f}
.progress{height:9px;background:#e6eef2;border-radius:10px;overflow:hidden;margin-top:12px}.progress>span{display:block;height:100%;width:0;background:linear-gradient(90deg,#1aa7c8,#0a6e92);transition:.25s}
.question{border:1px solid var(--line);border-radius:12px;padding:18px;margin:16px 0;background:white;scroll-margin-top:16px}.question.unanswered{border-color:#e2a427;box-shadow:0 0 0 2px #fff1bd}.question.correct{border-color:#58b68d;background:#f4fbf7}.question.wrong{border-color:#e08a82;background:#fff7f6}.qhead{display:flex;gap:10px;align-items:flex-start}.qno{flex:0 0 auto;background:var(--blue);color:white;border-radius:7px;padding:1px 9px;font-weight:700}.qtext{font-weight:700}.badge{font-size:12px;padding:2px 7px;border:1px solid #9fc0d2;border-radius:99px;color:#315f76;margin-left:6px;white-space:nowrap}.options{display:grid;gap:9px;margin-top:13px}.option{display:flex;gap:9px;align-items:flex-start;padding:10px 12px;border:1px solid #d9e4e9;border-radius:8px;cursor:pointer}.option:hover{background:#f2f9fc}.option input{margin-top:6px;transform:scale(1.15)}.option-key{font-weight:700;color:var(--blue)}
.feedback{display:none;margin-top:13px;padding:12px;border-radius:8px;background:#eef5f8}.submitted .feedback{display:block}.feedback.good{border-left:4px solid var(--good)}.feedback.bad{border-left:4px solid var(--bad)}
.actions{position:sticky;bottom:0;z-index:5;background:rgba(242,246,248,.95);backdrop-filter:blur(7px);padding:12px 0;display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:11px 20px;font:700 16px inherit;cursor:pointer}.primary{background:var(--blue);color:white}.secondary{background:#dcecf3;color:#153f54}.btn:disabled{opacity:.45;cursor:not-allowed}
.result{display:none}.result.show{display:block}.score-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{background:var(--light);border-radius:10px;padding:14px}.metric b{display:block;color:var(--blue);font-size:24px}.diagnosis{border:1px solid #e7c768;background:#fffaf0;border-radius:11px;padding:16px;margin-top:14px}.diagnosis h3{color:#7f5600;margin:0 0 8px}.weak-list{display:grid;gap:10px}.weak-item{background:white;border-left:4px solid #e2a427;padding:10px 12px}.suggestions li{margin:7px 0}.all-good{border-left-color:var(--good)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:720px){.info-grid,.score-grid{grid-template-columns:1fr}.hero{padding:22px 14px}.panel{padding:15px}.qhead{display:block}.qno{display:inline-block;margin-bottom:6px}.actions{position:static}.btn{width:100%}}
@media print{.hero,.actions,.info-panel,.progress{display:none!important}.wrap{margin:0;max-width:none}.panel,.question{box-shadow:none;break-inside:avoid}.result{display:block!important}}
</style>
</head>
<body>
<header class="hero"><div class="hero-inner"><div class="eyebrow">《单片机应用技术》项目9 · P09-H5-UNIT-01 · 第4节 · T1项目总评前 · 综合知识证据</div><h1>项目9三级任务综合知识检测</h1><p>紧邻对应知识学习节点完成；正确率达到80%为达标，错题须即时订正并回到接线、参数或代码复测。</p></div></header>
<main class="wrap">
  <section class="panel info-panel"><div class="info-grid">
    <div class="field"><label for="studentName">姓名 *</label><input id="studentName" maxlength="30" autocomplete="name"></div>
    <div class="field"><label for="studentId">学号 *</label><input id="studentId" maxlength="30"></div>
    <div class="field"><label for="studentClass">班级</label><input id="studentClass" maxlength="40"></div>
  </div><div class="note"><b>答题说明：</b>单项题和判断题选择1项，多项题须选择全部正确选项。测试用于诊断、即时订正和学习过程记录，不单独形成项目总分；提交后可导出Word兼容结果。</div><div class="progress" aria-label="答题进度"><span id="progressBar"></span></div><div id="progressText">已答0题</div></section>

    <h2>测试评价</h2><div class="score-grid"><div class="metric">得分<b id="score"></b><span id="scoreBase"></span></div><div class="metric">正确率<b id="percent"></b></div><div class="metric">评价等级<b id="level"></b></div><div class="metric">用时<b id="duration"></b></div></div>

  <div class="actions"><button id="submitBtn" class="btn primary">提交测试</button><button id="exportBtn" class="btn secondary" disabled>导出测试结果</button><button id="resetBtn" class="btn secondary">重新作答</button></div>
</main>
<script>
const TEST = {"resourceId":"P09-H5-UNIT-01","fileStem":"P09-H5-UNIT-01_项目9三级任务综合知识检测_V2.1","title":"项目9三级任务综合知识检测","sectionLabel":"项目9综合知识检测（16题）","questions":[{"stem":"项目三级任务共同保留的功能基线是（　）。","options":[{"key":"A","text":"LM35采集、ADC处理和OLED显示"},{"key":"B","text":"只发送固定字符"},{"key":"C","text":"删除本地显示"},{"key":"D","text":"直接接入RS-232"}],"type":"single","answer":["A"],"points":1,"tag":"三级任务需求与验收","explanation":"所有串口功能都建立在可运行的LM35+OLED基线上。","id":1},{"stem":"9600 bit/s、8N1发送一个ASCII字符理论上约需（　）。","options":[{"key":"A","text":"0.104 ms"},{"key":"B","text":"1.04 ms"},{"key":"C","text":"9.6 ms"},{"key":"D","text":"96 ms"}],"type":"single","answer":["B"],"points":1,"tag":"UART工作方式与8N1帧","explanation":"8N1每字符10位，10/9600 s约为1.04 ms。","id":2},{"stem":"11.0592 MHz、1T、SMOD=0、Timer1方式2产生9600 bit/s时，常用TH1为（　）。","options":[{"key":"A","text":"0xDC"},{"key":"B","text":"0xF4"},{"key":"C","text":"0x00"},{"key":"D","text":"0xFF"}],"type":"single","answer":["A"],"points":1,"tag":"通信参数与波特率","explanation":"Timer1方式2、1T、SMOD=0：N=11059200/(32×9600)=36，TH1=TL1=256−36=0xDC。","id":3},{"stem":"SCON=0x50的含义是（　）。","options":[{"key":"A","text":"串口方式1并允许接收"},{"key":"B","text":"串口方式0且禁止接收"},{"key":"C","text":"只允许发送9位数据"},{"key":"D","text":"关闭串口中断总开关"}],"type":"single","answer":["A"],"points":1,"tag":"SCON与串口初始化","explanation":"SM0=0、SM1=1、REN=1。","id":4},{"stem":"基础任务查询式发送字符的正确流程是（　）。","options":[{"key":"A","text":"写SBUF→等待TI→清TI"},{"key":"B","text":"判RI→清TH1→写OLED"},{"key":"C","text":"清EA→永久关闭中断"},{"key":"D","text":"先等待TF0"}],"type":"single","answer":["A"],"points":1,"tag":"SBUF与TI发送","explanation":"TI用于表明本字节发送完成，软件应按设计清零。","id":5},{"stem":"为了让OLED与串口显示同一温度，正确做法是（　）。","options":[{"key":"A","text":"使用同一次采样形成的温度快照"},{"key":"B","text":"两个输出分别重新随机采样"},{"key":"C","text":"每个字符重新读取ADC"},{"key":"D","text":"只对比显示位数"}],"type":"single","answer":["A"],"points":1,"tag":"LM35与OLED基线","explanation":"同一快照是数据一致性测试的基础。","id":6},{"stem":"双机TTL串口连接应满足（　）。","options":[{"key":"A","text":"TXD/RXD交叉"},{"key":"B","text":"GND共地"},{"key":"C","text":"电平兼容"},{"key":"D","text":"TTL直接接RS-232无需转换"}],"type":"multiple","answer":["A","B","C"],"points":1,"tag":"双机串口接口","explanation":"交叉、共地和电平兼容是双机链路的必要条件。","id":7},{"stem":"依据教案接收示例，完整帧的识别条件是（　）。","options":[{"key":"A","text":"识别AA 55帧头并收满14字节"},{"key":"B","text":"三个ASCII小数点"},{"key":"C","text":"只有高字节"},{"key":"D","text":"USB设备描述符"}],"type":"single","answer":["A"],"points":1,"tag":"定长帧与数据解析","explanation":"帧头、收帧长度和缓冲边界必须匹配；不能沿用旧版3字节方案，也不能将14字节载荷误当14字节整帧。","id":8},{"stem":"U4的RI中断服务程序适合执行（　）。","options":[{"key":"A","text":"读取SBUF、清RI并投递字节"},{"key":"B","text":"整帧解析、OLED刷新和长延时"},{"key":"C","text":"保存PC日志"},{"key":"D","text":"计算所有统计数据"}],"type":"single","answer":["A"],"points":1,"tag":"RI中断与主循环","explanation":"ISR保持短小，完整帧处理由主循环完成。","id":9},{"stem":"共享接收缓冲区的正确防护措施包括（　）。","options":[{"key":"A","text":"写入前检查边界"},{"key":"B","text":"共享变量使用volatile"},{"key":"C","text":"主循环取快照时保护临界区"},{"key":"D","text":"超出容量后继续写入"}],"type":"multiple","answer":["A","B","C"],"points":1,"tag":"共享数据与快照","explanation":"边界、可见性和原子快照共同避免越界与竞争。","id":10},{"stem":"验证U3/U4温度同步的有效方法是（　）。","options":[{"key":"A","text":"比较低、中、高三点并连续运行不少于5分钟"},{"key":"B","text":"只查看上电瞬间"},{"key":"C","text":"只检查文件名"},{"key":"D","text":"只显示固定温度"}],"type":"single","answer":["A"],"points":1,"tag":"双机一致性测试","explanation":"三点与连续运行能验证数值正确性和链路稳定性。","id":11},{"stem":"U4断线2 s显示NO DATA后，恢复有效帧时应（　）。","options":[{"key":"A","text":"自动恢复温度显示"},{"key":"B","text":"始终保持NO DATA"},{"key":"C","text":"清除全部程序"},{"key":"D","text":"关闭OLED电源"}],"type":"single","answer":["A"],"points":1,"tag":"超时提示与恢复","explanation":"超时提示不应阻止后续有效数据恢复。","id":12},{"stem":"USB-TTL连接PC时必须完成（　）。","options":[{"key":"A","text":"确认TTL电平、交叉共地、正确COM口和9600/8N1"},{"key":"B","text":"直接使用RS-232电平"},{"key":"C","text":"只设置OLED"},{"key":"D","text":"关闭Timer1"}],"type":"single","answer":["A"],"points":1,"tag":"USB-TTL与PC接口","explanation":"物理接口和PC参数必须与单片机一致。","id":13},{"stem":"PC命令处理的正确分工是（　）。","options":[{"key":"A","text":"ISR收字节并判行结束，主循环比较PING/STATUS并响应"},{"key":"B","text":"ISR中长延时后刷新OLED"},{"key":"C","text":"主循环不处理命令"},{"key":"D","text":"收到任意字节都重启单片机"}],"type":"single","answer":["A"],"points":1,"tag":"PC命令与文本边界","explanation":"CR/LF确定命令边界，耗时的字符串处理放在主循环。","id":14},{"stem":"“串口无输出”诊断应优先采用（　）。","options":[{"key":"A","text":"按供电/HEX、时钟、参数、接线、COM口、SBUF/TI逐层验证"},{"key":"B","text":"同时修改所有参数"},{"key":"C","text":"只更换OLED"},{"key":"D","text":"只看成功截图"}],"type":"single","answer":["A"],"points":1,"tag":"分层诊断与日志","explanation":"一次改变一个变量并保留复测证据，才能形成可靠故障闭环。","id":15},{"stem":"关于T1知识检测与项目评价，正确说法是（　）。","options":[{"key":"A","text":"综合知识检测形成知识证据，不另设项目总分"},{"key":"B","text":"每个阶段H5都重新形成100分"},{"key":"C","text":"项目评分点无需提交证据"},{"key":"D","text":"T2复测必须重做全部项目"}],"type":"single","answer":["A"],"points":1,"tag":"学习过程记录与评价边界","explanation":"项目只形成一次100分总评；知识检测、阶段测试和T2用于记录学习表现、诊断和同口径改进。","id":16}]};
const SUGGESTIONS = {"三级任务需求与验收":"用一张表分别写出基础、进阶、提升任务的复用基线、新增功能、可观察指标和必交证据。","学习过程记录与评价边界":"区分T0诊断、阶段测试、T1唯一总评和T2同口径复测，检查每个评分点是否有对应证据。","UART工作方式与8N1帧":"重画方式1的起始位、8位数据和停止位，结合9600 bit/s计算单字符传输时间。","通信参数与波特率":"按11.0592 MHz、1T、SMOD=0、Timer1方式2重新计算TH1，并核对两端参数。","SCON与串口初始化":"逐位标注SCON的SM0、SM1、REN、TI和RI，按时钟、Timer1、SCON、TR1顺序复核初始化。","文本格式与行结束":"把temperature_x10转换成LM35=xx.xC字符序列，逐字节标出ASCII码和CR/LF边界。","参数校核与证据":"补齐参数计算表、接口图和终端设置截图，让每个配置值都有数据手册或实测依据。","虚拟终端接口":"检查单片机TXD到终端RXD；需要回显时再连接终端TXD到单片机RXD，并统一8N1。","双机串口接口":"重画U3与U4的TXD/RXD交叉线和公共地，核对两端电平及串口参数。","USB-TTL与PC接口":"按TTL电平、TXD/RXD交叉、共地、COM口、9600/8N1逐项检查并截图。","LM35与OLED基线":"确认LM35接P1.0/ADC0、OLED SCL/SDA接P2.0/P2.1，并用同一温度快照驱动显示与通信。","Proteus仿真与最小验证":"按HEX、供电复位、时钟、串口参数和连线顺序排查，再用固定短串完成最小验证。","电路绘制与证据":"在完整接口图中标出信号方向、引脚、公共地、电平和终端参数，避免无上下文截图。","SBUF与TI发送":"单步跟踪写SBUF、TI置位和软件清TI，确认轮询发送与串口中断不会争抢TI。","温度文本格式":"用256代表25.6 ℃完成整数、小数点和一位小数的ASCII转换，并核对CR/LF。","500 ms周期调度":"把周期控制放在主循环或定时调度中，记录连续20次输出间隔，不在ISR中长延时。","RI中断与字符回显":"按判断RI、读SBUF、清RI、置标志、主循环回显的顺序跟踪变量。","中断与主循环分工":"把ISR限制为收数和置标志，字符串比较、显示、日志及长耗时操作放入主循环。","定长帧与数据解析":"按教案画出AA 55帧头和14字节缓冲，标记收帧边界；字段映射以核实后的配套源码为准。","U3采集与发送":"用同一次LM35采样依次完成OLED显示、组帧发送和周期等待，记录关键变量。","RI中断与主循环":"在流程图中分开ISR字节投递和主循环整帧解析、显示，检查每一步的标志变化。","帧同步与边界保护":"模拟帧头前出现干扰字节、半帧和连续帧，验证识别AA 55帧头后开始且不会越界。","共享数据与快照":"检查volatile、缓冲边界和取帧临界区，确保主循环读取的是同一完整帧。","双机一致性测试":"用低、中、高三点比较U3与U4显示，并连续运行5分钟记录差异。","超时提示与恢复":"断开链路超过2 s观察NO DATA，再恢复发送并确认OLED自动回到温度显示。","COM口与通信参数":"在设备管理器确认COM号，在串口助手核对9600、8N1、无校验和无流控。","PC日志与一致性":"保存带时间戳日志，用低、中、高三点与OLED显示逐项对照。","PC命令与文本边界":"分别发送PING、STATUS、未知命令和连续命令，核对CR/LF边界及响应日志。","分层诊断与日志":"按供电/HEX到SBUF/TI、RI/缓冲区逐级排查，每次只改变一个变量并保留复测证据。"};
const startedAt = Date.now();
let submitted = false;
const answers = {};
const qBox = document.getElementById('questions');

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function answerText(q,keys){return keys.map(k=>`${k}．${q.options.find(o=>o.key===k)?.text||''}`).join('；');}
function render(){
 qBox.innerHTML = `<h2>${esc(TEST.sectionLabel)}</h2>` + TEST.questions.map((q,i)=>{
   const type=q.type==='multiple'?'checkbox':'radio'; const label=q.displayType||(q.type==='multiple'?'多项选择题':'单项选择题');
   return `<article class="question" id="q-${q.id}" data-id="${q.id}"><div class="qhead"><span class="qno">${i+1}</span><div class="qtext">${esc(q.stem)} <span class="badge">${label}</span></div></div><div class="options">${q.options.map(o=>`<label class="option"><input type="${type}" name="q${q.id}" value="${o.key}"><span class="option-key">${o.key}．</span><span>${esc(o.text)}</span></label>`).join('')}</div><div class="feedback" id="fb-${q.id}"></div></article>`;
 }).join('');
 qBox.querySelectorAll('input').forEach(input=>input.addEventListener('change',()=>{collectOne(input.name);updateProgress();}));
}
function collectOne(name){const id=Number(name.slice(1));answers[id]=[...document.querySelectorAll(`input[name="${name}"]:checked`)].map(x=>x.value).sort();}
function updateProgress(){const done=TEST.questions.filter(q=>(answers[q.id]||[]).length).length;document.getElementById('progressBar').style.width=`${done/TEST.questions.length*100}%`;document.getElementById('progressText').textContent=`已答${done}题，共${TEST.questions.length}题`;}
function same(a,b){return JSON.stringify([...a].sort())===JSON.stringify([...b].sort());}
function formatTime(ms){const total=Math.max(1,Math.round(ms/1000));return `${Math.floor(total/60)}分${total%60}秒`;}
function grade(p){return p>=90?'优秀':p>=80?'达标':'需要订正';}
function buildDiagnosis(results){
 const wrong=results.filter(r=>!r.correct); const box=document.getElementById('diagnosis');
 if(!wrong.length){box.innerHTML='<h3>学习诊断</h3><div class="weak-item all-good"><b>本次未发现明显薄弱点。</b><br>建议进入综合迁移练习：调整参数或边界条件，重新判断程序、接口和测试结论是否仍然成立。</div>';return;}
 const counts={}; wrong.forEach(r=>counts[r.q.tag]=(counts[r.q.tag]||0)+1);
 const weak=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
 box.innerHTML=`<h3>主要薄弱点与提升建议</h3><p>本次共答错${wrong.length}题。建议优先补强以下知识点，而不是只记忆正确选项。</p><div class="weak-list">${weak.map(([tag,count])=>`<div class="weak-item"><b>${esc(tag)}</b>：涉及${count}道错题<br><span>${esc(SUGGESTIONS[tag]||'重新阅读对应关键知识，完成一次操作验证并记录结果。')}</span></div>`).join('')}</div><h4>建议复习顺序</h4><ol class="suggestions">${weak.slice(0,5).map(([tag])=>`<li>先复习“${esc(tag)}”，再重新完成对应错题。</li>`).join('')}<li>复习后重新作答，比较两次结果并确认错误原因已经消除。</li></ol>`;
}
function submitTest(){
 if(submitted)return;
 const name=document.getElementById('studentName').value.trim(), sid=document.getElementById('studentId').value.trim();
 if(!name||!sid){alert('请先填写姓名和学号。');(!name?document.getElementById('studentName'):document.getElementById('studentId')).focus();return;}
 document.querySelectorAll('.question').forEach(x=>x.classList.remove('unanswered'));
 const unanswered=TEST.questions.filter(q=>!(answers[q.id]||[]).length);
 if(unanswered.length){unanswered.forEach(q=>document.getElementById(`q-${q.id}`).classList.add('unanswered'));document.getElementById(`q-${unanswered[0].id}`).scrollIntoView({behavior:'smooth'});alert(`还有${unanswered.length}题未作答。`);return;}
 submitted=true; let score=0;
 const results=TEST.questions.map(q=>{const selected=answers[q.id]||[];const correct=same(selected,q.answer);if(correct)score+=q.points;const card=document.getElementById(`q-${q.id}`);card.classList.add('submitted',correct?'correct':'wrong');card.querySelectorAll('input').forEach(x=>x.disabled=true);const fb=document.getElementById(`fb-${q.id}`);fb.classList.add(correct?'good':'bad');fb.innerHTML=`<b>${correct?'回答正确':'需要改进'}</b><br>你的答案：${esc(answerText(q,selected))}<br>正确答案：${esc(answerText(q,q.answer))}<br>解析：${esc(q.explanation)}`;return{q,selected,correct};});
 const max=TEST.questions.reduce((s,q)=>s+q.points,0), percent=Math.round(score/max*100), elapsed=Date.now()-startedAt;
 document.getElementById('score').textContent=score;document.getElementById('scoreBase').textContent=`满分${max}分`;document.getElementById('percent').textContent=`${percent}%`;document.getElementById('level').textContent=grade(percent);document.getElementById('duration').textContent=formatTime(elapsed);buildDiagnosis(results);document.getElementById('result').classList.add('show');document.getElementById('submitBtn').disabled=true;document.getElementById('exportBtn').disabled=false;window.__result={name,sid,clazz:document.getElementById('studentClass').value.trim(),score,max,percent,level:grade(percent),elapsed,results,submittedAt:new Date()};document.getElementById('result').scrollIntoView({behavior:'smooth'});
}
function exportResult(){
 const r=window.__result;if(!r){alert('请先提交测试。');return;}
 const wrong=r.results.filter(x=>!x.correct);const counts={};wrong.forEach(x=>counts[x.q.tag]=(counts[x.q.tag]||0)+1);const weak=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
 const rows=r.results.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.q.stem)}</td><td>${esc(answerText(x.q,x.selected))}</td><td>${esc(answerText(x.q,x.q.answer))}</td><td>${x.correct?'正确':'错误'}</td><td>${esc(x.q.explanation)}</td></tr>`).join('');
 const weakHtml=weak.length?`<ol>${weak.map(([tag,count])=>`<li><b>${esc(tag)}</b>（${count}题）：${esc(SUGGESTIONS[tag]||'重新阅读对应关键知识并完成操作验证。')}</li>`).join('')}</ol>`:'<p>本次未发现明显薄弱点，建议开展变式和迁移练习。</p>';
 const doc=`<!doctype html><html><head><meta charset="utf-8"><title>项目9三级任务综合知识检测</title><style>body{font-family:'Microsoft YaHei';font-size:11pt;line-height:1.6}h1,h2{color:#0b4f7c}table{border-collapse:collapse;width:100%}td,th{border:1px solid #777;padding:6px;vertical-align:top}th{background:#eaf4f8}</style></head><body><h1>${esc(TEST.title)}测试结果</h1><p>姓名：${esc(r.name)}　学号：${esc(r.sid)}　班级：${esc(r.clazz||'未填写')}</p><p>提交时间：${r.submittedAt.toLocaleString()}　用时：${formatTime(r.elapsed)}</p><p><b>得分：${r.score}/${r.max}　正确率：${r.percent}%　评价：${r.level}</b></p><h2>主要薄弱点与提升建议</h2>${weakHtml}<h2>逐题结果</h2><table><thead><tr><th>题号</th><th>题目</th><th>作答</th><th>正确答案</th><th>结果</th><th>解析</th></tr></thead><tbody>${rows}</tbody></table></body></html>`;
 const blob=new Blob(['\ufeff',doc],{type:'application/msword;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${TEST.resourceId}-${r.sid}-${r.name}-测试结果.doc`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}
function resetTest(){if(!confirm('确定清除本次作答并重新开始吗？'))return;location.reload();}
document.getElementById('submitBtn').addEventListener('click',submitTest);document.getElementById('exportBtn').addEventListener('click',exportResult);document.getElementById('resetBtn').addEventListener('click',resetTest);render();updateProgress();
</script>
</body></html>
