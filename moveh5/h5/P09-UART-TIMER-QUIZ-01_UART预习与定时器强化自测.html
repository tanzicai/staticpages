Object.assign(SUGGESTIONS,{
 '串口发送流程':'按“写SBUF—等待TI—软件清TI”逐语句跟踪，并用连续字符串检查丢字、重字和乱码。',
 '定时器计数基础':'先写出FOSC、1T/12T与计数频率关系，再换算一个计数周期。',
 '定时器工作方式':'对照TMOD画出方式1和方式2，区分16位人工重装与8位自动重装。',
 '定时器初值计算':'按“目标时间→计数次数→65536减计数次数→拆分TH/TL”完成复算。',
 '定时器初始化':'按方式、初值、标志、分中断、启动、总中断顺序逐项核对。',
 '软件分频与任务周期':'用基础中断周期乘累计次数，验证10 ms、100 ms、500 ms和1 s任务周期。',
 '定时任务调度':'坚持ISR只计数和置标志，耗时采集、通信与显示放在主循环。',
 '定时器资源协同':'使用位掩码分别修改TMOD高低四位，检查Timer0与Timer1互不覆盖。'
});
const startedAt = Date.now();
let submitted = false;
const answers = {};
const qBox = document.getElementById('questions');

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function answerText(q,keys){return keys.map(k=>`${k}．${q.options.find(o=>o.key===k)?.text||''}`).join('；');}
function render(){
 let previousModule='';
 qBox.innerHTML = `<h2>${esc(TEST.sectionLabel)}</h2>` + TEST.questions.map((q,i)=>{
   const type=q.type==='multiple'?'checkbox':'radio'; const label=q.displayType||(q.type==='multiple'?'多项选择题':'单项选择题');
   const section=q.module!==previousModule?`<h3 class="section-title">${esc(q.module)}（10题，共50分）</h3>`:'';
   previousModule=q.module;
   return section+`<article class="question" id="q-${q.id}" data-id="${q.id}"><div class="qhead"><span class="qno">${i+1}</span><div class="qtext">${esc(q.stem)} <span class="badge">${label}</span><span class="badge">${esc(q.tag)}</span></div></div><div class="options">${q.options.map(o=>`<label class="option"><input type="${type}" name="q${q.id}" value="${o.key}"><span class="option-key">${o.key}．</span><span>${esc(o.text)}</span></label>`).join('')}</div><div class="feedback" id="fb-${q.id}"></div></article>`;
 }).join('');
 qBox.querySelectorAll('input').forEach(input=>input.addEventListener('change',()=>{collectOne(input.name);updateProgress();}));
}
function collectOne(name){const id=Number(name.slice(1));answers[id]=[...document.querySelectorAll(`input[name="${name}"]:checked`)].map(x=>x.value).sort();}
function updateProgress(){const done=TEST.questions.filter(q=>(answers[q.id]||[]).length).length;document.getElementById('progressBar').style.width=`${done/TEST.questions.length*100}%`;document.getElementById('progressText').textContent=`已答${done}题，共${TEST.questions.length}题`;}
function same(a,b){return JSON.stringify([...a].sort())===JSON.stringify([...b].sort());}
function formatTime(ms){const total=Math.max(1,Math.round(ms/1000));return `${Math.floor(total/60)}分${total%60}秒`;}
function grade(p){return p>=90?'优秀':p>=80?'良好':p>=60?'合格':'需要加强';}
function buildDiagnosis(results){
 const wrong=results.filter(r=>!r.correct); const box=document.getElementById('diagnosis');
 const uartScore=results.filter(r=>r.q.module==='UART预习诊断'&&r.correct).reduce((n,r)=>n+r.q.points,0),timerScore=results.filter(r=>r.q.module==='定时器知识强化'&&r.correct).reduce((n,r)=>n+r.q.points,0);
 const moduleSummary=`<p><b>模块达标：</b>UART ${uartScore}/50（${uartScore>=40?'通过':'未通过'}）；定时器 ${timerScore}/50（${timerScore>=40?'通过':'未通过'}）。</p>`;
 if(!wrong.length){box.innerHTML='<h3>学习诊断</h3>'+moduleSummary+'<div class="weak-item all-good"><b>本次未发现明显薄弱点。</b><br>建议进入综合迁移练习：调整参数或边界条件，重新判断程序、接口和测试结论是否仍然成立。</div>';return;}
 const counts={}; wrong.forEach(r=>counts[r.q.tag]=(counts[r.q.tag]||0)+1);
 const weak=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
 box.innerHTML=`<h3>主要薄弱点与提升建议</h3>${moduleSummary}<p>本次共答错${wrong.length}题。建议优先补强以下知识点，而不是只记忆正确选项。</p><div class="weak-list">${weak.map(([tag,count])=>`<div class="weak-item"><b>${esc(tag)}</b>：涉及${count}道错题<br><span>${esc(SUGGESTIONS[tag]||'重新阅读对应关键知识，完成一次操作验证并记录结果。')}</span></div>`).join('')}</div><h4>建议复习顺序</h4><ol class="suggestions">${weak.slice(0,5).map(([tag])=>`<li>先复习“${esc(tag)}”，再重新完成对应错题。</li>`).join('')}<li>复习后重新作答，比较两次结果并确认错误原因已经消除。</li></ol>`;
}
function submitTest(){
 if(submitted)return;
 const name=document.getElementById('studentName').value.trim(), sid=document.getElementById('studentId').value.trim();
 if(!name||!sid){alert('请先填写姓名和学号。');(!name?document.getElementById('studentName'):document.getElementById('studentId')).focus();return;}
 document.querySelectorAll('.question').forEach(x=>x.classList.remove('unanswered'));
 const unanswered=TEST.questions.filter(q=>!(answers[q.id]||[]).length);
 if(unanswered.length){unanswered.forEach(q=>document.getElementById(`q-${q.id}`).classList.add('unanswered'));document.getElementById(`q-${unanswered[0].id}`).scrollIntoView({behavior:'smooth'});alert(`还有${unanswered.length}题未作答。`);return;}
 submitted=true; let score=0;
 const results=TEST.questions.map(q=>{const selected=answers[q.id]||[];const correct=same(selected,q.answer);if(correct)score+=q.points;const card=document.getElementById(`q-${q.id}`);card.classList.add('submitted',correct?'correct':'wrong');card.querySelectorAll('input').forEach(x=>x.disabled=true);const fb=document.getElementById(`fb-${q.id}`);fb.classList.add(correct?'good':'bad');fb.innerHTML=`<b>${correct?'回答正确':'需要改进'}</b><br>你的答案：${esc(answerText(q,selected))}<br>正确答案：${esc(answerText(q,q.answer))}<br>解析：${esc(q.explanation)}`;return{q,selected,correct};});
 const max=TEST.questions.reduce((s,q)=>s+q.points,0), percent=Math.round(score/max*100), elapsed=Date.now()-startedAt;
 const uartScore=results.filter(r=>r.q.module==='UART预习诊断'&&r.correct).reduce((n,r)=>n+r.q.points,0),timerScore=results.filter(r=>r.q.module==='定时器知识强化'&&r.correct).reduce((n,r)=>n+r.q.points,0);
 document.getElementById('score').textContent=score;document.getElementById('scoreBase').textContent=`满分${max}分`;document.getElementById('percent').textContent=`${percent}%`;document.getElementById('uartScore').textContent=`${uartScore}/50`;document.getElementById('uartPass').textContent=uartScore>=40?'通过':'未通过';document.getElementById('timerScore').textContent=`${timerScore}/50`;document.getElementById('timerPass').textContent=timerScore>=40?'通过':'未通过';document.getElementById('level').textContent=grade(percent);document.getElementById('duration').textContent=formatTime(elapsed);buildDiagnosis(results);document.getElementById('result').classList.add('show');document.getElementById('submitBtn').disabled=true;document.getElementById('exportBtn').disabled=false;window.__result={name,sid,clazz:document.getElementById('studentClass').value.trim(),score,max,percent,uartScore,timerScore,level:grade(percent),elapsed,results,submittedAt:new Date()};document.getElementById('result').scrollIntoView({behavior:'smooth'});
}
function exportResult(){
 const r=window.__result;if(!r){alert('请先提交测试。');return;}
 const wrong=r.results.filter(x=>!x.correct);const counts={};wrong.forEach(x=>counts[x.q.tag]=(counts[x.q.tag]||0)+1);const weak=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
 const rows=r.results.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.q.stem)}</td><td>${esc(answerText(x.q,x.selected))}</td><td>${esc(answerText(x.q,x.q.answer))}</td><td>${x.correct?'正确':'错误'}</td><td>${esc(x.q.explanation)}</td></tr>`).join('');
 const weakHtml=weak.length?`<ol>${weak.map(([tag,count])=>`<li><b>${esc(tag)}</b>（${count}题）：${esc(SUGGESTIONS[tag]||'重新阅读对应关键知识并完成操作验证。')}</li>`).join('')}</ol>`:'<p>本次未发现明显薄弱点，建议开展变式和迁移练习。</p>';
 const doc=`<!doctype html><html><head><meta charset="utf-8"><title>${esc(TEST.title)}</title><style>body{font-family:'Microsoft YaHei';font-size:11pt;line-height:1.6}h1,h2{color:#0b4f7c}table{border-collapse:collapse;width:100%}td,th{border:1px solid #777;padding:6px;vertical-align:top}th{background:#eaf4f8}</style></head><body><h1>${esc(TEST.title)}测试结果</h1><p>姓名：${esc(r.name)}　学号：${esc(r.sid)}　班级：${esc(r.clazz||'未填写')}</p><p>提交时间：${r.submittedAt.toLocaleString()}　用时：${formatTime(r.elapsed)}</p><p><b>总分：${r.score}/${r.max}　正确率：${r.percent}%　评价：${r.level}</b></p><p><b>UART预习诊断：${r.uartScore}/50（${r.uartScore>=40?'通过':'未通过'}）　定时器知识强化：${r.timerScore}/50（${r.timerScore>=40?'通过':'未通过'}）</b></p><h2>主要薄弱点与提升建议</h2>${weakHtml}<h2>逐题结果</h2><table><thead><tr><th>题号</th><th>题目</th><th>作答</th><th>正确答案</th><th>结果</th><th>解析</th></tr></thead><tbody>${rows}</tbody></table></body></html>`;
 const blob=new Blob(['\ufeff',doc],{type:'application/msword;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${TEST.resourceId}-${r.sid}-${r.name}-测试结果.doc`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}
function resetTest(){if(!confirm('确定清除本次作答并重新开始吗？'))return;location.reload();}
document.getElementById('submitBtn').addEventListener('click',submitTest);document.getElementById('exportBtn').addEventListener('click',exportResult);document.getElementById('resetBtn').addEventListener('click',resetTest);render();updateProgress();
</script>
</body></html>
