<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="../assets/styles.css"><title>教师使用指南</title></head><body><main><section class="panel"><a href="../index.html#guide">← 返回资源中心</a><h1 style="font-size:40px">教师使用指南</h1><h2>一、课前准备</h2><p>检查浏览器、Keil与Proteus工程；发布知识图谱和T0诊断；按学情分组。</p><h2>二、180分钟使用建议</h2><table><tr><th>课时</th><th>内容</th><th>测试</th></tr><tr><td>第1课时</td><td>方案设计：8N1、Timer1方式2、1T、0xDC</td><td>T02 8题</td></tr><tr><td>第2课时</td><td>单机与虚拟终端，500 ms温度文本与字符回显</td><td>T04-01 8题</td></tr><tr><td>第3课时</td><td>双节点收发、RI中断、AA55与14字节收帧</td><td>T05 10题</td></tr><tr><td>第4课时</td><td>USB-TTL与PC通信、系统联调和项目总评</td><td>T04-02 8题、UNIT 16题</td></tr></table><h2>三、评价纪律</h2><p>C1—C4采集过程证据；阶段末仅形成一次T1总评，避免重复计分。</p></section></main></body></html>
