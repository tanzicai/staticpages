<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="../assets/styles.css"><title>STC15数据手册检索指南</title></head><body><main><section class="panel"><a href="../index.html#guide">← 返回资源中心</a><h1 style="font-size:40px">STC15数据手册检索指南</h1><p>请使用学校已授权或芯片厂商发布的对应型号数据手册，重点检索：SCON位定义、串口方式1、波特率发生器选择、AUXR 1T/12T配置、Timer1/Timer2计算公式、串口中断向量、I/O复用。</p><h2>记录要求</h2><p>在参数表注明手册版本、页码、晶振、时钟模式、公式、计算值、实测误差，避免把经典8051公式直接套用于不同STC15配置。</p></section></main></body></html>
