<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧教育平台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#fff;color:#1a1a1a;min-height:100vh}
/* Login */
.login-page{position:fixed;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;z-index:9999}
.login-bg{position:absolute;inset:0;background:linear-gradient(135deg,#fafafa 0%,#f0f0f0 100%)}
.login-bg::before{content:'';position:absolute;top:20%;left:10%;width:300px;height:300px;background:rgba(0,0,0,.02);border-radius:50%;filter:blur(60px)}
.login-bg::after{content:'';position:absolute;bottom:10%;right:15%;width:400px;height:400px;background:rgba(0,0,0,.015);border-radius:50%;filter:blur(80px)}
.login-card{position:relative;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:40px;width:400px;max-width:90vw;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.login-logo{width:44px;height:44px;background:#1a1a1a;border-radius:10px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
.login-logo svg{color:#fff}
.login-title{text-align:center;font-size:18px;font-weight:600;color:#1a1a1a;margin-bottom:6px}
.login-subtitle{text-align:center;font-size:13px;color:#9ca3af;margin-bottom:28px}
.login-field{margin-bottom:16px}
.login-label{font-size:12px;color:#6b7280;margin-bottom:6px;display:block}
.login-input{width:100%;height:42px;padding:0 14px;border:1px solid #e5e7eb;border-radius:8px;font-size:14px;font-family:inherit;transition:border-color .15s;background:#fff}
.login-input:focus{outline:none;border-color:#1a1a1a}
.login-btn{width:100%;height:42px;background:#1a1a1a;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;transition:opacity .15s;margin-top:8px}
.login-btn:hover{opacity:.9}
.login-btn:active{opacity:.8}
.login-error{color:#dc2626;font-size:12px;margin-top:12px;text-align:center;display:none}
.login-footer{text-align:center;margin-top:24px;font-size:11px;color:#d1d5db}
/* Main layout */
.app{display:none}
.app.visible{display:block}
.topbar{height:56px;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:#fff;position:fixed;top:0;left:0;right:0;z-index:100}
.topbar-left{display:flex;align-items:center;gap:12px}
.topbar-logo{width:28px;height:28px;background:#1a1a1a;border-radius:6px;display:flex;align-items:center;justify-content:center}
.topbar-logo svg{color:#fff}
.topbar-title{font-size:15px;font-weight:600;color:#1a1a1a}
.topbar-right{display:flex;align-items:center;gap:16px}
.topbar-user{display:flex;align-items:center;gap:8px;font-size:13px;color:#4b5563;cursor:pointer;padding:6px 12px;border-radius:8px;transition:background .15s}
.topbar-user:hover{background:#f5f5f5}
.topbar-avatar{width:28px;height:28px;border-radius:50%;background:#1a1a1a;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.sidebar{width:220px;border-right:1px solid #f0f0f0;position:fixed;top:56px;left:0;bottom:0;background:#fff;overflow-y:auto;padding:12px 0;z-index:90}
.sidebar::-webkit-scrollbar{width:4px}
.sidebar::-webkit-scrollbar-thumb{background:#e5e7eb;border-radius:2px}
.nav-group-title{font-size:10px;color:#9ca3af;padding:16px 20px 6px;font-weight:500;letter-spacing:.5px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 20px;font-size:13px;color:#4b5563;cursor:pointer;transition:all .12s;border-left:2px solid transparent}
.nav-item:hover{background:#f9fafb;color:#1a1a1a}
.nav-item.active{background:#f5f5f5;color:#1a1a1a;font-weight:500;border-left-color:#1a1a1a}
.nav-item svg{width:16px;height:16px;flex-shrink:0}
.nav-group{overflow:hidden}
.nav-group-header{display:flex;align-items:center;gap:8px;padding:10px 20px;font-size:12px;color:#9ca3af;cursor:pointer;user-select:none;font-weight:500;transition:color .12s}
.nav-group-header:hover{color:#6b7280}
.nav-group-header .arrow{width:12px;height:12px;transition:transform .2s;flex-shrink:0}
.nav-group-header .arrow.collapsed{transform:rotate(-90deg)}
.nav-group-body{overflow:hidden;transition:max-height .25s ease}
.nav-group-body.collapsed{max-height:0!important}
.nav-sub-item{display:flex;align-items:center;gap:10px;padding:8px 20px 8px 36px;font-size:13px;color:#6b7280;cursor:pointer;transition:all .12s;border-left:2px solid transparent}
.nav-sub-item:hover{background:#f9fafb;color:#1a1a1a}
.nav-sub-item.active{background:#f5f5f5;color:#1a1a1a;font-weight:500;border-left-color:#1a1a1a}
.nav-sub-item svg{width:15px;height:15px;flex-shrink:0}
.nav-sub-item .badge-new{display:inline-block;padding:1px 6px;font-size:10px;background:#f5f3ff;color:#7c3aed;border-radius:3px;margin-left:auto}
.content-area{margin-left:220px;margin-top:56px;padding:24px;min-height:calc(100vh - 56px)}
.page-title{font-size:20px;font-weight:600;color:#1a1a1a;margin-bottom:4px}
.page-desc{font-size:13px;color:#9ca3af;margin-bottom:24px}
/* Components */
.card{background:#fff;border:1px solid #f0f0f0;border-radius:10px;padding:20px;margin-bottom:16px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.card-title{font-size:14px;font-weight:600;color:#1a1a1a}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:#fff;border:1px solid #f0f0f0;border-radius:10px;padding:18px}
.stat-label{font-size:12px;color:#9ca3af;margin-bottom:8px}
.stat-value{font-size:26px;font-weight:700;color:#1a1a1a}
.stat-change{font-size:11px;color:#9ca3af;margin-top:4px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border:1px solid #e5e7eb;border-radius:8px;background:#fff;color:#1a1a1a;font-size:13px;cursor:pointer;transition:all .15s;font-family:inherit}
.btn:hover{border-color:#d1d5db;background:#f9fafb}
.btn-primary{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.btn-primary:hover{opacity:.9;background:#1a1a1a}
.btn-sm{padding:6px 10px;font-size:12px}
.btn-ghost{background:none;border:none;color:#6b7280}
.btn-ghost:hover{background:#f5f5f5;color:#1a1a1a}
.btn-danger{color:#dc2626;border-color:#fecaca}
.btn-danger:hover{background:#fef2f2}
.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500}
.tag-default{background:#f3f4f6;color:#6b7280}
.tag-success{background:#f0fdf4;color:#16a34a}
.tag-warning{background:#fffbeb;color:#d97706}
.tag-danger{background:#fef2f2;color:#dc2626}
.tag-info{background:#f5f3ff;color:#7c3aed}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 12px;border-bottom:1px solid #f0f0f0;font-weight:500;color:#6b7280;font-size:12px}
td{padding:12px;border-bottom:1px solid #f5f5f5;color:#1a1a1a}
tr:hover td{background:#fafafa}
.form-group{margin-bottom:14px}
.form-label{font-size:12px;color:#4b5563;margin-bottom:6px;display:block;font-weight:500}
.form-input,.form-textarea,.form-select{width:100%;padding:9px 12px;border:1px solid #e5e7eb;border-radius:8px;font-size:13px;font-family:inherit;color:#1a1a1a;background:#fff;transition:border-color .15s}
.form-input:focus,.form-textarea:focus,.form-select:focus{outline:none;border-color:#1a1a1a}
.form-textarea{min-height:80px;resize:vertical}
.tab-bar{display:flex;gap:0;border-bottom:1px solid #f0f0f0;margin-bottom:20px}
.tab-item{padding:10px 18px;font-size:13px;color:#6b7280;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
.tab-item:hover{color:#1a1a1a}
.tab-item.active{color:#1a1a1a;font-weight:600;border-bottom-color:#1a1a1a}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:1000;padding:24px}
.modal-overlay.visible{display:flex}
.modal{background:#fff;border-radius:12px;max-width:600px;width:100%;max-height:85vh;display:flex;flex-direction:column}
.modal-header{padding:16px 20px;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:15px;font-weight:600}
.modal-close{width:28px;height:28px;border:none;background:transparent;cursor:pointer;font-size:16px;color:#9ca3af;border-radius:6px;display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:#f5f5f5;color:#1a1a1a}
.modal-body{padding:20px;overflow-y:auto;flex:1}
.modal-footer{padding:14px 20px;border-top:1px solid #f0f0f0;display:flex;justify-content:flex-end;gap:10px}
.toast{position:fixed;top:72px;left:50%;transform:translateX(-50%) translateY(-20px);padding:10px 20px;background:#1a1a1a;color:#fff;border-radius:8px;font-size:13px;opacity:0;transition:all .3s;z-index:2000;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.progress-bar{width:100%;height:6px;background:#f3f4f6;border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:#1a1a1a;border-radius:3px;transition:width .3s}
.badge{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;font-size:10px;font-weight:600}
.badge-dark{background:#1a1a1a;color:#fff}
.badge-gray{background:#e5e7eb;color:#6b7280}
/* Panel switching */
.panel{display:none}
.panel.active{display:block}
/* Chat */
.chat-box{display:flex;flex-direction:column;height:520px;border:1px solid #f0f0f0;border-radius:10px;overflow:hidden}
.chat-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.chat-msg{display:flex;gap:10px;max-width:75%}
.chat-msg.user{align-self:flex-end;flex-direction:row-reverse}
.chat-avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;font-weight:600}
.chat-avatar.ai{background:#1a1a1a;color:#fff}
.chat-avatar.user{background:#e5e7eb;color:#1a1a1a}
.chat-bubble{padding:10px 14px;border-radius:10px;font-size:13px;line-height:1.6}
.chat-msg.ai .chat-bubble{background:#f5f5f5;color:#1a1a1a;border-top-left-radius:4px}
.chat-msg.user .chat-bubble{background:#1a1a1a;color:#fff;border-top-right-radius:4px}
.chat-input-area{padding:12px 16px;border-top:1px solid #f0f0f0;display:flex;gap:10px}
.chat-input{flex:1;padding:10px 14px;border:1px solid #e5e7eb;border-radius:8px;font-size:13px;font-family:inherit;outline:none}
.chat-input:focus{border-color:#1a1a1a}
.chat-quick{padding:10px 16px;border-top:1px solid #f0f0f0;display:flex;gap:8px;flex-wrap:wrap}
.chat-quick-btn{padding:5px 12px;border:1px solid #e5e7eb;border-radius:16px;font-size:11px;color:#6b7280;cursor:pointer;background:#fff}
.chat-quick-btn:hover{border-color:#1a1a1a;color:#1a1a1a}
/* Knowledge graph */
.kg-viewport{height:480px;background:#fafafa;border:1px solid #f0f0f0;border-radius:10px;overflow:auto;position:relative}
.kg-canvas{width:100%;height:100%;min-width:600px;min-height:440px}
/* Micro course */
.micro-tabs{display:flex;gap:0;border-bottom:1px solid #f0f0f0;margin-bottom:16px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.micro-tab{padding:10px 16px;font-size:13px;color:#6b7280;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;flex-shrink:0}
.micro-tab.active{color:#1a1a1a;font-weight:600;border-bottom-color:#1a1a1a}
/* Toggle */
.toggle-group{display:inline-flex;background:#f3f4f6;border-radius:8px;padding:3px}
.toggle-btn{padding:6px 14px;border:none;background:none;border-radius:6px;font-size:12px;color:#6b7280;cursor:pointer;font-family:inherit;transition:all .15s}
.toggle-btn.active{background:#fff;color:#1a1a1a;font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.06)}
/* Knowledge graph - responsive */
.mobile-kg-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:12px}
.mobile-kg-title{font-size:14px;font-weight:500;color:#1a1a1a}
.mobile-kg-viewport{width:100%;height:480px;background:#fafafa;border:1px solid #f0f0f0;border-radius:10px;overflow:hidden;position:relative;cursor:grab}
.mobile-kg-viewport:active{cursor:grabbing}
.mobile-kg-viewport canvas{display:block;width:100%;height:100%}
.mobile-tree{padding:8px 0}
.mobile-tree .tree-item{padding:10px 14px;font-size:14px}
.mobile-tree .tree-children{padding-left:16px}
.mobile-map-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:10px;padding:12px}
.mobile-map-node{aspect-ratio:1;border:1px solid #e5e7eb;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;padding:6px;min-width:0}
.mobile-map-node:hover{border-color:#1a1a1a;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.mobile-map-node.completed{background:#f0fdf4;border-color:#bbf7d0}
.mobile-map-node.current{background:#fffbeb;border-color:#fde68a}
.mobile-map-node.locked{opacity:.5;cursor:not-allowed}
.mobile-map-node .map-node-num{font-size:14px;font-weight:700;color:#1a1a1a}
.mobile-map-node .map-node-name{font-size:11px;color:#6b7280;margin-top:4px;text-align:center;line-height:1.2;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all}
/* Tree */
.tree-node{padding:6px 0}
.tree-item{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:6px;cursor:pointer;transition:background .12s;font-size:13px}
.tree-item:hover{background:#f5f5f5}
.tree-item.active{background:#f5f5f5;font-weight:500}
.tree-children{padding-left:20px}
.tree-toggle{width:16px;text-align:center;color:#9ca3af;font-size:10px;cursor:pointer}
/* Map mode */
.map-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;padding:20px}
.map-node{aspect-ratio:1;border:1px solid #e5e7eb;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;position:relative;padding:8px}
.map-node:hover{border-color:#1a1a1a;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.map-node.completed{background:#f0fdf4;border-color:#bbf7d0}
.map-node.current{background:#fffbeb;border-color:#fde68a}
.map-node.locked{opacity:.5;cursor:not-allowed}
.map-node-num{font-size:16px;font-weight:700;color:#1a1a1a}
.map-node-name{font-size:9px;color:#6b7280;margin-top:4px;text-align:center;line-height:1.2}
/* List */
.list-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid #f0f0f0;border-radius:8px;margin-bottom:8px;cursor:pointer;transition:all .12s}
.list-item:hover{border-color:#d1d5db;background:#fafafa}
.list-item-icon{width:36px;height:36px;border-radius:8px;background:#f5f5f5;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.list-item-body{flex:1}
.list-item-title{font-size:13px;font-weight:500;color:#1a1a1a}
.list-item-desc{font-size:11px;color:#9ca3af;margin-top:2px}
.list-item-meta{font-size:11px;color:#6b7280}
/* Research */
.research-input{width:100%;min-height:100px;padding:14px;border:1px solid #e5e7eb;border-radius:10px;font-size:13px;font-family:inherit;resize:vertical;outline:none;transition:border-color .15s}
.research-input:focus{border-color:#1a1a1a}
.lit-item{display:flex;align-items:flex-start;gap:12px;padding:12px;border:1px solid #f0f0f0;border-radius:8px;margin-bottom:8px}
.lit-item input[type=checkbox]{margin-top:3px}
/* Analysis charts (simple bar) */
.bar-chart{display:flex;flex-direction:column;gap:10px}
bar-row{display:flex;align-items:center;gap:12px}
.bar-label{width:80px;font-size:12px;color:#6b7280;text-align:right;flex-shrink:0}
.bar-track{flex:1;height:24px;background:#f5f5f5;border-radius:4px;overflow:hidden;position:relative}
.bar-fill{height:100%;background:#1a1a1a;border-radius:4px;transition:width .3s}
.bar-value{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:11px;color:#fff;font-weight:600}
/* Security */
.security-config-row{display:flex;gap:8px;margin-bottom:8px}
.security-config-row input{flex:1}
.keyword-tag{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;background:#f5f5f5;border-radius:6px;font-size:12px;margin:4px}
.keyword-tag .remove{cursor:pointer;color:#9ca3af}
.keyword-tag .remove:hover{color:#dc2626}
/* Text correction */
.correction-item{padding:12px 14px;border:1px solid #f0f0f0;border-radius:8px;margin-bottom:8px}
.correction-original{color:#dc2626;text-decoration:line-through;font-size:13px}
.correction-suggestion{color:#16a34a;font-size:13px;margin-top:4px}
.correction-type{font-size:11px;color:#9ca3af;margin-top:4px}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#e5e7eb;border-radius:3px}
::-webkit-scrollbar-track{background:transparent}
@media(max-width:768px){
  .sidebar{width:60px;overflow:hidden}
  .nav-item span{display:none}
  .nav-group-title{display:none}
  .nav-sub-item span{display:none}
  .nav-sub-item .badge-new{display:none}
  .nav-sub-item{padding:10px}
  .nav-group-header{padding:10px;justify-content:center}
  .nav-group-header span{display:none}
  .content-area{margin-left:60px;padding:16px}
  .stat-grid{grid-template-columns:1fr 1fr}
  .mobile-kg-viewport{height:380px}
  .mobile-kg-header{flex-direction:column;align-items:flex-start}
  .mobile-map-grid{grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
}
@media(max-width:480px){
  .content-area{padding:12px}
  .stat-grid{grid-template-columns:1fr}
  .mobile-kg-viewport{height:340px}
  .mobile-map-grid{grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
  .modal{max-width:95vw;border-radius:8px}
  .modal-body{padding:14px}
  .topbar{padding:0 12px}
  .topbar-title{font-size:14px}
}
</style>
</head>
<body>

<!-- ===== LOGIN PAGE ===== -->
<div class="login-page" id="loginPage">
  <div class="login-bg"></div>
  <div class="login-card">
    <div class="login-logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
    </div>
    <div class="login-title">智慧教育平台</div>
    <div class="login-subtitle">智能化教学管理与学习服务系统</div>
    <div class="login-field">
      <label class="login-label">账号</label>
      <input class="login-input" id="loginUser" type="text" placeholder="请输入账号" autocomplete="off">
    </div>
    <div class="login-field">
      <label class="login-label">密码</label>
      <input class="login-input" id="loginPass" type="password" placeholder="请输入密码">
    </div>
    <div class="login-error" id="loginError">账号或密码不正确，请重新输入</div>
    <button class="login-btn" onclick="doLogin()">登 录</button>
    <div class="login-footer">© 2026 智慧教育平台 · 版权所有</div>
  </div>
</div>

<!-- ===== MAIN APP ===== -->
<div class="app" id="mainApp">
  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-logo">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
      </div>
      <div class="topbar-title">智慧教育平台</div>
    </div>
    <div class="topbar-right">
      <div class="topbar-user" onclick="doLogout()">
        <div class="topbar-avatar">R</div>
        <span>管理员</span>
      </div>
    </div>
  </div>
  <div class="sidebar" id="sidebar">

function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2200)}
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

// ============ AUTH ============
function doLogin(){
  var u=document.getElementById('loginUser').value.trim();
  var p=document.getElementById('loginPass').value;
  if(u==='root'&&p==='root'){
    localStorage.setItem(STORAGE_KEY,JSON.stringify({user:u,loginTime:Date.now()}));
    document.getElementById('loginPage').style.display='none';
    document.getElementById('mainApp').classList.add('visible');
    switchModule('dashboard');
  }else{
    document.getElementById('loginError').style.display='block';
    document.getElementById('loginPass').value='';
  }
}
function doLogout(){
  if(confirm('确定退出登录？')){
    localStorage.removeItem(STORAGE_KEY);
    location.reload();
  }
}
function checkSession(){
  var session=localStorage.getItem(STORAGE_KEY);
  if(session){
    try{
      var data=JSON.parse(session);
      if(data.user==='root'){
        document.getElementById('loginPage').style.display='none';
        document.getElementById('mainApp').classList.add('visible');
        switchModule('dashboard');
        return true;
      }
    }catch(e){}
  }
  return false;
}
document.addEventListener('keypress',function(e){if(e.key==='Enter'&&document.getElementById('loginPage').style.display!=='none')doLogin()});

// ============ MODULE SWITCHING ============
function toggleNavGroup(header){
  var arrow=header.querySelector('.arrow');
  var body=header.nextElementSibling;
  if(!body.classList.contains('nav-group-body'))return;
  var isCollapsed=body.classList.contains('collapsed');
  if(isCollapsed){
    body.classList.remove('collapsed');
    body.style.maxHeight='600px';
    arrow.classList.remove('collapsed');
  }else{
    body.classList.add('collapsed');
    body.style.maxHeight='0px';
    arrow.classList.add('collapsed');
  }
}
function switchModule(name){
  S.currentModule=name;
  document.querySelectorAll('.nav-item,.nav-sub-item').forEach(function(n){n.classList.toggle('active',n.dataset.module===name)});
  var area=document.getElementById('contentArea');

}

function onMobileCourseChange(cid){
  MOBILE_STATE.selectedCourse=cid;
  var kgTree=COURSE_KG_TREES[cid]||KG_TREE;
  var course=COURSES.find(function(c){return c.id===cid})||COURSES[0];
  document.querySelector('.mobile-kg-title').textContent=kgTree.name+' · 知识图谱';
  if(mobileMode==='graph'){
    document.getElementById('mobileKgContent').innerHTML=renderMobileGraph();
    initInteractiveGraph();
  }else if(mobileMode==='outline'){
    document.getElementById('mobileKgContent').innerHTML=renderMobileOutline();
  }else{
    document.getElementById('mobileKgContent').innerHTML=renderMobileMap();
  }
  document.getElementById('mobileModeDesc').textContent=getMobileModeDesc(mobileMode);
  showToast('已切换至：'+course.name);
}

// ============ INTERACTIVE KNOWLEDGE GRAPH ============
var KG_STATE={nodes:[],edges:[],panX:0,panY:0,zoom:1,dragging:null,panning:false,lastX:0,lastY:0,canvas:null};
function toggleKGNode(e,nodeId){
  e.stopPropagation();
  if(KG_COLLAPSED[nodeId]){delete KG_COLLAPSED[nodeId]}else{KG_COLLAPSED[nodeId]=true}
  buildKGState();
  renderKGCanvas();
}
function buildKGState(){
  var tree=COURSE_KG_TREES[MOBILE_STATE.selectedCourse]||KG_TREE;
  var style=mobileGraphStyle||'ring';
  var nodes=[],edges=[];
  var rootId='root';
  nodes.push({id:rootId,name:tree.name.slice(0,4),type:'root',collapsed:!!KG_COLLAPSED[rootId]});
  tree.children.forEach(function(ch,i){
    var chId='ch'+i;
    var chCollapsed=!!KG_COLLAPSED[chId];
    nodes.push({id:chId,name:ch.name,type:'chapter',collapsed:chCollapsed,parentId:rootId});
    edges.push({from:rootId,to:chId});
    if(KG_COLLAPSED[rootId]||chCollapsed)return;
    ch.children.forEach(function(g,j){
      var leafId=chId+'g'+j;
      nodes.push({id:leafId,name:g.name,type:'leaf',parentId:chId});
      edges.push({from:chId,to:leafId});
    });
  });
  // Network: cross-chapter links
  if(style==='network'){
    for(var i=0;i<tree.children.length-1;i++){
      edges.push({from:'ch'+i,to:'ch'+(i+1)});
    }
  }
  KG_STATE.nodes=nodes;
  KG_STATE.edges=edges;
  computeLayout();
}
function computeLayout(){
  var style=mobileGraphStyle||'ring';
  var ns=KG_STATE.nodes;
  if(style==='ring'){
    ns.forEach(function(n){if(n.type==='root'){n._x=0;n._y=0}});
    var chNodes=ns.filter(function(n){return n.type==='chapter'});
    chNodes.forEach(function(n,i){
      var angle=-Math.PI/2+(2*Math.PI*i/chNodes.length);
      n._x=Math.cos(angle)*150;n._y=Math.sin(angle)*150;
    });
    ns.forEach(function(n){
      if(n.type==='leaf'){
        var p=ns.find(function(x){return x.id===n.parentId});
        if(p){
          var leafNodes=ns.filter(function(x){return x.parentId===n.parentId});
          var li=leafNodes.indexOf(n);
          var baseAngle=Math.atan2(p._y,p._x);
          var spread=Math.PI/3;
          var a=baseAngle-spread/2+spread*li/(leafNodes.length-1||1);
          n._x=p._x+Math.cos(a)*80;n._y=p._y+Math.sin(a)*80;
        }
      }
    });
  }else if(style==='tree'){
    ns.forEach(function(n){if(n.type==='root'){n._x=0;n._y=-220}});
    var chNodes=ns.filter(function(n){return n.type==='chapter'});
    var totalW=(chNodes.length-1)*120;
    chNodes.forEach(function(n,i){n._x=-totalW/2+i*120;n._y=-80});
    ns.forEach(function(n){
      if(n.type==='leaf'){
        var p=ns.find(function(x){return x.id===n.parentId});
        if(p){
          var leafNodes=ns.filter(function(x){return x.parentId===n.parentId});
          var li=leafNodes.indexOf(n);
          var lw=(leafNodes.length-1)*70;
          n._x=p._x-lw/2+li*70;n._y=p._y+70;
        }
      }
    });
  }else if(style==='network'){
    ns.forEach(function(n){if(n.type==='root'){n._x=0;n._y=-200}});
    var chNodes=ns.filter(function(n){return n.type==='chapter'});
    chNodes.forEach(function(n,i){
      var col=i%2,row=Math.floor(i/2);
      n._x=(col-0.5)*180;n._y=-60+row*120;
    });
    ns.forEach(function(n){
      if(n.type==='leaf'){
        var p=ns.find(function(x){return x.id===n.parentId});
        if(p){
          var leafNodes=ns.filter(function(x){return x.parentId===n.parentId});
          var li=leafNodes.indexOf(n);
          n._x=p._x-25+li*50;n._y=p._y+70;
        }
      }
    });
  }else{
    ns.forEach(function(n){if(n.type==='root'){n._x=0;n._y=-240}});
    var y=0;
    var chNodes=ns.filter(function(n){return n.type==='chapter'});
    chNodes.forEach(function(n,i){
      n._x=0;n._y=y;y+=80;
      var leafNodes=ns.filter(function(x){return x.parentId===n.id});
      leafNodes.forEach(function(lf,li){lf._x=(li+1)*80;lf._y=n._y});
    });
  }
}
function renderKGCanvas(){
  var canvas=KG_STATE.canvas;
  if(!canvas)return;
  var ctx=canvas.getContext('2d');
  var dpr=window.devicePixelRatio||1;
  var rect=canvas.getBoundingClientRect();
  canvas.width=rect.width*dpr;
  canvas.height=rect.height*dpr;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,rect.width,rect.height);
  var cx=rect.width/2,cy=rect.height/2;
  ctx.save();
  ctx.translate(cx+KG_STATE.panX,cy+KG_STATE.panY);
  ctx.scale(KG_STATE.zoom,KG_STATE.zoom);
  // Draw edges
  KG_STATE.edges.forEach(function(e){
    var from=KG_STATE.nodes.find(function(n){return n.id===e.from});
    var to=KG_STATE.nodes.find(function(n){return n.id===e.to});
    if(!from||!to)return;
    if(from.collapsed||to.collapsed)return;
    var p=KG_STATE.nodes.find(function(n){return n.id===to.parentId});
    if(p&&p.collapsed)return;
    if(from.type==='root'&&KG_STATE.nodes.find(function(n){return n.id==='root'&&n.collapsed}))return;
    ctx.beginPath();
    ctx.moveTo(from._x,from._y);
    ctx.lineTo(to._x,to._y);
    ctx.strokeStyle='#e5e7eb';
    ctx.lineWidth=1.5;
    ctx.stroke();
  });
  // Draw nodes
  KG_STATE.nodes.forEach(function(n){
    if(n.collapsed&&n.type!=='root'&&n.type!=='chapter')return;
    var p=n.type!=='root'?KG_STATE.nodes.find(function(x){return x.id===n.parentId}):null;
    if(p&&p.collapsed)return;
    if(n.type!=='root'&&KG_STATE.nodes.find(function(nn){return nn.id==='root'&&nn.collapsed}))return;
    var r=n.type==='root'?14:n.type==='chapter'?10:7;
    var fill=n.type==='root'?'#1a1a1a':n.type==='chapter'?'#6366f1':'#9ca3af';
    ctx.beginPath();
    ctx.arc(n._x,n._y,r,0,2*Math.PI);
    ctx.fillStyle=fill;
    ctx.fill();
    ctx.strokeStyle='#fff';
    ctx.lineWidth=1.5;
    ctx.stroke();
    if(n.type==='chapter'&&n.collapsed){
      ctx.fillStyle='#1a1a1a';
      ctx.font='bold 10px sans-serif';
      ctx.textAlign='center';
      ctx.textBaseline='middle';
      ctx.fillText('+',n._x,n._y);
    }
    var label=n.name.replace('第','').replace('章','').trim().slice(0,6);
    ctx.fillStyle='#1a1a1a';
    ctx.font=(n.type==='root'?'bold ':'')+'10px sans-serif';
    ctx.textAlign='center';
    ctx.fillText(label,n._x,n._y-r-4);
  });
  ctx.restore();
}
function initInteractiveGraph(){
  var viewport=document.getElementById('mobileKgContent');
  if(!viewport)return;
  viewport.innerHTML='<canvas id="kgCanvas" style="width:100%;height:100%"></canvas>';
  var canvas=document.getElementById('kgCanvas');
  KG_STATE.canvas=canvas;
  buildKGState();
  renderKGCanvas();
  canvas.addEventListener('mousedown',function(e){
    var mx=e.offsetX,my=e.offsetY;
    var rect=canvas.getBoundingClientRect();
    var cx=rect.width/2,cy=rect.height/2;
    var sx=(mx-cx-KG_STATE.panX)/KG_STATE.zoom;
    var sy=(my-cy-KG_STATE.panY)/KG_STATE.zoom;
    var hit=KG_STATE.nodes.find(function(n){
      var dx=sx-n._x,dy=sy-n._y;
      var r=n.type==='root'?16:n.type==='chapter'?12:9;
      return dx*dx+dy*dy<r*r;
    });
    if(hit){
      if(hit.type==='chapter'||hit.type==='root'){
        KG_STATE.dragging=hit.id;
      }else{
        openMicroCourse(hit.name);
        return;
      }
    }else{
      KG_STATE.panning=true;
    }
    KG_STATE.lastX=mx;KG_STATE.lastY=my;
  });
  canvas.addEventListener('mousemove',function(e){
    if(KG_STATE.dragging){
      var rect=canvas.getBoundingClientRect();
      var cx=rect.width/2,cy=rect.height/2;
      var sx=(e.offsetX-cx-KG_STATE.panX)/KG_STATE.zoom;
      var sy=(e.offsetY-cy-KG_STATE.panY)/KG_STATE.zoom;
      var node=KG_STATE.nodes.find(function(n){return n.id===KG_STATE.dragging});
      if(node){node._x=sx;node._y=sy;}
      renderKGCanvas();
    }else if(KG_STATE.panning){
      KG_STATE.panX+=e.offsetX-KG_STATE.lastX;
      KG_STATE.panY+=e.offsetY-KG_STATE.lastY;
      KG_STATE.lastX=e.offsetX;KG_STATE.lastY=e.offsetY;
      renderKGCanvas();
    }
  });
  canvas.addEventListener('mouseup',function(e){
    if(KG_STATE.dragging){
      var dx=Math.abs(e.offsetX-KG_STATE.lastX);
      var dy=Math.abs(e.offsetY-KG_STATE.lastY);
      if(dx<5&&dy<5){
        var nodeId=KG_STATE.dragging;
        toggleKGNode(new MouseEvent('click'),nodeId);
      }
      KG_STATE.dragging=null;
    }
    KG_STATE.panning=false;
  });
  canvas.addEventListener('mouseleave',function(){KG_STATE.dragging=null;KG_STATE.panning=false;});
  canvas.addEventListener('wheel',function(e){
    e.preventDefault();
    var delta=e.deltaY>0?0.9:1.1;
    KG_STATE.zoom=Math.max(0.3,Math.min(3,KG_STATE.zoom*delta));
    renderKGCanvas();
  });
  window.addEventListener('resize',renderKGCanvas);
}
function renderMobileGraph(){
  return '<canvas id="kgCanvas" style="width:100%;height:100%"></canvas>';
}
function renderMobileOutline(){
  var tree=COURSE_KG_TREES[MOBILE_STATE.selectedCourse]||KG_TREE;
  function renderNode(node,level){
    var html='<div class="tree-item" style="padding-left:'+(level*16+12)+'px" onclick="'+(node.microcourse?'openMicroCourse(\''+escapeHtml(node.name)+'\')':'')+'">'+
      '<span class="tree-toggle">'+(node.children?'▾':'●')+'</span>'+
      '<span>'+escapeHtml(node.name)+'</span>'+
      (node.microcourse?'<span class="tag tag-info" style="margin-left:auto;font-size:11px">微课</span>':'')+
    '</div>';
    if(node.children)html+='<div class="tree-children">'+node.children.map(function(c){return renderNode(c,level+1)}).join('')+'</div>';
    return html;
  }
  return '<div class="mobile-tree">'+renderNode(tree,0)+'</div>';
}
function renderMobileMap(){
  var tree=COURSE_KG_TREES[MOBILE_STATE.selectedCourse]||KG_TREE;
  var nodes=[tree.name];
  var statuses=['completed'];
  tree.children.forEach(function(ch){
    nodes.push(ch.name);
    statuses.push('completed');
    ch.children.forEach(function(g){
      nodes.push(g.name);
      statuses.push('locked');
    });
  });
  var completedCount=statuses.filter(function(s){return s==='completed'}).length;
  var progress=Math.round(completedCount/nodes.length*100);
  return '<div class="mobile-map-grid">'+
    nodes.map(function(n,i){
      var cls=statuses[i];
      return '<div class="mobile-map-node '+cls+'" onclick="'+(cls!=='locked'?'openMicroCourse(\''+escapeHtml(n)+'\')':'')+'">'+
        '<div class="map-node-num">'+(cls==='completed'?'✓':(i+1))+'</div>'+
        '<div class="map-node-name">'+escapeHtml(n)+'</div>'+
      '</div>';
    }).join('')+
  '</div>'+
  '<div style="font-size:12px;color:#9ca3af;text-align:center;padding:12px;border-top:1px solid #f0f0f0;margin-top:8px">已完成'+completedCount+'/'+nodes.length+' · 当前进度'+progress+'%</div>';
}

function submitQuizAnswers(){

  var q2=document.querySelectorAll('input[name="quiz2"]:checked');
  var q3=document.querySelector('input[name="quiz3"]:checked');
  var q4=document.querySelector('input[name="quiz4"]:checked');
  var details=[];
  // Q1: B
  if(q1&&q1.value==='B'){correctCount++;details.push('Q1 ✓ 正确：McCarthy于1956年提出AI概念')}
  else{details.push('Q1 ✗ 正确答案：B. McCarthy。图灵提出的是图灵测试（A）')}
  // Q2: B+C (多选)

  else{details.push('Q3 ✗ 正确答案：B。图灵测试核心是"不可区分性"')}
  // Q4: C
  if(q4&&q4.value==='C'){correctCount++;details.push('Q4 ✓ 正确：符号主义用符号和规则进行逻辑推理')}
  else{details.push('Q4 ✗ 正确答案：C。符号主义代表是纽厄尔/西蒙的"逻辑理论家"')}

  content+='--- 仅供学习参考，请勿外传 ---\n';
  var blob=new Blob([content],{type:'application/octet-stream'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;
  a.download=filename;
  document.body.appendChild(a);
  a.click();

  setTimeout(function(){URL.revokeObjectURL(url)},1000);

  btn.disabled=false;

}

function renderTaskList(){
  return TASKS.map(function(t){

function renderTaskMap(){
  var allPoints=[];
  TASKS.forEach(function(t){

      });
    });
  });
  return '<div class="map-grid">'+
    allPoints.map(function(item,i){
      var p=item.point;
      var cls=p.done?'completed':p.unlocked?'current':'locked';
      return '<div class="map-node '+cls+'" onclick="'+(p.unlocked?'learnTaskPoint(\''+item.task.id+'\',\''+escapeHtml(p.name)+'\')':'')+'">'+
        '<div class="map-node-num">'+(p.done?'✓':i+1)+'</div>'+
        '<div class="map-node-name">'+escapeHtml(p.name)+'</div>'+
      '</div>';
    }).join('')+
  '</div>'+
  '<div style="font-size:12px;color:#9ca3af;text-align:center;padding:12px">共'+allPoints.length+'个任务点 · 已完成'+allPoints.filter(function(x){return x.point.done}).length+'个</div>';

function completeTaskPoint(taskId,pointName){
  var t=TASKS.find(function(x){return x.id===taskId});
  if(!t){closeModal();return}
  var found=false;
  t.groups.forEach(function(g){
    g.points.forEach(function(p){
      if(p.name===pointName&&!p.done){
        p.done=true;
        found=true;
        // Unlock next point in same group
      }
    });
  });
  if(found){
    // Unlock logic: find first unlocked but not done point, unlock next
    var allPoints=[];
    t.groups.forEach(function(g){g.points.forEach(function(p){allPoints.push(p)})});
    for(var i=0;i<allPoints.length-1;i++){
      if(allPoints[i].done&&!allPoints[i+1].done&&!allPoints[i+1].unlocked){
        allPoints[i+1].unlocked=true;
        break;
      }
    }
    // Recalculate progress
    var doneCount=allPoints.filter(function(p){return p.done}).length;
    t.progress=Math.round(doneCount/allPoints.length*100);
    if(t.progress===100){t.status='completed'}
    // Unlock next task
    if(t.status==='completed'){
      var idx=TASKS.indexOf(t);
      if(idx<TASKS.length-1){TASKS[idx+1].unlock=true;TASKS[idx+1].status='in_progress';TASKS[idx+1].groups[0].status='in_progress';TASKS[idx+1].groups[0].points[0].unlocked=true}
    }
    showToast('学习完成，进度已更新');
    closeModal();
    // Re-render
    document.getElementById('taskListArea').innerHTML=taskMode==='list'?renderTaskList():renderTaskMap();
    viewTask(taskId);
  }else{
    showToast('该任务点已完成');
    closeModal();
  }
}

function togglePlanEdit(){
  var view=document.getElementById('researchPlanView');

  if(!view||!edit)return;
  if(edit.style.display==='none'){
    view.style.display='none';
    edit.style.display='block';
    var btn=document.querySelector('#researchResult .card-header button[onclick^="togglePlanEdit"]');
    if(btn)btn.textContent='完成编辑';

function editReport(){
  var reportContainer=document.querySelector('#researchResult .card:last-child');
  if(!reportContainer){showToast('请先生成报告');return}
  var reportBody=reportContainer.querySelector('.card-body')||reportContainer.querySelector('div[style]');
  if(!reportBody){showToast('请先生成报告');return}
  if(reportBody.contentEditable!=='true'){
    reportBody.contentEditable='true';
    reportBody.style.outline='2px dashed #6366f1';
    reportBody.style.outlineOffset='4px';
    reportBody.style.borderRadius='4px';
    var editBtn=reportContainer.querySelector('button[onclick="editReport()"]');
    if(editBtn){editBtn.textContent='保存编辑';editBtn.setAttribute('onclick','saveReportEdit()')}
    showToast('已进入编辑模式，点击报告内容即可修改');
  }
}
function saveReportEdit(){
  var reportContainer=document.querySelector('#researchResult .card:last-child');
  if(!reportContainer)return;
  var reportBody=reportContainer.querySelector('[contenteditable="true"]');
  if(reportBody){
    reportBody.contentEditable='false';
    reportBody.style.outline='';
    reportBody.style.outlineOffset='';
  }
  var editBtn=reportContainer.querySelector('button[onclick="saveReportEdit()"]');
  if(editBtn){editBtn.textContent='编辑';editBtn.setAttribute('onclick','editReport()')}
  showToast('报告已保存');
}
function copyReport(){
  var result=document.getElementById('researchResult');
  if(!result||!result.textContent.trim()){showToast('请先生成报告');return}
  var reportText=result.innerText;
  if(navigator.clipboard){
    navigator.clipboard.writeText(reportText).then(function(){
      showToast('报告内容已复制到剪贴板');
    }).catch(function(){
      fallbackCopy(reportText);
    });
  }else{
    fallbackCopy(reportText);
  }
}
function fallbackCopy(text){
  var ta=document.createElement('textarea');
  ta.value=text;
  ta.style.position='fixed';
  ta.style.left='-9999px';
  document.body.appendChild(ta);
  ta.select();
  try{document.execCommand('copy');showToast('报告内容已复制到剪贴板')}catch(e){showToast('复制失败，请手动复制')}
  document.body.removeChild(ta);
}
function downloadReport(format){
  var result=document.getElementById('researchResult');
  if(!result||!result.textContent.trim()){showToast('请先生成报告');return}
  var content=result.innerHTML;
  var textContent=result.innerText;
  if(format==='pdf'){
    // Generate HTML file with print-friendly styling; user can open and print to PDF
    var printHtml='<!DOCTYPE html><html><head><meta charset="UTF-8"><title>研究报告</title>'+
      '<style>body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;padding:40px;color:#333;line-height:1.8;max-width:800px;margin:0 auto}'+
      'h3{border-bottom:2px solid #333;padding-bottom:8px;margin-top:20px}'+
      'table{border-collapse:collapse;width:100%;margin:16px 0}td,th{border:1px solid #ddd;padding:8px;text-align:left}'+
      '@media print{body{padding:20px}}</style></head><body>'+
      content.replace(/style="[^"]*"/g,'')+'</body></html>';
    var blob=new Blob([printHtml],{type:'text/html;charset=UTF-8'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url;
    a.download='研究报告_'+new Date().toISOString().slice(0,10)+'.html';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(url)},1000);
    showToast('报告已下载为HTML文件（可用浏览器打开后打印为PDF）');
  }else if(format==='doc'){
    var blob=new Blob(['\ufeff',textContent],{type:'application/msword'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url;
    a.download='研究报告_'+Date.now()+'.doc';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('报告已下载为Word文档');
  }else{
    var blob=new Blob([textContent],{type:'text/plain'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url;
    a.download='研究报告_'+Date.now()+'.txt';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('报告已下载为TXT文件');
  }
}

function getAssignmentConclusion(a){
  var lowRateQ=a.questions.filter(function(q){return q.rate<60});
  if(lowRateQ.length>0){
    return '本次作业共'+a.questions.length+'题，其中'+lowRateQ.length+'题正确率低于60%，分别为第'+lowRateQ.map(function(q){return q.no}).join('、')+'题。建议针对这些题目涉及的知识点进行重点讲解和专项练习。班级整体表现'+(a.passRate>=85?'优秀':a.passRate>=75?'良好':'中等偏下')+'，平均分'+a.avgScore+'分。';
  }
  return '本次作业整体表现优秀，所有题目正确率均在60%以上，班级平均分'+a.avgScore+'分。可以适度提升难度，引导学生进行拓展学习。';

  var wrongRate=100-q.rate;

    '<div style="font-size:13px;line-height:1.8">'+
      '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px">'+

function getQuestionSuggestion(q){
  if(q.rate>=80)return '本题掌握情况良好，建议在后续测验中保持该题型的训练频率即可。';
  if(q.rate>=60)return '本题正确率中等，建议在下次课上花5-10分钟进行针对性讲解，并布置类似练习题加强巩固。';
  return '本题正确率偏低，建议：①安排专题讲解时间（建议20分钟以上）；②设计3-5道同类型课后练习题；③对答错学生进行个别辅导或小组讨论。';
}

function getAnalysisResponse(q){
  var avgScore=Math.round(STUDENTS.reduce(function(s,st){return s+st.score},0)/STUDENTS.length);
  var poorStudents=STUDENTS.filter(function(s){return s.level==='待提升'});
  if(q.indexOf('成绩')>=0||q.indexOf('整体')>=0){
    return '当前班级共'+STUDENTS.length+'名学生，平均分'+avgScore+'分。\n\n成绩分布：\n· 优秀(90+)：'+STUDENTS.filter(function(s){return s.level==='优秀'}).length+'人\n· 良好(80-89)：'+STUDENTS.filter(function(s){return s.level==='良好'}).length+'人\n· 中等(70-79)：'+STUDENTS.filter(function(s){return s.level==='中等'}).length+'人\n· 待提升(<70)：'+poorStudents.length+'人\n\n整体成绩呈正态分布，建议关注低分段学生的学习情况。';
  }
  if(q.indexOf('关注')>=0||q.indexOf('重点')>=0){
    return '以下'+poorStudents.length+'名学生需要重点关注：\n\n'+poorStudents.map(function(s){return '· '+s.name+'：综合成绩'+s.score+'分，视频完成'+s.videoRate+'%，作业完成'+s.homeworkRate+'%'}).join('\n')+'\n\n建议使用一键提醒功能通知这些学生加强学习。';
  }
  if(q.indexOf('视频')>=0){
    var avg=Math.round(STUDENTS.reduce(function(s,st){return s+st.videoRate},0)/STUDENTS.length);
    return '视频观看整体完成率为'+avg+'%。\n\n完成率最高：'+STUDENTS.sort(function(a,b){return b.videoRate-a.videoRate})[0].name+'('+STUDENTS[0].videoRate+'%)\n完成率最低：'+STUDENTS.sort(function(a,b){return a.videoRate-b.videoRate})[0].name+'\n\n建议对完成率低于60%的学生进行提醒。';
  }
  if(q.indexOf('知识')>=0){
    return '知识掌握情况分析：\n\n班级平均知识掌握度：'+Math.round(STUDENTS.reduce(function(s,st){return s+st.knowledge},0)/STUDENTS.length)+'%\n\n薄弱知识点：\n· 深度学习相关概念掌握率偏低\n· 强化学习原理理解不足\n\n建议针对薄弱知识点布置专项练习。';
  }
  return '已收到您的问题。当前班级共'+STUDENTS.length+'名学生，平均分'+avgScore+'分。您可以尝试询问"班级整体成绩"、"重点关注学生"、"视频完成情况"等获取更详细分析。';
}

}

function confirmAddKeyword(type){

function renderSecurityReview(){
  var filterType=ANALYSIS_STATE.assignmentFilter;
  var filterRisk=ANALYSIS_STATE.riskFilter;
  var filtered=SECURITY_REVIEWS.filter(function(r){
    var typeMatch=filterType==='all'||r.type===filterType;
    var riskMatch=filterRisk==='all'||r.risk===filterRisk;
    return typeMatch&&riskMatch;
  });
  var pendingCount=SECURITY_REVIEWS.filter(function(r){return r.status==='pending'}).length;
  var passedCount=SECURITY_REVIEWS.filter(function(r){return r.status==='passed'}).length;
  return '<div class="card">'+
    cardHeader('待审核资源',
      '<div style="display:flex;gap:8px;align-items:center">'+
        '<span style="font-size:12px;color:#6b7280">待审核：'+pendingCount+' · 已通过：'+passedCount+'</span>'+
        '<select class="form-select" style="width:auto" onchange="onSecurityFilter(\'type\',this.value)">'+
          '<option value="all"'+(filterType==='all'?' selected':'')+'>全部类型</option>'+
          '<option value="文本"'+(filterType==='文本'?' selected':'')+'>文本</option>'+
          '<option value="图片"'+(filterType==='图片'?' selected':'')+'>图片</option>'+
          '<option value="文档"'+(filterType==='文档'?' selected':'')+'>文档</option>'+
          '<option value="课程"'+(filterType==='课程'?' selected':'')+'>课程</option>'+
        '</select>'+
        '<select class="form-select" style="width:auto" onchange="onSecurityFilter(\'risk\',this.value)">'+
          '<option value="all"'+(filterRisk==='all'?' selected':'')+'>全部风险</option>'+
          '<option value="高"'+(filterRisk==='高'?' selected':'')+'>高风险</option>'+
          '<option value="中"'+(filterRisk==='中'?' selected':'')+'>中风险</option>'+
          '<option value="低"'+(filterRisk==='低'?' selected':'')+'>低风险</option>'+
          '<option value="无"'+(filterRisk==='无'?' selected':'')+'>无风险</option>'+
        '</select>'+
      '</div>'
    )+
    '<div style="font-size:12px;color:#9ca3af;margin-bottom:10px">当前筛选：'+(filterType==='all'?'全部类型':filterType)+' · '+(filterRisk==='all'?'全部风险':filterRisk)+' · 共'+filtered.length+'条记录</div>'+
    '<table><thead><tr><th>资源类型</th><th>内容</th><th>来源课程</th><th>提交者</th><th>时间</th><th>风险</th><th>状态</th><th>操作</th></tr></thead><tbody>'+
      (filtered.length===0?'<tr><td colspan="8" style="text-align:center;color:#9ca3af;padding:20px">无符合条件的记录</td></tr>':
      filtered.map(function(r){
        var riskTag=r.risk==='高'?'tag-danger':r.risk==='中'?'tag-warning':r.risk==='低'?'tag-info':'tag-success';
        var statusTag=r.status==='pending'?'<span class="tag tag-warning">待审核</span>':r.status==='passed'?'<span class="tag tag-success">已通过</span>':'<span class="tag tag-danger">已驳回</span>';
        var actionBtn=r.status==='pending'?'<button class="btn btn-sm" onclick="reviewItem(\''+r.id+'\')">审核</button>':'<span style="font-size:11px;color:#9ca3af">已处理</span>';
        return '<tr><td>'+r.type+'</td><td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+r.content+'</td><td>'+r.source+'</td><td>'+r.author+'</td><td style="font-size:12px;color:#9ca3af">'+r.time+'</td><td><span class="tag '+riskTag+'">'+r.risk+'</span></td><td>'+statusTag+'</td><td>'+actionBtn+'</td></tr>';
      }).join(''))+
    '</tbody></table>'+
  '</div>';
}
function onSecurityFilter(type,value){
  if(type==='type')ANALYSIS_STATE.assignmentFilter=value;
  else ANALYSIS_STATE.riskFilter=value;
  document.getElementById('securityContent').innerHTML=renderSecurityReview();
}
function reviewItem(id){
  var r=SECURITY_REVIEWS.find(function(x){return x.id===id});
  if(!r)return;
  openModal('资源审核 · '+r.type,
    '<div style="font-size:13px;line-height:1.7">'+
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px">'+
        '<div style="padding:10px;background:#f9fafb;border-radius:8px"><div style="font-size:11px;color:#9ca3af">来源课程</div><div style="margin-top:4px">'+r.source+'</div></div>'+
        '<div style="padding:10px;background:#f9fafb;border-radius:8px"><div style="font-size:11px;color:#9ca3af">提交者</div><div style="margin-top:4px">'+r.author+'</div></div>'+
      '</div>'+
      '<div style="padding:14px;background:#f9fafb;border-radius:8px;margin-bottom:16px"><div style="font-size:11px;color:#9ca3af;margin-bottom:6px">资源内容</div><div>'+r.content+'</div></div>'+
      '<div style="padding:14px;border-radius:8px;margin-bottom:16px;background:'+(r.risk==='高'?'#fef2f2':r.risk==='中'?'#fffbeb':'#f0fdf4')+'">'+
        '<div style="font-size:12px;font-weight:600;margin-bottom:6px">系统检测结果</div>'+
        '<div style="font-size:12px;color:#4b5563">风险等级：'+r.risk+'<br>检测项：关键词命中'+(r.risk==='高'?'3':'1')+'项，图片比对'+(r.risk!=='无'?'1':'0')+'项<br>建议：'+(r.risk==='高'?'建议驳回并通知作者修改':'内容基本合规，可人工确认通过')+'</div>'+
      '</div>'+
      '<div style="margin-bottom:8px"><label class="form-label">审核备注</label><textarea class="form-textarea" id="reviewRemark" placeholder="输入审核备注（可选）..."></textarea></div>'+
    '</div>',
    '<button class="btn" onclick="closeModal()">取消</button>'+
    '<button class="btn btn-danger" onclick="confirmReview(\''+r.id+'\',\'reject\')">驳回</button>'+
    '<button class="btn btn-primary" onclick="confirmReview(\''+r.id+'\',\'pass\')">通过</button>'
  );
}
function confirmReview(id,action){
  var r=SECURITY_REVIEWS.find(function(x){return x.id===id});
  if(!r)return;
  if(action==='pass'){
    r.status='passed';
    showToast('已通过审核：'+r.content);
  }else{
    r.status='rejected';
    showToast('已驳回：'+r.content);
  }
  closeModal();
  document.getElementById('securityContent').innerHTML=renderSecurityReview();
}

function runCorrection(){
  var text=document.getElementById('correctionText').value;
  if(!text.trim()){showToast('请输入待检测文本');return}
  var items=[];
  // 1. Check mixup words (错别字)
  CORRECTION_RULES.mixup.forEach(function(rule){
    if(rule.skip)return;
    var idx=text.indexOf(rule.pattern);
    if(idx>=0){
      items.push({
        original:rule.pattern,
        suggestion:rule.suggestion,
        type:rule.type,
        context:getContext(text,idx,rule.pattern.length)
      });
    }
  });
  // 2. Check institution names (机构名称)
  CORRECTION_RULES.institution.forEach(function(rule){
    if(rule.skip)return;
    var idx=text.indexOf(rule.pattern);
    if(idx>=0){
      items.push({
        original:rule.pattern,
        suggestion:rule.suggestion,
        type:rule.type,
        context:getContext(text,idx,rule.pattern.length)
      });
    }
  });
  // 3. Check grammar patterns (语法搭配)
  CORRECTION_RULES.grammar.forEach(function(rule){
    if(rule.skip)return;
    var match;
    if(rule.regex){
      var re=new RegExp(rule.pattern,'g');
      while((match=re.exec(text))!==null){
        if(items.some(function(item){return item.original===match[0]}))continue;
        items.push({
          original:match[0],
          suggestion:rule.suggestion||match[0],
          type:rule.type,
          context:getContext(text,match.index,match[0].length)
        });
      }
    }else{
      var idx=text.indexOf(rule.pattern);
      if(idx>=0){
        items.push({
          original:rule.pattern,
          suggestion:rule.suggestion,
          type:rule.type,
          context:getContext(text,idx,rule.pattern.length)
        });
      }
    }
  });
  // 4. Check punctuation (标点)
  CORRECTION_RULES.punctuation.forEach(function(rule){
    if(rule.skip)return;
    var idx=text.indexOf(rule.pattern);
    if(idx>=0){
      items.push({
        original:rule.pattern,
        suggestion:rule.suggestion,
        type:rule.type,
        context:getContext(text,idx,rule.pattern.length)
      });
    }
  });
  // 5. Generic checks: detect long sentences without punctuation
  var sentences=text.split(/[。！？\n]/);
  sentences.forEach(function(s){
    if(s.length>80&&s.indexOf('，')<0){
      items.push({
        original:s.slice(0,30)+'...',
        suggestion:'建议添加逗号分隔',
        type:'可读性建议 · 长句(>80字)缺少标点分隔',
        context:'...'+s.slice(0,40)+'...'
      });
    }
  });
  // Show results
  document.getElementById('correctionResult').style.display='block';
  document.getElementById('correctionCount').textContent='发现'+items.length+'处问题';
  if(items.length===0){
    document.getElementById('correctionItems').innerHTML='<div style="text-align:center;padding:30px;color:#16a34a;font-size:14px">✓ 未发现明显问题，文本质量良好</div>';
  }else{
    document.getElementById('correctionItems').innerHTML=items.map(function(item,i){
      return '<div class="correction-item">'+
        '<div class="correction-original">'+escapeHtml(item.original)+'</div>'+
        '<div class="correction-suggestion">建议修改为：'+escapeHtml(item.suggestion)+'</div>'+
        '<div class="correction-type">'+escapeHtml(item.type)+'</div>'+
        (item.context?'<div style="font-size:11px;color:#9ca3af;margin-top:4px">上下文：'+escapeHtml(item.context)+'</div>':'')+
        '<div style="margin-top:8px"><button class="btn btn-sm btn-primary" onclick="applyCorrection('+i+',\''+escapeHtml(item.suggestion)+'\')">采纳</button> <button class="btn btn-sm" onclick="ignoreCorrection(this)">忽略</button></div>'+
      '</div>';
    }).join('');
  }
  showToast('检测完成，发现'+items.length+'处问题');
}
function getContext(text,idx,len){
  var start=Math.max(0,idx-15);
  var end=Math.min(text.length,idx+len+15);
  var ctx=text.slice(start,end);
  if(start>0)ctx='...'+ctx;
  if(end<text.length)ctx=ctx+'...';
  return ctx.replace(/\n/g,' ');
}
function applyCorrection(i,suggestion){
  var text=document.getElementById('correctionText').value;
  var items=document.getElementById('correctionItems').querySelectorAll('.correction-item');
  if(!items[i])return;
  var original=items[i].querySelector('.correction-original').textContent;
  document.getElementById('correctionText').value=text.replace(original,suggestion);
  items[i].style.opacity='0.4';
  items[i].querySelector('.btn-primary').disabled=true;
  items[i].querySelector('.btn-primary').textContent='已采纳';
  showToast('已采纳修改建议');
}
function ignoreCorrection(btn){
  var item=btn.closest('.correction-item');
  if(item){item.style.opacity='0.4';btn.disabled=true;btn.textContent='已忽略'}
  showToast('已忽略该建议');
}

// ============ INIT ============
checkSession();
</script>
</body>
