<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>线上考试管理 · 智慧教育一体化平台</title>
<link rel="stylesheet" href="assets/css/common.css">
<style>
/* ===== ExamManage.vue scoped（选择器加 .exam-page 前缀） ===== */
.exam-page .exam-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 11px; margin-bottom: 12px; }
.exam-page .exam-kpi {
  padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px;
  background: linear-gradient(150deg, rgba(255,255,255,0.92), rgba(255,255,255,0.7));
  box-shadow: var(--shadow-sm);
}
.exam-page .exam-kpi > span { display: block; font-size: 10px; color: var(--muted); }
.exam-page .exam-kpi strong { display: block; margin-top: 6px; font-family: var(--num); font-size: 22px; font-weight: 720; color: var(--ink-2); }
.exam-page .exam-kpi strong small { font-size: 9.5px; color: var(--muted); margin-left: 3px; font-weight: 500; }
.exam-page .exam-kpi em { display: block; margin-top: 3px; font-style: normal; font-size: 9px; color: var(--muted-2); }

.exam-page .exam-table { font-size: 11px; }
.exam-page .exam-table th { white-space: nowrap; font-size: 10px; }
.exam-page .exam-table td.strong { font-weight: 620; color: var(--ink-2); }
.exam-page .exam-table td.num { font-family: var(--num); white-space: nowrap; }
.exam-page .row-actions { display: flex; gap: 4px; }
.exam-page .row-actions button {
  width: 26px; height: 26px; border-radius: 6px;
  border: 1px solid var(--line); background: #fff;
  display: grid; place-items: center; color: var(--muted); cursor: pointer;
}
.exam-page .row-actions button:hover { color: var(--violet); border-color: rgba(109, 91, 246, 0.4); }

.exam-page .exam-mask {
  position: fixed; inset: 0; z-index: 50;
  background: rgba(10, 24, 46, 0.36); backdrop-filter: blur(2px);
  display: grid; place-items: center; padding: 20px;
}
.exam-page .exam-dialog {
  width: min(680px, 94vw); max-height: 88vh; border-radius: 14px;
  background: #fff; box-shadow: 0 24px 60px rgba(10, 24, 46, 0.24);
  display: flex; flex-direction: column; overflow: hidden;
}
.exam-page .exam-dialog-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 13px 18px; border-bottom: 1px solid var(--line);
  font-size: 12.5px; font-weight: 650; color: var(--ink-2);
}
.exam-page .exam-dialog-head button { border: 0; background: transparent; cursor: pointer; color: var(--muted); display: grid; place-items: center; }
.exam-page .exam-dialog-body { padding: 14px 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
.exam-page .exam-dialog-foot {
  display: flex; justify-content: flex-end; gap: 8px;
  padding: 12px 18px; border-top: 1px solid var(--line);
}

.exam-page .section-label { font-size: 9.5px; color: var(--muted-2); letter-spacing: 0.5px; }
.exam-page .section-head { display: flex; align-items: center; justify-content: space-between; padding-top: 4px; border-top: 1px dashed var(--line); margin-top: 2px; }
.exam-page .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.exam-page .field { display: flex; flex-direction: column; gap: 4px; }
.exam-page .field.span2 { grid-column: span 2; }
.exam-page .field > span { font-size: 10px; color: var(--muted); }
.exam-page .field input, .exam-page .field select {
  width: 100%; padding: 7px 9px; border-radius: 7px;
  border: 1px solid var(--line); background: #fff;
  font-size: 11px; color: var(--ink-2); outline: none;
}
.exam-page .field input:focus, .exam-page .field select:focus { border-color: rgba(109, 91, 246, 0.5); }

.exam-page .switch {
  display: inline-flex; align-items: center; gap: 5px; flex: none;
  height: 25px; padding: 0 9px; border-radius: 13px;
  border: 1px solid var(--line); background: #fff;
  font-size: 9.5px; color: var(--muted); cursor: pointer;
}
.exam-page .switch-dot { width: 7px; height: 7px; border-radius: 50%; background: #c3cbd6; }
.exam-page .switch.on { border-color: rgba(15, 157, 143, 0.4); background: rgba(15, 157, 143, 0.07); color: var(--green); }
.exam-page .switch.on .switch-dot { background: var(--green); }

.exam-page .setting-row {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: rgba(47, 107, 255, 0.03);
}
.exam-page .setting-row.column { flex-direction: column; align-items: stretch; gap: 8px; }
.exam-page .setting-info strong { display: flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--ink-2); }
.exam-page .setting-info strong svg { color: var(--violet); }
.exam-page .setting-info > span { display: block; margin-top: 3px; font-size: 9.5px; color: var(--muted); }

.exam-page .group-box { padding: 10px 12px; border: 1px dashed rgba(109, 91, 246, 0.25); border-radius: 10px; }
.exam-page .group-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; font-size: 10px; color: var(--muted); }
.exam-page .group-row { display: grid; grid-template-columns: 130px 110px 1fr 26px; gap: 6px; margin-bottom: 6px; }
.exam-page .group-row input {
  width: 100%; padding: 6px 8px; border-radius: 6px;
  border: 1px solid var(--line); font-size: 10px; color: var(--ink-2); outline: none;
}
.exam-page .group-row input:focus { border-color: rgba(109, 91, 246, 0.45); }
.exam-page .del-btn {
  border: 1px solid var(--line); background: #fff; border-radius: 6px;
  color: var(--muted); cursor: pointer; display: grid; place-items: center;
}
.exam-page .del-btn:hover { color: var(--red); border-color: rgba(214, 69, 80, 0.4); }
.exam-page .group-note { margin: 2px 0 0; font-size: 9px; color: var(--muted-2); line-height: 1.5; }

.exam-page .perm-list { display: flex; flex-wrap: wrap; gap: 6px; }
.exam-page .perm-item {
  display: inline-flex; align-items: center; gap: 5px;
  height: 28px; padding: 0 10px; border-radius: 7px;
  border: 1px solid var(--line); background: #fff;
  font-size: 10.5px; color: var(--muted); cursor: pointer; transition: 0.12s;
}
.exam-page .perm-item.on { border-color: rgba(109, 91, 246, 0.4); background: rgba(109, 91, 246, 0.07); color: var(--violet); }
.exam-page .perm-item.on svg { color: var(--violet); }
.exam-page .perm-empty { width: 12px; height: 12px; border-radius: 50%; border: 1px dashed rgba(19, 33, 60, 0.25); display: inline-block; }

.exam-page .setting-hint {
  display: flex; align-items: flex-start; gap: 6px;
  padding: 8px 10px; border-radius: 8px;
  background: rgba(109, 91, 246, 0.05);
  font-size: 9.5px; color: var(--muted); line-height: 1.6;
}
.exam-page .setting-hint svg { color: var(--violet); flex: none; margin-top: 1px; }
.exam-page .setting-hint.muted-hint { background: rgba(19, 33, 60, 0.035); }
.exam-page .setting-hint.muted-hint svg { color: var(--muted); }

@media (max-width: 1024px) {
  .exam-page .exam-kpis { grid-template-columns: repeat(2, 1fr); }
  .exam-page .form-grid { grid-template-columns: 1fr; }
  .exam-page .field.span2 { grid-column: auto; }
  .exam-page .group-row { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body data-platform="exam" data-module="online-exam">
<main class="content"><div class="page exam-page">
  <div class="page-head module-head">
    <div>
      <div class="breadcrumb">
        <a href="portal.html">首页</a><span>/</span>
        <a href="platform.html?p=exam">考试系统</a><span>/</span>
        <span>线上考试管理</span>
      </div>
      <div class="module-title-row">
        <h1 class="page-title">线上考试管理</h1>
        <span class="tag blue">考试发布</span>
        <span class="tag violet">发布时配置移动端监考</span>
      </div>
      <p class="page-desc">考试发布时完成监考工作设置：可启用移动端监考、配置分组监考与移动端操作权限。具体监考端功能不在本页面实现，仅保留发布配置项。</p>
    </div>
    <div class="page-actions">
      <button class="btn btn-primary" id="btnPublish"></button>
    </div>
  </div>

  <div class="exam-kpis" id="examKpis"></div>

  <section class="panel">
    <div class="panel-head">
      <div class="panel-title"><span class="panel-titlebar"></span>考试列表</div>
      <span class="muted tiny">移动端监考与分组监考仅在发布考试时配置</span>
    </div>
    <div class="panel-body table-wrap">
      <table class="table exam-table">
        <thead>
          <tr>
            <th>考试名称</th><th>科目</th><th>考试时间</th><th>考生</th>
            <th>状态</th><th>移动端监考</th><th>移动端操作权限</th><th style="width: 72px">操作</th>
          </tr>
        </thead>
        <tbody id="examTbody"></tbody>
      </table>
    </div>
  </section>

  <!-- 发布考试弹窗 -->
  <div class="exam-mask" id="examMask" style="display:none">
    <div class="exam-dialog">
      <div class="exam-dialog-head">
        <strong id="examDialogTitle">发布考试</strong>
        <button data-act="close" id="examDialogClose"></button>
      </div>
      <div class="exam-dialog-body" id="examDialogBody"></div>
      <div class="exam-dialog-foot">
        <button class="btn" data-act="close">取消</button>
        <button class="btn" id="btnDraft" data-act="draft">保存草稿</button>
        <button class="btn btn-primary" id="btnSubmitExam" data-act="publish"></button>
      </div>
    </div>
  </div>
</div></main>
<script src="assets/js/icons.js"></script>
<script src="assets/js/seed.js"></script>
<script src="assets/js/common.js"></script>
<script>
(function () {
  const $ = (s, r) => (r || document).querySelector(s)
  const esc = (s) => UI.esc(String(s))
  const icon = (n, s) => UI.icon(n, s)

  /* ===== 数据 ===== */
  const exams = [
    {
      id: 'e1', name: '2026 秋季《数据结构》期中考试', subject: '数据结构', time: '2026-11-05 09:00 - 10:30',
      students: 126, status: '待开始', mobile: true, grouped: true, perms: ['查看考生监考详情', '强制收卷', '打回继续考试'],
      groups: [
        { name: '第 1 考场组', teacher: '陈予安', scope: '考场 A · 42 人' },
        { name: '第 2 考场组', teacher: '赵启航', scope: '考场 B · 42 人' },
        { name: '第 3 考场组', teacher: '何思齐', scope: '考场 C · 42 人' },
      ],
    },
    {
      id: 'e2', name: '《大学英语》四级模拟测试', subject: '大学英语', time: '2026-10-29 14:00 - 16:00',
      students: 210, status: '进行中', mobile: true, grouped: false,
      perms: ['查看考生监考详情', '强制收卷'], groups: [],
    },
    {
      id: 'e3', name: '《计算机基础》随堂测验', subject: '计算机基础', time: '2026-10-28 10:00 - 10:40',
      students: 88, status: '已结束', mobile: false, grouped: false, perms: [], groups: [],
    },
    {
      id: 'e4', name: '《高等数学》补考', subject: '高等数学', time: '2026-11-12 09:00 - 11:00',
      students: 36, status: '待开始', mobile: true, grouped: false, perms: ['查看考生监考详情', '打回继续考试'], groups: [],
    },
  ]

  const permOptions = ['查看考生监考详情', '强制收卷', '打回继续考试']
  const subjects = ['数据结构', '大学英语', '计算机基础', '高等数学', '数字媒体技术']

  let editId = null
  let form = null

  function defaultForm() {
    return {
      name: '', subject: '数据结构', time: '', students: 120, duration: 90,
      mobile: true, grouped: false, groups: [], perms: ['查看考生监考详情'],
    }
  }

  function mobileSummary(e) {
    if (!e.mobile) return '未启用'
    return e.grouped ? `分组监考 · ${e.groups.length} 组` : '移动端监考'
  }

  /* ===== KPI ===== */
  function renderKpis() {
    const kpis = [
      { label: '考试总数', value: exams.length, unit: '场', note: '本学期已创建' },
      { label: '进行中', value: exams.filter((e) => e.status === '进行中').length, unit: '场', note: '实时作答中' },
      { label: '启用移动端监考', value: exams.filter((e) => e.mobile).length, unit: '场', note: '发布时已配置' },
      { label: '分组监考', value: exams.filter((e) => e.grouped).length, unit: '场', note: '按考场分组建组' },
    ]
    $('#examKpis').innerHTML = kpis.map((k) => `
      <div class="exam-kpi">
        <span>${k.label}</span>
        <strong>${k.value}<small>${k.unit}</small></strong>
        <em>${k.note}</em>
      </div>`).join('')
  }

  /* ===== 考试列表 ===== */
  function renderTable() {
    $('#examTbody').innerHTML = exams.map((e) => `
      <tr>
        <td class="strong">${esc(e.name)}</td>
        <td>${esc(e.subject)}</td>
        <td class="num">${esc(e.time)}</td>
        <td class="num">${e.students} 人</td>
        <td><span class="tag ${e.status === '进行中' ? 'green' : e.status === '待开始' ? 'blue' : 'gray'}">${e.status}</span></td>
        <td>
          <span class="tag ${e.mobile ? 'violet' : 'gray'}">
            ${icon('smartphone', 10)}${mobileSummary(e)}
          </span>
        </td>
        <td class="muted tiny">${e.perms.length ? esc(e.perms.join(' / ')) : '—'}</td>
        <td>
          <div class="row-actions">
            <button title="编辑" data-edit="${e.id}">${icon('pen-line', 13)}</button>
            <button title="查看" data-view="${e.id}">${icon('eye', 13)}</button>
          </div>
        </td>
      </tr>`).join('')
  }

  /* ===== 发布 / 编辑弹窗 ===== */
  function openPublish() {
    editId = null
    form = defaultForm()
    renderDialog()
    $('#examMask').style.display = 'grid'
  }

  function openEdit(e) {
    editId = e.id
    form = {
      name: e.name, subject: e.subject, time: e.time, students: e.students,
      duration: 90, mobile: e.mobile, grouped: e.grouped,
      groups: e.groups.map((g) => ({ ...g })),
      perms: [...e.perms],
    }
    renderDialog()
    $('#examMask').style.display = 'grid'
  }

  function closeDialog() { $('#examMask').style.display = 'none' }

  function canSubmit() { return form.name.trim().length > 0 && form.time.trim().length > 0 }
  function updateSubmitState() {
    const ok = canSubmit()
    $('#btnDraft').disabled = !ok
    $('#btnSubmitExam').disabled = !ok
  }

  function mobileSettingsHtml() {
    const f = form
    let h = `
      <div class="setting-row">
        <div class="setting-info">
          <strong>${icon('users', 12)}分组监考</strong>
          <span>按考场 / 班级将监考教师分组，每位教师只负责所属组的考生</span>
        </div>
        <button class="switch ${f.grouped ? 'on' : ''}" data-act="toggle-grouped">
          <span class="switch-dot"></span>${f.grouped ? '已启用' : '未启用'}
        </button>
      </div>`
    if (f.grouped) {
      h += `
      <div class="group-box">
        <div class="group-head">
          <span>监考分组</span>
          <button class="btn btn-sm" data-act="add-group">${icon('plus', 12)}添加监考组</button>
        </div>
        ${f.groups.map((g, i) => `
        <div class="group-row">
          <input data-g="name" data-i="${i}" value="${esc(g.name)}" placeholder="组名" class="g-name">
          <input data-g="teacher" data-i="${i}" value="${esc(g.teacher)}" placeholder="监考教师">
          <input data-g="scope" data-i="${i}" value="${esc(g.scope)}" placeholder="负责范围，如 考场 A · 42 人">
          <button class="del-btn" title="删除" data-del-group="${i}">${icon('trash-2', 12)}</button>
        </div>`).join('')}
        <p class="group-note">分组结果将在考试开始后同步到移动端监考端（本期仅配置，不实现监考端功能）。</p>
      </div>`
    }
    h += `
      <div class="setting-row column">
        <div class="setting-info">
          <strong>${icon('shield-check', 12)}移动端操作权限</strong>
          <span>勾选监考教师可在移动端执行的操作</span>
        </div>
        <div class="perm-list">
          ${permOptions.map((p) => `
          <button class="perm-item ${f.perms.includes(p) ? 'on' : ''}" data-perm="${esc(p)}">
            ${f.perms.includes(p) ? icon('circle-check', 12) : '<span class="perm-empty"></span>'}
            ${p}
          </button>`).join('')}
        </div>
      </div>
      <div class="setting-hint">
        ${icon('clock-3', 12)}
        <span>以上设置仅在考试发布时保存为工作设置，用于后续移动端监考接入；本期不实现移动端监考功能。</span>
      </div>`
    return h
  }

  function renderDialog() {
    const f = form
    $('#examDialogTitle').textContent = editId ? '编辑考试发布设置' : '发布考试'
    $('#examDialogBody').innerHTML = `
      <div class="section-label">基本信息</div>
      <div class="form-grid">
        <label class="field span2">
          <span>考试名称</span>
          <input data-f="name" value="${esc(f.name)}" placeholder="如：2026 秋季《数据结构》期中考试">
        </label>
        <label class="field">
          <span>考试科目</span>
          <select data-f="subject">${subjects.map((s) => `<option value="${s}" ${s === f.subject ? 'selected' : ''}>${s}</option>`).join('')}</select>
        </label>
        <label class="field">
          <span>考试时间</span>
          <input data-f="time" value="${esc(f.time)}" placeholder="2026-11-05 09:00 - 10:30">
        </label>
        <label class="field">
          <span>考生人数</span>
          <input data-f="students" type="number" min="1" value="${f.students}">
        </label>
        <label class="field">
          <span>考试时长（分钟）</span>
          <input data-f="duration" type="number" min="10" value="${f.duration}">
        </label>
      </div>

      <div class="section-head">
        <span class="section-label">工作设置 · 移动端监考</span>
        <button class="switch ${f.mobile ? 'on' : ''}" data-act="toggle-mobile">
          <span class="switch-dot"></span>${f.mobile ? '已启用' : '未启用'}
        </button>
      </div>

      ${f.mobile ? mobileSettingsHtml() : `
      <div class="setting-hint muted-hint">
        ${icon('smartphone', 12)}
        <span>未启用移动端监考，该场考试仅支持 PC 监考端。</span>
      </div>`}
    `
    updateSubmitState()
  }

  function addGroup() {
    form.groups.push({ name: `监考组 ${form.groups.length + 1}`, teacher: '', scope: '' })
  }

  function submit(publish) {
    if (!canSubmit()) return
    const payload = {
      name: form.name.trim(),
      subject: form.subject,
      time: form.time.trim(),
      students: Number(form.students) || 0,
      mobile: form.mobile,
      grouped: form.mobile && form.grouped,
      groups: form.mobile && form.grouped ? form.groups.filter((g) => g.name.trim()) : [],
      perms: form.mobile ? [...form.perms] : [],
    }
    if (editId) {
      const target = exams.find((e) => e.id === editId)
      if (target) Object.assign(target, payload)
      UI.toast('考试设置已保存')
    } else if (publish) {
      exams.unshift({ id: `e${Date.now()}`, status: '待开始', ...payload })
      UI.toast('考试已发布，移动端监考配置已生效')
    } else {
      exams.unshift({ id: `e${Date.now()}`, status: '待开始', ...payload })
      UI.toast('已保存为草稿')
    }
    closeDialog()
    renderKpis()
    renderTable()
  }

  /* ===== 事件 ===== */
  $('#btnPublish').innerHTML = `${icon('plus', 15)}发布考试`
  $('#btnPublish').addEventListener('click', openPublish)
  $('#examDialogClose').innerHTML = icon('x', 16)
  $('#btnSubmitExam').innerHTML = `${icon('send', 13)}发布考试`

  $('#examMask').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) closeDialog()
  })

  $('#examTbody').addEventListener('click', (e) => {
    const editBtn = e.target.closest('[data-edit]')
    if (editBtn) {
      const exam = exams.find((x) => x.id === editBtn.dataset.edit)
      if (exam) openEdit(exam)
      return
    }
    const viewBtn = e.target.closest('[data-view]')
    if (viewBtn) {
      const exam = exams.find((x) => x.id === viewBtn.dataset.view)
      if (exam) UI.toast(`查看「${exam.name}」的发布配置`)
    }
  })

  document.querySelector('.exam-dialog').addEventListener('click', (e) => {
    const actBtn = e.target.closest('[data-act]')
    if (actBtn) {
      const act = actBtn.dataset.act
      if (act === 'close') closeDialog()
      else if (act === 'draft') submit(false)
      else if (act === 'publish') submit(true)
      else if (act === 'toggle-mobile') { form.mobile = !form.mobile; renderDialog() }
      else if (act === 'toggle-grouped') {
        form.grouped = !form.grouped
        if (form.grouped && form.groups.length === 0) addGroup()
        renderDialog()
      }
      else if (act === 'add-group') { addGroup(); renderDialog() }
      return
    }
    const delBtn = e.target.closest('[data-del-group]')
    if (delBtn) {
      form.groups.splice(Number(delBtn.dataset.delGroup), 1)
      renderDialog()
      return
    }
    const permBtn = e.target.closest('[data-perm]')
    if (permBtn) {
      const p = permBtn.dataset.perm
      const i = form.perms.indexOf(p)
      if (i >= 0) form.perms.splice(i, 1)
      else form.perms.push(p)
      renderDialog()
    }
  })

  $('#examDialogBody').addEventListener('input', (e) => {
    const t = e.target
    if (t.dataset.f) {
      const k = t.dataset.f
      form[k] = (k === 'students' || k === 'duration') ? Number(t.value) : t.value
      updateSubmitState()
    } else if (t.dataset.g) {
      const g = form.groups[Number(t.dataset.i)]
      if (g) g[t.dataset.g] = t.value
    }
  })
  $('#examDialogBody').addEventListener('change', (e) => {
    const t = e.target
    if (t.dataset.f === 'subject') form.subject = t.value
  })

  renderKpis()
  renderTable()
})()
</script>
</body>
</html>
