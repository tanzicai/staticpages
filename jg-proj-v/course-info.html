<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>课程信息 · 智慧教育一体化平台</title>
<link rel="stylesheet" href="assets/css/common.css">
<style>
[hidden] { display: none !important; }
.module-head { align-items: flex-start; }
.module-title-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.ci-head-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ci-head-actions .btn { height: 34px; }
.ci-empty { padding: 30px; text-align: center; color: var(--muted); font-size: 12px; }
.ci-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 330px;
  gap: 14px;
  align-items: start;
}
.ci-main { padding: 16px 18px 18px; }
.ci-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px 14px;
}
.ci-field { display: flex; flex-direction: column; gap: 5px; }
.ci-field.wide { grid-column: span 2; }
.ci-field > span { font-size: 10.5px; color: var(--muted); font-weight: 600; }
.ci-input {
  height: 34px;
  padding: 0 11px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
  font-size: 12px;
  color: var(--ink-2);
  outline: none;
  font-family: inherit;
}
.ci-input:focus, .ci-textarea:focus {
  border-color: rgba(109, 91, 246, 0.55);
  box-shadow: 0 0 0 2px rgba(109, 91, 246, 0.1);
}
.ci-textarea {
  padding: 9px 11px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
  font-size: 12px;
  line-height: 1.7;
  color: var(--ink-2);
  resize: vertical;
  outline: none;
  font-family: inherit;
}
.ci-section {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px dashed var(--line);
}
.ci-side { display: flex; flex-direction: column; gap: 12px; }
.ci-summary {
  position: relative;
  overflow: hidden;
  border-radius: 14px;
  padding: 18px;
  color: #fff;
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-height: 128px;
}
.ci-summary::after {
  content: '';
  position: absolute;
  right: -30px;
  bottom: -50px;
  width: 140px;
  height: 140px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.16);
}
.ci-summary-tag {
  align-self: flex-start;
  font-size: 10px;
  padding: 3px 8px;
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.18);
  margin-bottom: 6px;
}
.ci-summary strong { font-size: 18px; font-weight: 700; position: relative; z-index: 1; }
.ci-summary > span:last-child { font-size: 10.5px; color: rgba(255, 255, 255, 0.75); font-family: var(--num); }
.ci-info { padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.ci-info-row {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 10.5px;
  color: var(--muted);
  padding-bottom: 7px;
  border-bottom: 1px dashed var(--line);
}
.ci-info-row svg { flex: none; color: var(--violet); }
.ci-info-row strong { margin-left: auto; color: var(--ink-2); font-weight: 600; }
.ci-progress { padding-top: 2px; }
.ci-progress-head {
  display: flex;
  justify-content: space-between;
  font-size: 10.5px;
  color: var(--muted);
  margin-bottom: 5px;
}
.ci-progress-head strong { font-family: var(--num); color: var(--ink-2); }
.ci-progress-bar {
  height: 6px;
  border-radius: 3px;
  background: rgba(19, 33, 60, 0.07);
  overflow: hidden;
}
.ci-progress-bar i { display: block; height: 100%; background: linear-gradient(90deg, #2f6bff, #6d5bf6); }

@media (max-width: 1100px) {
  .ci-layout { grid-template-columns: 1fr; }
  .ci-grid { grid-template-columns: 1fr; }
  .ci-field.wide { grid-column: span 1; }
}
</style>
</head>
<body data-platform="course" data-module="course-build">
<main class="content">
  <div class="page ci-page">
    <div class="page-head module-head">
      <div>
        <div class="breadcrumb">
          <a href="portal.html">首页</a><span>/</span>
          <a href="platform.html?p=course">智慧课程</a><span>/</span>
          <a href="course-manage.html">课程管理</a><span>/</span>
          <span>课程信息</span>
        </div>
        <div class="module-title-row">
          <h1 class="page-title">课程信息</h1>
          <span class="tag blue" id="tagCode" hidden></span>
          <span class="tag violet" id="tagTerm" hidden></span>
        </div>
        <p class="page-desc">维护课程的基本信息、教学团队与教学目标；保存后可返回课程管理，继续进入该课程的维护平台。</p>
      </div>
      <div class="ci-head-actions">
        <a class="btn" href="course-manage.html" id="btnBack"></a>
        <a class="btn btn-dark" id="btnMaintain" hidden></a>
        <button class="btn btn-primary" id="btnSave" disabled></button>
      </div>
    </div>

    <div class="panel ci-empty" id="ciEmpty" hidden>未找到该课程，请返回课程管理重新选择。</div>

    <div class="ci-layout" id="ciLayout" hidden>
      <section class="panel ci-main">
        <div class="panel-head">
          <div>
            <div class="panel-title"><span class="panel-titlebar"></span>基本信息</div>
            <div class="panel-sub">课程属性、授课对象与教学安排</div>
          </div>
        </div>

        <div class="ci-grid">
          <label class="ci-field wide"><span>课程名称</span><input id="fName" class="ci-input"></label>
          <label class="ci-field"><span>课程代码</span><input id="fCode" class="ci-input"></label>
          <label class="ci-field"><span>课程类别</span><input id="fCategory" class="ci-input"></label>
          <label class="ci-field"><span>课程性质</span>
            <select id="fType" class="ci-input">
              <option value="必修">必修</option>
              <option value="选修">选修</option>
            </select>
          </label>
          <label class="ci-field"><span>开课学期</span><input id="fTerm" class="ci-input"></label>
          <label class="ci-field"><span>学分</span><input id="fCredits" type="number" min="0" step="0.5" class="ci-input"></label>
          <label class="ci-field"><span>学时</span><input id="fHours" type="number" min="0" class="ci-input"></label>
          <label class="ci-field"><span>授课教师</span><input id="fTeacher" class="ci-input"></label>
          <label class="ci-field"><span>教学团队</span><input id="fTeam" class="ci-input"></label>
          <label class="ci-field"><span>授课班级</span><input id="fClassName" class="ci-input"></label>
          <label class="ci-field"><span>学生人数</span><input id="fStudents" type="number" min="0" class="ci-input"></label>
        </div>

        <div class="ci-section">
          <div class="ci-field"><span>课程简介</span><textarea id="fDescription" class="ci-textarea" rows="3"></textarea></div>
          <div class="ci-field"><span>教学目标（每行一条）</span><textarea id="fObjectives" class="ci-textarea" rows="4"></textarea></div>
        </div>
      </section>

      <aside class="ci-side" id="ciSide"></aside>
    </div>
  </div>
</main>
<script src="assets/js/icons.js"></script>
<script src="assets/js/seed.js"></script>
<script src="assets/js/common.js"></script>
<script>
(function () {
  var course = SEED.courseList.find(function (c) { return c.id === UI.param('id') });
  var saved = false;

  var btnBack = document.getElementById('btnBack');
  btnBack.innerHTML = UI.icon('arrow-left', 14) + '返回课程管理';
  var btnSave = document.getElementById('btnSave');
  var btnMaintain = document.getElementById('btnMaintain');

  function renderSaveBtn() {
    btnSave.innerHTML = (saved ? UI.icon('circle-check', 14) : UI.icon('save', 14)) + (saved ? '已保存' : '保存修改');
  }
  renderSaveBtn();

  if (!course) {
    document.getElementById('ciEmpty').hidden = false;
    return;
  }

  document.getElementById('tagCode').hidden = false;
  document.getElementById('tagTerm').hidden = false;
  btnMaintain.hidden = false;
  btnMaintain.href = 'course-workbench.html?id=' + course.id;
  btnMaintain.innerHTML = UI.icon('book-open', 14) + '进入课程维护';
  btnSave.disabled = false;
  document.getElementById('ciLayout').hidden = false;

  var form = {
    name: course.name, code: course.code, category: course.category, type: course.type,
    term: course.term, credits: course.credits, hours: course.hours, teacher: course.teacher,
    team: course.team, className: course.className, students: course.students,
    description: course.description, objectivesText: course.objectives.join('\n'),
  };

  document.getElementById('fName').value = form.name;
  document.getElementById('fCode').value = form.code;
  document.getElementById('fCategory').value = form.category;
  document.getElementById('fType').value = form.type;
  document.getElementById('fTerm').value = form.term;
  document.getElementById('fCredits').value = form.credits;
  document.getElementById('fHours').value = form.hours;
  document.getElementById('fTeacher').value = form.teacher;
  document.getElementById('fTeam').value = form.team;
  document.getElementById('fClassName').value = form.className;
  document.getElementById('fStudents').value = form.students;
  document.getElementById('fDescription').value = form.description;
  document.getElementById('fObjectives').value = form.objectivesText;

  function renderSide() {
    document.getElementById('tagCode').textContent = course.code;
    document.getElementById('tagTerm').textContent = course.term;
    document.getElementById('ciSide').innerHTML =
      '<section class="ci-summary" style="background:' + course.cover + '">' +
        '<span class="ci-summary-tag">' + UI.esc(course.status) + '</span>' +
        '<strong>' + UI.esc(course.name) + '</strong>' +
        '<span>' + UI.esc(course.code) + ' · ' + UI.esc(course.type) + '</span>' +
      '</section>' +
      '<section class="panel ci-info">' +
        '<div class="panel-head"><div class="panel-title"><span class="panel-titlebar"></span>课程概况</div></div>' +
        '<div class="ci-info-row">' + UI.icon('calendar-days', 13) + '<span>学期</span><strong>' + UI.esc(course.term) + '</strong></div>' +
        '<div class="ci-info-row">' + UI.icon('graduation-cap', 13) + '<span>班级</span><strong>' + UI.esc(course.className) + '</strong></div>' +
        '<div class="ci-info-row">' + UI.icon('user-round', 13) + '<span>团队</span><strong>' + UI.esc(course.team) + '</strong></div>' +
        '<div class="ci-info-row">' + UI.icon('users', 13) + '<span>学生</span><strong>' + course.students + ' 人</strong></div>' +
        '<div class="ci-info-row">' + UI.icon('clock-3', 13) + '<span>学分学时</span><strong>' + course.credits + ' 学分 / ' + course.hours + ' 学时</strong></div>' +
        '<div class="ci-progress">' +
          '<div class="ci-progress-head"><span>教学进度</span><strong>' + course.progress + '%</strong></div>' +
          '<div class="ci-progress-bar"><i style="width:' + course.progress + '%"></i></div>' +
        '</div>' +
      '</section>';
  }
  renderSide();

  btnSave.addEventListener('click', function () {
    Object.assign(course, {
      name: document.getElementById('fName').value,
      code: document.getElementById('fCode').value,
      category: document.getElementById('fCategory').value,
      type: document.getElementById('fType').value,
      term: document.getElementById('fTerm').value,
      credits: Number(document.getElementById('fCredits').value) || 0,
      hours: Number(document.getElementById('fHours').value) || 0,
      teacher: document.getElementById('fTeacher').value,
      team: document.getElementById('fTeam').value,
      className: document.getElementById('fClassName').value,
      students: Number(document.getElementById('fStudents').value) || 0,
      description: document.getElementById('fDescription').value,
      objectives: document.getElementById('fObjectives').value.split('\n').map(function (s) { return s.trim() }).filter(Boolean),
    });
    renderSide();
    saved = true;
    renderSaveBtn();
    UI.toast('课程信息已保存');
    setTimeout(function () { saved = false; renderSaveBtn() }, 2200);
  });
})();
</script>
</body>
</html>
