<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教学管理 · 智慧教育一体化平台</title>
<link rel="stylesheet" href="assets/css/common.css">
<style>
.module-head { align-items: flex-start; }
.module-title-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.cp-stats {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
  margin-bottom: 14px;
}
.cp-stat {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 14px 16px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--surface);
}
.cp-stat-icon {
  width: 34px;
  height: 34px;
  border-radius: 9px;
  display: grid;
  place-items: center;
  color: #fff;
  background: linear-gradient(135deg, #2f6bff, #6d5bf6);
  flex: none;
}
.cp-stat-icon.green { background: linear-gradient(135deg, #0f9d8f, #1fb6c9); }
.cp-stat-icon.violet { background: linear-gradient(135deg, #6d5bf6, #9a8bff); }
.cp-stat > div { display: flex; flex-direction: column; gap: 1px; }
.cp-stat span { font-size: 10.5px; color: var(--muted); }
.cp-stat strong { font-size: 19px; font-family: var(--num); color: var(--ink); line-height: 1.2; }
.cp-stat em { font-style: normal; font-size: 10px; font-weight: 500; color: var(--muted); margin-left: 2px; }

.cp-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
  gap: 14px;
}
.cp-card {
  overflow: hidden;
  display: flex;
  flex-direction: column;
  padding: 0;
  transition: transform 0.18s, box-shadow 0.18s;
}
.cp-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow);
}
.cp-cover {
  position: relative;
  padding: 16px 18px 18px;
  color: #fff;
  min-height: 116px;
  display: flex;
  flex-direction: column;
}
.cp-cover::after {
  content: '';
  position: absolute;
  right: -28px;
  bottom: -46px;
  width: 140px;
  height: 140px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.14);
}
.cp-cover-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.cp-category {
  font-size: 10px;
  padding: 3px 8px;
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.18);
  backdrop-filter: blur(4px);
}
.cp-status {
  font-size: 10px;
  padding: 3px 8px;
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.9);
  color: var(--blue);
  font-weight: 650;
}
.cp-status.done { color: var(--green); }
.cp-status.pending { color: var(--amber); }
.cp-cover-title {
  margin-top: auto;
  font-size: 19px;
  font-weight: 700;
  letter-spacing: 0.01em;
  position: relative;
  z-index: 1;
}
.cp-cover-code { margin-top: 3px; font-size: 10.5px; color: rgba(255, 255, 255, 0.72); font-family: var(--num); }
.cp-card-body { padding: 14px 18px 16px; display: flex; flex-direction: column; gap: 12px; }
.cp-meta {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px 10px;
}
.cp-meta span {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 10.5px;
  color: var(--muted);
  min-width: 0;
}
.cp-meta svg { flex: none; color: var(--violet); }
.cp-progress-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 10.5px;
  color: var(--muted);
  margin-bottom: 5px;
}
.cp-progress-head strong { font-family: var(--num); color: var(--ink-2); font-size: 12px; }
.cp-progress-bar {
  height: 6px;
  border-radius: 3px;
  background: rgba(19, 33, 60, 0.07);
  overflow: hidden;
}
.cp-progress-bar i {
  display: block;
  height: 100%;
  border-radius: 3px;
  background: linear-gradient(90deg, #2f6bff, #6d5bf6);
}
.cp-actions {
  display: flex;
  gap: 8px;
  padding-top: 10px;
  border-top: 1px dashed var(--line);
}
.cp-actions .btn {
  flex: 1;
  height: 34px;
  justify-content: center;
}

@media (max-width: 1100px) {
  .cp-stats { grid-template-columns: 1fr; }
}
</style>
</head>
<body data-platform="course">
<main class="content">
  <div class="page cp-page">
    <div class="page-head module-head">
      <div>
        <div class="breadcrumb">
          <a href="portal.html">首页</a><span>/</span>
          <a href="platform.html?p=course">智慧课程</a><span>/</span>
          <span id="crumbTitle"></span>
        </div>
        <div class="module-title-row">
          <h1 class="page-title" id="cpTitle"></h1>
          <span id="cpTags"></span>
        </div>
        <p class="page-desc" id="cpDesc"></p>
      </div>
    </div>

    <div class="cp-stats" id="cpStats"></div>
    <div class="cp-grid" id="cpGrid"></div>
  </div>
</main>
<script src="assets/js/icons.js"></script>
<script src="assets/js/seed.js"></script>
<script>
// 在 common.js 渲染外壳前，按 fn 参数设置模块高亮
(function () {
  var fn = new URLSearchParams(location.search).get('fn');
  document.body.dataset.module = fn === 'learning' ? 'learning' : 'teaching';
})();
</script>
<script src="assets/js/common.js"></script>
<script>
(function () {
  var fn = UI.param('fn');
  var isLearning = fn === 'learning';

  var meta = isLearning
    ? {
        title: '学习过程监控与管理',
        tags: ['学习动态监测', '12 个维度学情', '教学预警'],
        desc: '请先选择课程进入课程管理信息页，可进入课程建设、教学管理与学习过程监控与管理三个功能。',
        action: '进入课程',
        url: function (id) { return 'course-workbench.html?id=' + id },
      }
    : {
        title: '教学管理',
        tags: ['辅助教学活动 · 权重设置', '备课教案 · 课前/课中/课后', '章节学习控制'],
        desc: '请先选择课程进入课程管理信息页，可进入课程建设、教学管理与学习过程监控与管理三个功能。',
        action: '进入课程',
        url: function (id) { return 'course-workbench.html?id=' + id },
      };

  document.title = meta.title + ' · 智慧教育一体化平台';
  document.getElementById('crumbTitle').textContent = meta.title;
  document.getElementById('cpTitle').textContent = meta.title;
  document.getElementById('cpDesc').textContent = meta.desc;
  document.getElementById('cpTags').innerHTML = meta.tags.map(function (t) {
    return '<span class="tag blue">' + t + '</span>';
  }).join('');

  var list = SEED.courseList;
  var totalStudents = list.reduce(function (s, c) { return s + c.students }, 0);
  var activeCount = list.filter(function (c) { return c.status === '进行中' }).length;

  document.getElementById('cpStats').innerHTML =
    '<div class="cp-stat"><span class="cp-stat-icon">' + UI.icon('book-open', 16) + '</span>' +
    '<div><span>授课课程</span><strong>' + list.length + ' <em>门</em></strong></div></div>' +
    '<div class="cp-stat"><span class="cp-stat-icon green">' + UI.icon('layers', 16) + '</span>' +
    '<div><span>进行中</span><strong>' + activeCount + ' <em>门</em></strong></div></div>' +
    '<div class="cp-stat"><span class="cp-stat-icon violet">' + UI.icon('users', 16) + '</span>' +
    '<div><span>覆盖学生</span><strong>' + totalStudents + ' <em>人</em></strong></div></div>';

  document.getElementById('cpGrid').innerHTML = list.map(function (c) {
    var statusCls = c.status === '已结课' ? ' done' : (c.status === '待发布' ? ' pending' : '');
    return '<article class="panel cp-card">' +
      '<div class="cp-cover" style="background:' + c.cover + '">' +
        '<div class="cp-cover-top">' +
          '<span class="cp-category">' + UI.esc(c.category) + '</span>' +
          '<span class="cp-status' + statusCls + '">' + UI.esc(c.status) + '</span>' +
        '</div>' +
        '<div class="cp-cover-title">' + UI.esc(c.name) + '</div>' +
        '<div class="cp-cover-code">' + UI.esc(c.code) + ' · ' + UI.esc(c.type) + '</div>' +
      '</div>' +
      '<div class="cp-card-body">' +
        '<div class="cp-meta">' +
          '<span>' + UI.icon('calendar-days', 12) + UI.esc(c.term) + '</span>' +
          '<span>' + UI.icon('graduation-cap', 12) + UI.esc(c.className) + '</span>' +
          '<span>' + UI.icon('users', 12) + c.students + ' 名学生</span>' +
          '<span>' + UI.icon('clock-3', 12) + c.credits + ' 学分 · ' + c.hours + ' 学时</span>' +
        '</div>' +
        '<div class="cp-progress">' +
          '<div class="cp-progress-head"><span>教学进度</span><strong>' + c.progress + '%</strong></div>' +
          '<div class="cp-progress-bar"><i style="width:' + c.progress + '%"></i></div>' +
        '</div>' +
        '<div class="cp-actions">' +
          '<a class="btn btn-primary" href="' + meta.url(c.id) + '">' + UI.icon('settings-2', 14) + meta.action + '</a>' +
        '</div>' +
      '</div>' +
    '</article>';
  }).join('');
})();
</script>
</body>
</html>
