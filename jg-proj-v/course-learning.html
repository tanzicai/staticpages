<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学情分析 · 智慧教育一体化平台</title>
<link rel="stylesheet" href="assets/css/common.css">
<style>
/* ===== CourseFunction.vue（fn=learning 外壳，选择器加 .cf-page 前缀） ===== */
.cf-page .cf-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.cf-page .cf-avatar {
  width: 34px;
  height: 34px;
  border-radius: 9px;
  display: grid;
  place-items: center;
  color: #fff;
  font-size: 14px;
  font-weight: 700;
  flex: none;
}
.cf-page .cf-info { display: flex; flex-direction: column; gap: 1px; flex: 1; min-width: 180px; }
.cf-page .cf-info strong { font-size: 12.5px; color: var(--ink-2); font-weight: 650; }
.cf-page .cf-info span { font-size: 10px; color: var(--muted); }
.cf-page .cf-back { flex: none; height: 30px; }
.cf-page .breadcrumb { display: none; }

/* ===== LearningAnalytics.vue scoped（选择器加 .la-page 前缀） ===== */
.la-page .la-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 12px; }
.la-page .la-kpi {
  padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px;
  background: linear-gradient(150deg, rgba(255,255,255,0.92), rgba(255,255,255,0.7));
  box-shadow: var(--shadow-sm);
}
.la-page .la-kpi-label { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--muted); }
.la-page .la-kpi-label svg { color: var(--violet); }
.la-page .la-kpi-value { font-family: var(--num); font-size: 24px; font-weight: 720; color: var(--ink-2); margin-top: 4px; }
.la-page .la-kpi-value small { font-size: 11px; color: var(--muted); margin-left: 3px; font-weight: 500; }
.la-page .la-kpi-trend { font-size: 10px; color: var(--green); margin-top: 3px; }
.la-page .la-kpi-trend.danger { color: var(--amber); }

.la-page .la-tabs {
  display: flex; gap: 6px; flex-wrap: wrap; padding: 8px; margin-bottom: 12px;
  border: 1px solid var(--line); border-radius: 12px; background: var(--surface);
}
.la-page .la-tabs button {
  display: inline-flex; align-items: center; gap: 5px;
  height: 30px; padding: 0 12px; border-radius: 7px;
  border: 1px solid transparent; background: transparent;
  font-size: 10.5px; color: var(--muted); cursor: pointer; transition: 0.15s;
}
.la-page .la-tabs button:hover { color: var(--ink-2); background: rgba(47,107,255,0.04); }
.la-page .la-tabs button.active { background: var(--violet); color: #fff; }

.la-page .la-body { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 12px; margin-bottom: 12px; }
.la-page .la-body.solo { grid-template-columns: 1fr; }
.la-page .la-detail-panel .panel-body { display: flex; flex-direction: column; gap: 10px; }

.la-page .dim-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.la-page .dim-stat { padding: 9px 10px; border-radius: 9px; background: rgba(47, 107, 255, 0.05); }
.la-page .dim-stat span { display: block; font-size: 9.5px; color: var(--muted); }
.la-page .dim-stat strong { display: block; margin-top: 3px; font-size: 14px; font-family: var(--num); color: var(--ink-2); font-weight: 680; }

.la-page .dim-table-head {
  display: flex; justify-content: space-between;
  padding: 0 4px; font-size: 9.5px; color: var(--muted-2); letter-spacing: 0.4px;
}
.la-page .dim-rows { display: flex; flex-direction: column; gap: 6px; max-height: 330px; overflow-y: auto; }
.la-page .dim-row {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 10px; border: 1px solid var(--line); border-radius: 9px; background: #fff;
}
.la-page .dim-main { flex: 1; min-width: 0; }
.la-page .dim-main strong { display: block; font-size: 11.5px; font-weight: 630; color: var(--ink-2); }
.la-page .dim-main span { display: block; margin-top: 2px; font-size: 9.5px; color: var(--muted); }
.la-page .dim-bar { flex: none; display: flex; align-items: center; gap: 6px; width: 110px; }
.la-page .dim-bar-track { flex: 1; height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
.la-page .dim-bar-track i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, #2f6bff, #0f9d8f); }
.la-page .dim-bar-track i.warn { background: linear-gradient(90deg, #e7a13a, #e0762f); }
.la-page .dim-bar-track i.danger { background: linear-gradient(90deg, #e0762f, #d64550); }
.la-page .dim-bar b { font-family: var(--num); font-size: 9.5px; color: var(--muted); width: 30px; text-align: right; }
.la-page .dim-value { flex: none; font-family: var(--num); font-size: 10.5px; color: var(--ink-2); min-width: 76px; text-align: right; }
.la-page .dim-note {
  display: flex; align-items: flex-start; gap: 5px; margin: 0;
  padding: 8px 10px; border-radius: 8px;
  background: rgba(109, 91, 246, 0.05); font-size: 9.5px; color: var(--muted); line-height: 1.6;
}
.la-page .dim-note svg { color: var(--violet); flex: none; margin-top: 2px; }

.la-page .la-table-wrap { overflow-x: auto; }
.la-page .la-table { font-size: 11px; }
.la-page .la-table th { white-space: nowrap; font-size: 10px; }
.la-page .la-table td.num { font-family: var(--num); text-align: center; }
.la-page .la-table td.good { color: var(--green); font-weight: 620; }
.la-page .la-table td.danger { color: var(--red); font-weight: 620; }
.la-page .la-table td.strong { font-weight: 620; color: var(--ink-2); }
.la-page .mini-progress { position: relative; width: 72px; height: 5px; border-radius: 3px; background: var(--line); display: inline-block; }
.la-page .mini-progress i {
  position: absolute; left: 0; top: 0; bottom: 0;
  border-radius: 3px; background: linear-gradient(90deg, #2f6bff, #0f9d8f);
}
.la-page .mini-progress i.danger { background: linear-gradient(90deg, #e0762f, #d64550); }
.la-page .mini-progress span { font-family: var(--num); font-size: 9px; margin-left: 6px; color: var(--muted); }

@media (max-width: 1024px) {
  .la-page .la-kpis { grid-template-columns: repeat(2, 1fr); }
  .la-page .la-body { grid-template-columns: 1fr; }
  .la-page .dim-stats { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body data-platform="course" data-module="learning">
<main class="content"><div class="page cf-page">
  <!-- 顶部课程条（CourseFunction fn=learning） -->
  <div class="panel cf-bar" id="cfBar"></div>

  <div class="page la-page">
    <div class="page-head module-head">
      <div>
        <div class="breadcrumb">
          <a href="portal.html">首页</a><span>/</span>
          <a href="platform.html?p=course">智慧课程</a><span>/</span>
          <span>学情分析</span>
        </div>
        <div class="module-title-row">
          <h1 class="page-title">学情分析</h1>
          <span class="tag blue">12 个维度学情监测</span>
          <span class="tag green">支持导出学生详细学习情况</span>
        </div>
        <p class="page-desc">学习动态监测、章节学习次数、章节任务点、签到、课程积分、作业、章节测验、考试、讨论、教学预警、互动测验、分组任务——全维度学情一屏掌握，可导出学生详细数据。</p>
      </div>
      <div class="page-actions">
        <span class="tag green" id="exportTip" style="display:none">已导出 CSV 文件</span>
        <button class="btn btn-primary" id="btnExport"></button>
      </div>
    </div>

    <!-- KPIs -->
    <div class="la-kpis" id="laKpis"></div>

    <div class="la-tabs" id="laTabs"></div>

    <div class="la-body" id="laBody">
      <section class="panel la-chart-panel" id="laChartPanel">
        <div class="panel-head">
          <div class="panel-title"><span class="panel-titlebar"></span><span id="laChartTitle"></span></div>
        </div>
        <div class="panel-body">
          <div id="laChart"></div>
        </div>
      </section>

      <section class="panel la-detail-panel">
        <div class="panel-head">
          <div class="panel-title"><span class="panel-titlebar"></span><span id="dimTitle"></span></div>
          <span class="muted tiny" id="dimDesc"></span>
        </div>
        <div class="panel-body">
          <div class="dim-stats" id="dimStats"></div>
          <div class="dim-table-head">
            <span id="dimCol0"></span>
            <span id="dimCol1"></span>
          </div>
          <div class="dim-rows" id="dimRows"></div>
          <p class="dim-note" id="dimNote"></p>
        </div>
      </section>
    </div>

    <!-- 学生明细表 -->
    <section class="panel la-student-panel">
      <div class="panel-head">
        <div class="panel-title"><span class="panel-titlebar"></span>学生详细学习情况</div>
        <span class="muted tiny" id="stuCount"></span>
      </div>
      <div class="panel-body la-table-wrap">
        <table class="table la-table">
          <thead>
            <tr>
              <th>学生</th><th>分组</th><th>学习时长(h)</th><th>学习天数</th><th>章节次数</th>
              <th>任务点</th><th>签到</th><th>积分</th><th>作业</th><th>测验</th>
              <th>考试</th><th>讨论</th><th>互动测验</th><th>预警</th>
            </tr>
          </thead>
          <tbody id="stuTbody"></tbody>
        </table>
      </div>
    </section>
  </div>
</div></main>
<script src="assets/js/icons.js"></script>
<script src="assets/js/seed.js"></script>
<script src="assets/js/common.js"></script>

<script>

  const statusClass = (s) => (s === 'good' ? 'green' : s === 'warn' ? 'amber' : s === 'danger' ? 'red' : 'gray')

  /* ===== 图表配置（LearningAnalytics.vue） ===== */

  /* ===== 学生详细学习情况 ===== */

  /* ================= 渲染 ================= */
  function renderKpis() {
    $('#laKpis').innerHTML = kpis
      .map(
        (k) => `
      <div class="la-kpi">
        <div class="la-kpi-label"><span>${k.label}</span>${icon(k.icon, 13)}</div>
        <div class="la-kpi-value">${k.value}<small>${k.unit}</small></div>
        <div class="la-kpi-trend${k.label === '教学预警' ? ' danger' : ''}">${k.trend}</div>
      </div>`,
      )
      .join('')
  }

  function renderTabs() {
    $('#laTabs').innerHTML = tabs
      .map((t) => `<button class="${activeTab === t.key ? 'active' : ''}" data-tab="${t.key}">${icon(t.icon, 13)}${t.label}</button>`)
      .join('')
  }

  let chartInst = null
  function renderChart() {
    const show = showChart()
    $('#laChartPanel').style.display = show ? '' : 'none'
    $('#laBody').classList.toggle('solo', !show)
    if (!show) return
    const option = activeTab === 'chapter' ? chapterChart : dynamicChart
    $('#laChartTitle').textContent = activeTab === 'chapter' ? '各章节学习次数与完成率' : '本周学习活动趋势'
    if (chartInst) {
      chartInst.setOption(option, true)
      chartInst.resize()
    } else {
      chartInst = UI.chart($('#laChart'), option, '230px')
    }
  }

  function renderDetail() {
    const cfg = dimConfigs[activeTab]
    $('#dimTitle').textContent = cfg.title
    $('#dimDesc').textContent = cfg.desc
    $('#dimStats').innerHTML = cfg.stats
      .map((s) => `<div class="dim-stat"><span>${s.label}</span><strong>${s.value}</strong></div>`)
      .join('')
    $('#dimCol0').textContent = cfg.columns[0]
    $('#dimCol1').textContent = cfg.columns[1]
    $('#dimRows').innerHTML = cfg.rows
      .map(
        (r) => `
      <div class="dim-row">
        <div class="dim-main">
          <strong>${esc(r.name)}</strong>
          ${r.sub ? `<span>${esc(r.sub)}</span>` : ''}
        </div>
        ${
          r.pct !== undefined
            ? `<div class="dim-bar"><div class="dim-bar-track"><i style="width:${r.pct}%" class="${r.status || ''}"></i></div><b>${r.pct}%</b></div>`
            : ''
        }
        <span class="dim-value">${esc(r.value || '')}</span>
        ${r.tag ? `<span class="tag ${statusClass(r.status)}">${r.tag}</span>` : ''}
      </div>`,
      )
      .join('')
    $('#dimNote').innerHTML = cfg.note ? `${icon('bell', 12)}${esc(cfg.note)}` : ''
    $('#dimNote').style.display = cfg.note ? '' : 'none'
  }

  function renderStudents() {
    $('#stuCount').textContent = `共 ${studentRows.length} 条示例 · 完整班级 36 人 · 支持导出`
    $('#stuTbody').innerHTML = studentRows
      .map((s) => {
        const taskPct = (s.done / s.tasks) * 100
        const hwCls = s.homework >= 80 ? ' good' : s.homework < 60 ? ' danger' : ''
        const qzCls = s.quiz >= 80 ? ' good' : s.quiz < 60 ? ' danger' : ''
        const exCls = s.exam >= 80 ? ' good' : s.exam > 0 && s.exam < 60 ? ' danger' : ''
        const inCls = s.interaction >= 80 ? ' good' : s.interaction < 60 ? ' danger' : ''
        return `
      <tr>
        <td class="strong">${s.name}</td>
        <td><span class="tag gray">${s.group}</span></td>
        <td class="num">${s.time.toFixed(1)}</td>
        <td class="num">${s.days}</td>
        <td class="num">${s.chapters}</td>
        <td><div class="mini-progress"><i style="width:${taskPct}%${s.done / s.tasks < 0.5 ? '" class="danger' : ''}"></i><span>${s.done}/${s.tasks}</span></div></td>
        <td class="num">${s.checkin}</td>
        <td class="num">${s.point}</td>
        <td class="num${hwCls}">${s.homework}</td>
        <td class="num${qzCls}">${s.quiz}</td>
        <td class="num${exCls}">${s.exam || '—'}</td>
        <td class="num">${s.discuss}</td>
        <td class="num${inCls}">${s.interaction}%</td>
        <td${s.alert > 0 ? ' class="danger"' : ''}>${s.alert ? s.alert + ' 条' : '—'}</td>
      </tr>`
      })
      .join('')
  }

  /* ===== 导出 CSV（LearningAnalytics.vue exportCSV） ===== */
  function exportCSV() {
    const header = [
      '学生', '分组', '学习时长(h)', '学习天数', '章节学习次数', '任务点完成', '任务点总数',
      '签到次数', '课程积分', '作业均分', '章节测验', '考试', '讨论发帖', '互动测验正确率(%)', '教学预警(条)',
    ]
    const lines = studentRows.map((s) => [
      s.name, s.group, s.time.toFixed(1), s.days, s.chapters, s.done, s.tasks,
      s.checkin, s.point, s.homework, s.quiz, s.exam, s.discuss, s.interaction, s.alert,
    ])
    const csv = '﻿' + [header, ...lines]
      .map((row) => row.map((cell) => `"${String(cell).replace(/"/g, '""')}"`).join(','))
      .join('\r\n')
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' })
    const url = URL.createObjectURL(blob)
    const a = document.createElement('a')
    a.href = url
    a.download = `学情分析_学生详细学习情况_${new Date().toISOString().slice(0, 10)}.csv`
    document.body.appendChild(a)
    a.click()
    document.body.removeChild(a)
    URL.revokeObjectURL(url)
    $('#exportTip').style.display = ''
    setTimeout(() => {
      $('#exportTip').style.display = 'none'
    }, 2000)
  }

  /* ================= 事件 ================= */
  $('#laTabs').addEventListener('click', (e) => {
    const b = e.target.closest('[data-tab]')
    if (!b) return
    activeTab = b.dataset.tab
    renderTabs()
    renderChart()
    renderDetail()
  })
  $('#btnExport').addEventListener('click', exportCSV)

  /* ================= 初始化 ================= */
  $('#btnExport').innerHTML = `${icon('download', 15)}导出学生详细学习情况`
  renderKpis()
  renderTabs()
  renderChart()
  renderDetail()
  renderStudents()
})()
