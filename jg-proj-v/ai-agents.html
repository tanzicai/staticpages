<head>

<title>智能体生成平台 · 智慧教育一体化平台</title>
<link rel="stylesheet" href="assets/css/common.css">
<style>

.as-page .as-modal-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }

.as-page .as-layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 12px; margin-bottom: 12px; }

}

.as-page .mini-panel { margin-bottom: 10px; }
.as-page .mini-panel .panel-body { padding: 10px; }
.as-page .agent-item {

}

.as-page .agent-item:hover { border-color: rgba(109,91,246,0.3); }

.as-page .core-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }

}
.as-page .core-tabs button:hover { color: var(--ink-2); }
.as-page .core-tabs button.active { background: var(--violet); border-color: transparent; color: #fff; }

/* multi agent */

}

.as-page .flow-agents i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.as-page .flow-note { margin: 0; font-size: 9px; color: var(--muted); line-height: 1.6; }

.as-page .entry-summary { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
.as-page .entry-desc { margin: 0 0 8px; font-size: 10px; color: var(--muted); }

.as-page .route-head { display: flex; align-items: center; gap: 7px; margin-bottom: 8px; }

}

.as-page .channels-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.as-page .channel-card {

.as-page .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }

  padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; text-align: center;

.as-page .stats-grid span { display: block; font-size: 10px; color: var(--muted); }

.as-page .logs-list { display: flex; flex-direction: column; gap: 4px; }

}

.as-page .log-item .user { color: var(--violet); font-weight: 600; }
.as-page .log-item .action { color: var(--amber); }

/* QA */
.as-page .qa-layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 12px; }
.as-page .qa-panel { margin-top: 12px; }
.as-page .qa-list { display: flex; flex-direction: column; gap: 5px; }
.as-page .qa-item {

.as-page .bar-spacer { flex: 1; }
.as-page .icon-btn {
  width: 22px; height: 22px; border-radius: 5px; border: 1px solid var(--line);

}

.as-page .acp-mask {

<body data-platform="ai" data-module="agents">
<main class="content"><div class="page as-page">
  <div class="page-head module-head">
    <div>
      <div class="breadcrumb">
        <a href="portal.html">首页</a><span>/</span>
        <a href="platform.html?p=ai">AI 能力中心</a><span>/</span>
        <span>AI 智能体生成平台</span>
      </div>
      <div class="module-title-row">
        <h1 class="page-title">智能体生成平台</h1>
        <span class="tag violet">单 Agent / 多 Agents 模式</span>
        <span class="tag blue">基础调试/资源/大模型/设置/渠道/统计/导出/日志</span>
        <span class="tag green">问答对 · 富文本 · 附件</span>
      </div>
      <p class="page-desc">建设智能体时可选单 Agent 或多 Agents 模式；智能体包含基础调试、资源管理、大模型、基础设置、接入渠道、数据统计、导出中心、操作日志等核心功能；添加问答对支持录入问题、答案（富文本）及附件。</p>
    </div>
  </div>

  <div class="as-layout">
    <!-- Left: agents + mode -->
    <aside class="as-left">
      <div class="mode-switch" id="modeSwitch"></div>
      <section id="agentPanel"></section>
      <section class="panel mini-panel">
        <div class="panel-head"><div class="panel-title"><span class="panel-titlebar"></span>核心功能</div></div>
        <div class="panel-body core-tabs" id="coreTabs"></div>
      </section>
    </aside>

    <!-- Right: main area -->
    <section class="as-main" id="asMain"></section>
  </div>

  <!-- 新建 / 编辑智能体 -->
  <div class="as-modal-mask" id="editorModal" style="display:none">
    <div class="as-modal panel">
      <div class="as-modal-head">
        <strong id="editorTitle">新建智能体</strong>
        <button data-editor-close></button>
      </div>
      <label class="as-field">
        <span>名称</span>
        <input id="formName" placeholder="如：课程智能备课" maxlength="20" />
      </label>

        <div class="core-title-bar">${icon('file', 15)}导出中心</div>
        <div class="table-list">
          <div class="resource-row">${icon('file', 14)}<strong>智能体配置 JSON</strong><span class="tag blue">JSON</span><button class="btn btn-sm" data-export="config">导出</button></div>
          <div class="resource-row">${icon('database', 14)}<strong>问答对数据</strong><span class="tag green">CSV</span><button class="btn btn-sm" data-export="qa">导出</button></div>
          <div class="resource-row">${icon('list-checks', 14)}<strong>操作日志</strong><span class="tag violet">CSV</span><button class="btn btn-sm" data-export="logs">导出</button></div>
        </div>`
    } else if (t === 'log') {
      const kw = acp.logFilter.trim()
      const list = acp.logs.filter((l) => !kw || `${l.user}${l.action}${l.target}`.includes(kw))
      core = `
        <div class="core-title-bar">
          ${icon('list-checks', 15)}操作日志
          <span class="bar-spacer"></span>
          <input class="log-search" id="logSearch" placeholder="搜索操作人 / 操作 / 对象" value="${esc(acp.logFilter)}" />
        </div>
        <div class="logs-list">
          ${list.map((l) => `
            <div class="log-item">
              <span class="time">${l.time}</span>
              <span class="user">${l.user}</span>
              <span class="action">${esc(l.action)}</span>
              <span class="target">${esc(l.target)}</span>
            </div>`).join('')}
          ${list.length ? '' : '<div class="log-empty">未匹配到日志</div>'}
        </div>`
    }
    $('#asMain').innerHTML = `<div id="acpRoot">${core}</div>
      <section class="panel qa-panel">
        <div class="panel-head">
          <div class="panel-title"><span class="panel-titlebar"></span>问答对管理 · 录入问题 / 答案（富文本） / 附件</div>
          <button class="btn btn-sm primary" id="newQaBtn">${icon('plus', 12)}新增问答对</button>
        </div>
        <div class="panel-body qa-layout">
          <div class="qa-list" id="qaList"></div>
          <div class="qa-editor">
            <div class="qa-editor-label">问题</div>
            <input class="qa-input" id="qaQuestion" />
            <div class="qa-editor-label">答案（富文本编辑器）</div>
            <div class="rich-toolbar" id="richToolbar"></div>
            <div class="rich-editor" id="qaAnswer" contenteditable="true"></div>
            <div class="qa-att-row">
              <span class="qa-editor-label">附件</span>
              <div id="qaAttachment"></div>
            </div>
          </div>
        </div>
      </section>`
    afterAcpRender()
  }

  function afterAcpRender() {
    const ls = $('#logSearch')
    if (ls) {
      ls.addEventListener('input', () => {
        acp.logFilter = ls.value
        const pos = ls.selectionStart
        renderAcp()
        const again = $('#logSearch')
        again.focus()
        again.setSelectionRange(pos, pos)
      })
    }
    $('#richToolbar').innerHTML =
      richCommands.map((c) => `<button class="rich-btn" title="${c.label}" type="button">${c.icon}</button>`).join('') +
      `<div class="rich-divider"></div><button class="rich-btn" type="button">${icon('check', 13)}预览</button>`
    renderQaList()
    renderQaEditor()
  }

  function renderQaList() {
    const el = $('#qaList')
    if (!el) return
    el.innerHTML = acp.qaPairs.map((q) => `
      <div class="qa-item ${currentQA() && currentQA().id === q.id ? 'active' : ''}" data-qa="${q.id}">
        <strong>${esc(q.question)}</strong>
        <span class="muted">${q.answer.slice(0, 30)}…</span>
      </div>`).join('')
  }
  function renderQaEditor() {
    const qa = currentQA()
    if (!qa || !$('#qaQuestion')) return
    $('#qaQuestion').value = qa.question
    $('#qaAnswer').innerHTML = qa.answer
    $('#qaAttachment').innerHTML = qa.attachment
      ? `<div class="qa-att">📎 ${esc(qa.attachment)}</div>`
      : `<div class="qa-att upload">📎 上传附件 · 支持 PDF / 图片 / 文档</div>`
  }

  /* ===== 统一入口调试 ===== */
  function runUnified() {
    const q = state.unifiedQuery.trim()
    if (!q) return
    const picked =
      agents.find((a) => a.enabled && a.id === 'a2' && /学情|预警|成绩|学习/.test(q)) ||
      agents.find((a) => a.enabled && a.id === 'a3' && /题|测验|练习|考试/.test(q)) ||
      enabledAgents().find((a) => a.id !== 'a1' && /出题|题目|练习/.test(q)) ||
      enabledAgents()[0]
    state.unifiedResult = {
      agent: picked.name,
      color: picked.color,
      confidence: 0.93,
      steps: [
        '统一入口接收提问，完成身份识别与会话上下文加载',
        `意图识别：${/学情|预警|成绩|学习/.test(q) ? '学情分析' : /题|测验|练习/.test(q) ? '题目生成' : '课程建设'}（置信度 0.93）`,
        `${state.unified.strategy === 'intent' ? '按意图路由' : state.unified.strategy === 'pipeline' ? '按顺序编排' : '并行分发'}至「${picked.name}」`,
        '汇总子智能体结果，由统一入口输出',
      ],
      answer: `已由「${picked.name}」完成处理：基于近 7 天学习数据定位 2 个薄弱知识点，并生成 6 道针对性练习（5 选择 + 1 判断），可直接加入章节测验。`,
    }
  }

  /* ===== 新建 / 编辑智能体 ===== */
  const editorModal = $('#editorModal')
  function openEditor(id) {
    if (id) {
      const a = agents.find((x) => x.id === id)
      if (!a) return
      state.editingId = id
      state.form = { name: a.name, desc: a.desc, color: a.color }
    } else {
      state.editingId = null
      state.form = { name: '', desc: '', color: palette[agents.length % palette.length] }
    }
    $('#editorTitle').textContent = state.editingId ? '编辑智能体' : '新建智能体'
    $('#saveAgentBtn').textContent = state.editingId ? '保存' : '创建'
    $('#formName').value = state.form.name
    $('#formDesc').value = state.form.desc
    renderColors()
    editorModal.style.display = 'grid'
  }
  function closeEditor() { editorModal.style.display = 'none' }
  function renderColors() {
    $('#formColors').innerHTML = palette.map((c) =>
      `<button class="as-color ${state.form.color === c ? 'on' : ''}" style="background:${c}" data-color="${c}"></button>`).join('')
  }
  $('#formColors').addEventListener('click', (e) => {
    const b = e.target.closest('[data-color]')
    if (!b) return
    state.form.color = b.dataset.color
    renderColors()
  })
  editorModal.addEventListener('click', (e) => {
    if (e.target === editorModal || e.target.closest('[data-editor-close]')) closeEditor()
  })
  $('[data-editor-close]', editorModal).innerHTML = icon('x', 14)
  $('#formName').addEventListener('input', (e) => { state.form.name = e.target.value })
  $('#formDesc').addEventListener('input', (e) => { state.form.desc = e.target.value })
  $('#saveAgentBtn').addEventListener('click', () => {
    if (!state.form.name.trim()) {
      toast('请填写智能体名称')
      return
    }
    if (state.editingId) {
      const a = agents.find((x) => x.id === state.editingId)
      if (a) Object.assign(a, { name: state.form.name.trim(), desc: state.form.desc.trim(), color: state.form.color })
      toast(`「${state.form.name.trim()}」已更新`)
    } else {
      const id = `a${Date.now()}`
      agents.push({
        id,
        name: state.form.name.trim(),
        desc: state.form.desc.trim() || '暂无描述',
        color: state.form.color,
        enabled: true,
        primary: false,
      })
      state.selectedAgentId = id
      toast(`「${state.form.name.trim()}」已创建，点击「平台设置」进入维护`)
    }
    closeEditor()
    renderAgentPanel()
    renderMain()
  })

  function maintainAgent(id) {
    location.href = `ai-agent-maintain.html?id=${encodeURIComponent(id)}`
  }

  /* ===== 左栏事件 ===== */
  $('#modeSwitch').addEventListener('click', (e) => {
    const b = e.target.closest('[data-mode]')
    if (!b) return
    state.agentMode = b.dataset.mode
    resetAcp()
    renderModeSwitch()
    renderAgentPanel()
    renderMain()
  })
  $('#agentPanel').addEventListener('click', (e) => {
    const t = e.target
    const edit = t.closest('[data-edit-agent]')
    if (edit) { e.stopPropagation(); openEditor(edit.dataset.editAgent); return }
    const maintain = t.closest('[data-maintain-agent]')
    if (maintain) { e.stopPropagation(); maintainAgent(maintain.dataset.maintainAgent); return }
    const create = t.closest('[data-new-agent]')
    if (create) { openEditor(null); return }
    const sel = t.closest('[data-select-agent]')
    if (sel) {
      state.selectedAgentId = sel.dataset.selectAgent
      renderAgentPanel()
      renderMain()
      return
    }
    const strat = t.closest('[data-strategy]')
    if (strat) {
      state.unified.strategy = strat.dataset.strategy
      renderAgentPanel()
      renderMain()
      return
    }
    const tm = t.closest('[data-toggle-member]')
    if (tm) {
      const a = agents.find((x) => x.id === tm.dataset.toggleMember)
      if (!a) return
      if (a.enabled && enabledAgents().length <= 1) return
      a.enabled = !a.enabled
      if (!a.enabled && a.primary) {
        const next = enabledAgents()[0]
        if (next) next.primary = true
      }
      renderAgentPanel()
      renderMain()
      return
    }
    const sp = t.closest('[data-set-primary]')
    if (sp) {
      const target = agents.find((a) => a.id === sp.dataset.setPrimary)
      if (!target || !target.enabled) return
      agents.forEach((a) => (a.primary = a.id === target.id))
      renderAgentPanel()
      renderMain()
      return
    }
    const mv = t.closest('[data-move-agent]')
    if (mv) {
      const [i, dir] = mv.dataset.moveAgent.split('|').map(Number)
      const targetIdx = i + dir
      if (targetIdx < 0 || targetIdx >= agents.length) return
      ;[agents[i], agents[targetIdx]] = [agents[targetIdx], agents[i]]
      renderAgentPanel()
      renderMain()
    }
  })
  $('#coreTabs').addEventListener('click', (e) => {
    const b = e.target.closest('[data-core-tab]')
    if (!b) return
    state.coreTab = b.dataset.coreTab
    renderCoreTabs()
    renderMain()
  })

  /* ===== 主区事件 ===== */
  $('#asMain').addEventListener('click', (e) => {
    const t = e.target
    const act = t.closest('[data-act]')
    if (act && act.dataset.act === 'run-unified') {
      state.unifiedQuery = $('#unifiedQueryInput').value
      runUnified()
      renderMain()
      return
    }
    if (act && act.dataset.act === 'run-debug') {
      const q = ($('#debugQuery').value || '').trim()
      acp.debugQuery = $('#debugQuery').value
      if (!q) return
      acp.debugRuns.unshift({
        time: nowTime(), query: q, result: '成功',
        tokens: 600 + Math.round(Math.random() * 900),
        latency: `${(0.6 + Math.random() * 1.2).toFixed(1)}s`,
      })
      addLog('执行基础调试', q)
      toast('调试执行完成，结果已写入记录')
      renderAcp()
      return
    }
    if (act && act.dataset.act === 'open-res') { openResDialog(); return }

    const rm = t.closest('[data-remove-res]')
    if (rm) {
      const name = rm.dataset.removeRes
      acp.resources = acp.resources.filter((r) => r.name !== name)
      addLog('移除智能体资源', name)
      toast('资源已移除')
      renderAcp()
      return
    }
    const sm = t.closest('[data-set-model]')
    if (sm) {
      acp.currentModel = sm.dataset.setModel
      addLog('设置默认大模型', acp.currentModel)
      toast(`已切换默认模型：${acp.currentModel}`)
      renderAcp()
      return
    }
    const tm = t.closest('[data-toggle-model]')
    if (tm) {
      const m = acp.models.find((x) => x.name === tm.dataset.toggleModel)
      if (!m) return
      m.enabled = !m.enabled
      if (!m.enabled && acp.currentModel === m.name) {
        const next = acp.models.find((x) => x.enabled)
        acp.currentModel = next ? next.name : ''
      }
      addLog(m.enabled ? '启用大模型' : '停用大模型', m.name)
      renderAcp()
      return
    }
    const ts = t.closest('[data-toggle-setting]')
    if (ts) {
      const key = ts.dataset.toggleSetting
      acp.settings[key] = !acp.settings[key]
      const labels = { identity: '身份识别', multiTerminal: '多终端入口', trace: 'AI 溯源', safety: '内容安全审核' }
      addLog('基础设置', `${labels[key]} ${acp.settings[key] ? '开启' : '关闭'}`)
      ts.classList.toggle('on', acp.settings[key])
      return
    }
    const tc = t.closest('[data-toggle-channel]')
    if (tc) {
      const c = acp.channels.find((x) => x.name === tc.dataset.toggleChannel)
      if (!c) return
      c.connected = !c.connected
      addLog(c.connected ? '接入渠道' : '断开渠道', c.name)
      toast(c.connected ? `${c.name} 已接入` : `${c.name} 已断开`)
      renderAcp()
      return
    }
    const p = t.closest('[data-period]')
    if (p) {
      acp.statsPeriod = p.dataset.period
      renderAcp()
      return
    }
    const ex = t.closest('[data-export]')
    if (ex) {
      if (ex.dataset.export === 'config') exportConfig()
      else if (ex.dataset.export === 'qa') exportQA()
      else exportLogs()
      return
    }
    const qaItem = t.closest('[data-qa]')
    if (qaItem) {
      acp.editingQA = acp.qaPairs.find((q) => q.id === qaItem.dataset.qa)
      renderQaList()
      renderQaEditor()
      return
    }
    if (t.closest('#newQaBtn')) {
      acp.editingQA = { id: 'new', question: '', answer: '' }
      renderQaList()
      renderQaEditor()
      $('#qaQuestion').focus()
    }
  })
  $('#asMain').addEventListener('input', (e) => {
    if (e.target.id === 'unifiedQueryInput') { state.unifiedQuery = e.target.value; return }
    if (e.target.id === 'debugQuery') { acp.debugQuery = e.target.value; return }
    if (e.target.id === 'qaQuestion') {
      const qa = currentQA()
      qa.question = e.target.value
      const item = $(`#qaList [data-qa="${qa.id}"] strong`)
      if (item) item.textContent = qa.question
      return
    }
    if (e.target.id === 'qaAnswer') {
      const qa = currentQA()
      qa.answer = e.target.innerHTML
      const item = $(`#qaList [data-qa="${qa.id}"] span`)
      if (item) item.innerHTML = qa.answer.slice(0, 30) + '…'
    }
  })
  $('#asMain').addEventListener('change', (e) => {
    const n = e.target.closest('[data-setting-num]')
    if (n) acp.settings[n.dataset.settingNum] = Number(n.value)
  })

  /* ===== 添加资源弹窗 ===== */
  const resDialog = $('#resDialog')
  function openResDialog() {
    $('#newResName').value = ''
    $('#newResType').value = '文件'
    $('#newResCount').value = 10
    $('#addResBtn').disabled = true
    resDialog.style.display = 'grid'
  }
  function closeResDialog() { resDialog.style.display = 'none' }
  resDialog.addEventListener('click', (e) => {
    if (e.target === resDialog || e.target.closest('[data-res-close]')) closeResDialog()
  })
  $('#newResName').addEventListener('input', (e) => {
    $('#addResBtn').disabled = !e.target.value.trim()
  })
  $('#addResBtn').addEventListener('click', () => {
    const name = $('#newResName').value.trim()
    if (!name) return
    acp.resources.push({ name, type: $('#newResType').value, count: Number($('#newResCount').value) || 1, size: '—' })
    closeResDialog()
    addLog('新增智能体资源', name)
    toast('资源已添加')
    renderAcp()
  })

  /* ===== 导出 ===== */
  function downloadFile(filename, content, mime) {
    const blob = new Blob([content], { type: mime })
    const url = URL.createObjectURL(blob)
    const a = document.createElement('a')
    a.href = url
    a.download = filename
    a.click()
    URL.revokeObjectURL(url)
  }
  function exportConfig() {
    downloadFile(
      '智能体配置.json',
      JSON.stringify({ agent: selectedAgent().name, settings: acp.settings, models: acp.models }, null, 2),
      'application/json;charset=utf-8',
    )
    addLog('导出智能体配置', 'JSON')
    toast('智能体配置已导出')
  }
  function exportQA() {
    const rows = [['问题', '答案', '附件'], ...acp.qaPairs.map((q) => [q.question, q.answer.replace(/<[^>]+>/g, ''), q.attachment || ''])]
    const csv = '﻿' + rows.map((r) => r.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n')
    downloadFile('智能体问答对.csv', csv, 'text/csv;charset=utf-8')
    addLog('导出问答对数据', 'CSV')
    toast('问答对数据已导出')
  }
  function exportLogs() {
    const rows = [['时间', '操作人', '操作', '对象'], ...acp.logs.map((l) => [l.time, l.user, l.action, l.target])]
    const csv = '﻿' + rows.map((r) => r.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n')
    downloadFile('智能体操作日志.csv', csv, 'text/csv;charset=utf-8')
    toast('操作日志已导出')
  }

  renderModeSwitch()
  renderAgentPanel()
  renderCoreTabs()
  renderMain()
})()
</script>
</body>
</html>
