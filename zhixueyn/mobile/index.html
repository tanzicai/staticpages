<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>智课云 · 移动端知识图谱</title>
<style>
/* 云采通 · 移动端样式（/mobile） */
:root {
  --primary: #2563eb;
  --primary-600: #1d4ed8;
  --primary-50: #eef4ff;
  --bg: #f2f5fa;
  --card: #fff;
  --text: #0f172a;
  --sub: #475569;
  --muted: #8a95a8;
  --border: #e6eaf2;
  --danger: #e11d48;
  --success: #16a34a;
  --warn: #f59e0b;
  --radius: 14px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  max-width: 560px; margin-inline: auto; position: relative;
}
button, input, select { font-family: inherit; font-size: 15px; }
button { cursor: pointer; }

#mApp { min-height: 100vh; padding-bottom: 66px; display: none; }
#mApp.active { display: block; }

/* 顶部栏 */
.m-header {
  position: sticky; top: 0; z-index: 30; background: #fff; border-bottom: 1px solid var(--border);
  height: 54px; display: flex; align-items: center; gap: 10px; padding: 0 16px;
}
.m-header h1 { font-size: 17px; margin: 0; font-weight: 700; }
.m-header .m-sub { font-size: 11px; color: var(--muted); }
.m-header .m-spacer { flex: 1; }
.m-avatar { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 14px; }
.m-bell { position: relative; width: 36px; height: 36px; border: 1px solid var(--border); background: #fff; border-radius: 10px; display: grid; place-items: center; color: var(--sub); }
.m-bell .dot { position: absolute; top: -4px; right: -4px; background: var(--danger); color: #fff; font-size: 10px; min-width: 16px; height: 16px; border-radius: 8px; display: grid; place-items: center; padding: 0 4px; }

.m-body { padding: 14px; }

/* 底部导航 */
.m-tabbar {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 560px;
  background: #fff; border-top: 1px solid var(--border); display: grid; grid-template-columns: repeat(4, 1fr);
  padding: 7px 4px calc(7px + env(safe-area-inset-bottom)); z-index: 40;
}
.m-tab { display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--muted); font-size: 11px; background: none; border: none; padding: 4px 0; }
.m-tab.active { color: var(--primary); font-weight: 600; }
.m-tab svg { width: 21px; height: 21px; }

/* 卡片 */
.m-card { background: #fff; border-radius: var(--radius); box-shadow: 0 1px 3px rgba(16,24,40,.06); margin-bottom: 12px; overflow: hidden; }
.m-card-hd { padding: 13px 15px; border-bottom: 1px solid var(--border); font-weight: 700; font-size: 14px; display: flex; align-items: center; }
.m-card-hd .spacer { flex: 1; }
.m-card-hd .more { color: var(--primary); font-size: 12.5px; font-weight: 500; }

.m-stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.m-stat { background: #fff; border-radius: var(--radius); padding: 15px; box-shadow: 0 1px 3px rgba(16,24,40,.06); }
.m-stat .l { font-size: 12px; color: var(--muted); }
.m-stat .v { font-size: 22px; font-weight: 800; margin-top: 5px; letter-spacing: .3px; }

.m-hero {
  background: linear-gradient(135deg, #1d4ed8, #2563eb 55%, #3b82f6); color: #fff; border-radius: var(--radius);
  padding: 18px; margin-bottom: 14px; position: relative; overflow: hidden;
}
.m-hero::after { content:""; position:absolute; right:-40px; top:-50px; width:150px; height:150px; border-radius:50%; background:rgba(255,255,255,.12); }
.m-hero .greet { font-size: 13px; opacity: .9; }
.m-hero .name { font-size: 20px; font-weight: 800; margin: 3px 0 8px; }
.m-hero .meta { font-size: 12px; opacity: .85; }
.m-hero .amount { font-size: 27px; font-weight: 800; margin-top: 12px; letter-spacing: .5px; }
.m-hero .amount small { font-size: 12px; font-weight: 400; opacity: .85; display: block; }

/* 列表条目 */
.m-item { display: flex; gap: 12px; padding: 14px 15px; border-bottom: 1px solid var(--border); align-items: center; }
.m-item:last-child { border-bottom: none; }
.m-item:active { background: #f7f9fc; }
.m-item .body { flex: 1; min-width: 0; }
.m-item .t1 { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.m-item .t2 { font-size: 12px; color: var(--muted); margin-top: 4px; display: flex; gap: 12px; flex-wrap: wrap; }
.m-item .t2 .mono { color: var(--sub); }
.m-item .amount { font-weight: 700; font-variant-numeric: tabular-nums; }
.m-item .chev { color: #c3ccdb; flex: none; }
.m-icon { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; flex: none; }

.m-tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 20px; font-size: 11.5px; font-weight: 500; }
.m-tag::before { content:""; width:5px; height:5px; border-radius:50%; background: currentColor; }
.m-tag.blue { background: #eef4ff; color: #1d4ed8; }
.m-tag.green { background: #e9f9ef; color: #15803d; }
.m-tag.orange { background: #fff5e6; color: #c2710c; }
.m-tag.red { background: #fdeef1; color: #be123c; }
.m-tag.gray { background: #f1f4f9; color: #64748b; }
.m-tag.cyan { background: #e7f7fd; color: #0369a1; }

.m-seg { display: flex; background: #e9edf5; border-radius: 11px; padding: 4px; margin: 0 0 14px; }
.m-seg button { flex: 1; border: none; background: transparent; padding: 8px; border-radius: 8px; color: var(--sub); font-weight: 500; font-size: 13.5px; }
.m-seg button.active { background: #fff; color: var(--primary); font-weight: 600; box-shadow: 0 1px 3px rgba(16,24,40,.1); }

.m-search { position: relative; margin-bottom: 12px; }
.m-search input { width: 100%; padding: 11px 14px 11px 38px; border-radius: 12px; border: 1px solid var(--border); background: #fff; outline: none; }
.m-search input:focus { border-color: var(--primary); }
.m-search .si { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); }

/* 全屏子页 */
.m-page { position: fixed; inset: 0; background: var(--bg); z-index: 50; display: flex; flex-direction: column; transform: translateX(100%); transition: transform .25s ease; max-width: 560px; margin-inline: auto; }
.m-page.open { transform: none; }
.m-page-hd { height: 52px; background: #fff; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; padding: 0 14px; flex: none; }
.m-page-hd h2 { font-size: 16px; margin: 0; flex: 1; text-align: center; padding-right: 30px; }
.m-back { border: none; background: none; color: var(--sub); padding: 6px; display: grid; place-items: center; }
.m-page-bd { padding: 14px; overflow-y: auto; flex: 1; }

.m-kv { background: #fff; border-radius: var(--radius); padding: 4px 15px; box-shadow: 0 1px 3px rgba(16,24,40,.06); }
.m-kv .row { display: flex; padding: 13px 0; border-bottom: 1px solid var(--border); font-size: 13.5px; }
.m-kv .row:last-child { border-bottom: none; }
.m-kv .row .k { color: var(--muted); width: 96px; flex: none; }
.m-kv .row .v { flex: 1; text-align: right; word-break: break-all; }

.m-btn { display: block; width: 100%; text-align: center; border: none; border-radius: 12px; padding: 13px; font-size: 15px; font-weight: 600; background: var(--primary); color: #fff; margin-top: 14px; }
.m-btn.ghost { background: #fff; color: var(--primary); border: 1px solid var(--primary); }
.m-btn.danger { background: #fff; color: var(--danger); border: 1px solid #f7cdd6; }

/* 底部弹层 */
.m-sheet-mask { position: fixed; inset: 0; background: rgba(15,23,42,.45); z-index: 60; display: none; }
.m-sheet-mask.open { display: block; }
.m-sheet {
  position: fixed; left: 50%; transform: translateX(-50%) translateY(100%); bottom: 0; width: 100%; max-width: 560px;
  background: #fff; border-radius: 18px 18px 0 0; z-index: 61; transition: transform .25s ease; padding: 8px 12px calc(14px + env(safe-area-inset-bottom));
}
.m-sheet.open { transform: translateX(-50%); }
.m-sheet .sheet-title { text-align: center; font-size: 12px; color: var(--muted); padding: 10px; }
.m-sheet-item { display: flex; gap: 12px; align-items: center; padding: 13px 12px; border-radius: 12px; }
.m-sheet-item:active { background: #f2f5fa; }
.m-sheet-item.active { background: var(--primary-50); }
.m-sheet-item b { font-size: 14px; }
.m-sheet-item small { display: block; color: var(--muted); font-size: 11.5px; margin-top: 2px; }
.m-sheet-item .ck { margin-left: auto; color: var(--primary); font-weight: 700; }

/* 登录 */
.m-login { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 30px 26px; background: linear-gradient(160deg, #0b2545, #1d4ed8 90%); }
.m-login .brand { color: #fff; text-align: center; margin-bottom: 30px; }
.m-login .brand h1 { font-size: 24px; margin: 12px 0 6px; letter-spacing: 1px; }
.m-login .brand p { color: rgba(255,255,255,.7); font-size: 13px; margin: 0; }
.m-login .panel { background: #fff; border-radius: 18px; padding: 24px 20px; box-shadow: 0 20px 50px rgba(0,0,0,.3); }
.m-login .panel h2 { margin: 0 0 4px; font-size: 19px; }
.m-login .panel .sub { color: var(--muted); font-size: 12.5px; margin: 0 0 18px; }
.m-field { margin-bottom: 14px; }
.m-field input { width: 100%; padding: 13px 14px; border-radius: 11px; border: 1px solid var(--border); background: #f8fafc; outline: none; }
.m-field input:focus { border-color: var(--primary); background: #fff; }
.m-err { background: #fef2f4; color: var(--danger); font-size: 13px; padding: 9px 12px; border-radius: 9px; margin-bottom: 14px; display: none; }

.m-toast-wrap { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 100; width: max-content; max-width: 90%; }
.m-toast { background: #0f172a; color: #fff; padding: 11px 18px; border-radius: 11px; font-size: 13.5px; box-shadow: 0 10px 30px rgba(0,0,0,.3); animation: mIn .2s ease; }
@keyframes mIn { from { opacity:0; transform: translateY(-8px); } to { opacity:1; transform:none; } }

.m-empty { text-align: center; color: var(--muted); padding: 46px 20px; }

.m-timeline { padding: 6px 15px; }
.m-tl-item { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
.m-tl-item:last-child { border-bottom: none; }
.m-tl-item .av { width: 32px; height: 32px; border-radius: 9px; background: #eef4ff; color: var(--primary); display: grid; place-items: center; font-weight: 700; font-size: 13px; flex: none; }
.m-tl-item b { font-size: 13.5px; }
.m-tl-item small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }

/* ============ 智课云 移动端专用 ============ */
.m-course-pick { display:flex; gap:10px; margin-bottom:12px; }
.m-course-pick button { flex:1; border:1px solid var(--border); background:#fff; border-radius:12px; padding:10px; font-size:13px; color:var(--sub); }
.m-course-pick button.active { border-color:var(--primary); background:var(--primary-50); color:var(--primary); font-weight:600; }

.m-graph { position:relative; background:#fbfcff; border:1px solid var(--border); border-radius:14px; padding:14px 10px; overflow:hidden; }
.m-graph .m-chapter { font-size:11px; color:var(--muted); margin:10px 0 6px; letter-spacing:.5px; }
.m-gnode { display:flex; align-items:center; gap:10px; background:#fff; border:1px solid var(--border); border-radius:12px; padding:10px 12px; margin-bottom:8px; box-shadow:0 1px 3px rgba(16,24,40,.05); }
.m-gnode:active { background:#f2f6ff; }
.m-gnode .dot { width:10px; height:10px; border-radius:50%; flex:none; }
.m-gnode .nm { flex:1; font-size:13.5px; font-weight:600; }
.m-gnode .rt { font-size:12px; font-weight:700; }

.m-outline .ol-chapter { background:#fff; border-radius:14px; margin-bottom:10px; overflow:hidden; border:1px solid var(--border); }
.m-outline .ol-hd { padding:13px 15px; font-weight:700; font-size:14px; display:flex; align-items:center; gap:8px; }
.m-outline .ol-hd .n { background:var(--primary); color:#fff; width:22px; height:22px; border-radius:7px; display:grid; place-items:center; font-size:12px; }
.m-outline .ol-item { display:flex; align-items:center; gap:10px; padding:12px 15px; border-top:1px solid var(--border); font-size:13.5px; }
.m-outline .ol-item:active { background:#f7f9fc; }
.m-outline .ol-item .st { font-size:11.5px; margin-left:auto; }

.m-map { position:relative; padding:6px 0; }
.m-map .mstep { display:flex; gap:12px; align-items:flex-start; }
.m-map .mstep .ln { display:flex; flex-direction:column; align-items:center; }
.m-map .mstep .bub { width:30px; height:30px; border-radius:50%; display:grid; place-items:center; color:#fff; font-size:12px; font-weight:700; flex:none; }
.m-map .mstep .bar { width:2px; flex:1; background:#e2e8f0; min-height:22px; }
.m-map .mstep .bx { flex:1; background:#fff; border:1px solid var(--border); border-radius:12px; padding:11px 13px; margin-bottom:12px; }
.m-map .mstep .bx b { font-size:13.5px; }
.m-map .mstep .bx small { display:block; color:var(--muted); font-size:11.5px; margin-top:3px; }

.m-micro-hd { background:linear-gradient(135deg,#1d4ed8,#2563eb); color:#fff; border-radius:14px; padding:16px; margin-bottom:12px; }
.m-micro-hd h3 { margin:0 0 6px; font-size:17px; }
.m-micro-hd p { margin:0; font-size:12px; opacity:.85; }
.m-micro-hd .stats { display:flex; gap:16px; margin-top:12px; }
.m-micro-hd .stats div { font-size:11.5px; opacity:.9; }
.m-micro-hd .stats b { font-size:16px; display:block; }

.m-mtabs { display:flex; gap:2px; overflow-x:auto; background:#fff; border-radius:12px; padding:5px; margin-bottom:12px; border:1px solid var(--border); }
.m-mtabs button { white-space:nowrap; border:none; background:transparent; padding:8px 13px; border-radius:9px; font-size:13px; color:var(--sub); }
.m-mtabs button.active { background:var(--primary); color:#fff; font-weight:600; }

.m-q { background:#fff; border:1px solid var(--border); border-radius:14px; padding:15px; margin-bottom:12px; }
.m-q .qt { font-size:14px; font-weight:600; line-height:1.6; margin-bottom:12px; }
.m-q .qo { display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border:1px solid var(--border); border-radius:10px; margin-bottom:8px; font-size:13px; }
.m-q .qo.sel { border-color:var(--primary); background:var(--primary-50); }
.m-q .qo.correct { border-color:var(--success); background:#eafaf0; }
.m-q .qo.wrong { border-color:var(--danger); background:#fdeef1; }
.m-q .qo .k { width:20px; height:20px; border-radius:6px; background:#eef2f9; display:grid; place-items:center; font-size:12px; font-weight:700; flex:none; }
.m-q .qo.sel .k { background:var(--primary); color:#fff; }

.m-video { background:#0f172a; border-radius:12px; height:170px; display:grid; place-items:center; color:rgba(255,255,255,.8); margin-bottom:12px; position:relative; }
.m-video .play { width:52px; height:52px; border-radius:50%; background:rgba(255,255,255,.2); display:grid; place-items:center; }

.m-discuss .d { display:flex; gap:10px; padding:12px 0; border-bottom:1px solid var(--border); }
.m-discuss .d:last-child { border-bottom:none; }
.m-discuss .d .av { width:32px; height:32px; border-radius:9px; background:#eef4ff; color:var(--primary); display:grid; place-items:center; font-weight:700; font-size:12px; flex:none; }
.m-discuss .d b { font-size:13px; }
.m-discuss .d p { margin:3px 0 0; font-size:12.5px; color:var(--sub); }
.m-discuss .d .rep { background:#f6f8fc; border-radius:8px; padding:8px 10px; margin-top:8px; font-size:12.5px; color:var(--sub); }

.m-score { text-align:center; padding:20px; }
.m-score .big { font-size:44px; font-weight:800; color:var(--primary); }
.m-score .lbl { color:var(--muted); font-size:13px; margin-top:4px; }

</style>
</head>
<body>

<!-- 登录 -->
<div id="mLogin" class="m-login">
  <div class="brand">
    <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="background:rgba(255,255,255,.15);padding:11px;border-radius:15px"><path d="M3 5.5 12 3l9 2.5-9 2.5-9-2.5Z"/><path d="M5 8v6.5c0 1 3 2.5 7 2.5s7-1.5 7-2.5V8"/><path d="M21 6v6"/></svg>
    <h1>智课云</h1>
    <p>AI+ 智慧课程 · 移动端知识图谱学习</p>
  </div>
  <div class="panel">
    <h2>账号登录</h2>
    <p class="sub">随时随地访问课程图谱与微课</p>
    <div class="m-err" id="mErr"></div>
    <form id="mLoginForm" autocomplete="off">
      <div class="m-field"><input type="text" id="mUser" placeholder="平台账号" autocomplete="off"></div>
      <div class="m-field"><input type="password" id="mPass" placeholder="登录密码" autocomplete="off"></div>
      <button class="m-btn" type="submit">登 录</button>
    </form>
  </div>
</div>

<!-- 主体 -->
<div id="mApp">
  <header class="m-header">
    <div>
      <h1 id="mTitle">课程图谱</h1>
      <div class="m-sub" id="mSub">智课云 · 移动学习</div>
    </div>
    <div class="m-spacer"></div>
    <button class="m-bell" id="mBell">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      <span class="dot" id="mBellDot" style="display:none">0</span>
    </button>
    <span class="m-avatar" id="mAvatar" style="background:#2563eb">管</span>
  </header>

  <main class="m-body" id="mBody"></main>

  <nav class="m-tabbar" id="mTabbar"></nav>
</div>

<!-- 全屏页（微课 / 详情） -->
<div class="m-page" id="mPage">
  <div class="m-page-hd">
    <button class="m-back" id="mBack"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <h2 id="mPageTitle">微课</h2>
  </div>
  <div class="m-page-bd" id="mPageBody"></div>
</div>

<!-- 底部弹层 -->
<div class="m-sheet-mask" id="mSheetMask"></div>
<div class="m-sheet" id="mSheet"><div class="sheet-title" id="mSheetTitle">选择</div><div id="mSheetBody"></div></div>

<div class="m-toast-wrap" id="mToast"></div>

<script>
/* 智课云 · 数据层（localStorage 持久化 + 预置教学数据） */
(function () {
  'use strict';

  const DATA_KEY = 'zky_data_v3';
  const SESSION_KEY = 'zky_session_v1';

  /* ---------- 角色 ---------- */
  const ROLES = [
    { id: 'admin', name: '平台管理员', short: '管', color: '#2563eb', desc: '平台全局配置：课程、门户、安全审核与系统设置' },
    { id: 'teacher', name: '课程教师', short: '师', color: '#0ea5e9', desc: '课程建设主力：图谱、微课、门户展厅、AI 教学工具' },
    { id: 'student', name: '学生', short: '学', color: '#16a34a', desc: '学习视角：知识图谱、微课学习、自测与错题集' },
    { id: 'supervisor', name: '教研督导', short: '督', color: '#f59e0b', desc: '质量把控：学情分析、资源安全检测与教学预警' }
  ];

  /* ---------- 演示账号 ---------- */
  const ACCOUNTS = [
    { username: 'admin', password: 'admin123', name: '刘建国', role: 'admin', dept: '现代教育技术中心' },
    { username: 'teacher', password: 'teacher123', name: '张恩正', role: 'teacher', dept: '安全工程学院' },
    { username: 'student', password: 'student123', name: '李娜', role: 'student', dept: '安全2301班' },
    { username: 'supervisor', password: 'supervisor123', name: '王海涛', role: 'supervisor', dept: '教学质量监控中心' }
  ];

  /* ---------- 菜单（按角色可见） ---------- */
  const MENUS = [

  function buildGraph() {
    const rnd = lcg(20261110);
    function int(a, b) { return a + Math.floor(rnd() * (b - a + 1)); }
    const gp = {};
    function make(course, defs) {
      const nodes = defs.map(function (d, i) {
        const name = d[0], chapter = d[1], diff = d[2], pre = d[3];
        const id = course + '-KP' + pad(i + 1, 2);
        return {
          id: id, course: course, name: name, chapter: chapter, diff: diff,
          pre: pre.map(function (p) { const idx = defs.findIndex(function (x) { return x[0] === p; }); return course + '-KP' + pad(idx + 1, 2); }),
          mastery: int(58, 96), completion: int(62, 99),
          video: int(1, 4), docs: int(2, 7), quiz: int(3, 9), discuss: int(0, 12)
        };
      });
      return nodes;
    }
    gp.C1 = make('C1', C1_KP);
    gp.C2 = make('C2', C2_KP);
    return gp;
  }

  /* 生成微课题库（每知识点 2-3 题） */
  function buildQuestions(graph) {
    const qs = [];
    Object.keys(graph).forEach(function (c) {
      graph[c].forEach(function (kp) {
        const bank = CHAPTER_QUESTIONS[CHAPTERS[c][kp.chapter]] || [];
        bank.forEach(function (q, i) {
          qs.push({ id: kp.id + '-Q' + (i + 1), kpId: kp.id, type: 'single', stem: q[0], options: q[1], answer: q[2], analysis: q[3] });
        });
      });
    });
    return qs;
  }

    const an = S.data.analysis[kp.id] || { points: [] };
    const tabs = [['analysis', '分析'], ['content', '学习内容'], ['quiz', '自测'], ['mats', '资料'], ['wrong', '错题集'], ['discuss', '讨论']];
    let h = '<div class="m-micro-hd"><h3>' + esc(kp.name) + '</h3><p>' + esc(S.CHAPTERS[kp.course][kp.chapter]) + ' · 知识点 ' + kp.id + '</p>' +
      '<div class="stats"><div><b>' + kp.mastery + '%</b>班级掌握率</div><div><b>' + kp.completion + '%</b>完成率</div><div><b>' + kp.diff + '/3</b>难度</div></div></div>';
    h += '<div class="m-mtabs">' + tabs.map(function (t) { return '<button class="' + (App.micro.tab === t[0] ? 'active' : '') + '" data-mtab="' + t[0] + '">' + t[1] + '</button>'; }).join('') + '</div>';
    h += '<div id="microBody">' + microBody(kp, an) + '</div>';
    $('mPageBody').innerHTML = h;
  }

  function microBody(kp, an) {
    const t = App.micro.tab;
    if (t === 'analysis') {
      return '<div class="m-card"><div class="m-card-hd">AI 内容解析</div><div style="padding:15px"><p style="font-size:13.5px;line-height:1.8;margin:0">' + esc(an.core || '') + '</p>' +
        '<ul style="font-size:13px;line-height:1.9;color:var(--sub);margin:12px 0 0;padding-left:18px">' + (an.points || []).map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('') + '</ul>' +
        '<div style="margin-top:14px"><b style="font-size:13px">知识点词云</b><div style="margin-top:8px">' + (an.keyWords || []).map(function (k, i) { return '<span class="m-tag blue" style="margin:3px 4px 0 0;font-size:' + (11 + (i % 3)) + 'px">' + esc(k) + '</span>'; }).join('') + '</div></div>' +
        '<div style="margin-top:14px;font-size:12.5px;color:var(--muted)">讲解视频时长 ' + esc(an.videoLen || '') + ' · 难度系数 ' + kp.diff + ' / 3</div></div></div>';
    }
    if (t === 'content') {
      return '<div class="m-video"><div class="play"><svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg></div><div style="position:absolute;bottom:12px;left:14px;font-size:12px">知识讲解视频 · 支持智能切片与 AI 助教答疑</div></div>' +
        '<div class="m-card"><div class="m-card-hd">学习内容</div><div style="padding:6px 15px">' +
        (an.points || []).map(function (p, i) { return '<div class="m-item"><span class="m-icon" style="background:#eef4ff;color:#2563eb">' + (i + 1) + '</span><div class="body"><div class="t1" style="font-weight:500;font-size:13.5px">' + esc(p) + '</div></div></div>'; }).join('') +
        '</div></div>' +
        '<div class="m-card"><div class="m-card-hd">AI 助教</div><div style="padding:14px"><div class="m-search" style="margin:0"><input id="aiAsk" placeholder="有不懂的？点击提问，AI 助教即时答疑"></div><button class="m-btn" data-act="ai-ask">向 AI 助教提问</button></div></div>';
    }
    if (t === 'quiz') return quizBody(kp);
    if (t === 'mats') {
      return '<div class="m-card">' + (S.data.materials[kp.id] || []).map(function (m) { return '<div class="m-item"><span class="m-icon" style="background:#f1f5f9;color:#475569">' + esc(m.type) + '</span><div class="body"><div class="t1" style="font-weight:500;font-size:13px">' + esc(m.name) + '</div><div class="t2"><span>' + esc(m.size) + '</span></div></div><svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 6l6 6-6 6"/></svg></div>'; }).join('') + '</div>';
    }
    if (t === 'wrong') {
      const wb = wrongList(kp.id);
      if (!wb.length) return '<div class="m-card"><div class="m-empty">暂无错题，去「自测」练习一下吧</div></div>';
      return '<div class="m-card"><div class="m-card-hd">错题集 · ' + wb.length + ' 题</div><div style="padding:14px">' + wb.map(function (w) {
        return '<div class="m-q"><div class="qt">' + esc(w.stem) + '</div><div style="font-size:13px;color:var(--danger)">你的作答：' + esc(w.your) + '</div><div style="font-size:13px;color:var(--success);margin-top:4px">正确答案：' + esc(w.correct) + '</div><div style="font-size:12.5px;color:var(--muted);margin-top:8px">解析：' + esc(w.analysis) + '</div></div>';
      }).join('') + '</div></div>';
    }
    if (t === 'discuss') {
      const list = S.data.discussions[kp.id] || [];
      let h = '<div class="m-card"><div class="m-card-hd">讨论区</div><div class="m-discuss" style="padding:6px 15px">' + list.map(function (d) {
        return '<div class="d"><span class="av">' + esc(d.avatar) + '</span><div style="flex:1"><b>' + esc(d.user) + '</b><p>' + esc(d.content) + '</p>' + (d.replies || []).map(function (r) { return '<div class="rep"><b>' + esc(r.user) + '</b>：' + esc(r.content) + '</div>'; }).join('') + '<div style="font-size:11.5px;color:var(--muted);margin-top:6px">' + esc(d.time) + '</div></div></div>';
      }).join('') + '</div></div>';
      return h + '<div class="m-card"><div style="padding:14px"><div class="m-search" style="margin:0"><input id="discInput" placeholder="参与讨论，发表你的看法…"></div><button class="m-btn" data-act="disc-post">发表</button></div></div>';
    }
    return '';
  }

  function quizBody(kp) {
    if (!App.micro.quiz) {
      return '<div class="m-card"><div class="m-card-hd">开始自测</div><div style="padding:15px">' +
        '<div style="font-size:13px;color:var(--sub);margin-bottom:10px">抽题范围（避免抽到未开始学习的知识点）</div>' +
        '<div class="m-seg"><button class="' + (App.micro.scope === 'kp' ? 'active' : '') + '" data-scope="kp">仅当前知识点</button><button class="' + (App.micro.scope === 'pre' ? 'active' : '') + '" data-scope="pre">当前及前置知识点</button></div>' +
        '<div style="font-size:12.5px;color:var(--muted);margin-bottom:14px">将从「' + esc(kp.name) + '」' + (App.micro.scope === 'pre' ? '及其前置知识点' : '') + '的题库中抽取最多 5 道题</div>' +
        '<button class="m-btn" data-act="quiz-start">开始自测</button></div></div>';
    }
    const q = App.micro.quiz;
    let h = '<div class="m-card"><div class="m-card-hd">自测 · 共 ' + q.length + ' 题</div><div style="padding:14px">';
    q.forEach(function (item, qi) {
      h += '<div class="m-q"><div class="qt">' + (qi + 1) + '. ' + esc(item.stem) + '</div>';
      item.options.forEach(function (o, oi) {
        let cls = '';
        const picked = App.micro.answers[item.id] === oi;
        if (App.micro.submitted) {
          if (oi === item.answer) cls = 'correct'; else if (picked) cls = 'wrong';
        } else if (picked) cls = 'sel';
        h += '<div class="qo ' + cls + '" data-ans="' + item.id + '|' + oi + '"><span class="k">' + 'ABCD'[oi] + '</span><span>' + esc(o) + '</span></div>';
      });
      if (App.micro.submitted) h += '<div style="font-size:12.5px;color:var(--muted);margin-top:6px">解析：' + esc(item.analysis) + '</div>';
      h += '</div>';
    });
    if (!App.micro.submitted) h += '<button class="m-btn" data-act="quiz-submit">提交答卷</button>';
    else {
      const correct = q.filter(function (item) { return App.micro.answers[item.id] === item.answer; }).length;
      h += '<div class="m-score"><div class="big">' + Math.round(correct / q.length * 100) + '</div><div class="lbl">本次得分（答对 ' + correct + '/' + q.length + ' 题）</div></div><button class="m-btn ghost" data-act="quiz-again">再测一次</button>';
    }
    h += '</div></div>';
    return h;
  }

  function startQuiz(kp) {
    const scope = App.micro.scope;
    let kpIds = [kp.id];
    if (scope === 'pre') kpIds = kpIds.concat(kp.pre || []);
    let pool = S.data.questions.filter(function (q) { return kpIds.indexOf(q.kpId) >= 0; });
    pool = pool.slice(0, 5);
    if (pool.length === 0) { toast('该知识点暂无试题'); return; }
    App.micro.quiz = pool; App.micro.answers = {}; App.micro.submitted = false;
    renderMicro();
  }
  function submitQuiz() {
    const q = App.micro.quiz;
    if (!q) return;
    const ans = App.micro.answers;
    const missing = q.filter(function (item) { return ans[item.id] == null; }).length;
    if (missing > 0) { toast('还有 ' + missing + ' 题未作答'); return; }
    App.micro.submitted = true;
    // 记录错题
    const kpId = App.micro.kpId;
    const wb = S.data.wrongBook[kpId] = S.data.wrongBook[kpId] || [];
    q.forEach(function (item) {
      if (ans[item.id] !== item.answer) {
        if (!wb.some(function (w) { return w.qid === item.id; })) {
          wb.push({ qid: item.id, stem: item.stem, your: 'ABCD'[ans[item.id]] + '. ' + item.options[ans[item.id]], correct: 'ABCD'[item.answer] + '. ' + item.options[item.answer], analysis: item.analysis });
        }
      }
    });
    S.save();
    renderMicro();
    const correct = q.filter(function (item) { return ans[item.id] === item.answer; }).length;
    toast('自测完成，答对 ' + correct + '/' + q.length + ' 题');
  }
  function wrongList(kpId) { return S.data.wrongBook[kpId] || []; }

  /* ---------------- 消息 ---------------- */
  function renderMsgs() {
    setTitle('消息中心', '未读 ' + S.unreadCount() + ' 条');
    const msgs = S.data.messages.slice().sort(function (a, b) { return String(b.id).localeCompare(String(a.id)); });
    let h = '<div class="m-card"><div class="m-card-hd">全部消息<span class="spacer"></span><span class="more" data-act="allread">全部已读</span></div>';
    msgs.forEach(function (m) {
      h += '<div class="m-item" data-msg="' + m.id + '"><span class="m-icon" style="background:' + (m.read ? '#f1f4f9' : '#eef4ff') + ';color:' + (m.read ? '#8a95a8' : '#2563eb') + ';width:8px;height:8px;border-radius:50%;padding:0"></span>' +
        '<div class="body"><div class="t1">' + esc(m.title) + ' <span class="m-tag ' + (m.type === '告警' ? 'red' : m.type === '待办' ? 'blue' : m.type === '提醒' ? 'orange' : 'cyan') + '">' + esc(m.type) + '</span></div><div class="t2"><span>' + esc(m.content) + '</span></div></div><span style="color:var(--muted);font-size:11.5px;white-space:nowrap">' + esc(m.createdAt) + '</span></div>';
    });
    return $('mBody').innerHTML = h + '</div>';
  }

  /* ---------------- 我的 ---------------- */
  function renderMe() {
    setTitle('我的', '个人中心');
    const s = App.session, r = S.roleById(s.role);
    const wrongTotal = Object.keys(S.data.wrongBook).reduce(function (a, k) { return a + S.data.wrongBook[k].length; }, 0);
    let h = '<div class="m-hero" style="background:linear-gradient(135deg,#0f172a,#334155)"><div style="display:flex;align-items:center;gap:14px"><span class="m-avatar" style="width:52px;height:52px;font-size:20px;background:' + r.color + '">' + r.short + '</span><div><div class="name" style="margin:0">' + esc(s.name) + '</div><div class="meta">' + esc(s.dept) + ' · ' + r.name + '</div></div></div></div>';
    h += '<div class="m-card"><div class="m-card-hd">学习概览</div><div style="display:grid;grid-template-columns:repeat(3,1fr)">' +
      meStat(S.data.graph[App.course].length, '知识点') + meStat(wrongTotal, '错题数') + meStat(Object.keys(S.data.wrongBook).length, '已练知识点') + '</div></div>';
    h += '<div class="m-card"><div class="m-card-hd">切换角色<span class="spacer"></span><span class="more">当前：' + r.name + '</span></div>';
    S.ROLES.forEach(function (x) {
      h += '<div class="m-item" data-role="' + x.id + '"><span class="m-avatar" style="background:' + x.color + '">' + x.short + '</span><div class="body"><div class="t1">' + x.name + (x.id === s.role ? ' <span class="m-tag blue">当前</span>' : '') + '</div><div class="t2"><span>' + esc(x.desc) + '</span></div></div>' + (x.id === s.role ? '<span style="color:var(--primary);font-weight:700">✓</span>' : '<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 6l6 6-6 6"/></svg>') + '</div>';
    });
    h += '</div>';
    h += '<div class="m-card"><div class="m-card-hd">设置</div>' +
      '<div class="m-item" data-act="about"><div class="body"><div class="t1">关于平台</div><div class="t2"><span>智课云移动端 v3.1.0</span></div></div></div>' +
      '<div class="m-item" data-act="reset"><div class="body"><div class="t1">恢复初始数据</div><div class="t2"><span>清空错题与学习记录</span></div></div></div></div>';
    h += '<button class="m-btn danger" data-act="logout" style="margin-bottom:20px">退出登录</button>';
    $('mBody').innerHTML = h;
  }
  function meStat(v, l) { return '<div style="text-align:center;padding:16px 6px"><div style="font-size:21px;font-weight:800;color:var(--primary)">' + v + '</div><div style="font-size:12px;color:var(--muted);margin-top:4px">' + l + '</div></div>'; }

  /* ---------------- 角色切换 ---------------- */
  function openRoleSheet() {
    $('mSheetTitle').textContent = '切换角色（即时生效）';
    let h = '';
    S.ROLES.forEach(function (x) { h += '<div class="m-sheet-item' + (x.id === App.session.role ? ' active' : '') + '" data-pick="' + x.id + '"><span class="m-avatar" style="background:' + x.color + '">' + x.short + '</span><span style="flex:1"><b>' + x.name + '</b><small>' + esc(x.desc) + '</small></span>' + (x.id === App.session.role ? '<span class="ck">✓</span>' : '') + '</div>'; });
    $('mSheetBody').innerHTML = h; $('mSheetMask').classList.add('open'); $('mSheet').classList.add('open');
  }
  function closeSheet() { $('mSheetMask').classList.remove('open'); $('mSheet').classList.remove('open'); }
  function pickRole(id) {
    App.session.role = id; S.setSession(App.session);
    const r = S.roleById(id);
    $('mAvatar').textContent = r.short; $('mAvatar').style.background = r.color;
    App.tab = 'graph'; renderTabbar(); render(); closeSheet(); toast('已切换为「' + r.name + '」');
  }

  /* ---------------- 事件 ---------------- */
  function bind() {
    $('mLoginForm').addEventListener('submit', submit);
    $('mBack').addEventListener('click', closePage);
    $('mBell').addEventListener('click', function () { App.tab = 'msg'; renderTabbar(); render(); renderBell(); });
    $('mAvatar').addEventListener('click', openRoleSheet);
    $('mSheetMask').addEventListener('click', closeSheet);

    document.addEventListener('click', function (e) {
      const t = e.target.closest('[data-tab],[data-course],[data-mode],[data-kp],[data-mtab],[data-scope],[data-ans],[data-role],[data-pick],[data-msg],[data-act]');
      if (!t) return;
      if (t.hasAttribute('data-tab')) { App.tab = t.getAttribute('data-tab'); renderTabbar(); render(); return; }
      if (t.hasAttribute('data-course')) { App.course = t.getAttribute('data-course'); renderGraph(); return; }
      if (t.hasAttribute('data-mode')) { App.mode = t.getAttribute('data-mode'); renderGraph(); return; }
      if (t.hasAttribute('data-kp')) { openMicro(t.getAttribute('data-kp')); return; }
      if (t.hasAttribute('data-mtab')) { App.micro.tab = t.getAttribute('data-mtab'); renderMicro(); return; }
      if (t.hasAttribute('data-scope')) { App.micro.scope = t.getAttribute('data-scope'); renderMicro(); return; }
      if (t.hasAttribute('data-ans')) { const p = t.getAttribute('data-ans').split('|'); if (!App.micro.submitted) { App.micro.answers[p[0]] = Number(p[1]); const card = t.closest('.m-q'); if (card) { card.querySelectorAll('.qo').forEach(function (o) { o.classList.remove('sel'); }); t.classList.add('sel'); } } return; }
      if (t.hasAttribute('data-pick')) { pickRole(t.getAttribute('data-pick')); return; }
      if (t.hasAttribute('data-role')) { pickRole(t.getAttribute('data-role')); return; }
      if (t.hasAttribute('data-msg')) {
        const m = S.data.messages.filter(function (x) { return x.id === t.getAttribute('data-msg'); })[0];
        if (m && !m.read) { m.read = true; S.save(); } renderBell(); renderMsgs();
        if (m) { $('mPageTitle').textContent = '消息详情'; $('mPageBody').innerHTML = '<div class="m-kv"><div class="row"><span class="k">标题</span><span class="v">' + esc(m.title) + '</span></div><div class="row"><span class="k">类型</span><span class="v">' + esc(m.type) + '</span></div><div class="row"><span class="k">时间</span><span class="v">' + esc(m.createdAt) + '</span></div></div><div class="m-card" style="margin-top:12px"><div style="padding:15px;font-size:13.5px;line-height:1.8">' + esc(m.content) + '</div></div>'; $('mPage').classList.add('open'); }
        return;
      }
      if (t.hasAttribute('data-act')) {
        const a = t.getAttribute('data-act');
        if (a === 'quiz-start') { startQuiz(kpById(App.micro.kpId)); }
        else if (a === 'quiz-submit') { submitQuiz(); }
        else if (a === 'quiz-again') { App.micro.quiz = null; App.micro.submitted = false; App.micro.answers = {}; renderMicro(); }
        else if (a === 'disc-post') { const v = $('discInput').value.trim(); if (!v) { toast('请输入内容'); return; } S.data.discussions[App.micro.kpId].push({ user: S.roleById(App.session.role).name + '(' + App.session.name + ')', avatar: App.session.name.charAt(0), content: v, time: '刚刚', replies: [] }); S.save(); renderMicro(); toast('已发表'); }
        else if (a === 'ai-ask') { const v = ($('aiAsk') && $('aiAsk').value.trim()) || '这个知识点在实际工程中如何应用？'; toast('AI 助教正在解答…'); setTimeout(function () { toast('AI 助教：' + aiAnswer(App.micro.kpId, v)); }, 400); }
        else if (a === 'allread') { S.data.messages.forEach(function (m) { m.read = true; }); S.save(); renderBell(); renderMsgs(); toast('已全部标为已读'); }
        else if (a === 'logout') { if (confirm('确定要退出当前账号吗？')) logout(); }
        else if (a === 'about') { $('mPageTitle').textContent = '关于平台'; $('mPageBody').innerHTML = '<div class="m-kv"><div class="row"><span class="k">产品</span><span class="v">智课云 · AI+智慧课程资源建设与运行平台</span></div><div class="row"><span class="k">客户端</span><span class="v">移动端 v3.1.0</span></div><div class="row"><span class="k">访问方式</span><span class="v">微信公众号 / 移动 App</span></div></div>'; $('mPage').classList.add('open'); }
        else if (a === 'reset') { if (confirm('确定恢复初始数据？将清空错题与学习记录。')) { S.resetAll(); location.reload(); } }
        return;
      }
    });
  }
  function aiAnswer(kpId, q) {
    const kp = kpById(kpId);
    const an = S.data.analysis[kpId] || {};
    if (/应用|实践|工程/.test(q)) return '「' + kp.name + '」在工程实践中，主要体现在' + (an.points && an.points[1] ? an.points[1] : '技术要点与现场管理') + '。建议结合配套案例与规范条文理解。';
    if (/自测|题|考/.test(q)) return '你可以在「自测」标签中按知识点或前置知识点抽题练习，做错的题会自动进入「错题集」方便复习。';
    return '关于「' + kp.name + '」：' + (an.core || '请参考学习内容与配套资料。');
  }

  boot();
})();

</script>
</body>
</html>
