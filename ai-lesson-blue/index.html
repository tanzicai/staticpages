<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智慧课堂 - 首页仪表板</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .quick-entry {
      display: block;
      padding: 16px;
      border-radius: var(--radius);
      color: var(--text-primary);
      transition: all 0.2s;
      border: 1px solid #d0e1f9;
      background: #f0f6ff;
      border-left: 4px solid var(--primary);
    }
    .quick-entry:hover {
      background: #e4efff;
      text-decoration: none;
      box-shadow: var(--shadow-sm);
    }
    .quick-entry .qe-title {
      font-weight: 600;
      margin-bottom: 2px;
    }
    .quick-entry .qe-desc {
      font-size: 12px;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>
  <script src="js/common.js"></script>
  <script src="js/data.js"></script>
  <script>
    Auth.guard();
    renderSidebar('dashboard');
  </script>

  <div class="main-content">
    <div class="topbar">
      <div class="topbar-left">
        <div class="breadcrumb">
          <span>首页仪表板</span>
        </div>
      </div>
      <div class="topbar-right" data-topbar-actions></div>
    </div>

    <div class="page-content">
      <!-- 欢迎横幅 -->
      <div class="welcome-strip">
        <div>
          <h2 id="welcomeTitle">欢迎回来</h2>
          <p id="welcomeSub"></p>
        </div>
        <div class="welcome-status">
          <div>系统运行状态</div>
          <div class="status-ok">● 所有服务正常</div>
        </div>
      </div>

      <!-- 统计卡片（JS渲染） -->
      <div class="stat-grid" id="statGrid"></div>

      <div class="grid-2">
        <!-- 今日课堂活动 -->
        <div class="card">
          <div class="card-header">
            <div class="card-title"><span class="card-title-icon"></span>今日课堂活动</div>
            <a href="pages/timeline.html" class="btn-link">查看全部</a>
          </div>
          <div class="timeline" id="todayTimeline"></div>
        </div>

        <!-- 快速入口 + 关键指标 -->
        <div>
          <div class="card">
            <div class="card-header">
              <div class="card-title"><span class="card-title-icon"></span>核心功能模块</div>
            </div>
            <div class="grid-2" style="gap:12px;">
              <a href="pages/timeline.html" class="quick-entry">
                <div class="qe-title">课堂活动时间轴</div>
                <div class="qe-desc">课程活动同步与跳转</div>
              </a>
              <a href="pages/coverage.html" class="quick-entry">
                <div class="qe-title">授课计划覆盖分析</div>
                <div class="qe-desc">知识点覆盖统计与分析报告</div>
              </a>
              <a href="pages/resources.html" class="quick-entry">
                <div class="qe-title">录播资源与语音转写</div>
                <div class="qe-desc">多语种实时翻译与剪辑</div>
              </a>
              <a href="pages/evaluation.html" class="quick-entry">
                <div class="qe-title">督导评价</div>
                <div class="qe-desc">课程评价与打分管理</div>
              </a>
            </div>
          </div>

          <!-- 关键指标 -->
          <div class="card">
            <div class="card-header">
              <div class="card-title"><span class="card-title-icon"></span>平台关键指标</div>
            </div>
            <div class="grid-3" style="gap:20px;text-align:center;">
              <div>
                <div class="donut-chart" style="margin:0 auto;">
                  <svg width="120" height="120" viewBox="0 0 120 120">
                    <circle cx="60" cy="60" r="50" fill="none" stroke="#e5e7eb" stroke-width="10"/>
                    <circle cx="60" cy="60" r="50" fill="none" stroke="#1e6fd9" stroke-width="10"
                      stroke-dasharray="314" stroke-dashoffset="86.5" stroke-linecap="round"/>
                  </svg>
                  <div class="donut-center">
                    <div class="value">72.5%</div>
                    <div class="label">平均覆盖率</div>
                  </div>
                </div>
              </div>
              <div>
                <div class="donut-chart" style="margin:0 auto;">
                  <svg width="120" height="120" viewBox="0 0 120 120">
                    <circle cx="60" cy="60" r="50" fill="none" stroke="#e5e7eb" stroke-width="10"/>
                    <circle cx="60" cy="60" r="50" fill="none" stroke="#4a90e2" stroke-width="10"
                      stroke-dasharray="314" stroke-dashoffset="18.1" stroke-linecap="round"/>
                  </svg>
                  <div class="donut-center">
                    <div class="value">94.2%</div>
                    <div class="label">评价完成率</div>
                  </div>
                </div>
              </div>
              <div>
                <div class="donut-chart" style="margin:0 auto;">
                  <svg width="120" height="120" viewBox="0 0 120 120">
                    <circle cx="60" cy="60" r="50" fill="none" stroke="#e5e7eb" stroke-width="10"/>
                    <circle cx="60" cy="60" r="50" fill="none" stroke="#6bb3ff" stroke-width="10"
                      stroke-dasharray="314" stroke-dashoffset="60.5" stroke-linecap="round"/>
                  </svg>
                  <div class="donut-center">
                    <div class="value">81%</div>
                    <div class="label">资源同步率</div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 最新课程列表 -->
      <div class="card">
        <div class="card-header">
          <div class="card-title"><span class="card-title-icon"></span>本学期课程概览</div>
          <div style="display:flex;gap:10px;">
            <input type="text" class="form-control" style="width:200px;padding:8px 12px;" placeholder="搜索课程..." id="courseSearch">
            <button class="btn btn-primary btn-sm" onclick="filterCourses()">查询</button>
          </div>
        </div>
        <div class="card-body" style="overflow-x:auto;">
          <table class="table">
            <thead>
              <tr>
                <th>课程名称</th>
                <th>开课学院</th>
                <th>授课教师</th>
                <th>上课班级</th>
                <th>排课教室</th>
                <th>排课时间</th>
                <th>选课人数</th>
                <th>状态</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="courseTable"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ===== 欢迎横幅 =====
    (function() {
      const user = Auth.getUser();
      document.getElementById('welcomeTitle').textContent = '欢迎回来，' + (user ? user.displayName : '管理员');
      const today = new Date().toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
      document.getElementById('welcomeSub').innerHTML =
        '今天是 ' + today + '，共 <b>' + mockDashboardStats.totalActivitiesToday + '</b> 项课堂活动正在进行';
    })();

    // ===== 统计卡片 =====
    (function() {
      const stats = [
        { label: '本学期课程总数', value: mockDashboardStats.totalCourses, trend: '较上期 +8', trendCls: 'up' },
        { label: '授课教师', value: mockDashboardStats.totalTeachers, trend: '较上期 +5', trendCls: 'up' },
        { label: '在校学生', value: mockDashboardStats.totalStudents, trend: '较上期 +312', trendCls: 'up' },
        { label: '教学资源库', value: mockDashboardStats.totalRecordings, trend: '本周新增 28', trendCls: 'up' }
      ];
      document.getElementById('statGrid').innerHTML = stats.map(s => `
        <div class="stat-card">
          <div class="stat-info">
            <div class="stat-label">${s.label}</div>
            <div class="stat-value">${s.value}</div>
            <div class="stat-trend ${s.trendCls}">${s.trend}</div>
          </div>
        </div>
      `).join('');
    })();

    // ===== 今日时间轴 =====
    (function() {
      const todayEvents = (mockTimelineEvents.c001 || []).slice(0, 4);
      const html = todayEvents.map(e => {
        const act = activityTypes[e.type] || {};
        return `
          <div class="timeline-item activity-${e.type}">
            <div class="timeline-date">${e.time}</div>
            <div class="timeline-title"><span class="type-dot" style="background:${act.color || '#999'}"></span>${e.title}</div>
            <div class="timeline-desc">${e.description || act.label || ''}</div>
            <div class="timeline-meta">
              <span>参与 ${e.participants || 0} 人</span>
              ${e.status === 'ongoing' ? '<span style="color:var(--primary)">● 进行中</span>' : '<span style="color:var(--text-muted)">已完成</span>'}
            </div>
          </div>
        `;
      }).join('');
      document.getElementById('todayTimeline').innerHTML = html || '<div class="empty-state">今日暂无课堂活动</div>';
    })();

    // ===== 课程表 =====
    function renderCourseTable(list) {
      document.getElementById('courseTable').innerHTML = list.map(c => `
        <tr>
          <td style="font-weight:500;color:var(--primary)">${c.name}</td>
          <td>${c.college}</td>
          <td>${c.teacher}</td>
          <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${c.class}">${c.class}</td>
          <td>${c.classroom}</td>
          <td style="font-size:12px;">${c.schedule}</td>
          <td>${c.students}</td>
          <td><span class="badge badge-success">授课中</span></td>
          <td>
            <button class="btn-link" onclick="window.location.href='pages/course-detail.html?id=${c.id}'">详情</button>
            <button class="btn-link" onclick="window.location.href='pages/timeline.html'">活动</button>
          </td>
        </tr>
      `).join('') || '<tr><td colspan="9"><div class="empty-state">未找到匹配的课程</div></td></tr>';
    }

    function filterCourses() {
      const kw = (document.getElementById('courseSearch').value || '').trim().toLowerCase();
      if (!kw) { renderCourseTable(mockCourses); return; }
      const filtered = mockCourses.filter(c =>
        c.name.toLowerCase().includes(kw) || c.teacher.includes(kw) || c.college.includes(kw)
      );
      renderCourseTable(filtered);
      Toast.success('查询完成，共 ' + filtered.length + ' 门课程');
    }

    renderCourseTable(mockCourses);
  </script>
</body>
</html>
