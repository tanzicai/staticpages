<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智慧课堂 - 统一身份认证</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .login-brand {
      text-align: center;
      color: rgba(255,255,255,0.9);
      margin-top: 24px;
      font-size: 13px;
    }
    .login-brand .version {
      opacity: 0.6;
      margin-top: 4px;
    }
    .captcha-row {
      display: flex;
      gap: 10px;
    }
    .captcha-row .form-control {
      flex: 1;
    }
    .captcha-box {
      width: 110px;
      height: 44px;
      background: #f1f5f5;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Courier New', monospace;
      font-size: 22px;
      letter-spacing: 3px;
      color: var(--primary);
      font-weight: bold;
      cursor: pointer;
      user-select: none;
      position: relative;
      overflow: hidden;
    }
    .captcha-box::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: transparent;
    }
    .captcha-text {
      position: relative;
      z-index: 1;
      text-shadow: 1px 1px 0 rgba(255,255,255,0.8);
    }
    .remember-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      font-size: 13px;
    }
    .checkbox-wrapper {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-secondary);
      cursor: pointer;
    }
    .checkbox-wrapper input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--primary);
    }
    .forgot-link {
      color: var(--primary);
      font-size: 13px;
    }
    .forgot-link:hover { text-decoration: underline; }
    .agreement {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .agreement a {
      color: var(--primary);
    }
    .login-error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: var(--radius);
      padding: 10px 14px;
      color: #dc2626;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
    .login-error.show { display: block; }
    .shake {
      animation: shake 0.4s ease-in-out;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }
    .login-loading {
      display: none;
    }
    .login-loading.show { display: inline-flex; align-items: center; gap: 8px; }
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="login-body">
  <div class="login-container" id="loginContainer">
    <div class="login-logo">
      <div class="login-logo-icon">智</div>
      <h1>智慧课堂</h1>
      <p>教学数据分析与课堂服务平台</p>
    </div>

    <div class="login-error" id="loginError">
      <span id="errorText">用户名或密码错误</span>
    </div>

    <form id="loginForm" autocomplete="off">
      <div class="form-group">
        <label>账号</label>
        <input type="text" class="form-control" id="username" placeholder="请输入统一身份认证账号" autocomplete="off" required>
      </div>

      <div class="form-group">
        <label>密码</label>
        <input type="password" class="form-control" id="password" placeholder="请输入密码" autocomplete="new-password" required>
      </div>

      <div class="form-group">
        <label>验证码</label>
        <div class="captcha-row">
          <input type="text" class="form-control" id="captcha" placeholder="请输入右侧验证码" autocomplete="off" maxlength="4" required>
          <div class="captcha-box" id="captchaBox" title="点击刷新验证码">
            <span class="captcha-text" id="captchaText"></span>
          </div>
        </div>
      </div>

      <div class="remember-row">
        <label class="checkbox-wrapper">
          <input type="checkbox" id="remember">
          <span>记住登录状态</span>
        </label>
        <a class="forgot-link" href="javascript:void(0)">忘记密码？</a>
      </div>

      <button type="submit" class="btn btn-primary" id="loginBtn">
        <span class="btn-text">登 录</span>
        <span class="login-loading" id="loginLoading">
          <span class="spinner"></span> 登录中...
        </span>
      </button>

      <div class="agreement">
        登录即表示您同意 <a href="javascript:void(0)">《平台服务协议》</a> 和 <a href="javascript:void(0)">《隐私政策》</a>
      </div>
    </form>
  </div>

  <div class="login-brand">
    <div>© 2026 Smart Campus · 智慧教学解决方案</div>
    <div class="version">Version 3.8.2 · Build 20260901</div>
  </div>

  <script src="js/common.js"></script>
  <script>
    // 验证码生成
    function generateCaptcha() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let text = '';
      for (let i = 0; i < 4; i++) {
        text += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      document.getElementById('captchaText').textContent = text;
      return text;
    }

    let currentCaptcha = generateCaptcha();
    document.getElementById('captchaBox').onclick = function() {
      currentCaptcha = generateCaptcha();
    };

    // 如果已登录，直接跳转
    if (Auth.isLoggedIn()) {
      window.location.href = 'index.html';
    }

    // 登录表单提交
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const captchaInput = document.getElementById('captcha').value.trim().toUpperCase();
      const errorBox = document.getElementById('loginError');
      const errorText = document.getElementById('errorText');
      const loginBtn = document.getElementById('loginBtn');
      const container = document.getElementById('loginContainer');

      // 隐藏错误
      errorBox.classList.remove('show');

      // 验证码校验
      if (captchaInput !== currentCaptcha) {
        errorText.textContent = '验证码错误，请重新输入';
        errorBox.classList.add('show');
        currentCaptcha = generateCaptcha();
        return;
      }

      // 登录处理
      loginBtn.disabled = true;
      loginBtn.querySelector('.btn-text').style.display = 'none';
      loginBtn.querySelector('.login-loading').classList.add('show');

      // 模拟网络延迟
      setTimeout(() => {
        const success = Auth.login(username, password);

        if (success) {
          loginBtn.innerHTML = '<span>登录成功，正在跳转...</span>';
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 600);
        } else {
          errorText.textContent = '账号或密码错误，请检查后重试';
          errorBox.classList.add('show');
          container.classList.add('shake');
          setTimeout(() => container.classList.remove('shake'), 400);

          loginBtn.disabled = false;
          loginBtn.querySelector('.btn-text').style.display = '';
          loginBtn.querySelector('.login-loading').classList.remove('show');

          // 清空密码框，刷新验证码
          document.getElementById('password').value = '';
          currentCaptcha = generateCaptcha();
          document.getElementById('captcha').value = '';
        }
      }, 800);
    });
  </script>
</body>
</html>
