<style>
:root{--ink:#1d2939;--muted:#667085;--line:#d9e1ec;--brand:#6952ff;--panel:#fff;--bg:#f6f8fb}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif}
main{width:min(1240px,calc(100% - 40px));margin:0 auto;padding:34px 0 48px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:24px}
h1{margin:4px 0 0;font-size:28px;line-height:1.25;letter-spacing:-.02em}.muted{color:var(--muted);font-size:13px;line-height:1.7;margin:0}
.toolbar{display:grid;grid-template-columns:minmax(180px,1fr) minmax(220px,1fr) auto auto;gap:10px;padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
select,button{height:40px;border:1px solid #cdd7e5;border-radius:9px;background:#fff;color:var(--ink);font:inherit;font-size:14px;padding:0 12px}
button{cursor:pointer;background:var(--ink);border-color:var(--ink);color:#fff;white-space:nowrap}button.secondary{background:#fff;color:var(--ink);border-color:#cdd7e5}
.index{padding:22px;margin-top:18px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
.index h2{font-size:18px;margin:0 0 8px}.source-note{margin:0 0 16px;color:var(--muted);font-size:13px;line-height:1.7}
.search{width:100%;height:40px;border:1px solid #cdd7e5;border-radius:9px;padding:0 12px;font:inherit;margin:6px 0 14px;background:#fff;color:var(--ink)}
.scroll{overflow:auto;border:1px solid #e5eaf2;border-radius:10px}table{width:100%;border-collapse:collapse;min-width:780px;background:#fff}
th,td{padding:11px 12px;border-bottom:1px solid #edf1f6;text-align:left;font-size:13px}th{background:#f9fafc;color:#475467;font-weight:600}tr:last-child td{border-bottom:0}
td a{color:var(--brand);text-decoration:none;font-weight:600}.pill{color:#475467;white-space:nowrap}
.chart-shell{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 18px 10px;margin-top:18px}
.chart-title{font-size:18px;font-weight:600;margin:0 0 2px}.chart-sub{color:var(--muted);font-size:12px;margin-bottom:12px}.plot{position:relative}.plot svg{display:block;width:100%;height:auto}
.caption{text-align:center;color:#475467;font-size:13px;padding:6px 0 10px}
.tooltip{position:absolute;z-index:20;display:none;min-width:160px;padding:12px 14px;border:1px solid #dce3ee;border-radius:10px;background:rgba(255,255,255,.98);box-shadow:0 12px 32px rgba(32,50,78,.18);font-size:13px;line-height:1.65;pointer-events:none}
.tooltip strong{display:block;font-size:15px;margin-bottom:2px}.tooltip .score{font-size:20px;font-weight:700;color:var(--brand)}.tooltip .teacher{color:#475467}
.point{cursor:crosshair;outline:none}.point circle{transition:r .15s ease,stroke-width .15s ease}.point:hover circle,.point:focus circle{r:6;stroke:#fff;stroke-width:2}
body.chart-only{background:#fff}body.chart-only main{width:min(980px,calc(100% - 36px));min-height:100vh;display:flex;flex-direction:column;justify-content:center}body.chart-only header,body.chart-only .toolbar{display:none}body.chart-only .index{display:none}
@media(max-width:760px){main{width:calc(100% - 24px);padding-top:20px}header{align-items:flex-start;flex-direction:column}.toolbar{grid-template-columns:1fr}.index{padding:16px}.chart-shell{padding:12px 8px 6px}}
</style>

  <header>

  </section>
</main>

<script>
const payload=JSON.parse(document.getElementById('payload').textContent);
const charts=payload.charts;
const el=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
payload.courses.forEach(c=>el('course').add(new Option(`${c.name} · ${c.teacher}`,c.id)));
payload.metrics.forEach(m=>el('metric').add(new Option(`${m.type} · ${m.name}`,m.type)));
function openChart(){location.search=`?type=${el('metric').value}&classid=${el('course').value}`;}
el('show').onclick=openChart;

function render(chart){
  document.body.classList.add('chart-only');
  el('indexSection').hidden=true;
  el('content').innerHTML=`<section class="chart-shell"><h2 class="chart-title">${esc(chart.course)} · ${esc(chart.metric)}</h2><div class="chart-sub">${esc(chart.phase)} · ${esc(chart.state)}</div><div class="plot"></div><div class="caption">${esc(chart.course)} · ${esc(chart.metric)}</div></section>`;
  const rows=chart.rows.slice().sort((a,b)=>a.time.localeCompare(b.time));
  const W=1100,H=390,L=78,R=35,T=28,B=72;
  const times=rows.map(r=>Date.parse(r.time.replace(' ','T')));
  let min=Math.min(...times),max=Math.max(...times);
  if(!Number.isFinite(min)||!Number.isFinite(max)){min=Date.now()-3600e3;max=Date.now()+3600e3;}
  if(min===max){min-=43200000;max+=43200000;}
  const X=t=>L+(Date.parse(t.replace(' ','T'))-min)/(max-min)*(W-L-R);
  const Y=v=>T+(100-v)/100*(H-T-B);
  const color='#6952ff';
  let svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(chart.course)}${esc(chart.metric)}时间得分趋势">`;
  [0,20,40,60,80,100].forEach(v=>{
    svg+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#e8edf4"/><text x="${L-16}" y="${Y(v)+5}" text-anchor="end" fill="#8990a3" font-size="13">${v}</text>`;
  });
  const dates=[...new Map(rows.map(r=>[r.time.slice(0,10),r.time])).entries()];
  dates.forEach(([date,time])=>{
    const x=X(time);
    svg+=`<line x1="${x}" x2="${x}" y1="${T}" y2="${H-B}" stroke="#d6deeb" stroke-dasharray="3 4"/><text x="${x}" y="${H-B+25}" text-anchor="middle" fill="#78859a" font-size="12">${esc(date.slice(5))}</text>`;
  });
  if(rows.length){
    const points=rows.map(r=>`${X(r.time)},${Y(r.score)}`).join(' ');
    svg+=`<polyline points="${points}" fill="none" stroke="${color}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
    rows.forEach(r=>{
      const x=X(r.time),y=Y(r.score);
      svg+=`<g class="point" tabindex="0" role="img" aria-label="${esc(chart.course)}，得分${esc(r.score)}分，教师${esc(r.teacher)}" data-course="${esc(chart.course)}" data-score="${esc(r.score)}" data-teacher="${esc(r.teacher)}" data-cx="${x}" data-cy="${y}"><circle cx="${x}" cy="${y}" r="12" fill="transparent"/><circle cx="${x}" cy="${y}" r="4" fill="${color}" pointer-events="none"/></g>`;
    });
  }
  svg+=`<text transform="translate(22,${(T+H-B)/2}) rotate(-90)" text-anchor="middle" fill="#78859a" font-size="13">得分（分）</text><text x="${(L+W-R)/2}" y="${H-16}" text-anchor="middle" fill="#78859a" font-size="13">日期</text></svg>`;
  const plot=el('content').querySelector('.plot');
  plot.innerHTML=svg+'<div class="tooltip" id="tooltip" role="tooltip"><strong data-course></strong><div>得分：<span class="score" data-score></span> 分</div><div class="teacher">教师名称：<span data-teacher></span></div></div>';
  const tip=plot.querySelector('#tooltip'),svgEl=plot.querySelector('svg');
  const hide=()=>tip.style.display='none';
  const show=e=>{
    const point=e.currentTarget;
    tip.querySelector('[data-course]').textContent=point.dataset.course;
    tip.querySelector('[data-score]').textContent=point.dataset.score;
    tip.querySelector('[data-teacher]').textContent=point.dataset.teacher;
    tip.style.display='block';
    const plotRect=plot.getBoundingClientRect(),svgRect=svgEl.getBoundingClientRect();
    const anchorX=svgRect.left-plotRect.left+Number(point.dataset.cx)/W*svgRect.width;
    const anchorY=svgRect.top-plotRect.top+Number(point.dataset.cy)/H*svgRect.height;
    const tw=tip.offsetWidth,th=tip.offsetHeight,pad=8;
    let left=anchorX+12,top=anchorY-th-12;
    if(left+tw>plot.clientWidth-pad)left=anchorX-tw-12;
    if(top<pad)top=anchorY+12;
    tip.style.left=`${Math.max(pad,Math.min(left,plot.clientWidth-tw-pad))}px`;
    tip.style.top=`${Math.max(pad,Math.min(top,plot.clientHeight-th-pad))}px`;
  };
  plot.querySelectorAll('.point').forEach(p=>{p.addEventListener('pointerenter',show);p.addEventListener('pointerdown',show);p.addEventListener('focus',show);p.addEventListener('pointerleave',hide);p.addEventListener('blur',hide);});
  window.addEventListener('resize',hide);
  el('download').onclick=()=>{
    const data=[['课程名称','得分','教师名称','时间'],...rows.map(r=>[r.course,r.score,r.teacher,r.time])];
    const text='\ufeff'+data.map(row=>row.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));a.download=`${chart.course}_${chart.metric}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  };
}

function renderIndex(){
  const q=el('search').value.trim().toLowerCase();
  el('indexBody').innerHTML=charts.filter(c=>`${c.course} ${c.teacher} ${c.metric} ${c.phase}`.toLowerCase().includes(q)).map(c=>`<tr><td>${c.type}</td><td>${esc(c.course)}</td><td>${esc(c.teacher)}</td><td>${esc(c.metric)}</td><td>${esc(c.phase)}</td><td>${c.rows.length}</td><td class="pill">${esc(c.state)}</td><td><a href="?type=${c.type}&classid=${c.classid}">查看图表 ↗</a></td></tr>`).join('');
}
el('search').oninput=renderIndex;
const params=new URLSearchParams(location.search);
const type=Number(params.get('type')),classid=params.get('classid');
if(type&&classid){
  const chart=charts.find(c=>c.type===type&&c.classid===classid);
  if(chart)render(chart);else{el('content').textContent='未找到该课程指标。';el('indexSection').hidden=false;}
}else{
  el('back').hidden=true;el('download').hidden=true;renderIndex();
}
</script>
</html>
