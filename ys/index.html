<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>智慧教学平台</title>
    <!-- ECharts CDN -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js">
    </script>
    <!-- Font Awesome 6 (免费) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ========== SoybeanAdmin 风格重置 & 全局 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        :root {
            --primary: #4F6EF7;
            --primary-light: #7B93FA;
            --primary-bg: #F0F4FF;
            --sidebar-width: 240px;
            --header-height: 60px;
            --bg-body: #F6F8FC;
            --card-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
            --radius: 12px;
            --text-main: #1E293B;
            --text-secondary: #64748B;
            --border-color: #E9EDF4;
            --tag-blue: #EFF6FF;
            --tag-green: #ECFDF5;
            --tag-orange: #FFFBEB;
            --tag-red: #FEF2F2;
        }
        body {
            background: var(--bg-body);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
        }
        a {
            text-decoration: none;
            color: inherit;
        }
        button {
            cursor: pointer;
            border: none;
            outline: none;
            background: transparent;
            font-size: 14px;
        }
        input,
        select,
        textarea {
            font-size: 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 12px;
            background: #fff;
            outline: none;
            transition: 0.2s;
        }
        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 110, 247, 0.15);
        }
        textarea {
            resize: vertical;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th {
            text-align: left;
            padding: 12px 12px;
            background: #F8FAFC;
            color: var(--text-secondary);
            font-weight: 500;
            border-bottom: 1px solid var(--border-color);
        }
        td {
            padding: 12px;
            border-bottom: 1px solid #F1F5F9;
        }
        .badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        .badge-blue {
            background: var(--tag-blue);
            color: #2563EB;
        }
        .badge-green {
            background: var(--tag-green);
            color: #059669;
        }
        .badge-orange {
            background: var(--tag-orange);
            color: #D97706;
        }
        .badge-red {
            background: var(--tag-red);
            color: #DC2626;
        }

        /* ===== 布局 ===== */
        #app {
            display: flex;
            height: 100vh;
        }
        /* 侧边栏 */
        .sidebar {
            width: var(--sidebar-width);
            background: #fff;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: 0.3s;
            z-index: 100;
            overflow-y: auto;
            padding-bottom: 20px;
        }
        .sidebar .logo {
            height: var(--header-height);
            display: flex;
            align-items: center;
            padding: 0 20px;
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
            border-bottom: 1px solid var(--border-color);
        }
        .sidebar .logo i {
            margin-right: 10px;
        }
        .sidebar .menu {
            padding: 16px 12px;
            flex: 1;
        }
        .sidebar .menu .menu-item {
            display: flex;
            align-items: center;
            padding: 10px 16px;
            border-radius: 10px;
            margin-bottom: 4px;
            color: var(--text-secondary);
            transition: 0.2s;
            font-weight: 500;
            cursor: pointer;
        }
        .sidebar .menu .menu-item i {
            width: 24px;
            margin-right: 12px;
            font-size: 16px;
        }
        .sidebar .menu .menu-item:hover {
            background: var(--primary-bg);
            color: var(--primary);
        }
        .sidebar .menu .menu-item.active {
            background: var(--primary);
            color: #fff;
        }
        .sidebar .menu .menu-group {
            font-size: 12px;
            color: var(--text-secondary);
            padding: 16px 16px 8px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        /* 主内容 */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header {
            height: var(--header-height);
            background: #fff;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            flex-shrink: 0;
        }
        .header .user {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 14px;
            color: var(--text-secondary);
        }
        .header .user .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }
        .header .user .logout-btn {
            color: var(--text-secondary);
            font-size: 14px;
            padding: 6px 14px;
            border-radius: 8px;
            background: #F1F4F9;
            transition: 0.2s;
        }
        .header .user .logout-btn:hover {
            background: #E2E8F0;
        }
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 24px 28px 40px;
        }
        /* 页面容器 */
        .page {
            display: none;
            animation: fadeIn 0.25s ease;
        }
        .page.active {
            display: block;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== 登录页 ===== */
        #page-login {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(135deg, #EEF2FF 0%, #F8FAFC 100%);
        }
        #page-login .login-box {
            background: #fff;
            padding: 48px 40px;
            border-radius: 24px;
            width: 400px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
        }
        #page-login .login-box h1 {
            font-size: 28px;
            color: var(--primary);
            margin-bottom: 8px;
        }
        #page-login .login-box .sub {
            color: var(--text-secondary);
            margin-bottom: 32px;
        }
        #page-login .login-box .form-group {
            margin-bottom: 20px;
        }
        #page-login .login-box .form-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 6px;
            color: var(--text-main);
        }
        #page-login .login-box .form-group input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
        }
        #page-login .login-box .login-btn {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: #fff;
            border-radius: 10px;
            font-weight: 600;
            font-size: 16px;
            transition: 0.2s;
        }
        #page-login .login-box .login-btn:hover {
            background: #3B56D9;
        }
        #page-login .login-box .error-msg {
            color: #DC2626;
            font-size: 14px;
            margin-top: 12px;
            text-align: center;
        }
        #page-login .login-box .footer {
            text-align: center;
            margin-top: 24px;
            color: var(--text-secondary);
            font-size: 13px;
        }
        /* 登录页隐藏主布局 */
        #page-login .main {
            display: none;
        }
        #page-login .sidebar {
            display: none;
        }
        #app.login-mode {
            display: block;
        }
        #app.login-mode .main {
            display: none;
        }
        #app.login-mode .sidebar {
            display: none;
        }

        /* ===== 通用组件 ===== */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .page-header h2 {
            font-size: 22px;
            font-weight: 600;
        }
        .page-header .breadcrumb {
            font-size: 14px;
            color: var(--text-secondary);
        }
        .page-header .breadcrumb span {
            cursor: pointer;
        }
        .page-header .breadcrumb span:hover {
            color: var(--primary);
        }

        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            background: #fff;
            padding: 16px 20px;
            border-radius: var(--radius);
            box-shadow: var(--card-shadow);
            margin-bottom: 20px;
            align-items: center;
        }
        .filter-bar input,
        .filter-bar select {
            min-width: 160px;
        }
        .filter-bar .btn {
            padding: 8px 20px;
            border-radius: 8px;
            font-weight: 500;
        }
        .filter-bar .btn-primary {
            background: var(--primary);
            color: #fff;
        }
        .filter-bar .btn-primary:hover {
            background: #3B56D9;
        }
        .filter-bar .btn-outline {
            background: transparent;
            border: 1px solid var(--border-color);
        }
        .filter-bar .btn-outline:hover {
            background: #F1F4F9;
        }

        .card-table {
            background: #fff;
            border-radius: var(--radius);
            box-shadow: var(--card-shadow);
            padding: 16px 20px 8px;
            overflow-x: auto;
        }
        .card-table .toolbar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .card-table .toolbar .left {
            display: flex;
            gap: 8px;
        }
        .card-table .toolbar .btn {
            padding: 6px 16px;
            border-radius: 8px;
            font-weight: 500;
            font-size: 14px;
        }
        .card-table .toolbar .btn-primary {
            background: var(--primary);
            color: #fff;
        }
        .card-table .toolbar .btn-primary:hover {
            background: #3B56D9;
        }
        .card-table .toolbar .btn-danger {
            background: #FEE2E2;
            color: #DC2626;
        }
        .card-table .toolbar .btn-danger:hover {
            background: #FECACA;
        }

        .pagination {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 12px;
            padding: 16px 0 8px;
            font-size: 14px;
            color: var(--text-secondary);
        }
        .pagination select {
            padding: 4px 8px;
            border-radius: 6px;
        }
        .pagination .page-num {
            display: flex;
            gap: 4px;
        }
        .pagination .page-num button {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            background: transparent;
            font-weight: 500;
        }
        .pagination .page-num button.active {
            background: var(--primary);
            color: #fff;
        }
        .pagination .page-num button:hover:not(.active) {
            background: #F1F4F9;
        }

        /* 详情页 */
        .detail-container {
            background: #fff;
            border-radius: var(--radius);
            box-shadow: var(--card-shadow);
            padding: 24px 28px;
            margin-bottom: 20px;
        }
        .detail-container .detail-row {
            display: flex;
            padding: 12px 0;
            border-bottom: 1px solid #F1F5F9;
        }
        .detail-container .detail-row:last-child {
            border-bottom: none;
        }
        .detail-container .detail-label {
            width: 140px;
            flex-shrink: 0;
            color: var(--text-secondary);
            font-weight: 500;
        }
        .detail-container .detail-value {
            flex: 1;
        }
        .detail-container .detail-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
            flex-wrap: wrap;
        }
        .detail-container .detail-actions .btn {
            padding: 8px 24px;
            border-radius: 8px;
            font-weight: 500;
        }
        .detail-container .detail-actions .btn-primary {
            background: var(--primary);
            color: #fff;
        }
        .detail-container .detail-actions .btn-outline {
            border: 1px solid var(--border-color);
        }
        .detail-container .detail-actions .btn-outline:hover {
            background: #F1F4F9;
        }

        /* 参数配置弹窗 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            z-index: 999;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-box {
            background: #fff;
            border-radius: 20px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            padding: 28px 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            animation: fadeIn 0.2s ease;
        }
        .modal-box h3 {
            font-size: 20px;
            margin-bottom: 20px;
        }
        .modal-box .form-group {
            margin-bottom: 18px;
        }
        .modal-box .form-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 4px;
            color: var(--text-secondary);
        }
        .modal-box .form-group input,
        .modal-box .form-group select {
            width: 100%;
            padding: 10px 14px;
        }
        .modal-box .form-group .hint {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        .modal-box .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 24px;
        }
        .modal-box .modal-actions .btn {
            padding: 8px 28px;
            border-radius: 8px;
            font-weight: 500;
        }
        .modal-box .modal-actions .btn-primary {
            background: var(--primary);
            color: #fff;
        }
        .modal-box .modal-actions .btn-outline {
            border: 1px solid var(--border-color);
        }

        /* 关联数据 */
        .rel-table {
            margin-top: 20px;
        }
        .rel-table h4 {
            font-size: 16px;
            margin-bottom: 12px;
            color: var(--text-secondary);
        }

        /* 首页统计卡片 */
        .stat-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: #fff;
            border-radius: var(--radius);
            box-shadow: var(--card-shadow);
            padding: 20px 24px;
            cursor: pointer;
            transition: 0.2s;
        }
        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.07);
        }
        .stat-card .num {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-main);
        }
        .stat-card .label {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        .stat-card .icon {
            float: right;
            font-size: 32px;
            opacity: 0.2;
        }

        .chart-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }
        .chart-box {
            background: #fff;
            border-radius: var(--radius);
            box-shadow: var(--card-shadow);
            padding: 16px;
            height: 300px;
        }
        .chart-box h4 {
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-secondary);
        }
        .chart-box .chart-container {
            width: 100%;
            height: calc(100% - 30px);
        }

        .quick-entry {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 8px;
        }
        .quick-entry .entry-item {
            background: var(--primary-bg);
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 14px;
            color: var(--primary);
            cursor: pointer;
            transition: 0.2s;
        }
        .quick-entry .entry-item:hover {
            background: var(--primary);
            color: #fff;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .sidebar {
                width: 64px;
            }
            .sidebar .logo span {
                display: none;
            }
            .sidebar .menu .menu-item span {
                display: none;
            }
            .sidebar .menu .menu-item i {
                margin-right: 0;
            }
            .sidebar .menu .menu-group {
                display: none;
            }
            .chart-row {
                grid-template-columns: 1fr;
            }
            .filter-bar {
                flex-direction: column;
                align-items: stretch;
            }
        }
        /* 图片批注占位 */
        .annotation-area {
            background: #F8FAFC;
            border: 2px dashed #D1D9E6;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            color: var(--text-secondary);
            min-height: 200px;
            position: relative;
        }
        .annotation-area .mock-img {
            max-width: 100%;
            max-height: 180px;
            background: #E9EDF4;
            border-radius: 8px;
            display: inline-block;
            padding: 30px 60px;
            font-size: 40px;
        }
        .annotation-tools {
            margin-top: 16px;
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .annotation-tools .btn {
            padding: 4px 16px;
            border-radius: 6px;
            background: #fff;
            border: 1px solid var(--border-color);
            font-size: 13px;
        }
        .annotation-tools .btn-primary {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
    </style>
</head>
<body>

    <div id="app" class="login-mode">
        <!-- ========== 登录页 ========== -->
        <div id="page-login" class="page active">
            <div class="login-box">
                <h1><i class="fas fa-graduation-cap" style="color:#4F6EF7;"></i> 智慧教学</h1>
                <div class="sub">统一身份认证平台</div>
                <div class="form-group">
                    <label>账号</label>
                    <input type="text" id="login-username" value="admin" />
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="login-password" value="123456" />
                </div>
                <button class="login-btn" id="login-btn">登 录</button>
                <div id="login-error" class="error-msg"></div>
                <div class="footer">© 2026 智慧教学平台 v3.0</div>
            </div>
        </div>

        <!-- ========== 主布局 ========== -->
        <div class="sidebar" id="sidebar">
            <div class="logo">
                <i class="fas fa-graduation-cap"></i>
                <span>智慧教学</span>
            </div>
            <div class="menu" id="menu-container">
                <!-- 由JS动态生成 -->
            </div>
        </div>
        <div class="main">
            <div class="header">
                <div style="font-size:16px;font-weight:500;">工作台</div>
                <div class="user">
                    <span id="header-username">admin</span>
                    <div class="avatar">A</div>
                    <button class="logout-btn" id="logout-btn"><i class="fas fa-sign-out-alt"></i> 退出</button>
                </div>
            </div>
            <div class="content" id="content-area">
                <!-- 所有页面由JS渲染 -->
            </div>
        </div>
    </div>

    <!-- ========== 全局模态框 ========== -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-box" id="modal-box">
            <h3 id="modal-title">标题</h3>
            <div id="modal-body"></div>
            <div class="modal-actions">
                <button class="btn btn-outline" id="modal-cancel">取消</button>
                <button class="btn btn-primary" id="modal-confirm">确认</button>
            </div>
        </div>
    </div>

    <script>
        // ================================================================
        //  数据层
        // ================================================================
        const STORAGE_KEY = 'teach_platform_data';
        let DB = {};

        // 默认数据生成
        function getDefaultDB() {
            const now = Date.now();
            const genId = () => Math.random().toString(36).substr(2, 8);

            // 素材库
            const materials = [];
            for (let i = 1; i <= 25; i++) {
                materials.push({
                    id: 'mat_' + genId(),
                    name: `教学资源_${i}`,
                    type: ['视频', '文档', '音频', '图书'][i % 4],
                    size: (2 + Math.random() * 3).toFixed(2) + 'GB',
                    uploadTime: new Date(now - i * 86400000 * 3).toLocaleDateString(),
                    status: ['已完成', '处理中', '已完成', '已完成'][i % 4],
                    desc: `第${i}批教学素材，用于课程建设`
                });
            }
            // 教师团队
            const teams = [];
            for (let i = 1; i <= 18; i++) {
                teams.push({
                    id: 'team_' + genId(),
                    name: `教学团队_${i}`,
                    leader: `张${i}${i%2?'老师':'教授'}`,
                    members: Math.floor(3 + Math.random() * 8),
                    classCount: Math.floor(1 + Math.random() * 5),
                    status: ['活跃', '停用', '活跃', '活跃'][i % 4],
                    desc: `负责${['数学','语文','英语','物理','化学'][i%5]}课程建设`
                });
            }
            // 智能批阅 (作业)
            const smartMarks = [];
            for (let i = 1; i <= 20; i++) {
                smartMarks.push({
                    id: 'sm_' + genId(),
                    title: `主观题作业_${i}`,
                    student: `学生${String.fromCharCode(65 + i % 26)}`,
                    submitTime: new Date(now - i * 3600000 * 2).toLocaleString(),
                    similarity: (60 + Math.random() * 35).toFixed(1) + '%',
                    score: Math.floor(40 + Math.random() * 60),

        function loadDB() {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) {
                try { DB = JSON.parse(raw); } catch (e) { DB = getDefaultDB(); }
            } else {
                DB = getDefaultDB();
            }
            // 保证所有key存在
            const def = getDefaultDB();
            for (let k in def) {
                if (!(k in DB)) DB[k] = def[k];
            }
            if (!DB.params) DB.params = def.params;
            for (let k in def.params) {
                if (!DB.params[k]) DB.params[k] = def.params[k];
            }
            saveDB();
        }

            localStorage.setItem(STORAGE_KEY, JSON.stringify(DB));

        function renderMenu() {
            const container = document.getElementById('menu-container');
            let html = '';

            for (const item of menuConfig) {
                if (item.group !== lastGroup) {
                    if (lastGroup) html += '</div>';
                    html += `<div class="menu-group">${item.group}</div>`;
                    lastGroup = item.group;
                }
                html += `<div class="menu-item" data-page="${item.id}">
                    <i class="fas ${item.icon}"></i>
                    <span>${item.label}</span>
                </div>`;
            }
            container.innerHTML = html;
            // 点击菜单
            container.querySelectorAll('.menu-item').forEach(el => {
                el.addEventListener('click', function() {
                    const page = this.dataset.page;
                    navigateTo(page);
                });
            });
            highlightMenu(currentPage);
        }

        function highlightMenu(page) {
            document.querySelectorAll('.menu-item').forEach(el => {
                el.classList.toggle('active', el.dataset.page === page);
            });
            // 更新顶栏标题
            const found = menuConfig.find(m => m.id === page);
            if (found) {
                document.querySelector('.header > div:first-child').textContent = found.label;
            }
        }

        function navigateTo(page, params) {
            currentPage = page;
            highlightMenu(page);
            if (page === 'dashboard') {
                renderDashboard();
            } else {
                const mod = menuConfig.find(m => m.id === page);
                if (mod) {
                    currentModule = mod.id;
                    renderListPage(mod.id);
                }
            }
            // 关闭所有模态框
            closeModal();
            window.scrollTo(0, 0);

        function renderTableRows(module, data, page = 1, limit = 10) {
            const start = (page - 1) * limit;
            const end = start + limit;
            const slice = data.slice(start, end);
            const columns = getColumns(module);
            if (slice.length === 0) {
                return `<tr><td colspan="${columns.length+1}" style="text-align:center;color:#94A3B8;padding:40px;">暂无数据</td></tr>`;
            }
            return slice.map(item => {
                const cells = columns.map(c => {
                    let val = item[c.key] ?? '-';
                    if (c.key === 'status') {
                        const cls = {
                            '已完成': 'badge-green',
                            '处理中': 'badge-orange',
                            '活跃': 'badge-green',
                            '停用': 'badge-red',
                            '待批阅': 'badge-orange',
                            '已批阅': 'badge-green',
                            '已阅': 'badge-green',
                            '待阅': 'badge-orange',
                            '已发布': 'badge-green',
                            '草稿': 'badge-orange',
                            '已掌握': 'badge-green',
                            '未掌握': 'badge-red',
                            '可在线阅读': 'badge-blue',
                            '已推荐': 'badge-green',
                            '已建课': 'badge-green',
                            '备课中': 'badge-orange',
                            '待查重': 'badge-orange',
                            '已查重': 'badge-blue',
                            '待互评': 'badge-orange',
                            '已互评': 'badge-green',
                            '安全': 'badge-green',
                            '风险': 'badge-red'
                        };
                        return `<span class="badge ${cls[val] || 'badge-blue'}">${val}</span>`;
                    }
                    return val;
                }).join('');
                return `<tr>
                    <td><input type="checkbox" class="row-checkbox" data-id="${item.id}" /></td>
                    ${cells}
                    <td>
                        <button class="btn btn-primary" style="padding:2px 12px;font-size:13px;" onclick="viewDetail('${module}','${item.id}')">查看</button>
                        <button class="btn btn-outline" style="padding:2px 12px;font-size:13px;" onclick="openEditModal('${module}','${item.id}')">编辑</button>
                        <button class="btn btn-danger" style="padding:2px 12px;font-size:13px;color:#DC2626;" onclick="deleteItem('${module}','${item.id}')">删除</button>
                    </td>
                </tr>`;
            }).join('');
        }

        function renderPagination(module, total) {
            const page = getPage(module);
            const limit = getLimit(module);
            const totalPages = Math.ceil(total / limit) || 1;
            let html =
                `<span>共 ${total} 条</span>
                <select onchange="changeLimit('${module}',this.value)">
                    <option value="10" ${limit===10?'selected':''}>10条/页</option>
                    <option value="20" ${limit===20?'selected':''}>20条/页</option>
                </select>
                <div class="page-num">`;
            for (let i = 1; i <= Math.min(totalPages, 10); i++) {
                html += `<button class="${i===page?'active':''}" onclick="goPage('${module}',${i})">${i}</button>`;
            }
            if (totalPages > 10) html += `<span>...</span>`;
            html += `</div>`;
            return html;
        }

        // 分页状态存储
        const pageState = {};

        function getPage(module) { return pageState[module]?.page || 1; }

        function getLimit(module) { return pageState[module]?.limit || 10; }

        function goPage(module, p) {
            if (!pageState[module]) pageState[module] = { page: 1, limit: 10 };
            pageState[module].page = p;
            refreshTable(module);
        }

        function changeLimit(module, val) {
            if (!pageState[module]) pageState[module] = { page: 1, limit: 10 };
            pageState[module].limit = parseInt(val);
            pageState[module].page = 1;
            refreshTable(module);
        }

        function attachPaginationEvents(module) {
            // 已内联
        }

        function refreshTable(module) {
            const data = getData(module);
            const p = getPage(module);
            const l = getLimit(module);
            const tbody = document.getElementById(`table-body-${module}`);
            if (tbody) tbody.innerHTML = renderTableRows(module, data, p, l);
            const pag = document.getElementById(`pagination-${module}`);
            if (pag) pag.innerHTML = renderPagination(module, data.length);
            // 更新总数显示
            const toolbar = document.querySelector(`#page-${module} .toolbar .left span`);
            if (toolbar) toolbar.textContent = `共 ${data.length} 条记录`;
            // 重新绑定分页事件
            attachPaginationEvents(module);
        }

        function doSearch(module) {
            const keyword = document.getElementById(`search-${module}`)?.value?.trim() || '';
            const status = document.getElementById(`status-${module}`)?.value || '';
            let data = getData(module);
            if (keyword) {
                const cols = getColumns(module);
                data = data.filter(item => {
                    return cols.some(c => {
                        const v = String(item[c.key] || '');
                        return v.includes(keyword);
                    });
                });
            }
            if (status) {
                data = data.filter(item => item.status === status);
            }
            // 暂存过滤结果
            if (!pageState[module]) pageState[module] = { page: 1, limit: 10 };
            pageState[module].page = 1;
            pageState[module].filteredData = data;
            const tbody = document.getElementById(`table-body-${module}`);
            if (tbody) tbody.innerHTML = renderTableRows(module, data, 1, getLimit(module));
            const pag = document.getElementById(`pagination-${module}`);
            if (pag) pag.innerHTML = renderPagination(module, data.length);
            // 更新总数
            const toolbar = document.querySelector(`#page-${module} .toolbar .left span`);
            if (toolbar) toolbar.textContent = `共 ${data.length} 条记录`;
        }

        function resetSearch(module) {
            document.getElementById(`search-${module}`).value = '';
            document.getElementById(`status-${module}`).value = '';
            delete pageState[module]?.filteredData;
            refreshTable(module);
        }

        let modalCallback = null;
        let modalData = {};

        function showModal(title, fields, item, callback, mode) {
            const overlay = document.getElementById('modal-overlay');
            document.getElementById('modal-title').textContent = title;
            const body = document.getElementById('modal-body');
            let html = '';
            fields.forEach(f => {
                const val = item ? (item[f.key] !== undefined ? item[f.key] : '') : (f.value || '');
                let input = '';
                if (f.type === 'select') {
                    const opts = f.options.map(o => `<option value="${o}" ${val===o?'selected':''}>${o}</option>`).join('');
                    input = `<select id="field-${f.key}">${opts}</select>`;
                } else if (f.type === 'textarea') {
                    input = `<textarea id="field-${f.key}" rows="3">${val}</textarea>`;
                } else {
                    input = `<input type="${f.type||'text'}" id="field-${f.key}" value="${val}" />`;
                }
                html += `<div class="form-group"><label>${f.label}</label>${input}</div>`;
            });
            body.innerHTML = html;
            modalCallback = callback;
            modalData = { fields, item };
            overlay.classList.add('active');
            // 绑定确认
            document.getElementById('modal-confirm').onclick = function() {
                const data = {};
                let valid = true;
                fields.forEach(f => {
                    const el = document.getElementById(`field-${f.key}`);
                    if (el) {
                        const val = el.value;
                        if (f.key === 'members' || f.key === 'classCount' || f.key === 'score' || f.key ===
                            'totalScore' || f.key === 'givenScore' || f.key === 'questionCount' || f.key ===
                            'knowledgeCount') {
                            data[f.key] = parseInt(val) || 0;
                        } else {
                            data[f.key] = val;
                        }
                        // 简单必填校验
                        if (!val && f.key !== 'desc' && f.key !== 'comment' && f.key !== 'answer' && f.key !==
                            'aiExplain' && f.key !== 'desc') {
                            valid = false;
                        }
                    }
                });
                if (!valid) {
                    alert('请填写所有必填字段');
                    return;
                }
                if (modalCallback) modalCallback(data);
            };
            document.getElementById('modal-cancel').onclick = closeModal;
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.remove('active');
            modalCallback = null;
        }

        function openParamsModal(module) {
            const params = DB.params[module] || {};
            const label = getModuleLabel(module);
            const configs = getParamConfigs(module);
            let html = '';
            configs.forEach(c => {
                const val = params[c.key] !== undefined ? params[c.key] : c.default;
                let input = '';
                if (c.type === 'select') {
                    const opts = c.options.map(o => `<option value="${o}" ${val==o?'selected':''}>${o}</option>`).join('');
                    input = `<select id="param-${c.key}">${opts}</select>`;
                } else if (c.type === 'switch') {
                    input =
                        `<select id="param-${c.key}"><option value="true" ${val===true?'selected':''}>开启</option><option value="false" ${val===false?'selected':''}>关闭</option></select>`;
                } else if (c.type === 'number') {
                    input = `<input type="number" id="param-${c.key}" value="${val}" />`;
                } else {
                    input = `<input type="text" id="param-${c.key}" value="${val}" />`;
                }
                html += `<div class="form-group"><label>${c.label}</label>${input}<div class="hint">${c.hint||''}</div></div>`;
            });
            showModal(`${label} - 参数配置`, [], null, function(data) {
                // 收集参数

                configs.forEach(c => {
                    const el = document.getElementById(`param-${c.key}`);
                    if (el) {
                        let v = el.value;
                        if (c.type === 'number') v = parseFloat(v) || 0;
                        if (c.type === 'switch') v = v === 'true';
                        newParams[c.key] = v;
                    }
                });
                DB.params[module] = { ...DB.params[module], ...newParams };
                saveDB();
                closeModal();
                alert('参数保存成功！');

                onlineMarks: [
                    { key: 'scoreRange', label: '满分值', type: 'number', default: 100 },
                    { key: 'commentTemplate', label: '评语模板', type: 'select', options: ['通用', '详细', '简洁'], default: '通用' }
                ],
                quizzes: [
                    { key: 'eachScore', label: '每题分值', type: 'number', default: 5 },
                    { key: 'knowledgeWeight', label: '知识点权重', type: 'number', default: 0.7, hint: '0~1' }
                ],
                wrongBooks: [
                    { key: 'aiExplain', label: 'AI讲解开关', type: 'switch', default: true },
                    { key: 'recommendCount', label: '推荐资源数量', type: 'number', default: 3 }
                ],
                resources: [
                    { key: 'defaultReadingTime', label: '默认阅读时间(秒)', type: 'number', default: 30 },
                    { key: 'searchPrecision', label: '搜索精度', type: 'select', options: ['高', '中', '低'], default: '高' }
                ],
                courses: [
                    { key: 'markColor', label: '知识点标记颜色', type: 'text', default: '#4F6EF7' },
                    { key: 'graphStyle', label: '图谱样式', type: 'select', options: ['力导图', '环形图', '树形图'], default: '力导图' }
                ],
                homeworks: [
                    { key: 'checkThreshold', label: '查重阈值(%)', type: 'number', default: 40 },
                    { key: 'peerOpen', label: '互评开放时间(小时)', type: 'number', default: 48 }
                ],
                securities: [
                    { key: 'sensitiveLevel', label: '敏感词等级', type: 'select', options: ['标准', '严格', '宽松'], default: '标准' },
                    { key: 'detectMode', label: '检测模式', type: 'select', options: ['自动', '手动'], default: '自动' }
                ]
            };
            return map[module] || [];
        }

        // ================================================================
        //  首页仪表盘
        // ================================================================
        function renderDashboard() {
            const area = document.getElementById('content-area');
            // 统计数据
            const stats = [
                { label: '素材总量', value: DB.materials.length, icon: 'fa-folder-open', color: '#4F6EF7',
                module: 'materials' },
                { label: '教师团队', value: DB.teams.length, icon: 'fa-users', color: '#059669', module: 'teams' },
                { label: '待批阅作业', value: DB.smartMarks.filter(i => i.status === '待批阅').length, icon: 'fa-robot',
                    color: '#D97706', module: 'smartMarks' },
                { label: '待阅试卷', value: DB.onlineMarks.filter(i => i.status === '待阅').length, icon: 'fa-pen-fancy',
                    color: '#DC2626', module: 'onlineMarks' },
                { label: '错题总数', value: DB.wrongBooks.length, icon: 'fa-book-open', color: '#7C3AED',
                module: 'wrongBooks' },
                { label: '安全风险', value: DB.securities.filter(i => i.status === '风险').length, icon: 'fa-shield-alt',
                    color: '#DC2626', module: 'securities' }
            ];

            let html = `
                <div class="page active">
                    <div class="page-header"><h2>工作台</h2><div class="breadcrumb">首页</div></div>
                    <div class="stat-cards">
                        ${stats.map(s => `
                            <div class="stat-card" onclick="navigateTo('${s.module}')">
                                <div class="icon" style="color:${s.color}"><i class="fas ${s.icon}"></i></div>
                                <div class="num">${s.value}</div>
                                <div class="label">${s.label}</div>
                            </div>
                        `).join('')}
                    </div>
                    <div class="chart-row">
                        <div class="chart-box"><h4>各模块数据分布</h4><div class="chart-container" id="chart-bar"></div></div>
                        <div class="chart-box"><h4>状态占比</h4><div class="chart-container" id="chart-pie"></div></div>
                    </div>
                    <div class="chart-row">
                        <div class="chart-box"><h4>近7天趋势</h4><div class="chart-container" id="chart-line"></div></div>
                        <div class="chart-box">
                            <h4>快捷入口</h4>
                            <div class="quick-entry">
                                ${menuConfig.filter(m=>m.id!=='dashboard').map(m => `
                                    <div class="entry-item" onclick="navigateTo('${m.id}')"><i class="fas ${m.icon}"></i> ${m.label}</div>
                                `).join('')}
                            </div>
                            <div style="margin-top:24px;color:var(--text-secondary);font-size:14px;">
                                <p><i class="fas fa-clock"></i> 最近动态：${new Date().toLocaleString()} 管理员登录</p>
                                <p style="margin-top:8px;"><i class="fas fa-tasks"></i> 待办事项：${stats.filter(s=>s.value>0).length}项待处理</p>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            area.innerHTML = html;

            // 渲染 ECharts
            setTimeout(() => {
                // 柱状图
                const barChart = echarts.init(document.getElementById('chart-bar'));
                const modules = menuConfig.filter(m => m.id !== 'dashboard');
                const dataMap = {};
                modules.forEach(m => { dataMap[m.label] = DB[m.id] ? DB[m.id].length : 0; });
                barChart.setOption({
                    tooltip: { trigger: 'axis' },
                    grid: { left: '10%', right: '5%', top: '10%', bottom: '15%' },
                    xAxis: { type: 'category', data: modules.map(m => m.label), axisLabel: { rotate: 30 } },
                    yAxis: { type: 'value' },
                    series: [{
                        type: 'bar',
                        data: modules.map(m => dataMap[m.label] || 0),
                        itemStyle: { color: '#4F6EF7', borderRadius: [4, 4, 0, 0] }
                    }]
                });
                barChart.on('click', function(params) {
                    const idx = params.dataIndex;
                    const mod = modules[idx];
                    if (mod) navigateTo(mod.id);
                });
                window.addEventListener('resize', () => barChart.resize());

                // 饼图 - 状态分布（以课程为例）
                const pieChart = echarts.init(document.getElementById('chart-pie'));
                const statusMap = {};
                DB.courses.forEach(c => { statusMap[c.status] = (statusMap[c.status] || 0) + 1; });
                pieChart.setOption({
                    tooltip: { trigger: 'item' },
                    series: [{
                        type: 'pie',
                        radius: ['40%', '70%'],
                        data: Object.keys(statusMap).map(k => ({ name: k, value: statusMap[k] })),
                        color: ['#4F6EF7', '#F59E0B', '#10B981']
                    }]
                });
                window.addEventListener('resize', () => pieChart.resize());

                // 折线图 - 近7天新增
                const lineChart = echarts.init(document.getElementById('chart-line'));
                const days = ['8/14', '8/15', '8/16', '8/17', '8/18', '8/19', '8/20'];
                lineChart.setOption({
                    tooltip: { trigger: 'axis' },
                    grid: { left: '10%', right: '5%', top: '10%', bottom: '15%' },
                    xAxis: { type: 'category', data: days },
                    yAxis: { type: 'value' },
                    series: [{
                        type: 'line',
                        data: [12, 18, 15, 22, 30, 28, 35],
                        smooth: true,
                        lineStyle: { color: '#4F6EF7', width: 3 },
                        areaStyle: { color: 'rgba(79,110,247,0.1)' }
                    }]
                });
                window.addEventListener('resize', () => lineChart.resize());

                // 点击图表跳转
                document.querySelectorAll('.chart-box').forEach((box, idx) => {
                    box.style.cursor = 'pointer';
                    box.addEventListener('click', function() {
                        if (idx === 0) navigateTo('materials');
                        else if (idx === 1) navigateTo('courses');
                        else if (idx === 2) navigateTo('homeworks');
                    });
                });

            }, 100);
        }

        // ================================================================
        //  登录/退出
        // ================================================================
        function login() {
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value.trim();
            const error = document.getElementById('login-error');
            if (username === 'admin' && password === '123456') {
                error.textContent = '';
                document.getElementById('app').classList.remove('login-mode');
                document.getElementById('page-login').style.display = 'none';
                document.getElementById('header-username').textContent = username;
                // 初始化数据
                loadDB();
                renderMenu();
                navigateTo('dashboard');
            } else {
                error.textContent = '账号或密码错误，请重试';
            }
        }

        function logout() {
            if (confirm('确认退出登录吗？')) {
                document.getElementById('app').classList.add('login-mode');
                document.getElementById('page-login').style.display = 'flex';
                document.getElementById('content-area').innerHTML = '';
                currentPage = 'dashboard';
                // 清空敏感数据
                localStorage.removeItem(STORAGE_KEY);
            }
        }

        // ================================================================
        //  初始化
        // ================================================================
        document.addEventListener('DOMContentLoaded', function() {
            // 登录事件
            document.getElementById('login-btn').addEventListener('click', login);
            document.getElementById('login-password').addEventListener('keyup', function(e) {
                if (e.key === 'Enter') login();
            });
            document.getElementById('login-username').addEventListener('keyup', function(e) {
                if (e.key === 'Enter') login();
            });
            document.getElementById('logout-btn').addEventListener('click', logout);

            // 如果已登录，自动恢复（演示模式默认未登录）
            // 但为了演示方便，不自动登录
        });

        // 暴露全局函数
        window.navigateTo = navigateTo;
        window.viewDetail = viewDetail;
        window.openAddModal = openAddModal;
        window.openEditModal = openEditModal;
        window.deleteItem = deleteItem;
        window.batchDelete = batchDelete;
        window.doSearch = doSearch;
        window.resetSearch = resetSearch;
        window.goPage = goPage;
        window.changeLimit = changeLimit;
        window.closeModal = closeModal;
        window.openParamsModal = openParamsModal;
        window.renderDashboard = renderDashboard;
        window.login = login;
        window.logout = logout;

        // 预置数据初始化
        loadDB();
        // 默认显示登录页
        document.getElementById('page-login').style.display = 'flex';
        document.getElementById('app').classList.add('login-mode');
    </script>
</body>
</html>
