<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智教云 · 教育教学服务平台</title>
<style>
:root{
  --primary:#6366F1;--primary-dark:#4F46E5;--primary-light:#EEF2FF;--primary-soft:#F5F3FF;
  --bg:#F7F8FC;--card:#FFFFFF;--text:#1F2937;--text-2:#4B5563;--text-3:#9CA3AF;
  --border:#EDEFF4;--border-2:#E5E7EB;--success:#10B981;--warning:#F59E0B;--danger:#EF4444;
  --radius:12px;--radius-sm:8px;--shadow:0 1px 3px rgba(17,24,39,.04),0 1px 2px rgba(17,24,39,.06);
  --shadow-md:0 4px 16px rgba(99,102,241,.08);--shadow-lg:0 12px 40px rgba(17,24,39,.10);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:14px;outline:none}
ul,ol{list-style:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#D1D5DB;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#9CA3AF}
::-webkit-scrollbar-track{background:transparent}

/* ===== 登录页 ===== */
.login-wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#667eea 0%,#764ba2 60%,#6366F1 100%);overflow:hidden;z-index:100}
.login-wrap::before,.login-wrap::after{content:"";position:absolute;border-radius:50%;filter:blur(80px);opacity:.4}
.login-wrap::before{width:480px;height:480px;background:#A78BFA;top:-160px;right:-120px}
.login-wrap::after{width:520px;height:520px;background:#7C3AED;bottom:-200px;left:-160px}
.login-card{position:relative;width:400px;background:rgba(255,255,255,.96);backdrop-filter:blur(20px);
  border-radius:20px;padding:48px 40px 40px;box-shadow:0 24px 60px rgba(31,41,55,.25);z-index:1}
.login-logo{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.login-logo .logo-mark{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#6366F1,#8B5CF6);
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:20px;box-shadow:0 6px 16px rgba(99,102,241,.4)}
.login-logo .logo-text{font-size:20px;font-weight:700;color:#1F2937}
.login-sub{color:var(--text-3);font-size:13px;margin-bottom:32px;padding-left:56px;margin-top:-4px}
.login-field{margin-bottom:20px}
.login-field label{display:block;font-size:13px;color:var(--text-2);margin-bottom:8px;font-weight:500}
.login-input{width:100%;height:44px;padding:0 14px;border:1px solid var(--border-2);border-radius:10px;
  background:#fff;transition:all .2s}
.login-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,.12)}
.login-btn{width:100%;height:46px;background:linear-gradient(135deg,#6366F1,#7C3AED);color:#fff;border-radius:10px;
  font-size:15px;font-weight:600;margin-top:8px;transition:all .2s;box-shadow:0 6px 16px rgba(99,102,241,.35)}
.login-btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(99,102,241,.45)}
.login-btn:active{transform:translateY(0)}
.login-tip{display:flex;justify-content:space-between;margin-top:20px;font-size:12px;color:var(--text-3)}
.login-error{color:var(--danger);font-size:12px;margin-top:8px;min-height:16px;text-align:center}
.login-footer{position:absolute;bottom:24px;left:0;right:0;text-align:center;color:rgba(255,255,255,.7);font-size:12px;z-index:1}

/* ===== 主应用 ===== */
.app{display:none;height:100vh;flex-direction:column}
.app.show{display:flex}

/* 顶栏 */
.topbar{height:60px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;
  padding:0 24px;justify-content:space-between;flex-shrink:0;z-index:10}
.topbar-left{display:flex;align-items:center;gap:14px}
.topbar-logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#6366F1,#8B5CF6);
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:17px}
.topbar-title{font-size:16px;font-weight:600;color:var(--text)}
.topbar-title small{font-size:12px;color:var(--text-3);font-weight:400;margin-left:8px}
.topbar-right{display:flex;align-items:center;gap:18px}
.topbar-search{position:relative;width:280px}
.topbar-search input{width:100%;height:36px;padding:0 12px 0 36px;background:var(--bg);border:1px solid transparent;
  border-radius:18px;font-size:13px}
.topbar-search input:focus{background:#fff;border-color:var(--primary)}
.topbar-search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-3)}
.topbar-icon{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:var(--text-2);cursor:pointer;transition:all .2s;position:relative}
.topbar-icon:hover{background:var(--primary-light);color:var(--primary)}
.topbar-icon .dot{position:absolute;top:8px;right:8px;width:8px;height:8px;background:var(--danger);border-radius:50%;border:2px solid #fff}
.user-chip{display:flex;align-items:center;gap:10px;padding:4px 10px 4px 4px;border-radius:24px;cursor:pointer;transition:all .2s}
.user-chip:hover{background:var(--bg)}
.user-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#8B5CF6,#6366F1);
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:13px}
.user-name{font-size:13px;font-weight:500}
.user-role{font-size:11px;color:var(--text-3)}

/* 主体 */
.app-body{flex:1;display:flex;overflow:hidden}

/* 侧栏 */
.sidebar{width:232px;background:#fff;border-right:1px solid var(--border);flex-shrink:0;overflow-y:auto;padding:16px 0}
.nav-group{margin-bottom:6px}
.nav-group-title{padding:8px 20px;font-size:11px;color:var(--text-3);font-weight:600;letter-spacing:.5px}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 20px;cursor:pointer;color:var(--text-2);
  font-size:14px;transition:all .15s;border-left:3px solid transparent;position:relative}
.nav-item:hover{background:var(--primary-soft);color:var(--primary)}
.nav-item.active{background:var(--primary-light);color:var(--primary-dark);border-left-color:var(--primary);font-weight:600}
.nav-item svg{flex-shrink:0}
.nav-sub{padding:4px 0}
.nav-sub-item{padding:9px 20px 9px 52px;cursor:pointer;font-size:13px;color:var(--text-2);transition:all .15s}
.nav-sub-item:hover{color:var(--primary)}
.nav-sub-item.active{color:var(--primary-dark);font-weight:600;background:var(--primary-light)}

/* 内容区 */
.content{flex:1;overflow-y:auto;padding:24px}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.page-title{font-size:20px;font-weight:700;color:var(--text)}
.page-subtitle{font-size:13px;color:var(--text-3);margin-top:4px}
.breadcrumb{font-size:12px;color:var(--text-3);margin-bottom:8px}
.breadcrumb span{margin:0 6px}

/* 通用组件 */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.card-title{font-size:15px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:13px;
  font-weight:500;transition:all .2s;border:1px solid transparent}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-ghost{background:#fff;color:var(--text-2);border-color:var(--border-2)}
.btn-ghost:hover{border-color:var(--primary);color:var(--primary)}
.btn-soft{background:var(--primary-light);color:var(--primary-dark)}
.btn-soft:hover{background:#E0E7FF}
.btn-danger{background:#FEE2E2;color:var(--danger)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-lg{padding:11px 22px;font-size:14px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:6px;font-size:12px;font-weight:500}
.tag-primary{background:var(--primary-light);color:var(--primary-dark)}
.tag-success{background:#D1FAE5;color:#065F46}
.tag-warning{background:#FEF3C7;color:#92400E}
.tag-info{background:#DBEAFE;color:#1E40AF}
.tag-gray{background:#F3F4F6;color:#4B5563}
.tag-purple{background:#EDE9FE;color:#5B21B6}

.grid{display:grid;gap:16px}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
.grid-5{grid-template-columns:repeat(5,1fr)}

.stat-card{background:#fff;border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat-card .stat-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.stat-card .stat-label{font-size:13px;color:var(--text-3);margin-bottom:6px}
.stat-card .stat-value{font-size:26px;font-weight:700;color:var(--text)}
.stat-card .stat-trend{font-size:12px;margin-top:8px}
.stat-trend.up{color:var(--success)}
.stat-trend.down{color:var(--danger)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:20px}
.tab{padding:10px 18px;cursor:pointer;font-size:14px;color:var(--text-2);border-bottom:2px solid transparent;transition:all .2s;font-weight:500}
.tab:hover{color:var(--primary)}
.tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}

.seg{display:inline-flex;background:var(--bg);border-radius:8px;padding:3px;gap:2px}
.seg-item{padding:6px 14px;border-radius:6px;font-size:13px;cursor:pointer;color:var(--text-2);transition:all .2s}
.seg-item.active{background:#fff;color:var(--primary);font-weight:600;box-shadow:var(--shadow)}

.input,.select,.textarea{width:100%;height:38px;padding:0 12px;border:1px solid var(--border-2);border-radius:8px;background:#fff;transition:all .2s}
.textarea{height:auto;padding:10px 12px;line-height:1.6;resize:vertical}
.input:focus,.select:focus,.textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,.1)}
.input::placeholder,.textarea::placeholder{color:var(--text-3)}

.table{width:100%;border-collapse:collapse;font-size:13px}
.table th{background:var(--bg);padding:12px 14px;text-align:left;font-weight:600;color:var(--text-2);font-size:12px;border-bottom:1px solid var(--border)}
.table td{padding:12px 14px;border-bottom:1px solid var(--border);color:var(--text)}
.table tr:hover td{background:var(--primary-soft)}

.progress{height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.progress-bar{height:100%;background:linear-gradient(90deg,#6366F1,#8B5CF6);border-radius:4px;transition:width .6s}

/* 弹窗 */
.modal-mask{position:fixed;inset:0;background:rgba(17,24,39,.5);display:none;align-items:center;justify-content:center;z-index:200;backdrop-filter:blur(4px)}
.modal-mask.show{display:flex}
.modal{background:#fff;border-radius:14px;width:560px;max-width:92vw;max-height:86vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
.modal-header{padding:18px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:16px;font-weight:600}
.modal-close{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text-3);cursor:pointer}
.modal-close:hover{background:var(--bg);color:var(--text)}
.modal-body{padding:24px;overflow-y:auto;flex:1}
.modal-footer{padding:14px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}

/* 提示 */
.toast{position:fixed;top:24px;left:50%;transform:translateX(-50%);background:#1F2937;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;z-index:300;box-shadow:var(--shadow-lg);display:none;align-items:center;gap:8px}
.toast.show{display:flex}
.toast.success{background:#10B981}
.toast.error{background:var(--danger)}

.empty{text-align:center;padding:60px 20px;color:var(--text-3)}
.empty svg{margin-bottom:12px;opacity:.4}

/* 已移除移动端外壳样式 */

.flex{display:flex}.items-center{align-items:center}.justify-between{justify-content:space-between}
.gap-2{gap:8px}.gap-3{gap:12px}.gap-4{gap:16px}
.mt-2{margin-top:8px}.mt-3{margin-top:12px}.mt-4{margin-top:16px}.mt-6{margin-top:24px}
.mb-2{margin-bottom:8px}.mb-3{margin-bottom:12px}.mb-4{margin-bottom:16px}
.text-sm{font-size:13px}.text-xs{font-size:12px}.text-3{color:var(--text-3)}.text-2{color:var(--text-2)}
.font-bold{font-weight:700}.font-medium{font-weight:500}
.flex-1{flex:1}.text-center{text-align:center}
.hidden{display:none!important}

/* 微课/详情头部返回 */
.back-bar{display:flex;align-items:center;gap:10px;margin-bottom:16px;cursor:pointer;color:var(--text-2);font-size:13px}
.back-bar:hover{color:var(--primary)}

/* 图谱SVG */
.kg-svg{width:100%;height:520px;background:radial-gradient(circle at 50% 50%,#F5F3FF 0%,#FFFFFF 70%);border-radius:12px;border:1px solid var(--border)}
.kg-node{cursor:pointer;transition:all .2s}
.kg-node:hover circle{filter:brightness(1.1)}
.kg-link{stroke:#C7D2FE;stroke-width:1.5;fill:none}
.kg-link.active{stroke:#6366F1;stroke-width:2.5}

/* 资源卡片 */
.res-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px;transition:all .2s;cursor:pointer}
.res-card:hover{border-color:var(--primary);box-shadow:var(--shadow-md);transform:translateY(-2px)}
.res-icon{width:40px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* 学情环形 */
.ring{position:relative;width:88px;height:88px}
.ring svg{transform:rotate(-90deg)}
.ring-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column}
.ring-text .v{font-size:18px;font-weight:700;color:var(--primary)}
.ring-text .l{font-size:10px;color:var(--text-3)}

/* 微课Tabs内容 */
.lesson-tab-content{min-height:300px}
.quiz-option{padding:12px 14px;border:1px solid var(--border-2);border-radius:8px;margin-bottom:10px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:10px}
.quiz-option:hover{border-color:var(--primary);background:var(--primary-soft)}
.quiz-option.selected{border-color:var(--primary);background:var(--primary-light);color:var(--primary-dark)}
.quiz-option.correct{border-color:var(--success);background:#D1FAE5;color:#065F46}
.quiz-option.wrong{border-color:var(--danger);background:#FEE2E2;color:#991B1B}
.quiz-radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--border-2);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.quiz-option.selected .quiz-radio{border-color:var(--primary)}
.quiz-option.correct .quiz-radio{border-color:var(--success);background:var(--success)}
.quiz-option.wrong .quiz-radio{border-color:var(--danger);background:var(--danger)}

/* AI聊天 */
.chat-bubble{max-width:80%;padding:12px 16px;border-radius:14px;font-size:13px;line-height:1.7;white-space:pre-wrap}
.chat-bubble.user{background:var(--primary);color:#fff;border-bottom-right-radius:4px;align-self:flex-end}
.chat-bubble.ai{background:#fff;border:1px solid var(--border);border-bottom-left-radius:4px;align-self:flex-start}

/* 职业卡片 */
.career-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px;transition:all .2s;cursor:pointer;position:relative;overflow:hidden}
.career-card::before{content:"";position:absolute;top:0;left:0;width:4px;height:100%;background:linear-gradient(180deg,#6366F1,#8B5CF6)}
.career-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}
</style>
</head>
<body>

<!-- ===== 登录页 ===== -->
<div class="login-wrap" id="loginPage">
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-mark">智</div>
      <div class="logo-text">智教云</div>
    </div>
    <div class="login-sub">教育教学服务平台</div>
    <div class="login-field">
      <label>账号</label>
      <input type="text" class="login-input" id="loginUser" placeholder="请输入账号" autocomplete="off">
    </div>
    <div class="login-field">
      <label>密码</label>
      <input type="password" class="login-input" id="loginPass" placeholder="请输入密码">
    </div>
    <div class="login-error" id="loginError"></div>
    <button class="login-btn" id="loginBtn">登 录</button>
    <div class="login-tip">
      <span>忘记密码？联系管理员</span>
      <span>v 3.2.1</span>
    </div>
  </div>
  <div class="login-footer">© 2026 智教云 · 教育教学服务平台 · 保留所有权利</div>
</div>

<!-- ===== 主应用 ===== -->
<div class="app" id="mainApp">
  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-logo">智</div>
      <div class="topbar-title">智教云 <small>教育教学服务平台</small></div>
    </div>
    <div class="topbar-right">
      <div class="topbar-search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" placeholder="搜索知识点、资源、应用…">
      </div>
      <div class="topbar-icon" title="消息">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        <span class="dot"></span>
      </div>
      <div class="topbar-icon" title="帮助">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      </div>
      <div class="user-chip" id="userChip">
        <div class="user-avatar">管</div>
        <div>
          <div class="user-name">管理员</div>
          <div class="user-role">系统管理员</div>
        </div>
      </div>
    </div>
  </div>

  <div class="app-body">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="content" id="content"></main>
  </div>
</div>

<!-- 弹窗 -->
<div class="modal-mask" id="modalMask">
  <div class="modal" id="modalBox"></div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
/* =========================================================
 * 智教云 · 教育教学服务平台
 * 单文件实现：HTML / CSS / JS
 * 本地存储：localStorage
 * ========================================================= */

/* ---------- 工具函数 ---------- */
const $ = (s,el=document)=>el.querySelector(s);
const $$ = (s,el=document)=>[...el.querySelectorAll(s)];
const uid = ()=>Math.random().toString(36).slice(2,10);
const fmt = n=>Number(n).toLocaleString('zh-CN');
function toast(msg,type=''){
  const t=$('#toast');t.className='toast show '+type;t.textContent=msg;
  clearTimeout(t._t);t._t=setTimeout(()=>t.className='toast '+type,2400);
}
function openModal(title,bodyHTML,footerHTML=''){
  $('#modalBox').innerHTML=`
    <div class="modal-header"><div class="modal-title">${title}</div>
    <div class="modal-close" onclick="closeModal()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </div></div>
    <div class="modal-body">${bodyHTML}</div>
    ${footerHTML?('<div class="modal-footer">'+footerHTML+'</div>'):''}
  `;
  $('#modalMask').classList.add('show');
}
function closeModal(){$('#modalMask').classList.remove('show')}
function handleQuizOption(el,correct){
  el.parentElement.querySelectorAll('.quiz-option').forEach(function(opt){opt.classList.remove('correct','wrong')});
  el.classList.add(correct?'correct':'wrong');
}
function setLibType(t){KBState.libType=t;KBState.searched=false;renderDbSearch()}
function togglePlanTerm(el){
  const next=el.nextElementSibling;
  next.style.display=next.style.display==='none'?'block':'none';
}
function switchLessonTab(tabKey){
  if(window.__curLesson){document.getElementById('lessonContent').innerHTML=renderLessonTabs(window.__curLesson,tabKey)}
}
function downloadMaterial(el){toast('已下载 '+el.dataset.name,'success')}

function loadData(){
  try{
    const raw=localStorage.getItem(DATA_KEY);
    if(raw){
      const d=JSON.parse(raw);
      const def=defaultData();
      let changed=false;
      for(const k in def){
        if(d[k]===undefined){d[k]=def[k];changed=true}
      }
      if(changed){localStorage.setItem(DATA_KEY,JSON.stringify(d))}
      return d;
    }
  }catch(e){}
  const d=defaultData();
  localStorage.setItem(DATA_KEY,JSON.stringify(d));
  return d;
}
function saveData(){localStorage.setItem(DATA_KEY,JSON.stringify(DB))}

let DB=loadData();

function checkAuth(){
  return localStorage.getItem(AUTH_KEY)==='1';
}
function doLogin(u,p){
  if(u==='root'&&p==='root'){localStorage.setItem(AUTH_KEY,'1');return true}
  return false;
}
function logout(){localStorage.removeItem(AUTH_KEY);location.reload()}

$('#loginBtn').addEventListener('click',()=>{
  const u=$('#loginUser').value.trim(),p=$('#loginPass').value;
  if(!u||!p){$('#loginError').textContent='请输入账号和密码';return}
  if(doLogin(u,p)){
    $('#loginPage').style.display='none';
    $('#mainApp').classList.add('show');
    App.init();
  }else{
    $('#loginError').textContent='账号或密码不正确，请重新输入';
  }
});

function renderKGraphMode(){
  const kps=DB.knowledgePoints;
  // 简易树形布局
  const positions={
    kp1:{x:200,y:120},kp2:{x:340,y:220},kp3:{x:480,y:140},
    kp4:{x:480,y:320},kp5:{x:620,y:240},kp6:{x:760,y:340},
    kp7:{x:880,y:240},kp8:{x:340,y:400},kp9:{x:760,y:140}
  };
  const links=[];
  kps.forEach(k=>{if(k.parent)links.push({s:k.parent,t:k.id})});
  const W=1000,H=480;
  $('#studentModeBox').innerHTML=`
    <div class="card">
      <div class="card-title">${I.network}知识图谱模式<div class="text-xs text-3" style="margin-left:auto;font-weight:400">点击节点进入微课学习</div></div>
      <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:480px;background:radial-gradient(circle at 50% 50%,#F5F3FF,#fff);border-radius:12px">
        ${links.map(l=>{
          const a=positions[l.s],b=positions[l.t];
          return `<path class="kg-link" d="M${a.x} ${a.y} L${b.x} ${b.y}"/>`;
        }).join('')}
        ${kps.map(k=>{
          const p=positions[k.id];const r=k.level===1?38:30;
          const color=k.completed?'#6366F1':'#C7D2FE';
          const text=k.completed?'#fff':'#4B5563';
          return `<g class="kg-node" onclick="enterStudentLesson('${k.id}')">

  return `<div style="display:flex;background:#fff;border-bottom:1px solid var(--border);padding:0 4px;overflow-x:auto">
    ${tabBar}
  </div>${body}`;
}

function renderTrendChart(data,labels,name,color){
  const W=320,H=100,pad=10;
  const max=Math.max(...data)*1.1,min=Math.min(...data)*0.9;
  const pts=data.map((v,i)=>{
    const x=pad+i*(W-pad*2)/(data.length-1);
    const y=H-pad-(v-min)/(max-min)*(H-pad*2);
    return [x,y];
  });
  const path=pts.map((p,i)=>(i?'L':'M')+p[0]+' '+p[1]).join(' ');
  const area=path+` L ${pts[pts.length-1][0]} ${H-pad} L ${pts[0][0]} ${H-pad} Z`;
  return `<div class="mb-3"><div class="flex justify-between text-xs mb-2"><span style="color:${color};font-weight:600">${name}</span><span class="text-3">最新 ${data[data.length-1]}%</span></div>
  <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:80px">
    <defs><linearGradient id="g${name}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity="0.3"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#g${name})"/>
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2"/>
    ${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#fff" stroke="${color}" stroke-width="2"/>`).join('')}
    ${pts.map((p,i)=>`<text x="${p[0]}" y="${H-2}" text-anchor="middle" fill="#9CA3AF" font-size="8">${labels[i]}</text>`).join('')}
  </svg></div>`;
}

function renderKbGrid(rs){
  if(!rs.length)return '<div class="empty" style="grid-column:1/-1"><div class="text-sm">暂无资源</div></div>';
  return rs.map(r=>{
    const ti=TYPE_ICON[r.type]||TYPE_ICON.文档;
    return `<div class="res-card">
      <div class="flex items-center gap-3 mb-3">
        <div class="res-icon" style="background:${ti.bg};color:${ti.c};cursor:pointer" onclick="previewResource('${r.id}')">${ti.i}</div>
        <div class="flex-1" style="min-width:0">
          <div class="font-medium text-sm" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer" onclick="previewResource('${r.id}')">${r.name}</div>
          <div class="text-xs text-3 mt-2">${r.size} · ${r.time}</div>
        </div>
      </div>
      <div class="flex items-center justify-between">
        <div class="flex gap-2">
          <span class="tag tag-primary">${r.type}</span>
          <span class="tag ${r.source==='本地'?'tag-gray':r.source==='云盘'?'tag-info':'tag-purple'}">${r.source}</span>
        </div>
        <div class="flex gap-2">
          <button class="btn btn-ghost btn-sm" onclick="previewResource('${r.id}')">预览</button>
          <button class="btn btn-ghost btn-sm" onclick="downloadResource('${r.id}')" style="color:var(--primary)">下载</button>
          <button class="btn btn-ghost btn-sm" onclick="delKbRes('${r.id}')" style="color:var(--danger)">删除</button>
        </div>
      </div>
    </div>`;
  }).join('');
}
function filterKbRes(kw){
  const k=kw!==undefined?kw:$('#kbSearch').value;
  const t=$('#kbTypeFilter')?$('#kbTypeFilter').value:'';
  const s=$('#kbSrcFilter')?$('#kbSrcFilter').value:'';
  let rs=DB.myResources.filter(r=>{
    return (!k||r.name.includes(k))&&(!t||r.type===t)&&(!s||r.source===s);
  });
  $('#kbGrid').innerHTML=renderKbGrid(rs);
}
function delKbRes(id){
  DB.myResources=DB.myResources.filter(r=>r.id!==id);
  saveData();
  Views['kb-my']();
  toast('已删除资源','success');
}

function downloadResource(id){
  const r=DB.myResources.find(x=>x.id===id);
  if(!r)return;
  const ext=r.name.split('.').pop().toLowerCase();
  let content='';
  let mimeType='text/plain';
  if(ext==='pdf'){
    content=generateResourceContent(r);
    mimeType='text/html';
    content='<html><head><meta charset="utf-8"><title>'+r.name+'</title></head><body style="font-family:sans-serif;padding:40px;line-height:1.8">'+content+'</body></html>';
  }else if(ext==='doc'||ext==='docx'){
    content=generateResourceContent(r);
    mimeType='text/html';
    content='<html><head><meta charset="utf-8"><title>'+r.name+'</title></head><body style="font-family:sans-serif;padding:40px;line-height:1.8">'+content+'</body></html>';
  }else{
    content='资源名称：'+r.name+'\n资源类型：'+r.type+'\n资源来源：'+r.source+'\n文件大小：'+r.size+'\n上传时间：'+r.time+'\n\n---\n\n'+generateResourceContent(r);
    mimeType='text/plain';
  }
  try{
    const blob=new Blob([content],{type:mimeType+';charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download=r.name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    toast('已下载：'+r.name,'success');
  }catch(e){
    toast('下载失败，请重试','error');
  }
}

function doLibSearch(silent){
  const kw=($('#libKw')||{}).value||'';
  const field=($('#libField')||{}).value||'标题';
  KBState.libKw=kw;KBState.searched=true;
  let list=DB.library.filter(r=>{
    if(KBState.libType!=='全部'&&r.type!==KBState.libType)return false;
    if(!kw)return true;
    if(field==='标题')return r.title.includes(kw);
    if(field==='作者')return r.author.includes(kw);
    if(field==='关键词')return r.keyword.some(k=>k.includes(kw));
    if(field==='主题')return r.subject.includes(kw);
    return true;
  });
  const box=$('#libResult');if(!box)return;

function updateGraphCenter(){
  const v=$('#graphCenter').value.trim();
  if(!v)return;
  GraphState.center=v;
  GraphState.expanded=new Set(['g0']);
  GraphState.selected='g0';
  renderGraphCanvas();
  toast('已生成「'+v+'」关联图谱','success');
}

function computeLayout(){
  const pos={};
  const W=900,H=500,cx=450,cy=250;
  const nodes=DB.graphNodes;
  if(GraphState.layout==='放射'){
    pos.g0={x:cx,y:cy};
    const l1=nodes.filter(n=>n.level===1);
    l1.forEach((n,i)=>{const a=-Math.PI/2+i*2*Math.PI/l1.length;pos[n.id]={x:cx+Math.cos(a)*190,y:cy+Math.sin(a)*190}});
    const l2=nodes.filter(n=>n.level===2);
    l2.forEach(n=>{
      const pl=DB.graphLinks.find(l=>l.t===n.id&&l.s!=='g0');
      const p=pos[pl?pl.s:'g0']||pos.g0;
      const idx=l1.findIndex(x=>x.id===(pl?pl.s:''));
      const a=idx>=0?idx*2*Math.PI/l1.length:0;
      pos[n.id]={x:p.x+Math.cos(a)*120,y:p.y+Math.sin(a)*120};
    });
  }else if(GraphState.layout==='层级'){
    const byLevel={};
    nodes.forEach(n=>{(byLevel[n.level]=byLevel[n.level]||[]).push(n)});
    Object.keys(byLevel).forEach(lv=>{
      const arr=byLevel[lv];
      const x=110+lv*250;
      arr.forEach((n,i)=>{pos[n.id]={x,y:60+i*(H-120)/Math.max(1,arr.length-1)}});
    });
  }else{
    nodes.forEach(n=>pos[n.id]={x:n.x-100,y:n.y-30});
  }
  return pos;
}

function getVisibleNodes(){
  const links=DB.graphLinks;
  const visible=['g0'];
  DB.graphNodes.forEach(n=>{
    if(n.id==='g0')return;
    const parents=links.filter(l=>l.t===n.id).map(l=>l.s);
    if(parents.some(p=>GraphState.expanded.has(p)))visible.push(n.id);
  });
  let res=DB.graphNodes.filter(n=>visible.includes(n.id));
  if(GraphState.attr!=='全部')res=res.filter(n=>n.attr===GraphState.attr||n.id==='g0');
  if(GraphState.maxNodes!=='全部'&&res.length>parseInt(GraphState.maxNodes)){
    const keep=new Set([GraphState.selected||'g0',...res.slice(0,parseInt(GraphState.maxNodes)).map(n=>n.id)]);
    res=res.filter(n=>keep.has(n.id));
  }
  return res;
}

function renderGraphCanvas(){
  const pos=computeLayout();
  const vis=getVisibleNodes();
  const visIds=new Set(vis.map(n=>n.id));
  const visLinks=DB.graphLinks.filter(l=>visIds.has(l.s)&&visIds.has(l.t));
  const color={0:'#6366F1',1:'#8B5CF6',2:'#A78BFA'};
  const r={0:42,1:30,2:24};
  $('#graphCanvas').innerHTML=`
    <svg viewBox="0 0 900 500" style="width:100%;height:500px;background:radial-gradient(circle at 50% 50%,#F5F3FF 0%,#FFFFFF 70%);border-radius:12px">
      ${visLinks.map(l=>{
        const a=pos[l.s],b=pos[l.t];
        const isActive=GraphState.selected===l.s||GraphState.selected===l.t;
        return `<path class="kg-link ${isActive?'active':''}" d="M${a.x} ${a.y} Q ${(a.x+b.x)/2} ${(a.y+b.y)/2-20} ${b.x} ${b.y}"/>`;
      }).join('')}
      ${vis.map(n=>{
        const p=pos[n.id];const c=color[n.level]||'#A78BFA';const rr=r[n.level]||24;
        const sel=GraphState.selected===n.id;
        const expanded=GraphState.expanded.has(n.id);
        const hasChild=DB.graphLinks.some(l=>l.s===n.id);
        return `<g class="kg-node" onclick="toggleGraphNode('${n.id}')">
          ${sel?`<circle cx="${p.x}" cy="${p.y}" r="${rr+6}" fill="none" stroke="${c}" stroke-width="2" stroke-dasharray="3 3" opacity=".5"/>`:''}
          <circle cx="${p.x}" cy="${p.y}" r="${rr}" fill="${c}" stroke="#fff" stroke-width="3"/>
          <text x="${p.x}" y="${p.y+4}" text-anchor="middle" fill="#fff" font-size="${n.level===0?14:11}" font-weight="600">${n.name}</text>
          <text x="${p.x}" y="${p.y+rr+15}" text-anchor="middle" fill="#9CA3AF" font-size="10">${n.attr}</text>
          ${hasChild?`<circle cx="${p.x+rr-6}" cy="${p.y-rr+6}" r="9" fill="#fff" stroke="${c}" stroke-width="1.5"/><text x="${p.x+rr-6}" y="${p.y-rr+10}" text-anchor="middle" fill="${c}" font-size="11" font-weight="700">${expanded?'−':'+'}</text>`:''}
        </g>`;
      }).join('')}
    </svg>`;
  renderGraphDetail();
}

function toggleGraphNode(id){
  if(GraphState.selected===id){
    // 已选中再次点击 → 展开/收起
    if(id!=='g0'){
      if(GraphState.expanded.has(id))GraphState.expanded.delete(id);
      else GraphState.expanded.add(id);
    }
  }else{
    GraphState.selected=id;
    if(!GraphState.expanded.has(id)&&id!=='g0')GraphState.expanded.add(id);
  }
  renderGraphCanvas();
}

    'a4':head+`【智能问答 · ${input}】\n\n根据知识库相关资料，为您解答如下：\n\n${input}是微积分/计算机科学中的核心概念之一。其本质是从【角度一】刻画对象的变化规律，具有【性质一】和【性质二】两个重要特征。\n\n• 定义：在…条件下，${input}可表述为…\n• 几何意义：${input}对应曲线在某点处的切线斜率/图形特征\n• 典型应用：用于求解最值问题、变化率问题、近似计算等\n\n【参考来源】\n1. 《高等数学（第七版）》同济大学数学系\n2. 《深度学习中的优化方法综述》《软件学报》\n3. 个人知识库：高等数学课堂笔记\n\n如需深入理解，建议进一步学习关联知识点。`,
    'a5':head+`【文献研读 · ${input}】\n\n一、文献要点\n• 研究背景：针对${input}领域的关键问题展开研究\n• 研究方法：采用理论分析 + 实证研究相结合的方法\n• 主要结论：提出了${input}的改进方案，效果显著\n\n二、创新点\n1. 方法创新：提出了一种新的${input}分析框架\n2. 应用创新：拓展了${input}的应用场景\n3. 评价创新：构建了多维评估指标体系\n\n三、对比分析\n与同类研究相比，本文在精度/效率/泛化性方面均有提升。\n\n四、启示\n本研究对教学/科研具有参考价值，建议结合本校实际进一步探索。`,

}

function saveAIToKb(){
  const last=[...AIState.chat].reverse().find(c=>c.role==='ai');
  if(!last){toast('暂无可保存的生成内容','error');return}
  const app=DB.aiApps.find(a=>a.id===AIState.appId);
  const id='r'+uid();
  const today=new Date().toISOString().slice(0,10);
  DB.myResources.unshift({id,name:`${app.name}生成内容-${today}.md`,type:'文档',source:'AI生成',size:'—',time:today,cat:'AI生成'});
  saveData();
  toast('已保存到个人AI知识库','success');
}

/* =====================================================
 * 模块5 · 一生一案培养方案管理
 * ===================================================== */
const PlanState={studentId:'s1'};

Views['plan']=function(){
  const allStudents=DB.students.filter(s=>DB.studentProfiles[s.id]);
  const sp=DB.studentProfiles[PlanState.studentId]||DB.studentProfiles.s1;
  const majorCodeMap={'计算机科学与技术':'080901','软件工程':'080802'};
  const plan=DB.majorPlans[majorCodeMap[sp.major]||'080901'];
  const creditPct=Math.round(plan.completedCredits/plan.totalCredits*100);
  $('#content').innerHTML=`
    <div class="page-header">
      <div>
        <div class="breadcrumb">培养方案 <span>/</span> 一生一案管理</div>
        <div class="page-title">个性化人才培养方案</div>
        <div class="page-subtitle">管理员可查看所有学生的培养方案，完整展示专业基础信息与毕业要求，匹配职业发展方向</div>
      </div>
      <div class="flex items-center gap-3">
        <select class="select" style="width:280px" onchange="PlanState.studentId=this.value;Views['plan']()">
          ${allStudents.map(s=>{
            const p=DB.studentProfiles[s.id];
            return '<option value="'+s.id+'" '+(PlanState.studentId===s.id?'selected':'')+'>'+s.name+' · '+p.major+' · '+s.no+'</option>';
          }).join('')}
        </select>
        <button class="btn btn-ghost" onclick="exportPlan()">${I.upload} 导出方案</button>
      </div>
    </div>
    <!-- 学生 + 专业基础信息 -->
    <div class="grid grid-2 mb-4">
      <div class="card">
        <div class="card-title">${I.user}学生信息</div>
        <div class="flex items-center gap-4 mb-4">
          <div style="width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#6366F1,#8B5CF6);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700">${sp.name.slice(0,1)}</div>
          <div>
            <div style="font-size:18px;font-weight:700">${sp.name}</div>
            <div class="text-sm text-3 mt-2">学号 ${sp.no} · ${sp.major} · ${sp.grade}</div>
          </div>
        </div>
        <div class="grid grid-2" style="gap:12px;font-size:13px">
          <div class="flex justify-between"><span class="text-3">GPA</span><span class="font-medium" style="color:var(--primary)">${sp.gpa}</span></div>
          <div class="flex justify-between"><span class="text-3">专业排名</span><span class="font-medium">${sp.rank}</span></div>
          <div class="flex justify-between"><span class="text-3">培养方向</span><span class="font-medium">${sp.target}</span></div>
          <div class="flex justify-between"><span class="text-3">获奖经历</span><span class="font-medium">${sp.awards.length} 项</span></div>
        </div>
        <div class="mt-4">
          <div class="text-xs text-3 mb-2">个人能力画像</div>
          ${sp.skills.map(s=>'<div class="mb-2"><div class="flex justify-between text-xs mb-2"><span>'+s.name+'</span><span class="text-3">'+s.level+'%</span></div><div class="progress"><div class="progress-bar" style="width:'+s.level+'%"></div></div></div>').join('')}
        </div>
      </div>
      <div class="card">
        <div class="card-title">${I.book}专业基础信息</div>
        <div class="grid grid-2 mb-4" style="gap:14px;font-size:13px">
          <div><div class="text-3 text-xs">专业名称</div><div class="font-medium mt-2">${plan.name}</div></div>
          <div><div class="text-3 text-xs">专业代码</div><div class="font-medium mt-2">${plan.code}</div></div>
          <div><div class="text-3 text-xs">授予学位</div><div class="font-medium mt-2">${plan.degree}</div></div>
          <div><div class="text-3 text-xs">学制</div><div class="font-medium mt-2">${plan.duration}</div></div>
        </div>
        <div class="flex items-center gap-4 mb-4" style="background:var(--primary-soft);border-radius:10px;padding:16px">
          ${renderCreditRing(creditPct,72,'#6366F1')}
          <div class="flex-1">
            <div class="text-xs text-3">毕业学分要求</div>
            <div class="flex items-baseline gap-2 mt-2"><span style="font-size:26px;font-weight:700;color:var(--primary)">${plan.completedCredits}</span><span class="text-3">/ ${plan.totalCredits} 学分</span></div>
            <div class="text-xs text-3 mt-2">已完成 ${creditPct}%，尚需 ${plan.totalCredits-plan.completedCredits} 学分</div>
          </div>
        </div>
        <div>
          <div class="text-xs text-3 mb-2">培养目标</div>
          <div class="text-sm text-2" style="line-height:1.8">${plan.direction}</div>
        </div>
      </div>
    </div>
    <!-- 学分构成 -->
    <div class="card mb-4">
      <div class="card-title">${I.chart}学分构成与完成情况</div>
      <div class="grid grid-5" style="gap:16px">
        ${plan.categories.map(c=>{
          const pct=Math.round(c.done/c.require*100);
          return '<div class="text-center">'+
            renderCreditRing(pct,64,c.color)+
            '<div class="font-medium text-sm mt-3">'+c.name+'</div>'+
            '<div class="text-xs text-3 mt-2">'+c.done+' / '+c.require+' 学分</div>'+
          '</div>';
        }).join('')}
      </div>
    </div>
    <!-- 个性化学习方案 -->
    <div class="card mb-4">
      <div class="card-title">${I.list}个性化学习方案<div class="text-xs text-3" style="margin-left:auto;font-weight:400">按学期展开培养方案课程</div></div>
      <div id="planTerms"></div>
    </div>
    <!-- 职业发展方向 -->
    <div class="card">
      <div class="card-title">${I.target}职业发展方向与就业岗位<div class="text-xs text-3" style="margin-left:auto;font-weight:400">基于专业匹配的就业岗位推荐</div></div>
      <div class="grid grid-3">
        ${plan.careers.map(c=>`
          <div class="career-card">
            <div class="flex items-center justify-between mb-3">
              <div class="font-medium">${c.dir}</div>
              <span class="tag tag-success">${c.match}% 匹配</span>
            </div>
            <div class="flex items-center gap-3 mb-3 text-sm">
              <span style="color:var(--primary);font-weight:600">${c.sal}</span>
              <span class="text-3">|</span>
              <span class="text-3 text-xs">${c.city}</span>
            </div>
            <div class="text-xs text-2 mb-3" style="line-height:1.7">${c.outlook}</div>
            <div class="text-xs text-3 mb-2">核心技能要求</div>
            <div class="flex" style="gap:6px;flex-wrap:wrap">${c.skills.map(s=>'<span class="tag tag-gray">'+s+'</span>').join('')}</div>
            <div class="mt-3"><div class="flex justify-between text-xs mb-2"><span class="text-3">专业匹配度</span><span style="color:var(--primary)">${c.match}%</span></div><div class="progress"><div class="progress-bar" style="width:${c.match}%"></div></div></div>
          </div>`).join('')}
      </div>
    </div>`;
  renderPlanTerms();
};

function renderCreditRing(pct,size,color){
  const r=size/2-6,cx=size/2,cy=size/2;
  const circ=2*Math.PI*r;
  const off=circ*(1-pct/100);
  return `<div style="position:relative;width:${size}px;height:${size}px;margin:0 auto">
    <svg width="${size}" height="${size}" style="transform:rotate(-90deg)">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#EEF2FF" stroke-width="6"/>
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${off}"/>
    </svg>
    <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;color:${color};font-size:${size>80?16:13}px">${pct}%</div>
  </div>`;
}

function renderPlanTerms(){
  const sp=DB.studentProfiles[PlanState.studentId]||DB.studentProfiles.s1;
  const majorCodeMap={'计算机科学与技术':'080901','软件工程':'080802'};
  const m=DB.majorPlans[majorCodeMap[sp.major]||'080901'];
  const statusTag={通过:'tag-success',修读中:'tag-warning',未修:'tag-gray'};
  $('#planTerms').innerHTML=m.planCourses.map((t,i)=>{
    const courseRows=t.courses.map(c=>'<tr><td><span class="font-medium">'+c.name+'</span></td><td><span class="tag tag-gray">'+c.cat+'</span></td><td>'+c.credit+'</td><td>'+(c.score||'—')+'</td><td><span class="tag '+statusTag[c.status]+'">'+c.status+'</span></td></tr>').join('');
    return `
    <div class="res-card mb-3" style="cursor:pointer" onclick="togglePlanTerm(this)">
      <div class="flex items-center gap-3">
        <div style="width:32px;height:32px;border-radius:8px;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700">${i+1}</div>
        <div class="flex-1"><div class="font-medium">${t.term}</div><div class="text-xs text-3 mt-2">${t.courses.length} 门课程 · 共 ${t.courses.reduce((s,c)=>s+c.credit,0)} 学分</div></div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--text-3)"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
    </div>
    <div style="${i>2?'display:none':''}">
      <table class="table mb-3">
        <thead><tr><th>课程名称</th><th>课程类别</th><th>学分</th><th>成绩</th><th>状态</th></tr></thead>
        <tbody>${courseRows}</tbody>
      </table>
    </div>`;
  }).join('');
}

function exportPlan(){
  toast('培养方案已导出为 PDF','success');
}
if(checkAuth()){App.init()}
</script>
