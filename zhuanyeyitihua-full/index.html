<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>专业数据驾驶舱｜浅冰蓝动态科技增强版</title>
  <style>
    :root {
      --ice-top: #eef6ff;
      --ice-bottom: #d8eaff;
      --tech-blue: #3b9dff;
      --ink-blue: #12345d;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: linear-gradient(145deg, var(--ice-top), var(--ice-bottom));
    }

    body {
      display: grid;
      place-items: center;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    }

    .stage {
      position: relative;
      display: grid;
      width: 100vw;
      height: 100vh;
      place-items: center;
      isolation: isolate;
      overflow: hidden;
    }

    .stage::before {
      position: absolute;
      inset: 0;
      z-index: -1;
      content: "";
      background:
        radial-gradient(circle at 18% 16%, rgb(255 255 255 / 68%), transparent 34%),
        radial-gradient(circle at 84% 82%, rgb(91 169 255 / 13%), transparent 36%);
      pointer-events: none;
    }

    .dashboard {
      display: block;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      object-position: center;
      image-rendering: auto;
      transform: translateZ(0);
      backface-visibility: hidden;
      user-select: none;
      -webkit-user-drag: none;
    }

    .loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-blue);
      font-size: clamp(14px, 1.2vw, 22px);
      letter-spacing: .12em;
      background: linear-gradient(145deg, var(--ice-top), var(--ice-bottom));
      transition: opacity .3s ease, visibility .3s ease;
    }

    .loading::before {
      width: 42px;
      height: 42px;
      margin-right: 14px;
      content: "";
      border: 3px solid rgb(59 157 255 / 20%);
      border-top-color: var(--tech-blue);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    .loading-inner {
      display: block;
    }

    .is-ready .loading {
      visibility: hidden;
      opacity: 0;
    }

    @keyframes spin { to { transform: rotate(1turn); } }

    .fullscreen-btn {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 10;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      padding: 0;
      border: 1px solid rgb(59 157 255 / 40%);
      border-radius: 8px;
      background: rgb(255 255 255 / 70%);
      color: var(--ink-blue);
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: background .2s ease, border-color .2s ease, color .2s ease;
    }

    .fullscreen-btn:hover {
      background: rgb(59 157 255 / 14%);
      border-color: var(--tech-blue);
      color: var(--tech-blue);
    }

    .fullscreen-btn:focus-visible {
      outline: 2px solid var(--tech-blue);
      outline-offset: 2px;
    }

    .fullscreen-btn svg {
      width: 20px;
      height: 20px;
      display: block;
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="专业数据驾驶舱动态展示">
    <a href="#"><img id="dashboard" class="dashboard" src="https://img.naixiai.cn/2026/08/14/base64-to-image-1.jpg" alt="base64 to image (1)" border="0" draggable="false" decoding="sync" fetchpriority="high"></a>
    <div class="loading" aria-live="polite">
      <div class="loading-inner">正在加载高清数据驾驶舱</div>
    </div>
  </main>
  <button class="fullscreen-btn" type="button" aria-label="全屏" title="全屏">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/>
    </svg>
  </button>
  <script>
    const image = document.getElementById('dashboard');
    const markReady = () => document.documentElement.classList.add('is-ready');
    if (image.complete) requestAnimationFrame(markReady);
    else {
      image.addEventListener('load', markReady, { once: true });
      image.addEventListener('error', markReady, { once: true });
    }

    const fsBtn = document.querySelector('.fullscreen-btn');
    const fsIcon = fsBtn.querySelector('svg');
    const enterIcon = '<path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/>';
    const exitIcon = '<path d="M3 8V5a2 2 0 0 1 2-2h3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M21 16v3a2 2 0 0 1-2 2h-3"/>';
    const syncIcon = () => { fsIcon.innerHTML = document.fullscreenElement ? exitIcon : enterIcon; };
    fsBtn.addEventListener('click', () => {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen().catch(() => {});
    });
    document.addEventListener('fullscreenchange', syncIcon);
  </script>
</body>
</html>
