<!doctype html>
<html lang="zh-CN">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>机械智能制造案例 教学动画</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf2f7;color:#182b45;font-family:"Microsoft YaHei",sans-serif}main{max-width:1160px;margin:auto;padding:24px}h1{font-size:25px;margin:0 0 8px}.sub{font-size:14px;color:#66788d}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 10px}button,select{border:1px solid #ccd7e3;border-radius:8px;padding:9px 13px;background:#fff;color:#253c59;cursor:pointer;font:14px inherit}button.active{background:#176dd8;border-color:#176dd8;color:#fff}.scene-tabs{margin:0;padding:12px 16px;background:#f7faff;border-bottom:1px solid #e7edf4}.scene-tabs button{padding:7px 11px;font-size:13px}.stage{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 8px 30px #213e5910}canvas{width:100%;display:block}.controls{display:flex;align-items:center;gap:14px;padding:15px 18px;border-top:1px solid #e7edf4;flex-wrap:wrap}input{flex:1;min-width:160px}.note{padding:18px 24px;background:#f7faff;min-height:133px}.note strong{font-size:20px;color:#176dd8}.note p{line-height:1.8;margin:8px 0 0}.legend{margin:14px 0 0;color:#576a80;font-size:14px}@media(max-width:650px){main{padding:14px}h1{font-size:20px}.note strong{font-size:17px}}
</style>
<main>
  <h1 id="title">案例② 齿轮轴图纸与工艺</h1>
  <div class="sub">高端装备与智能制造｜多案例交互教学演示</div>
  <nav class="tabs" id="caseTabs"></nav>
  <section class="stage">
    <nav class="tabs scene-tabs" id="sceneTabs"></nav>
    <canvas id="cv" width="1120" height="500"></canvas>
    <div class="controls"><button id="play">暂停</button><button id="reset">重新播放</button><span>动画进度</span><input id="seek" type="range" min="0" max="1000" value="0"><select id="speed"><option value="0.5">0.5 倍速</option><option value="1" selected>1 倍速</option><option value="2">2 倍速</option></select></div>
    <div class="note"><strong id="formula"></strong><p id="explain"></p></div>
  </section>
  <div class="legend">蓝色：输入、要求或数据　橙色：待加工或待比较对象　绿色：已核对或有效路径　灰色：基准、边界或未激活对象　红色虚线：待确认或风险点</div>
</main>
<script>
const cv=document.getElementById('cv'),c=cv.getContext('2d'),$=id=>document.getElementById(id);
const C={blue:'#2478dc',orange:'#ed9135',green:'#1ba98c',gray:'#8995a4',red:'#df5a57',purple:'#9b6bd8',ink:'#243a55',pale:'#edf5ff'};
let chosen=0,scene=0,t=0,running=true,last=0;
const cases=[
 {name:'案例① 连杆机构自由度',scenes:['四杆机构','曲柄滑块','复合铰链','局部自由度','虚约束'],notes:[
 ['F = 3n − 2Pₗ − Pₕ = 3×3 − 2×4 = 1','灰色机架是固定参考，不计入活动构件；四杆机构的活动构件 n＝3，四个转动副 Pₗ＝4，因此自由度为 1。'],
 ['曲柄滑块同样按构件和低副计数','活动构件为曲柄、连杆、滑块，共 3 个；3 个转动副加 1 个移动副，共 4 个低副，代入公式可得 F＝1。'],
 ['复合铰链按 m−1 计数','先数清同一销轴连接的构件数。三个构件共用销轴时，通常等效为 3−1＝2 个转动副；这是局部计数示例。'],
 ['滚子自转可属于局部自由度','理想光滑接触下，凸轮驱动从动件升降；保持主体位置而仅让滚子自转时，可观察其不改变主体输入输出。'],
 ['虚约束必须证明条件重复','平行四边形机构中再连接两水平杆的中点，若该长度条件由原机构恒定，则新增约束重复；不能只凭外形判断。']]},
 {name:'案例② 齿轮轴工艺',scenes:['识别图纸','安排齿部','定位与余量','验证路线'],notes:[
 ['先识别，再确认','已从演示图纸识别轴颈 Φ60k6、Ra0.8 和相对指定基准的同轴度要求。材料、热处理及齿部要求仍须逐项核对。'],
 ['齿部工序不能遗漏','先补充齿部精度、热处理要求和可用设备，再提出候选加工方法，比较其与热处理、轴颈精加工的先后关系。'],
 ['定位基准与余量需有依据','采用两端中心孔定位时，要说明调质后的检查或修整；精车后各待磨表面及余量应逐项确定，不能只凭工序名称下结论。'],
 ['用要求、条件和能力验证','每项修改对应图纸要求、定位条件或设备能力。同轴度与圆跳动的检测对象分别说明，并检查后续装夹是否影响已完成精度。']]},
 {name:'案例③ 主轴轴承布局',scenes:['支承布局','课程资源','寿命校核','综合比较'],notes:[
 ['定位与热伸长要明确','在图中先识别轴向定位轴承组，以及热伸长从哪里释放。仅凭前后端轴承类型，不能认定布局成立。'],
 ['从课程资源回到问题','在已授权接入的课程中检索轴承组合设计资源；学习后返回草图，补充轴向定位和热伸长释放方式。'],
 ['逐项填写数据来源','L₁₀h＝[10⁶／(60n)]·(C／P)ᵖ。球轴承 p＝3，滚子轴承 p＝10/3；C、P、n 要注明来源和单位。'],
 ['寿命合格不等于方案完成','继续核对刚度、预紧、润滑和热条件。跨距需结合悬伸、轴径与支承刚度比较，不能仅凭寿命下结论。']]},
 {name:'案例④ 人形机器人腰部关节',scenes:['需求拆解','同工况比较','力臂与推力','扩大侧倾'],notes:[
 ['需求已定，关键输入待补','三自由度和角度范围明确；还需重心位置、是否包含作业载荷、最大角速度/加速度及安装空间。'],
 ['同一组工况公平比较','比较范围覆盖、极限干涉、各关节力矩或推杆推力来源，以及加工、装配、测量和控制条件。'],
 ['先求有效力臂','标出推杆安装点，在代表姿态下求有效力臂；再结合重心和运动加速度计算需求推力，不能直接判定推力不足。'],
 ['行程增加不是唯一检查项','扩大侧倾至 ±15° 时，同时检查行程、最小有效力臂、峰值推力、干涉和运动学敏感位置。']]},
 {name:'案例⑤ 仿生蝴蝶数字孪生',scenes:['最小系统','变量测量','通信与数据','独立验证'],notes:[
 ['先定目标，再定系统','展示姿态、分析扑翼或预测转向响应，对应不同变量、传感器和模型；先确定最小可行系统。'],
 ['IMU 不替代翼角测量','IMU 支持姿态估计，但不能直接替代翼角测量，也不能仅靠它长期稳定获得绝对位置。'],
 ['分清设备、连接、协议和存储','深度相机要检查安装质量、功耗和视野；Wi-Fi 是连接方式，UDP 是传输协议，数据库负责记录管理。'],
 ['动画跟随不是完整验证','区分采样缺失和传输丢包，数据中断要标记过期；还须用独立工况比较模型输出与实际响应。']]},
 {name:'案例⑥ 教师备课与评价',scenes:['任务分层','过程评价','达成分析','循环改进'],notes:[
 ['按课程条件裁剪任务','对照课程目标、学时、先修知识和实验条件：基础任务围绕感知、传输与虚实一致性；进阶任务增加模型校准和独立验证。'],
 ['过程证据进入评价','评分项对应模型假设、计算依据、方案论证与验证能力；设置阶段检查、个人提交和答辩，生成材料由教师确认使用。'],
 ['先核对计算口径','核对评分项—课程目标映射、满分、权重、缺失成绩和学校计算方法。只有总成绩时，只能分析总体分布。'],
 ['建议必须可回溯','若方案比较评分偏低，再结合学生提交物判断原因；改进措施对应具体证据，下一轮设置同能力维度评价。']]}
];
function tabs(){ $('caseTabs').innerHTML='';cases.forEach((x,i)=>{let b=document.createElement('button');b.textContent=x.name;b.className=i===chosen?'active':'';b.onclick=()=>{chosen=i;scene=0;t=0;tabs();update();draw()};$('caseTabs').append(b)});$('sceneTabs').innerHTML='';cases[chosen].scenes.forEach((x,i)=>{let b=document.createElement('button');b.textContent=`${i+1}. ${x}`;b.className=i===scene?'active':'';b.onclick=()=>{scene=i;t=0;tabs();update();draw()};$('sceneTabs').append(b)})}
function update(){let k=cases[chosen],n=k.notes[scene];$('title').textContent=k.name;$('formula').textContent=n[0];$('explain').textContent=n[1]}
function text(s,x,y,size=18,color=C.ink,align='left'){c.fillStyle=color;c.font=`${size}px "Microsoft YaHei",sans-serif`;c.textAlign=align;c.fillText(s,x,y);c.textAlign='left'}
function line(a,b,color=C.ink,w=8,d=[]){c.save();c.strokeStyle=color;c.lineWidth=w;c.lineCap='round';c.setLineDash(d);c.beginPath();c.moveTo(...a);c.lineTo(...b);c.stroke();c.restore()}
function box(x,y,w,h,label,color=C.blue,fill='#fff'){c.fillStyle=fill;c.fillRect(x,y,w,h);c.strokeStyle=color;c.lineWidth=2;c.strokeRect(x,y,w,h);let a=String(label).split('\n'),gap=20,start=y+h/2-(a.length-1)*gap/2+6;a.forEach((s,i)=>text(s,x+w/2,start+i*gap,16,color,'center'))}
function dot(x,y,color=C.blue,r=7){c.fillStyle=color;c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fill()}
function arrow(a,b,color=C.blue){line(a,b,color,4);const q=Math.atan2(b[1]-a[1],b[0]-a[0]);line(b,[b[0]-12*Math.cos(q-.5),b[1]-12*Math.sin(q-.5)],color,4);line(b,[b[0]-12*Math.cos(q+.5),b[1]-12*Math.sin(q+.5)],color,4)}
function base(title){c.clearRect(0,0,1120,500);c.setLineDash([]);c.fillStyle='#fff';c.fillRect(0,0,1120,500);text(title,30,37,22);text('拖动下方进度条，可逐帧观察',810,37,15,'#75869b')}
function gear(x,y,r,spin=0){c.save();c.translate(x,y);c.rotate(spin);c.strokeStyle=C.orange;c.lineWidth=10;for(let i=0;i<12;i++){c.rotate(Math.PI/6);c.beginPath();c.moveTo(r-5,0);c.lineTo(r+10,0);c.stroke()}c.beginPath();c.arc(0,0,r,0,Math.PI*2);c.stroke();c.beginPath();c.arc(0,0,r*.35,0,Math.PI*2);c.stroke();c.restore()}
function mechanism(){base('机构运动与自由度');if(scene===0){let A=[250,330],D=[570,330],B=[250+92*Math.cos(t),330-92*Math.sin(t)],dx=D[0]-B[0],dy=D[1]-B[1],d=Math.hypot(dx,dy),u=(260**2-210**2+d*d)/(2*d),h=Math.sqrt(Math.max(0,260**2-u*u)),Q=[B[0]+u*dx/d,B[1]+u*dy/d],E=[Q[0]+h*dy/d,Q[1]-h*dx/d];line(A,D,C.gray,16);line(A,B,C.blue,14);line(B,E,C.orange,14);line(E,D,C.green,14);[A,B,E,D].forEach((p,i)=>{dot(...p,[C.gray,C.blue,C.orange,C.green][i],9)});text('机架：固定，不计入 n',410,410,20,C.gray,'center');text('活动构件 n＝3',800,150,24,C.blue,'center');text('转动副 Pₗ＝4',800,200,24,C.ink,'center');text('独立输入＝1',800,250,24,C.green,'center');text('蓝色曲柄可整周转动；绿色摇杆只往复摆动',470,462,20,C.ink,'center')}if(scene===1){let A=[250,255],B=[250+90*Math.cos(t),255-90*Math.sin(t)],x=B[0]+Math.sqrt(Math.max(0,285**2-(B[1]-255)**2)),E=[x,255];line([170,305],[870,305],C.gray,12);line([440,225],[870,225],C.gray,5);line([440,290],[870,290],C.gray,5);line(A,B,C.blue,14);line(B,E,C.orange,14);c.fillStyle='#d9f1e9';c.fillRect(x-32,230,64,58);dot(...A,C.gray);dot(...B,C.orange);text('曲柄',170,145,20,C.blue);text('连杆',440,145,20,C.orange);text('滑块 ↔ 固定导轨：移动副',650,375,22,C.green,'center');text('3 个转动副 + 1 个移动副 = 4 个低副',550,445,22,C.ink,'center')}if(scene===2){let O=[440,275],P=[440+170*Math.cos(.8+.5*Math.sin(t)),275-170*Math.sin(.8+.5*Math.sin(t))],Q=[440+170*Math.cos(2.45+.4*Math.cos(t)),275-170*Math.sin(2.45+.4*Math.cos(t))];line(O,[440,420],C.gray,20);line(O,P,C.blue,15);line(O,Q,C.orange,15);dot(...O,'#f3ba36',18);dot(...O,C.ink,8);text('共同销轴：m＝3',755,145,26,C.blue,'center');text('转动副数＝m−1＝2',755,200,24,C.ink,'center');text('两根活动杆可分别绕同一销轴转动',440,450,22,C.ink,'center')}if(scene===3){for(let v of [270,760]){c.strokeStyle=C.gray;c.lineWidth=5;c.strokeRect(v-35,110,70,150);let y=225-55*Math.sin(t);line([v,y],[v,345],C.green,12);c.beginPath();c.arc(v,y-22,24,0,Math.PI*2);c.fillStyle='#fff';c.fill();c.strokeStyle=C.orange;c.lineWidth=5;c.stroke();line([v,y-22],[v+17*Math.cos(t*(v<500?3:4)),y-22-17*Math.sin(t*(v<500?3:4))],C.orange,4)}text('凸轮转动 → 从动件升降',270,420,20,C.blue,'center');text('保持主体位置 → 滚子单独自转',760,420,20,C.orange,'center')}if(scene===4){let A=[240,350],D=[600,350],a=1.15+.42*Math.sin(t),B=[A[0]+210*Math.cos(a),A[1]-210*Math.sin(a)],E=[D[0]+210*Math.cos(a),D[1]-210*Math.sin(a)],M=[420,350],N=[(B[0]+E[0])/2,(B[1]+E[1])/2];line(A,D,C.gray,14);line(A,B,C.blue,13);line(B,E,C.orange,13);line(E,D,C.green,13);line(M,N,C.purple,9,[10,7]);[A,B,E,D,M,N].forEach(p=>dot(...p,C.ink,7));text('紫色杆：需证明为重复长度条件',810,180,22,C.purple,'center');text('保持非共线装配分支；不能仅凭外形修正计数',560,445,21,C.ink,'center')}}
function process(){base('图纸信息 → 候选工艺路线');let x=85,steps=['下料','锻造','正火','粗车','调质','精车','铣键槽','磨削'];steps.forEach((s,i)=>{box(x+i*118,330,94,48,s,i===6?C.orange:C.blue,i===6?'#fff6e9':'#fff');if(i<7)arrow([x+i*118+94,354],[x+(i+1)*118,354],C.gray)});line([150,220],[810,220],C.gray,24);c.fillStyle='#e5ebf2';c.fillRect(190,190,120,60);c.fillRect(500,190,110,60);c.strokeStyle=C.blue;c.lineWidth=3;c.strokeRect(410,184,86,72);text('Φ60k6',450,165,18,C.blue,'center');text('Ra 0.8',550,165,18,C.blue,'center');gear(700,220,52,t);if(scene===0){text('已识别：轴颈精度与表面粗糙度',110,100,22,C.blue);text('材料、热处理、齿部要求：待逐项核对',110,140,19,C.red)}if(scene===1){c.setLineDash([9,6]);line([640,140],[760,140],C.red,4,[9,6]);text('齿部加工：待安排',700,110,20,C.red,'center');text('先补充齿部精度、热处理及设备条件',590,285,18,C.orange)}if(scene===2){dot(230,220,C.green,10);dot(770,220,C.green,10);line([230,220],[770,220],C.green,3,[8,6]);text('两端中心孔定位？调质后检查/修整？',500,110,20,C.green,'center');text('待磨表面与余量：逐项确定',500,285,20,C.red,'center')}if(scene===3){box(190,78,180,55,'图纸要求',C.blue);box(470,78,180,55,'定位条件',C.green);box(750,78,180,55,'设备能力',C.orange);arrow([280,133],[410,225]);arrow([560,133],[510,225]);arrow([840,133],[610,225]);box(415,210,210,58,'修订路线与检查',C.green,'#effbf7')}}
function bearings(){base('主轴支承布局与寿命校核');line([170,250],[890,250],C.gray,38);c.fillStyle='#eef2f6';c.fillRect(235,170,125,160);c.fillRect(730,175,105,150);for(let x of [270,322,765,805]){c.strokeStyle=x<400?C.blue:C.orange;c.lineWidth=6;c.beginPath();c.arc(x,250,28,0,Math.PI*2);c.stroke()}line([400,250],[660,250],C.orange,22);if(scene===0){text('前端：一对角接触球轴承',295,105,20,C.blue,'center');text('后端支承：配置与安装方式待补',785,105,20,C.orange,'center');arrow([330,145],[330,185],C.blue);arrow([780,145],[780,185],C.orange);text('轴向定位在哪？热伸长从哪里释放？',560,410,23,C.red,'center')}if(scene===1){box(170,80,220,70,'课程资源入口\n轴承组合设计',C.green,'#effbf7');text('学习资源 → 返回草图补充设计条件',560,420,21,C.green,'center');arrow([390,115],[500,115],C.green);box(510,80,220,70,'当前草图\n定位与释放方式',C.blue)}if(scene===2){box(710,80,260,190,'L₁₀h = [10⁶/(60n)]·(C/P)ᵖ',C.blue,'#f7faff');text('C：额定动载荷  P：当量动载荷',840,155,15,C.ink,'center');text('n：转速  p：球=3；滚子=10/3',840,190,15,C.ink,'center');text('每项参数均需标注来源与单位',840,230,15,C.red,'center');arrow([520,330],[690,330],C.blue)}if(scene===3){let q=['寿命','刚度','预紧','润滑','热条件','跨距'];q.forEach((v,i)=>box(150+(i%3)*270,85+Math.floor(i/3)*85,190,50,v,i===0?C.green:C.orange));text('寿命合格只是候选方案的一项检查',560,430,23,C.red,'center')}}
