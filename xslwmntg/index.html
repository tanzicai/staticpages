<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>学术论文投稿模拟系统 · Academic Paper Submission Simulator</title>
<!-- SECTION: styles -->
<style>
:root{
  --ink:#16233a; --ink-2:#4a5a72; --ink-3:#77839a;
  --brand:#1b3a6b; --brand-2:#2f6fb5; --brand-soft:#eaf1fa;
  --accent:#b9821f; --accent-soft:#fdf6e7;
  --bg:#f3f5f9; --card:#ffffff; --line:#dfe4ec; --line-2:#eef1f6;
  --ok:#1f7a4d; --ok-soft:#e8f5ee;
  --warn:#a9701a; --warn-soft:#fdf3e2;
  --err:#a8342a; --err-soft:#fdeceb;
  --radius:10px; --radius-sm:7px;
  --shadow:0 1px 2px rgba(22,35,58,.05),0 6px 18px rgba(22,35,58,.06);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
  --serif:Georgia,"Times New Roman","Songti SC","SimSun",serif;
}
*,*::before,*::after{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.65;
  min-height:100vh;
}
h1,h2,h3,h4{font-family:var(--serif); line-height:1.3; margin:0; font-weight:600;}
p{margin:0;}
button{font-family:inherit; font-size:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit; font-size:16px; color:var(--ink);}
a{color:var(--brand-2);}
[hidden]{display:none !important;}

/* SECTION: topbar */
.topbar{
  background:linear-gradient(135deg,#16305a 0%,#1b3a6b 55%,#24507f 100%);
  color:#fff; padding:14px 20px; border-bottom:3px solid var(--accent);
}
.topbar-in{max-width:1400px; margin:0 auto; display:flex; gap:14px; align-items:center; flex-wrap:wrap;}
.brand{display:flex; align-items:center; gap:12px; min-width:0; flex:1 1 320px;}
.brand-mark{flex:0 0 auto; width:40px; height:40px;}
.brand-txt{min-width:0;}
.brand-txt strong{display:block; font-family:var(--serif); font-size:19px; letter-spacing:.3px;}
.brand-txt span{display:block; font-size:12px; opacity:.82; letter-spacing:.4px;}
.top-actions{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.jpill{
  display:flex; align-items:center; gap:8px; background:rgba(255,255,255,.13);
  border:1px solid rgba(255,255,255,.28); border-radius:999px; padding:5px 13px;
  font-size:12.5px; max-width:min(52vw,340px);
}
.jpill span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.lang-switch{display:flex; background:rgba(255,255,255,.13); border:1px solid rgba(255,255,255,.3); border-radius:999px; padding:3px;}
.lang-btn{
  border:0; background:transparent; color:#fff; padding:5px 15px; border-radius:999px;
  font-size:13px; min-height:32px; opacity:.75; transition:.18s;
}
.lang-btn.on{background:#fff; color:var(--brand); opacity:1; font-weight:600;}

/* SECTION: tabs */
.tabs{
  background:var(--card); border-bottom:1px solid var(--line);
  display:flex; gap:2px; padding:0 12px; overflow-x:auto; scrollbar-width:thin;
  position:sticky; top:0; z-index:40;
}
.tab{
  border:0; background:transparent; padding:14px 18px; color:var(--ink-2);
  font-size:14.5px; white-space:nowrap; border-bottom:3px solid transparent;
  margin-bottom:-1px; display:flex; align-items:center; gap:8px; min-height:48px;
}
.tab:hover{color:var(--brand); background:var(--brand-soft);}
.tab.on{color:var(--brand); border-bottom-color:var(--accent); font-weight:600;}
.tab .dot{
  width:7px; height:7px; border-radius:50%; background:var(--line); flex:0 0 auto;
}
.tab.done .dot{background:var(--ok);}

/* SECTION: layout */
.wrap{max-width:1400px; margin:0 auto; padding:22px 20px 46px;}
.view{display:none;}
.view.on{display:block;}
.sec-head{margin-bottom:18px;}
.sec-head h2{font-size:23px; color:var(--brand);}
.sec-head p{color:var(--ink-2); margin-top:6px; font-size:14.5px; max-width:80ch;}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);}
.pad{padding:18px;}

/* SECTION: notice */
.notice{
  display:flex; gap:11px; padding:12px 15px; border-radius:var(--radius-sm);
  font-size:13.5px; line-height:1.6; margin-bottom:18px; border:1px solid;
}
.notice.info{background:var(--brand-soft); border-color:#cfe0f3; color:#20406e;}
.notice.warn{background:var(--accent-soft); border-color:#f0e0bd; color:#7c5a15;}
.notice.err{background:var(--err-soft); border-color:#f3cfcb; color:#8d2b22;}
.notice.ok{background:var(--ok-soft); border-color:#c9e6d6; color:#1a6340;}
.notice svg{flex:0 0 auto; margin-top:2px;}

/* SECTION: journal hall */
.toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:16px;}
.search{position:relative; flex:1 1 240px; min-width:0;}
.search input{
  width:100%; padding:10px 12px 10px 38px; border:1px solid var(--line);
  border-radius:var(--radius-sm); background:var(--card); min-height:44px;
}
.search svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--ink-3);}
.chips{display:flex; gap:7px; flex-wrap:wrap;}
.chip{
  border:1px solid var(--line); background:var(--card); color:var(--ink-2);
  padding:8px 14px; border-radius:999px; font-size:13px; min-height:38px; transition:.16s;
}
.chip:hover{border-color:var(--brand-2); color:var(--brand);}
.chip.on{background:var(--brand); border-color:var(--brand); color:#fff;}
.jgrid{display:grid; gap:16px; grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));}
.jcard{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  padding:16px; display:flex; flex-direction:column; gap:10px; box-shadow:var(--shadow);
  transition:.18s; min-width:0;
}
.jcard:hover{border-color:var(--brand-2); transform:translateY(-2px);}
.jcard.picked{border-color:var(--accent); border-width:2px; padding:15px;}
.jtop{display:flex; justify-content:space-between; gap:10px; align-items:flex-start;}
.jname{font-family:var(--serif); font-size:17.5px; color:var(--brand); line-height:1.35; min-width:0;}
.jpub{font-size:12.5px; color:var(--ink-3); margin-top:3px;}
.badge{
  display:inline-flex; align-items:center; gap:4px; font-size:11.5px; padding:3px 9px;
  border-radius:999px; background:var(--brand-soft); color:var(--brand);
  border:1px solid #cfe0f3; white-space:nowrap; flex:0 0 auto; font-weight:600;
}
.badge.oa{background:var(--ok-soft); color:var(--ok); border-color:#c9e6d6;}
.badge.gold{background:var(--accent-soft); color:var(--accent); border-color:#f0e0bd;}
.jmeta{display:flex; flex-wrap:wrap; gap:6px;}
.tag{font-size:11.5px; padding:3px 8px; border-radius:5px; background:var(--line-2); color:var(--ink-2);}
.jscope{font-size:13.5px; color:var(--ink-2); line-height:1.6;}
.sysbox{display:flex; gap:7px; align-items:baseline; flex-wrap:wrap; background:#f2f7fd; border:1px solid #d7e6f5; border-left:3px solid var(--brand-2); border-radius:0 var(--radius-sm) var(--radius-sm) 0; padding:8px 11px;}
.sysbox .sysk{font-size:11.5px; font-weight:700; color:var(--brand); text-transform:uppercase; letter-spacing:.4px; flex:0 0 auto;}
.sysbox .sysv{font-size:12.5px; color:var(--ink-2); line-height:1.5; min-width:0;}
.jkv{display:grid; gap:5px; font-size:13px; border-top:1px dashed var(--line); padding-top:10px;}
.jkv div{display:flex; gap:8px; min-width:0;}
.jkv dt{color:var(--ink-3); flex:0 0 auto; min-width:96px;}
.jkv dd{margin:0; color:var(--ink); min-width:0; flex:1 1 auto; overflow-wrap:anywhere;}
.jact{display:flex; gap:8px; margin-top:auto; padding-top:4px; flex-wrap:wrap;}

/* SECTION: buttons */
.btn{
  border:1px solid var(--line); background:var(--card); color:var(--ink);
  padding:9px 16px; border-radius:var(--radius-sm); font-size:14px; min-height:42px;
  display:inline-flex; align-items:center; justify-content:center; gap:7px; transition:.16s;
}
.btn:hover{border-color:var(--brand-2); color:var(--brand);}
.btn.primary{background:var(--brand); border-color:var(--brand); color:#fff;}
.btn.primary:hover{background:#152f57; color:#fff;}
.btn.gold{background:var(--accent); border-color:var(--accent); color:#fff;}
.btn.gold:hover{background:#a2711a; color:#fff;}
.btn.danger{background:var(--card); border-color:#e3bfbb; color:var(--err);}
.btn.danger:hover{background:var(--err-soft); border-color:var(--err);}
.btn.sm{padding:6px 12px; font-size:13px; min-height:34px;}
.btn.block{width:100%;}
.btn:disabled{opacity:.45; cursor:not-allowed;}
.btn-row{display:flex; gap:10px; flex-wrap:wrap;}

/* SECTION: wizard */
.wizard{display:grid; gap:18px; grid-template-columns:minmax(0,1fr); align-items:start;}
@media (min-width:1000px){
  .wizard{grid-template-columns:246px minmax(0,1fr);}
  .stepnav{position:sticky; top:66px;}
}
@media (min-width:1320px){
  .wizard{grid-template-columns:246px minmax(0,1fr) 306px;}
  .note-rail{position:sticky; top:66px;}
}
.stepnav{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  padding:12px; box-shadow:var(--shadow); min-width:0;
}
.stepnav h3{font-size:13px; text-transform:uppercase; letter-spacing:.9px; color:var(--ink-3); font-family:var(--sans); font-weight:600; padding:2px 6px 10px;}
.stepnav ol{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px;}
@media (max-width:999px){
  .stepnav ol{flex-direction:row; overflow-x:auto; gap:8px; padding-bottom:6px; scrollbar-width:thin;}
  .stepnav li{flex:0 0 auto;}
}
.snav{
  display:flex; gap:10px; align-items:center; width:100%; border:0; background:transparent;
  padding:9px 8px; border-radius:var(--radius-sm); text-align:left; min-height:44px;
  color:var(--ink-2); transition:.16s;
}
.snav:hover{background:var(--line-2);}
.snav.on{background:var(--brand-soft); color:var(--brand); font-weight:600;}
.snum{
  flex:0 0 auto; width:24px; height:24px; border-radius:50%; display:flex;
  align-items:center; justify-content:center; font-size:12px; font-weight:700;
  background:var(--line-2); color:var(--ink-3); border:1px solid var(--line);
}
.snav.on .snum{background:var(--brand); color:#fff; border-color:var(--brand);}
.snav.ok .snum{background:var(--ok-soft); color:var(--ok); border-color:#c9e6d6;}
.snav.ok.done .snum{background:var(--ok); color:#fff; border-color:var(--ok);}
.stxt{min-width:0; flex:1 1 auto; font-size:13.5px; line-height:1.35; overflow-wrap:anywhere;}
.stxt small{display:block; font-size:11.5px; color:var(--ink-3); font-weight:400; overflow-wrap:anywhere;}
.nav-foot{border-top:1px solid var(--line-2); margin-top:10px; padding-top:10px; display:grid; gap:8px;}

.wiz-main{min-width:0;}
.wiz-head{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow); margin-bottom:16px;}
.wiz-head .kicker{font-size:12px; letter-spacing:.8px; text-transform:uppercase; color:var(--accent); font-weight:700;}
.wiz-head h2{font-size:22px; color:var(--brand); margin-top:5px;}
.wiz-head p{color:var(--ink-2); font-size:14px; margin-top:7px;}
.pbar{height:7px; background:var(--line-2); border-radius:999px; margin-top:14px; overflow:hidden;}
.pbar i{display:block; height:100%; background:linear-gradient(90deg,var(--brand),var(--brand-2)); border-radius:999px; transition:width .35s;}
.pmeta{display:flex; justify-content:space-between; gap:10px; font-size:12.5px; color:var(--ink-3); margin-top:6px; flex-wrap:wrap;}

.step-body{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow);}
.step-body h3{font-size:16.5px; color:var(--ink); margin-bottom:4px;}
.step-body h4{font-size:14.5px; color:var(--brand); margin:20px 0 9px; font-family:var(--sans); font-weight:700;}
.subnote{font-size:13px; color:var(--ink-3); margin-bottom:14px;}
.divider{height:1px; background:var(--line-2); margin:20px 0;}

.field{margin-bottom:16px; min-width:0;}
.field > label,.lbl{display:block; font-size:13.5px; font-weight:600; color:var(--ink); margin-bottom:6px;}
.req{color:var(--err); margin-left:3px;}
.hint{font-size:12.5px; color:var(--ink-3); margin-top:5px; line-height:1.55;}
.inp,.sel,.ta{
  width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:var(--radius-sm);
  background:#fff; min-height:44px; transition:.16s;
}
.ta{min-height:104px; resize:vertical; line-height:1.6;}
.inp:focus,.sel:focus,.ta:focus{outline:none; border-color:var(--brand-2); box-shadow:0 0 0 3px rgba(47,111,181,.13);}
.inp.bad,.ta.bad,.sel.bad{border-color:var(--err); background:#fffafa;}
.grid2{display:grid; gap:14px; grid-template-columns:minmax(0,1fr);}
@media (min-width:720px){ .grid2{grid-template-columns:repeat(2,minmax(0,1fr));} }
.grid3{display:grid; gap:14px; grid-template-columns:minmax(0,1fr);}
@media (min-width:720px){ .grid3{grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));} }
.counter{display:flex; justify-content:space-between; gap:10px; font-size:12.5px; margin-top:5px; flex-wrap:wrap;}
.counter b{font-weight:700;}
.counter .good{color:var(--ok);} .counter .bad{color:var(--err);} .counter .mid{color:var(--warn);}

.check{display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border:1px solid var(--line); border-radius:var(--radius-sm); background:#fcfdfe; margin-bottom:9px; min-width:0;}
.check:hover{border-color:var(--brand-2); background:var(--brand-soft);}
.check input{width:19px; height:19px; margin:2px 0 0; flex:0 0 auto; accent-color:var(--brand);}
.check span{font-size:13.5px; line-height:1.55; min-width:0;}
.check small{display:block; color:var(--ink-3); font-size:12.5px; margin-top:2px;}

.radio-cards{display:grid; gap:10px; grid-template-columns:minmax(0,1fr);}
@media (min-width:640px){ .radio-cards{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));} }
.rcard{
  border:1px solid var(--line); border-radius:var(--radius-sm); padding:13px; cursor:pointer;
  background:#fff; transition:.16s; display:flex; gap:10px; align-items:flex-start; min-width:0; text-align:left;
}
.rcard:hover{border-color:var(--brand-2); background:var(--brand-soft);}
.rcard.on{border-color:var(--brand); background:var(--brand-soft); box-shadow:inset 0 0 0 1px var(--brand);}
.rcard input{margin:3px 0 0; accent-color:var(--brand); flex:0 0 auto; width:17px; height:17px;}
.rcard b{display:block; font-size:14px; color:var(--ink); margin-bottom:3px;}
.rcard small{display:block; font-size:12.5px; color:var(--ink-2); line-height:1.55;}

/* authors / files / reviewers lists */
.listitem{border:1px solid var(--line); border-radius:var(--radius-sm); padding:14px; margin-bottom:11px; background:#fcfdfe; min-width:0;}
.li-head{display:flex; justify-content:space-between; gap:10px; align-items:center; margin-bottom:11px; flex-wrap:wrap;}
.li-title{font-size:14px; font-weight:700; color:var(--brand); display:flex; align-items:center; gap:8px; flex-wrap:wrap; min-width:0;}
.pill{font-size:11px; padding:2px 8px; border-radius:999px; background:var(--brand-soft); color:var(--brand); border:1px solid #cfe0f3; white-space:nowrap;}
.pill.ok{background:var(--ok-soft); color:var(--ok); border-color:#c9e6d6;}
.pill.warn{background:var(--warn-soft); color:var(--warn); border-color:#f0e0bd;}
.pill.err{background:var(--err-soft); color:var(--err); border-color:#f3cfcb;}
.li-acts{display:flex; gap:6px; flex-wrap:wrap;}
.iconbtn{border:1px solid var(--line); background:#fff; border-radius:6px; padding:5px 10px; font-size:12.5px; color:var(--ink-2); min-height:32px;}
.iconbtn:hover{border-color:var(--brand-2); color:var(--brand);}
.iconbtn.del:hover{border-color:var(--err); color:var(--err); background:var(--err-soft);}

.filetable{width:100%; border-collapse:collapse; font-size:13.5px;}
.filetable th,.filetable td{text-align:left; padding:9px 10px; border-bottom:1px solid var(--line-2); vertical-align:top; min-width:0;}
.filetable th{font-size:11.5px; text-transform:uppercase; letter-spacing:.6px; color:var(--ink-3); font-weight:700; background:#fafbfd;}
.filetable td.fname{overflow-wrap:anywhere; max-width:0;}
.scroll-x{overflow-x:auto; -webkit-overflow-scrolling:touch; border:1px solid var(--line); border-radius:var(--radius-sm);}
.dropzone{
  border:2px dashed #c6d3e4; border-radius:var(--radius); padding:22px 16px; text-align:center;
  background:#fafcff; color:var(--ink-2); font-size:13.5px; transition:.16s;
}
.dropzone:hover,.dropzone.over{border-color:var(--brand-2); background:var(--brand-soft);}
.empty{text-align:center; padding:26px 14px; color:var(--ink-3); font-size:13.5px; border:1px dashed var(--line); border-radius:var(--radius-sm); background:#fcfdfe;}

.wiz-actions{display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; align-items:center;}
.wiz-actions .spacer{flex:1 1 auto;}
.errbox{margin-top:14px;}

/* SECTION: note rail */
.note-rail{min-width:0;}
.note-card{background:var(--accent-soft); border:1px solid #f0e0bd; border-radius:var(--radius); padding:16px; box-shadow:var(--shadow);}
.note-card h3{font-size:14.5px; color:#8a5f14; display:flex; align-items:center; gap:8px; margin-bottom:10px; font-family:var(--sans); font-weight:700;}
.note-sec{margin-bottom:14px;}
.note-sec:last-child{margin-bottom:0;}
.note-sec h4{font-size:12px; text-transform:uppercase; letter-spacing:.7px; color:var(--accent); margin-bottom:5px; font-family:var(--sans); font-weight:700;}
.note-sec p,.note-sec li{font-size:13px; color:#5c4a25; line-height:1.62;}
.note-sec ul{margin:0; padding-left:18px;}
.note-sec li{margin-bottom:5px;}
.pitfall{background:#fff; border-left:3px solid var(--err); border-radius:0 6px 6px 0; padding:9px 11px; font-size:12.5px; color:#7d332b; line-height:1.6;}
.pitfall b{display:block; margin-bottom:3px; font-size:12px;}
@media (max-width:1319px){
  .note-rail{margin-top:16px;}
}
.note-toggle{display:none;}
@media (max-width:1319px){ .note-toggle{display:inline-flex;} }

/* SECTION: tracking */
.ms-head{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); margin-bottom:18px;}
.ms-id{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:13px; color:var(--accent); font-weight:700; letter-spacing:.5px;}
.ms-title{font-family:var(--serif); font-size:20px; color:var(--brand); margin:7px 0 5px; line-height:1.4; overflow-wrap:anywhere;}
.ms-status{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:12px;}
.status-tag{font-size:13px; font-weight:700; padding:6px 14px; border-radius:999px; background:var(--brand-soft); color:var(--brand); border:1px solid #cfe0f3;}
.status-tag.ok{background:var(--ok-soft); color:var(--ok); border-color:#c9e6d6;}
.status-tag.warn{background:var(--warn-soft); color:var(--warn); border-color:#f0e0bd;}
.status-tag.err{background:var(--err-soft); color:var(--err); border-color:#f3cfcb;}
.trk-grid{display:grid; gap:18px; grid-template-columns:minmax(0,1fr); align-items:start;}
@media (min-width:1000px){ .trk-grid{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);} }
.timeline{list-style:none; margin:0; padding:0;}
.tl{display:flex; gap:14px; position:relative; padding-bottom:20px; min-width:0;}
.tl:last-child{padding-bottom:0;}
.tl::before{content:""; position:absolute; left:13px; top:28px; bottom:0; width:2px; background:var(--line);}
.tl:last-child::before{display:none;}
.tl.done::before{background:var(--ok);}
.tl-dot{
  flex:0 0 auto; width:28px; height:28px; border-radius:50%; background:#fff;
  border:2px solid var(--line); display:flex; align-items:center; justify-content:center;
  font-size:12px; color:var(--ink-3); z-index:1; font-weight:700;
}
.tl.done .tl-dot{background:var(--ok); border-color:var(--ok); color:#fff;}
.tl.now .tl-dot{background:var(--brand); border-color:var(--brand); color:#fff; box-shadow:0 0 0 4px rgba(27,58,107,.15);}
.tl-body{min-width:0; flex:1 1 auto; padding-top:2px;}
.tl-body b{display:block; font-size:14px; color:var(--ink);}
.tl.now .tl-body b{color:var(--brand);}
.tl-body small{display:block; font-size:12.5px; color:var(--ink-3); margin-top:2px;}

.tl-date{font-size:12px; color:var(--ink-3); font-family:ui-monospace,Menlo,Consolas,monospace;}

.rev-card{border:1px solid var(--line); border-radius:var(--radius-sm); margin-bottom:12px; overflow:hidden; min-width:0;}
.rev-head{display:flex; gap:10px; align-items:center; padding:11px 14px; background:#fafbfd; border-bottom:1px solid var(--line-2); flex-wrap:wrap;}
.rev-head b{font-size:14px; color:var(--brand);}
.rev-rec{font-size:12px; padding:3px 10px; border-radius:999px; background:var(--brand-soft); color:var(--brand); border:1px solid #cfe0f3; font-weight:600;}

.rev-body ol{margin:0; padding-left:20px;}
.rev-body li{font-size:13.5px; color:var(--ink-2); line-height:1.65; margin-bottom:8px;}
.letter{background:#fcfdfe; border:1px solid var(--line); border-left:4px solid var(--brand); border-radius:0 var(--radius-sm) var(--radius-sm) 0; padding:16px; font-size:13.5px; line-height:1.72; white-space:pre-line; color:var(--ink-2); overflow-wrap:anywhere;}
.score-wrap{display:flex; gap:16px; align-items:center; flex-wrap:wrap; margin-bottom:14px;}
.score-ring{flex:0 0 auto; width:96px; height:96px; position:relative;}
.score-ring svg{transform:rotate(-90deg);}
.score-ring b{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:21px; color:var(--brand); font-family:var(--serif);}
.score-list{list-style:none; margin:0; padding:0; flex:1 1 240px; min-width:0; display:grid; gap:6px;}
.score-list li{display:flex; gap:8px; align-items:flex-start; font-size:13px; color:var(--ink-2); line-height:1.5;}
.score-list li span{flex:0 0 auto; width:18px; height:18px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; margin-top:1px;}
.score-list li.y span{background:var(--ok-soft); color:var(--ok);}
.score-list li.n span{background:var(--err-soft); color:var(--err);}

/* SECTION: knowledge */
.kgrid{display:grid; gap:18px; grid-template-columns:minmax(0,1fr);}
.kmap{display:grid; gap:12px; grid-template-columns:minmax(0,1fr);}
@media (min-width:680px){ .kmap{grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));} }
.kstep{border:1px solid var(--line); border-radius:var(--radius-sm); padding:14px; background:#fcfdfe; min-width:0;}
.kstep .n{font-family:var(--serif); font-size:24px; color:var(--accent); line-height:1;}
.kstep b{display:block; font-size:14.5px; color:var(--brand); margin:6px 0 3px;}
.kstep small{display:block; font-size:12px; color:var(--ink-3); margin-bottom:7px;}
.kstep p{font-size:13px; color:var(--ink-2); line-height:1.6;}
.gloss-table{width:100%; border-collapse:collapse; font-size:13.5px;}
.gloss-table th,.gloss-table td{padding:10px 12px; text-align:left; border-bottom:1px solid var(--line-2); vertical-align:top;}
.gloss-table th{background:#fafbfd; font-size:11.5px; text-transform:uppercase; letter-spacing:.6px; color:var(--ink-3); font-weight:700;}
.gloss-table td.en{font-family:var(--serif); color:var(--brand); min-width:150px;}
.gloss-table tr:hover td{background:#fafcff;}
.acc{border:1px solid var(--line); border-radius:var(--radius-sm); margin-bottom:10px; overflow:hidden; min-width:0;}
.acc > button{
  width:100%; border:0; background:#fafbfd; padding:13px 15px; text-align:left;
  font-size:14.5px; font-weight:600; color:var(--brand); display:flex; gap:10px;
  align-items:center; justify-content:space-between; min-height:48px;
}
.acc > button:hover{background:var(--brand-soft);}
.acc .body{padding:15px; border-top:1px solid var(--line-2); font-size:13.5px; color:var(--ink-2); line-height:1.7;}
.acc .body ul{margin:0 0 10px; padding-left:20px;}
.acc .body li{margin-bottom:6px;}
.acc .body p{margin-bottom:10px;}
.acc .body pre{
  background:#f7f9fc; border:1px solid var(--line); border-radius:6px; padding:12px;
  font-size:12.5px; overflow-x:auto; line-height:1.65; font-family:ui-monospace,Menlo,Consolas,monospace;
  white-space:pre-wrap; overflow-wrap:anywhere; color:var(--ink-2); margin:0 0 10px;
}
.caret{transition:.2s; flex:0 0 auto;}
.acc.open .caret{transform:rotate(90deg);}

/* SECTION: modal */
.mask{position:fixed; inset:0; background:rgba(16,26,44,.5); z-index:80; display:flex; align-items:center; justify-content:center; padding:18px;}
.modal{background:#fff; border-radius:var(--radius); max-width:520px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,.28); max-height:88vh; overflow-y:auto;}
.modal-h{padding:17px 20px; border-bottom:1px solid var(--line); display:flex; gap:10px; align-items:center;}
.modal-h h3{font-size:17px; color:var(--brand);}
.modal-b{padding:20px; font-size:14px; color:var(--ink-2); line-height:1.7;}
.modal-f{padding:14px 20px; border-top:1px solid var(--line); display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap; background:#fafbfd;}
.toast{
  position:fixed; left:50%; bottom:26px; transform:translateX(-50%); z-index:90;
  background:#16233a; color:#fff; padding:11px 20px; border-radius:999px; font-size:13.5px;
  box-shadow:0 8px 26px rgba(0,0,0,.3); max-width:min(92vw,520px); text-align:center;
}
.toast.ok{background:#1a6340;} .toast.err{background:#8d2b22;}

/* SECTION: footer */
.foot{border-top:1px solid var(--line); background:var(--card); padding:20px; margin-top:10px;}
.foot-in{max-width:1400px; margin:0 auto; font-size:12.5px; color:var(--ink-3); line-height:1.7;}
.foot-in b{color:var(--ink-2);}

<body>

<!-- SECTION: header -->
<header class="topbar">

</header>

<!-- SECTION: tabs -->
<nav class="tabs" id="tabs">

  <button class="tab" type="button" data-view="wizard"><span class="dot"></span><span data-i18n="tab.wizard"></span></button>

<main class="wrap">

  <!-- SECTION: view-journals -->

      <h2 data-i18n="jh.title"></h2>
      <p data-i18n="jh.sub"></p>
    </div>
    <div class="notice info" id="jh-notice">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
      <div data-i18n="jh.notice"></div>

  <!-- SECTION: view-wizard -->

      <aside class="stepnav">

          <div data-i18n="kb.sysTip"></div>
        </div>
      </div>
      <div class="card pad" style="margin-bottom:18px">
        <h3 style="font-size:17px;color:var(--brand);margin-bottom:4px" data-i18n="kb.gloss"></h3>
        <p class="subnote" data-i18n="kb.glossSub"></p>
        <div class="search" style="margin:12px 0">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>

            <thead><tr><th data-i18n="kb.thEn"></th><th data-i18n="kb.thZh"></th><th data-i18n="kb.thNote"></th></tr></thead>
            <tbody id="kb-gloss-body"></tbody>
          </table>
        </div>
        <div class="empty" id="kb-gloss-empty" hidden data-i18n="kb.glossEmpty"></div>
      </div>
      <div class="card pad" style="margin-bottom:18px">
        <h3 style="font-size:17px;color:var(--brand);margin-bottom:4px" data-i18n="kb.reject"></h3>
        <p class="subnote" data-i18n="kb.rejectSub"></p>
        <div id="kb-reject" style="margin-top:12px"></div>

        <h3 style="font-size:17px;color:var(--brand);margin-bottom:4px" data-i18n="kb.tools"></h3>

        <div id="kb-tools" style="margin-top:12px"></div>

"s0.t":"作者注册与登录","s0.d":"国际期刊普遍使用在线投稿系统，但不同出版社用的并不是同一套：Elsevier 主要用 Editorial Manager，Wiley 与部分 Taylor & Francis 期刊用 ScholarOne，Springer Nature 部分品牌用 SNAPP，T&F 另有 Submission Portal，ACS 与中文期刊则用自建平台。账户体系各不相同——同一出版社内通常可跨刊复用，跨出版社则需重新注册。请优先使用机构邮箱（.edu / .ac.cn），可显著降低被系统判定为垃圾投稿的风险。",
"s0.sysNote":"不同出版社的投稿系统界面、字段顺序与文件分类项并不相同。本模拟系统的步骤以覆盖面最广的 Editorial Manager 为基准；在 ScholarOne 中文件上传页叫 File Upload，在 SNAPP 中步骤更精简。无论哪套系统，核心逻辑一致：填报信息 → 分类上传 → 核对确认 → 提交。",

"s0.err.full":"请填写姓名","s0.err.email":"请填写有效的电子邮箱（建议使用机构邮箱）","s0.err.inst":"请填写所属机构","s0.err.orcid":"ORCID 格式应为 0000-0000-0000-0000",
"s0.hint.email":"系统会通过该邮箱发送稿件编号、审稿意见与决定信。邮箱填写错误是最常见的“投稿后失联”原因。",
"s0.note.why":"为什么要注册账户：投稿系统需要一个身份来关联你的稿件、跟踪状态、接收编辑信件。账户范围取决于系统——Springer Nature 一个账户可投集团旗下多刊；Elsevier 的 Editorial Manager 通常按期刊分别开户；ScholarOne 则按期刊专属站点（mc.manuscriptcentral.com/刊名）注册。ORCID 是跨系统的唯一学者标识，绑定后可避免同名混淆，也便于各系统自动带出你的信息。",
"s0.note.tip":"注册前准备：稳定的机构邮箱、所有合作者的姓名与邮箱、基金编号、单位英文全称（须与学校官方译名一致）。换出版社投稿时要重新注册，别指望旧账号通用——这是新手最常卡住的地方。",
"s0.note.pit":"常见错误：用 QQ/163 等个人邮箱注册被系统拦为高风险投稿；单位英文名自行翻译与官方不一致；多位作者共用一个账户，导致署名与账户信息不符；以为在 A 出版社注册过就能直接登录 B 出版社的系统，结果在登录页反复失败。",

"s1.t":"选择文章类型","s1.d":"文章类型（Article Type）决定稿件的篇幅限制、结构要求与审稿标准。选错类型会直接进入形式审查退回。请务必对照期刊稿约（Guide for Authors）确认。",

"s1.note.why":"为什么先选类型：系统会根据类型加载不同的必填字段、字数上限与文件清单。类型一旦提交，编辑部通常不允许中途更改，只能撤稿重投。",
"s1.note.tip":"判断依据：是否有原创实验数据（Research Paper）；是否对已有文献做系统归纳（Review）；是否为简短的初步发现（Short Communication）；是否回应已发表论文（Letter）。",
"s1.note.pit":"常见错误：把综述投成研究论文；篇幅远超该类型上限；学位论文直接拆分投稿但未改写为期刊体例。",

"s2.t":"稿件基本信息","s2.d":"填写标题、摘要、关键词与 Highlights。这是编辑在初审阶段唯一会认真读的部分——很多稿件在这里就被决定命运。摘要字数与 Highlights 字符数都有硬性上限，超出即无法通过系统校验。",
"s2.title":"论文标题","s2.ph.title":"如：超声辅助提取对蓝莓花青素得率及抗氧化活性的影响",
"s2.hint.title":"标题应包含研究对象、处理方式与主要观测指标，避免“研究”“分析”“探讨”等空泛词，控制在 20 个词以内。",
"s2.abstract":"摘要","s2.ph.abstract":"按 目的—方法—结果—结论 四要素撰写。结果部分应给出关键数据（如得率提高 X%、p<0.05），而非仅定性描述。",
"s2.words":"词 / words","s2.limit":"上限","s2.hint.abstract":"多数食品类期刊要求 150–250 词，不分段、不含参考文献与图表编号、不用第一人称。",
"s2.keywords":"关键词（用分号分隔，3–7 个）","s2.ph.keywords":"如：花青素；超声辅助提取；抗氧化活性；蓝莓；响应面法",
"s2.hint.keywords":"避免与标题完全重复；优先使用学科规范术语（可参考期刊近期论文的关键词）；不要用缩略语，除非是通用缩写。",
"s2.hlTitle":"Highlights（研究亮点）","s2.hint.hl":"3–5 条要点，每条不超过 85 个字符（含空格），只写核心结果与创新点，不写背景与方法。",
"s2.hlAdd":"添加一条 Highlight","s2.hlChars":"字符","s2.hlMax":"上限 85","s2.hlPh":"如：Ultrasound increased anthocyanin yield by 34.2%.",
"s2.hlNoTitle":"本期刊不要求提交 Highlights","s2.hlNoNote":"Highlights 是 Elsevier 系期刊（以及后来跟进的少数出版社）特有的投稿材料，并非国际通行要求。你当前选择的这本期刊属于其他出版社，因此系统不提供该填写项。换投 Elsevier 期刊时它会重新出现——这正是不同出版社投稿要求存在差异的典型例子：同一篇论文改投时，需要准备的配套材料清单可能完全不同。投稿前请以该刊官网的 Guide for Authors / Submission Guidelines 为准。",
"s2.gaTitle":"图形摘要 Graphical Abstract","s2.hint.ga":"一张图概括研究主线（原料→处理→表征→功能）。建议尺寸与格式见期刊指南；此处仅登记是否已准备。",
"s2.gaYes":"已准备图形摘要","s2.gaN":"未准备",
"s2.err.title":"请填写论文标题（建议不少于 8 个词）","s2.err.abstract":"请填写摘要，且字数需在期刊要求范围内",
"s2.err.keywords":"请填写 3–7 个关键词，用分号分隔","s2.err.hl":"Highlights 需为 3–5 条，且每条不超过 85 个字符",
"s2.note.why":"为什么这一步最关键：编辑每天处理数十份投稿，初审时通常只看标题、摘要和 Highlights。这三项决定稿件是否送外审——据统计约 30%–50% 的稿件在编辑环节即被拒（Desk Rejection）。",
"s2.note.tip":"摘要写作四要素：目的（为什么做）→ 方法（怎么做的关键参数）→ 结果（最重要的 2–3 个数据）→ 结论（说明了什么、有何应用价值）。Highlights 只放结果，每条一个独立发现。",
"s2.note.pit":"常见错误：摘要写成引言的扩写；结果部分只有“显著提高”而无数据；关键词与标题高度重复；Highlights 写成方法罗列或超过 85 字符被系统截断。",

"s6.note.why":"为什么期刊要你推荐：编辑的审稿人库有限，作者最了解本领域谁在做相关工作。但推荐权在编辑，你推荐的专家不一定会被邀请，也不必因未被采用而焦虑。",
"s6.note.tip":"选人标准：① 研究方向高度匹配（可查其近三年论文）；② 优先正高职称或独立课题组负责人；③ 国籍与机构尽量分散；④ 避开同单位、同课题组、近期合作者与师生关系。",
"s6.note.pit":"常见错误：推荐自己的导师或合作者；推荐人邮箱填成机构公共邮箱；只填姓名不填单位导致编辑无法核实；伪造审稿人邮箱（属严重学术不端，会被列入黑名单）。",

"s7.t":"投稿信与最终确认","s7.d":"投稿信（Cover Letter）是作者与编辑的直接对话，用来说明研究做了什么、为什么重要、为什么适合这本期刊。提交前请逐项核对检查清单，确认无误后点击提交。",

"s7.hint.cl":"控制在 400 词以内、一页纸。不要复制摘要——编辑要看的是“为什么值得发表”和“为什么投给我们”。",

"s7.submitTitle":"确认提交稿件？","s7.submitBody":"提交后稿件将进入编辑部处理流程，系统会生成稿件编号（Manuscript ID）。在编辑正式处理前你仍可撤稿，但已提交的稿件不能直接修改内容——如需更改须撤稿重投。确定提交吗？",
"s7.note.why":"为什么投稿信值得花时间：Elsevier 等出版商明确指出，投稿信往往是编辑审阅投稿时最先阅读的内容。一封到位的信能让编辑在几十秒内抓住研究亮点，直接影响是否送外审。",
"s7.note.tip":"投稿信必备要素：编辑姓名（如已知）与期刊名、稿件标题与类型、研究问题与背景、方法与主要发现、创新点与意义、为何契合本刊范围、原创性与无一稿多投声明、通讯作者联系方式。",
"s7.note.pit":"常见错误：整段复制摘要；只写“我们的研究很重要”却不说重要在哪；篇幅超过一页；忘记声明未一稿多投；语气过度推销或使用夸张表述。",

"st.editor":"编辑初审中","st.editor.d":"主编或副主编评估稿件是否落在期刊范围、是否具有足够创新性，决定是否送外审。此阶段约有 30%–50% 的稿件被拒（Desk Rejection）。",

"kb.title":"投稿知识库","kb.sub":"投稿流程全景、术语中英对照、常见退稿原因与写作要点。建议在动手投稿前先通读一遍，遇到具体步骤时再回来查阅对应条目。",
"kb.map":"投稿全流程九阶段","kb.mapSub":"从选刊到见刊的完整链条。多数新手只关注“写完论文”，但实际发表周期中，投稿与修改环节往往占用数月。",
"kb.sys":"各出版社投稿系统对比","kb.sysSub":"不同出版社使用不同的在线投稿系统，账户体系、界面字段与文件分类项差异明显。选刊时把系统一并纳入考虑，能避免正式投稿当天手忙脚乱。",
"kb.sysPub":"出版社","kb.sysName":"常用投稿系统","kb.sysNote":"特点与差异","kb.sysTip":"教学提示：同一篇论文投往不同出版社，需要重新调整的不只是参考文献格式——账户体系、文件分类项（Item）、是否要求 Highlights、状态词与决定信措辞都不同。本模拟系统的步骤设计以 Editorial Manager 为基准（覆盖面最广）；在其他系统中步骤名称可能不同，但“填报信息 → 分类上传 → 核对确认 → 提交”的核心逻辑一致。",
"kb.s1.pub":"Elsevier","kb.s1.name":"Editorial Manager（EM）",
"kb.s1.note":"应用最广的第三方投稿系统之一，由 Aries Systems 开发（现属 Elsevier）。特点：分步向导式填报（先选 Article Type，再逐步填写 General Information 等）；上传文件后需 Build PDF 并由作者逐页核对确认；常见状态词为 With Editor / Under Review / Decision in Process。2025 年下半年起部分期刊已切换到新版系统，入口与流程有所调整，以期刊主页按钮指向为准。",
"kb.s2.pub":"Springer Nature","kb.s2.name":"Editorial Manager / SNAPP（按品牌而定）",
"kb.s2.note":"同一集团内不同品牌使用不同系统：Springer 品牌期刊多数使用 Editorial Manager，部分品牌使用 SNAPP。特点：账户可在集团内跨刊复用，无需为每本期刊重复注册；稿件常要求明确分节标题，图表与源文件可单独上传；开放获取选项与 APC 金额在提交环节即需确认。",
"kb.s3.pub":"Taylor & Francis","kb.s3.name":"ScholarOne / Editorial Manager / Submission Portal（三套并行）",
"kb.s3.note":"同一出版社内部三套系统并行，无法凭出版社名称推断，必须从期刊主页的 Go to submission site 按钮进入才能确定。Submission Portal 的特点是把作者在各刊的历史投稿集中管理，免去为多本期刊分别注册账号；ScholarOne 则以 Manuscript Central 为入口，文件分类项与 EM 命名不同。",
"kb.s4.pub":"Wiley","kb.s4.name":"ScholarOne Manuscripts",
"kb.s4.note":"入口为 mc.manuscriptcentral.com（期刊专属站点）。特点：投稿用 ScholarOne，而录用后的协议签署、APC 支付与出版进度在 Wiley Authors Dashboard 中处理，两套界面分工明确；Wiley 另有智能投稿功能，可自动从上传文档中提取标题、摘要、作者与单位信息以减少重复录入，但提取结果仍须逐项核对。",
"kb.s5.pub":"ACS（美国化学会）","kb.s5.name":"出版社自建投稿系统",
"kb.s5.note":"入口在期刊主页的 Submit 按钮。特点：ACS 系列期刊体例高度统一，有专用 Word/LaTeX 模板与固定参考文献格式；Graphical Abstract 与 Supporting Information 通常需作为独立条目提交；提交环节会要求填写详细的作者贡献与利益冲突信息。",
"kb.s6.pub":"中文期刊（如《食品科学》）","kb.s6.name":"编辑部自建采编系统",
"kb.s6.note":"界面为中文，字段相对精简。特点：通常需额外填写作者简介、基金项目号、中图分类号与文献标识码；稿件须为中文撰写并附中英文摘要与关键词；审稿流程与国内评价体系衔接，格式要求以刊物官网为准。",
"kb.gloss":"术语中英对照表","kb.glossSub":"投稿系统与编辑信件中的高频术语。看不懂状态词是新手焦虑的主要来源。","kb.glossPh":"搜索术语（中文或英文）…","kb.thEn":"英文术语","kb.thZh":"中文","kb.thNote":"说明","kb.glossEmpty":"没有找到匹配术语。",
"kb.reject":"常见退稿原因 Top 10","kb.rejectSub":"按编辑部与审稿人反馈频次排序。前四项属于“编辑环节即退”，与论文学术质量无关，完全可以避免。",
"kb.tools":"关键材料写作要点","kb.toolsSub":"投稿信、Highlights、摘要、审稿意见回复信的写作规范与模板骨架。",

"kb.map1.t":"选题与选刊","kb.map1.d":"确认研究创新性，用参考文献来源、期刊检索工具筛选 3–5 本候选期刊，逐一核对 Aims & Scope。",
"kb.map2.t":"阅读作者指南","kb.map2.d":"通读 Guide for Authors，摘录格式要求：摘要字数、关键词数量、参考文献体例、图表规格、字数上限。",
"kb.map3.t":"稿件体例改写","kb.map3.d":"按目标期刊体例重排版式、调整参考文献格式、补充声明与作者贡献。学位论文不能直接投稿。",
"kb.map4.t":"准备配套材料","kb.map4.d":"撰写投稿信、Highlights、图形摘要，整理伦理批件、基金信息、推荐审稿人名单。",
"kb.map5.t":"系统注册与填报","kb.map5.d":"用机构邮箱注册投稿账户，按向导填写稿件信息、作者、声明，逐类上传文件。",
"kb.map6.t":"核对并提交","kb.map6.d":"Build PDF 后逐页核对合并稿，确认无误提交，记录稿件编号与提交日期。",
"kb.map7.t":"初审与外审","kb.map7.d":"形式审查 → 编辑初审 → 送外审。期间状态长期不变属正常，不要频繁催审或另投他刊。",
"kb.map8.t":"修改与回复","kb.map8.d":"逐条回应审稿意见（含不同意的意见），标注修改位置，按期提交修改稿与回复信。",
"kb.map9.t":"录用与出版","kb.map9.d":"签署版权协议、支付 APC（如选开放获取）、校对清样（Proof）、获得 DOI，正式见刊。",

"kb.r1.t":"超出期刊收稿范围（Out of Scope）","kb.r1.d":"最高频退稿原因。研究主题与期刊定位不符，编辑不会送外审。投稿前必须读 Aims & Scope，并浏览该刊近期发表的 5–10 篇论文。",
"kb.r2.t":"创新性不足 / 增量式研究","kb.r2.d":"仅更换原料或微调参数重复已知结论，缺乏机理阐释或方法学贡献。需在引言末与讨论中明确说明“本研究新在哪里”。",
"kb.r3.t":"格式与形式要求不合规","kb.r3.d":"摘要超字数、图表分辨率不足、参考文献体例混乱、缺少必需声明。这类问题会在形式审查阶段直接退回，浪费数周时间。",
"kb.r4.t":"英文表达与逻辑问题","kb.r4.d":"语言错误多到影响理解，或段落逻辑跳跃。审稿人会据此判断研究严谨性。建议投稿前完成专业润色并请母语者通读。",
"kb.r5.t":"实验设计与统计方法缺陷","kb.r5.d":"缺少重复实验（n<3）、未说明随机化与盲法、统计方法误用（如对非正态数据用 t 检验）、只报 P 值不报效应量。",
"kb.r6.t":"数据不足以支撑结论","kb.r6.d":"结论超出数据可支撑范围，或用相关性推断因果。讨论部分必须明确研究局限（Limitations）。",
"kb.r7.t":"缺少必要的表征手段","kb.r7.d":"食品研究常需微观结构与理化表征支撑。仅报告感官或得率数据，缺少 SEM、XRD、FTIR、流变等机理性证据者易被要求补实验。",
"kb.r8.t":"参考文献陈旧或覆盖不足","kb.r8.d":"引用文献多为 5 年前，或未引用该刊及本领域关键论文。说明作者对研究现状把握不足。",
"kb.r9.t":"伦理与合规文件缺失","kb.r9.d":"涉及人体/动物实验却无伦理批件编号；使用受版权保护的图表未获授权；未披露利益冲突或基金。",
"kb.r10.t":"一稿多投与学术诚信问题","kb.r10.d":"同时投递多家期刊、拆分发表（Salami slicing）、图片重复使用、伪造审稿人邮箱。一经查实将被列入出版商黑名单并通报单位。",

"kb.a1.t":"投稿信 Cover Letter","kb.a1.d":"写给编辑的一页纸介绍信，是编辑最先阅读的内容，直接影响是否送外审。",
"kb.a1.c":"Dear [Editor Name],\n\nWe wish to submit our manuscript entitled \"[Title]\" for consideration as a [Article Type] in [Journal Name].\n\n[1 段：研究背景与待解决的科学问题]\n[1 段：本研究做了什么、用了什么关键方法、得到哪些主要结果（含关键数据）]\n[1 段：创新点与意义；为什么契合贵刊 Aims & Scope；为什么读者会感兴趣]\n\nThis manuscript is original, has not been published previously, and is not under consideration by any other journal. All authors have read and approved the submission and declare no competing interests.\n\nThank you for your consideration.\n\nSincerely,\n[Corresponding Author], on behalf of all authors\n[Affiliation / Email / ORCID]",
"kb.a2.t":"Highlights 研究亮点","kb.a2.d":"独立于摘要的要点清单，用于搜索引擎与数据库展示，提升论文可发现性。",
"kb.a2.c":"规范（Elsevier 系）：\n· 3–5 条（部分期刊 3–4 条）\n· 每条 ≤ 85 个字符（含空格）\n· 只写核心结果与创新点，不写背景、不写方法细节\n· 每条一个独立发现，动词开头、现在时\n· 不使用缩略语（除非通用）、不加序号外的标点堆砌\n\n正例：\n· Ultrasound increased anthocyanin yield by 34.2%.\n· Pectin-protein complex stabilized the oil-in-water emulsion.\n· Cold plasma reduced Salmonella by 3.1 log CFU/g.\n\n反例：\n· We studied the effect of ultrasound on blueberry.（无结果）\n· The samples were extracted with ethanol and then analyzed by HPLC-MS/MS.（写成了方法）",
"kb.a3.t":"摘要 Abstract","kb.a3.d":"结构化的一段话，通常 150–250 词，是数据库检索与读者判断是否下载全文的依据。",
"kb.a3.c":"四要素结构：\n1) 目的（1–2 句）：研究背景中的知识缺口 + 本研究目标\n2) 方法（2–3 句）：关键实验设计、处理方式、主要表征与统计手段\n3) 结果（3–5 句）：最重要的量化发现，给出具体数值与显著性\n4) 结论（1–2 句）：机理归纳 + 应用价值或产业意义\n\n硬性禁忌：\n· 不分段、不设小标题（除非期刊要求结构式摘要）\n· 不引用参考文献、不出现图表编号\n· 不用第一人称与缩略语（首次出现须写全称）\n· 不写“本文首次报道”等无依据的强断言",
"kb.a4.t":"审稿意见回复信 Response to Reviewers","kb.a4.d":"修改稿必须附带的逐条回复文件，决定编辑是否认可你的修改。",
"kb.a4.c":"格式规范：\n· 逐条引用审稿意见原文（可用斜体或引用块）\n· 每条下方给出回应：接受并修改 / 部分接受 / 不同意并说明理由\n· 明确标注修改位置：页码、行号、段落\n· 修改处在稿件中用高亮或修订模式标出\n· 语气始终礼貌克制，即使意见明显有误\n\n模板：\nReviewer #1, Comment 3: \"The thermal treatment conditions are not reproducible.\"\nResponse: We thank the reviewer for this valuable comment. We have added the equipment model, heating rate and temperature calibration procedure in Section 2.3 (Page 6, Lines 142–151). The revised text reads: \"…\"\n\n不同意的写法：\nResponse: We respectfully disagree. As shown in the newly added Figure S4, … We have, however, clarified this point in the Discussion (Page 18, Lines 402–410).",
"kb.a5.t":"稿件状态词速查","kb.a5.d":"投稿系统里最常见的状态及其真实含义，帮你判断该不该着急。",
"kb.a5.c":"Submitted to Journal — 已提交，尚未被编辑部处理\nWith Editor — 已分配编辑，正在初审\nEditor Invited — 正在寻找合适的处理编辑（可能较慢）\nUnder Review — 已送外审，审稿人正在评审\nReviewer(s) Invited — 正在邀请审稿人，尚未有人接受\nRequired Reviews Completed — 审稿报告已齐，编辑正在决策\nDecision in Process — 编辑正在撰写决定信\nRevision Required / Author Revision — 需作者修改（注意截止日期）\nRevision Submitted — 修改稿已提交\nAccepted — 已录用\nIn Press / Articles in Press — 已在线发表，待编入卷期\nPublished — 已正式见刊\nDeclined / Rejected — 已退稿\nWithdrawn — 作者已撤稿\nUnsubmitted / Sent Back to Author — 形式审查未通过，退回作者补正（未算正式投稿）\n\n提醒：状态长期不变属正常。多数期刊规定 6–8 周后才可礼貌询问进度。",

"foot.text":"Teaching simulator · This platform supports the course \"Food Science Research & Writing\". All journal entries, reviewer reports, manuscript IDs and editorial decisions are illustrative teaching material and do not represent the official requirements or real decisions of any actual journal.\nEverything you type and every file you select stays in this browser only — nothing is uploaded to any server. Before a real submission, always follow the target journal's official Guide for Authors.",

"jh.title":"Step 1: Select a Target Journal","jh.sub":"Submission does not start at the submission portal — it starts with journal selection. Read each journal's Aims & Scope first, confirm your work falls inside it, then compare publishing model, review cycle and formatting requirements. This page deliberately lists journals from several publishers — Elsevier, Springer Nature, Taylor & Francis, Wiley, ACS and a Chinese-language journal — because they do not share one submission system (Editorial Manager, ScholarOne, SNAPP, Submission Portal or a publisher's own platform), and the screens, fields and file requirements differ. Factor the submission system into your journal choice.",
"jh.notice":"The journal entries below are teaching examples. Scope statements are based on each journal's publicly stated aims and scope, but formatting rules and review cycles are simplified for classroom use. Always verify against the journal's current Guide for Authors.",
"jh.searchPh":"Search journal name, ISSN or field…","jh.empty":"No journal matches. Try another keyword.",

"j.foodchem.scope":"Food chemistry and biochemistry, analysis of food constituents, effects of processing and storage on quality, food additives and contaminants. Emphasises original mechanistic insight at the chemical level.",
"j.foodchem.fit":"Best for studies with a clear chemical or molecular mechanism: structural changes of a compound during processing, oxidation pathways, flavour formation. Pure process optimisation without mechanistic analysis is frequently rejected.",
"j.fam.scope":"Analytical methods for food: development, optimisation, validation and practical implementation of methods for microbial contaminants, food chemistry and toxicology, quality, authenticity and traceability.",
"j.fam.fit":"The method must be the core contribution — a new method, a significant improvement to an existing one, or a valuable application, with validation data (limit of detection, recovery, precision). Routine analysis of samples with no methodological advance is out of scope.",
"j.efrt.scope":"Fundamental and applied food research: food chemistry and molecular transformations, structure–function relationships and physicochemical properties, processing and technology, nutritional chemistry and toxicology, analytical and sensory methods, food physics.",
"j.efrt.fit":"Suits food chemistry and processing work with a clear mechanism. The journal explicitly excludes routine analytical or bacteriological data collection, bioactivity reports without structural characterisation of the compounds, and studies of no international significance.",
"j.faca.scope":"Additives and chemical contaminants in the food and animal feed chain: chemistry, analysis, control, exposure and risk assessment.",
"j.faca.fit":"Suits additive safety, contaminant detection and exposure assessment, migration testing and risk assessment. An exposure or risk dimension is expected; pure method development fits Food Analytical Methods better.",
"j.ijfsn.scope":"The interface of food science and human nutrition: relationships between foods, dietary patterns and health, nutrition requirements and recommendations, nutritional quality of foods, nutrient bioavailability, consumer science.",
"j.ijfsn.fit":"Suits nutritional epidemiology, human or animal intervention trials and bioavailability studies. The endpoint must be an advance in human nutrition knowledge; papers reporting only physicochemical indices of foods are out of scope.",
"j.jsfa.scope":"Interdisciplinary research at the agriculture/food interface: production and processing of food for human consumption and animal feed, nutritional quality, food safety, sensory analysis and related science. Hypothesis-driven work is emphasised.",
"j.jsfa.fit":"Suits quality and safety research across the chain from primary production to processing, and especially topics bridging agriculture and food science. A clear scientific hypothesis is expected; purely descriptive process accounts are often rejected.",
"j.fsn.scope":"Fundamental and applied research across all aspects of food science and nutrition, plus interdisciplinary work spanning both: food chemistry, microbiology and safety, processing and packaging, sensory science, nutritional metabolism, bioavailability, functional foods.",
"j.fsn.fit":"A fully open access journal with a broad scope and a comparatively author-friendly process; suits a first paper or wide-ranging applied work. Evidence must still be sound and methods reliable — unsupported argument is not accepted.",
"j.jafc.scope":"Chemistry and biochemistry of agricultural and food constituents: bioactive compounds, metabolism, safety and nutritional effects.",
"j.jafc.fit":"Suits natural bioactive compounds, metabolic pathways, in vitro and in vivo bioactivity. Isolation and identification work must be linked to biological significance.",
"j.spk.scope":"A comprehensive Chinese-language journal covering food chemistry, microbiology, processing, analytical detection, nutrition and safety.",
"j.spk.fit":"Useful for practising Chinese academic writing with undergraduate and postgraduate coursework. Manuscripts are in Chinese; see the journal website for formatting rules.",

"s0.t":"Author Registration & Login","s0.d":"International journals all use online submission systems, but publishers do not share one platform: Elsevier mainly uses Editorial Manager, Wiley and some Taylor & Francis journals use ScholarOne, parts of Springer Nature use SNAPP, T&F also runs Submission Portal, while ACS and Chinese journals run their own. Account models differ too — one account usually works across a publisher's journals, but you must register again with a different publisher. Always use an institutional address (.edu / .ac.cn); personal free-mail accounts are frequently flagged as high-risk submissions.",
"s0.sysNote":"Submission systems differ in layout, field order and file item types. This simulator follows Editorial Manager, the most widely used; in ScholarOne the upload page is called File Upload, and SNAPP has fewer steps. Whichever system you meet, the core logic is the same: enter metadata, upload by item type, verify, submit.",
"s0.full":"Full name","s0.email":"Email address","s0.inst":"Institution","s0.pos":"Academic status","s0.orcid":"ORCID iD","s0.ph.full":"e.g. San Zhang","s0.ph.email":"name@university.edu.cn","s0.ph.inst":"e.g. College of Food Science, XX University","s0.ph.orcid":"0000-0000-0000-0000 (optional)",
"s0.pos1":"Undergraduate","s0.pos2":"Master's student","s0.pos3":"PhD candidate","s0.pos4":"Postdoc","s0.pos5":"Faculty / Researcher",
"s0.err.full":"Please enter your full name","s0.err.email":"Please enter a valid email address (an institutional address is recommended)","s0.err.inst":"Please enter your institution","s0.err.orcid":"ORCID must look like 0000-0000-0000-0000",
"s0.hint.email":"The system sends your manuscript ID, reviewer reports and decision letters to this address. A wrong email is the most common reason authors \"lose\" a submission.",
"s0.note.why":"Why register at all: the system needs an identity to link your manuscript, track its status and deliver editorial correspondence. Account scope depends on the system — one Springer Nature account covers many of its journals; Elsevier's Editorial Manager usually creates a separate account per journal; ScholarOne registers per journal-specific site (mc.manuscriptcentral.com/journal). ORCID is a persistent cross-system identifier: linking it prevents name confusion and lets systems pre-fill your details.",
"s0.note.tip":"Prepare before registering: a stable institutional email, names and emails of all co-authors, grant numbers, and the official English name of your institution. Moving to a different publisher means registering again — do not expect the old account to work. This is where beginners get stuck most often.",
"s0.note.pit":"Common mistakes: registering with a personal free-mail account and being flagged; translating your institution's name inconsistently with the official version; several co-authors sharing one account, so the account holder does not match the author list; assuming an account with publisher A works for publisher B and failing repeatedly at the login page.",

"s1.t":"Select Article Type","s1.d":"The Article Type determines length limits, required structure and review criteria. A wrong choice sends the manuscript straight back at technical check. Confirm against the journal's Guide for Authors.",
"s1.label":"Select the article type for this submission","s1.err":"Please select an article type",
"s1.note.why":"Why type comes first: the system loads different mandatory fields, word limits and file checklists depending on the type. Once submitted, editorial offices usually will not change it — you would have to withdraw and resubmit.",
"s1.note.tip":"How to decide: original experimental data → Research Paper; systematic synthesis of published work → Review; brief preliminary finding → Short Communication; response to a published paper → Letter to the Editor.",
"s1.note.pit":"Common mistakes: submitting a review as a research paper; far exceeding the word limit for the type; splitting a thesis and submitting chapters unchanged instead of rewriting them in journal style.",

"s2.t":"General Information","s2.d":"Enter the title, abstract, keywords and highlights. This is the only part an editor reads carefully during initial screening — many manuscripts are decided here. Abstract word count and highlight character count are hard limits enforced by the system.",
"s2.title":"Manuscript title","s2.ph.title":"e.g. Effect of ultrasound-assisted extraction on anthocyanin yield and antioxidant activity of blueberry",
"s2.hint.title":"Include the object, the treatment and the main measured response. Avoid vague words such as \"study of\" or \"investigation on\". Keep it under about 20 words.",
"s2.abstract":"Abstract","s2.ph.abstract":"Structure it as Objective – Methods – Results – Conclusion. Report key figures (e.g. yield increased by X%, p<0.05), not only qualitative statements.",
"s2.words":"words","s2.limit":"limit","s2.hint.abstract":"Most food-science journals require 150–250 words: one paragraph, no references, no figure or table numbers, no first person.",
"s2.keywords":"Keywords (semicolon-separated, 3–7)","s2.ph.keywords":"e.g. anthocyanin; ultrasound-assisted extraction; antioxidant activity; blueberry; response surface methodology",
"s2.hint.keywords":"Avoid duplicating the title. Prefer established disciplinary terms (check keywords of recent papers in the journal). Avoid abbreviations unless universally known.",
"s2.hlTitle":"Highlights","s2.hint.hl":"3–5 bullet points, each no longer than 85 characters including spaces. Report core results and novelty only — no background, no methods.",
"s2.hlAdd":"Add a highlight","s2.hlChars":"chars","s2.hlMax":"max 85","s2.hlPh":"e.g. Ultrasound increased anthocyanin yield by 34.2%.",
"s2.hlNoTitle":"This journal does not require Highlights","s2.hlNoNote":"Highlights are a submission item specific to Elsevier journals (and a few publishers that later adopted them), not a universal international requirement. Your currently selected journal belongs to a different publisher, so the system does not offer this field. It reappears if you switch to an Elsevier journal — a typical illustration of how submission requirements differ between publishers: the list of supporting materials can change completely when you resubmit the same paper elsewhere. Always follow the journal's own Guide for Authors / Submission Guidelines.",
"s2.gaTitle":"Graphical Abstract","s2.hint.ga":"One image summarising the study (raw material → treatment → characterisation → function). Check the journal guide for size and format; here you only record whether it is ready.",
"s2.gaYes":"Graphical abstract prepared","s2.gaN":"Not prepared",
"s2.err.title":"Please enter a manuscript title (at least about 8 words is recommended)","s2.err.abstract":"Please enter an abstract within the journal's word limit",
"s2.err.keywords":"Please enter 3–7 keywords separated by semicolons","s2.err.hl":"Highlights must be 3–5 items, each within 85 characters",
"s2.note.why":"Why this step matters most: editors handle dozens of submissions a day and typically read only the title, abstract and highlights at first. These three items decide whether the paper is sent for external review — roughly 30–50% of submissions are rejected at the editorial stage.",
"s2.note.tip":"Four elements of an abstract: objective (why), methods (key parameters), results (the 2–3 most important numbers), conclusion (what it means and its application value). Highlights carry results only, one distinct finding per line.",
"s2.note.pit":"Common mistakes: an abstract that reads like an extended introduction; results stated only as \"significantly improved\" with no data; keywords that merely repeat the title; highlights that list methods or exceed 85 characters and get truncated.",

"s3.t":"Authors & Affiliations","s3.d":"Enter all authors in contribution order and designate one Corresponding Author. Authorship order and affiliations are normally frozen after submission; adding or removing authors without agreement is research misconduct.",
"s3.add":"Add author","s3.authorN":"Author","s3.corresp":"Corresponding author","s3.name":"Full name","s3.email":"Email","s3.inst":"Affiliation (official English name)","s3.contrib":"Contribution (CRediT)","s3.orcid":"ORCID","s3.ph.name":"Full name","s3.ph.email":"author@university.edu.cn","s3.ph.inst":"College of Food Science, XX University",
"s3.concep":"Conceptualisation & design","s3.data":"Data curation","s3.analysis":"Formal analysis","s3.draft":"Writing – original draft","s3.revise":"Writing – review & editing","s3.superv":"Supervision","s3.fund":"Funding acquisition",
"s3.err.name":"Please enter a name","s3.err.email":"Please enter a valid email","s3.err.inst":"Please enter an affiliation","s3.err.corresp":"Exactly one corresponding author must be designated","s3.err.contrib":"Please select at least one contribution for each author",
"s3.warn.same":"This email is the same as the corresponding author's. Check for a duplicate entry.",
"s3.note.why":"Why it must be accurate: authorship signals substantial contribution and academic responsibility. Journals follow ICMJE or CRediT criteria — guest authorship (listing someone who did no substantial work) and ghost authorship (omitting someone who did) are both misconduct.",
"s3.note.tip":"The corresponding author is the single point of contact with the editorial office: managing the submission, confirming that all authors approve it, and delivering the final version. Usually the supervisor or project lead, with a long-lived email address.",
"s3.note.pit":"Common mistakes: informing co-authors only after submission; listing someone who merely provided lab space; affiliation names inconsistent between the system and the manuscript; requesting authorship changes after acceptance (almost always refused, sometimes triggering an investigation).",

"s4.t":"Funding, Ethics & Declarations","s4.d":"This page is mostly checkboxes, but each one is evidence the editorial office uses to verify research integrity. Omitting a grant or concealing a competing interest can be pursued — and can lead to retraction — even after publication.",
"s4.fundTitle":"Funding","s4.fundYes":"This work was supported by funding","s4.fundNo":"This research received no specific grant","s4.fundPh":"e.g. National Natural Science Foundation of China (No. 32100000); XX Provincial Key R&D Programme (No. 2024XXX)",
"s4.hint.fund":"Grant names and numbers must match the award letter exactly. Anything acknowledged in the paper must also appear here — inconsistencies are sent back by the editor.",
"s4.coiTitle":"Conflict of Interest","s4.coiYes":"There are interests to disclose","s4.coiNo":"The authors declare no competing interests","s4.coiPh":"Describe the relationship: e.g. an author is employed by a related company, holds shares, or received corporate funding or donated equipment",
"s4.hint.coi":"Disclosable interests include corporate funding or donations, employment, shareholding, patent royalties and consultancy fees. Having an interest is not misconduct; concealing it is.",
"s4.declTitle":"Submission declarations (confirm each item)",
"s4.d1":"This manuscript is original and has not been published elsewhere","s4.d2":"It is not under consideration by any other journal (no duplicate submission)",
"s4.d3":"All authors have read and approved the submission and the author order","s4.d4":"Studies involving humans or animals have ethics committee approval",
"s4.d5":"Data are available on request or deposited in a public repository","s4.d6":"Any use of AI-assisted tools has been declared as the journal requires",
"s4.d7":"All borrowed work is properly cited; no plagiarism or self-plagiarism",
"s4.ethTitle":"Ethics approval (human / animal studies)","s4.ethPh":"Approval number and committee, e.g. Ethics Committee of XX University, No. 2025-XXX",
"s4.dataTitle":"Data Availability Statement","s4.dataPh":"e.g. Data are available from the corresponding author on reasonable request / Data are deposited in XXX repository (accession …)",
"s4.err.fund":"Please state the funding situation, and give grant names and numbers if funded",
"s4.err.coi":"Please state the conflict-of-interest position",
"s4.err.decl":"All 7 submission declarations must be confirmed",
"s4.note.why":"Why declarations matter: journals rely on them for editorial decisions and publish them alongside the article. Under COPE guidance, a concealed competing interest or an undisclosed grant can result in a correction notice or retraction even after publication.",
"s4.note.tip":"Standard wording when there is nothing to declare: \"The authors declare that they have no known competing financial interests or personal relationships that could have appeared to influence the work reported in this paper.\" When funded, list every grant number.",
"s4.note.pit":"Common mistakes: listing a grant in the acknowledgements but not in the system form; duplicate submission to two journals; submitting a thesis verbatim while declaring it original and unpublished; using AI for language editing without the declaration the journal requires.",

"s5.t":"Upload Files","s5.d":"Upload each file under its own Item type. Files marked required cannot be omitted or the submission cannot be completed. The system merges everything into one PDF for your final approval (Build PDF).",
"s5.dzTitle":"Select or drop files here","s5.dzHint":"Teaching simulation: files are only registered by name and size inside this browser. Nothing is uploaded to any server.",
"s5.browse":"Choose files from this device","s5.addDemo":"Add sample file","s5.itemType":"Item type","s5.required":"Required","s5.optional":"Optional",

"s5.err.manuscript":"The Manuscript file is required","s5.err.coverletter":"This journal requires a Cover Letter","s5.err.highlights":"This journal requires a Highlights file","s5.err.figure":"If the manuscript contains figures, high-resolution image files must be uploaded as required",
"s5.note.why":"Why upload by item type: the editorial office routes each type to a different audience — the manuscript goes to reviewers, declaration forms stay with the office, artwork goes to production. Mixing them into one file causes a technical-check return.",
"s5.note.tip":"Naming convention: ID_type_version, e.g. Fig1_revised.tif. Artwork usually needs 300 dpi or more (600–1200 dpi for line art) in TIFF or EPS; figures may also be embedded in the text file for review.",
"s5.note.pit":"Common mistakes: stuffing manuscript, figures and declarations into a single PDF; uploading low-resolution screenshots; a cover letter that merely copies the abstract; supplementary material referenced in the text but never uploaded.",

"s6.t":"Suggest Reviewers","s6.d":"Most journals ask for 3–6 potential reviewers; the editor selects from them and is not obliged to use your suggestions. You may also oppose specific reviewers with a reason. Good suggestions genuinely speed up peer review.",
"s6.add":"Add suggested reviewer","s6.addOpp":"Add opposed reviewer","s6.name":"Full name","s6.email":"Email","s6.inst":"Institution","s6.why":"Reason for suggesting / opposing","s6.ph.name":"Prof. Jane Smith","s6.ph.email":"j.smith@university.edu","s6.ph.inst":"Dept. of Food Science, XX University","s6.ph.why":"Works on food colloid stability; five related papers in Food Hydrocolloids in the last three years",
"s6.sugTitle":"Suggested reviewers","s6.oppTitle":"Opposed reviewers","s6.sugN":"Suggested","s6.oppN":"Opposed",
"s6.err.min":"Please suggest at least 3 reviewers","s6.err.email":"Please enter a valid email","s6.err.name":"Please enter a name","s6.err.inst":"Please enter an institution",
"s6.err.self":"This reviewer shares the authors' email domain and looks like a self-nomination. Please change it.",
"s6.err.same":"Several suggested reviewers share the same email address. Please check.",
"s6.warn.opp":"Opposing reviewers is optional. Give an objective reason (competing research programme, documented disagreement); never exclude reviewers maliciously.",
"s6.note.why":"Why journals ask you: editorial reviewer databases are limited, and authors know best who is currently working on the topic. The choice remains the editor's — your suggestions may not be used, and that is normal.",
"s6.note.tip":"Selection criteria: (1) closely matching research topic (check their papers from the last three years); (2) prefer full professors or independent group leaders; (3) spread countries and institutions; (4) avoid your own institution, your group, recent collaborators and your supervisors or students.",
"s6.note.pit":"Common mistakes: suggesting your own supervisor or collaborator; giving a generic departmental mailbox; omitting the institution so the editor cannot verify identity; fabricating reviewer email accounts — a serious offence that leads to blacklisting.",

"s7.t":"Cover Letter & Final Check","s7.d":"The cover letter is your direct conversation with the editor: what the study did, why it matters, why it fits this journal. Run through the pre-submission checklist, then submit.",
"s7.clTitle":"Cover Letter","s7.clPh":"Dear Editor,\n\nWe would like to submit our manuscript entitled … for consideration as a Research Paper in …\n\n(background and research question; main findings and novelty; fit with the journal's scope; originality and no-duplicate-submission statement; corresponding author contact details)",
"s7.hint.cl":"Keep it under 400 words and one page. Do not copy the abstract — the editor wants to know why the work deserves publication and why it belongs in this journal.",
"s7.clTip":"Insert cover letter checklist","s7.chkTitle":"Pre-submission checklist","s7.chk1":"Article type matches the journal's scope","s7.chk2":"Title, abstract and keywords meet length and format rules","s7.chk3":"Reference style unified to the journal's format (author–date / numbered)",

"kb.sys":"Submission systems by publisher","kb.sysSub":"Publishers use different online submission systems, with markedly different account models, screen fields and file item types. Factoring the system into your journal choice avoids a scramble on submission day.",
"kb.sysPub":"Publisher","kb.sysName":"Common system","kb.sysNote":"Characteristics & differences","kb.sysTip":"Teaching note: submitting the same paper to a different publisher means changing more than the reference style — the account model, file Item types, whether Highlights are required, the status vocabulary and the wording of decision letters all differ. This simulator's steps are modelled on Editorial Manager (the most widely used); step names may differ in other systems, but the core logic — enter metadata, upload by item type, verify, submit — is the same.",

"kb.s1.note":"One of the most widely used third-party systems, developed by Aries Systems (now part of Elsevier). A step-by-step wizard (Article Type first, then General Information etc.); after uploading you Build the PDF and must proof it page by page; typical statuses are With Editor / Under Review / Decision in Process. From late 2025 some journals migrated to a new system with a different entry point and flow — always follow the button on the journal homepage.",
"kb.s2.pub":"Springer Nature","kb.s2.name":"Editorial Manager / SNAPP (depends on the brand)",
"kb.s2.note":"Different brands within the group use different systems: most Springer-branded journals use Editorial Manager, while some brands use SNAPP. One account works across the group's journals, so no repeated registration; manuscripts usually require explicit section headings; figures and source files can be uploaded separately; the open-access choice and APC amount are confirmed during submission.",
"kb.s3.pub":"Taylor & Francis","kb.s3.name":"ScholarOne / Editorial Manager / Submission Portal (three in parallel)",
"kb.s3.note":"Three systems run in parallel within one publisher, so the publisher name alone tells you nothing — you must enter through the journal's Go to submission site button to find out which one applies. Submission Portal centralises an author's submissions across the publisher's journals, removing the need for separate accounts; ScholarOne is reached via Manuscript Central, with file item types named differently from EM.",
"kb.s4.pub":"Wiley","kb.s4.name":"ScholarOne Manuscripts",
"kb.s4.note":"Reached at mc.manuscriptcentral.com (a journal-specific site). Submission runs on ScholarOne, while the publishing agreement, APC payment and production progress after acceptance are handled in the Wiley Authors Dashboard — two distinct interfaces. Wiley also offers a smart submission feature that extracts the title, abstract, authors and affiliations from your uploaded document to reduce re-keying; the extracted values still need checking item by item.",
"kb.s5.pub":"ACS (American Chemical Society)","kb.s5.name":"The publisher's own submission system",
"kb.s5.note":"Reached from the Submit button on the journal homepage. ACS journals share a highly uniform house style with dedicated Word/LaTeX templates and a fixed reference format; the Graphical Abstract and Supporting Information are usually submitted as separate items; the submission step asks for detailed author contributions and competing-interest information.",

"kb.s6.note":"A Chinese-language interface with comparatively few fields. You usually also provide author biographies, grant numbers, the CLC classification number and a document identifier code; manuscripts must be in Chinese with abstracts and keywords in both Chinese and English; the review workflow aligns with domestic evaluation systems. Always follow the journal's own website for formatting rules.",

"kb.map1.t":"Topic & journal selection","kb.map1.d":"Confirm the novelty, then use your reference list and journal-finder tools to shortlist 3–5 journals and check each Aims & Scope.",

"kb.r1.t":"Out of scope","kb.r1.d":"The single most common reason. The topic does not match the journal's focus, so the editor never sends it out. Read the Aims & Scope and browse 5–10 recent papers first.",
"kb.r2.t":"Insufficient novelty / incremental work","kb.r2.d":"Swapping a raw material or tweaking a parameter to reproduce a known conclusion, with no mechanistic or methodological advance. State explicitly what is new at the end of the introduction and in the discussion.",
"kb.r3.t":"Non-compliant formatting","kb.r3.d":"Over-length abstract, low-resolution figures, inconsistent reference style, missing declarations. These fail the technical check and waste weeks.",

"kb.a1.t":"Cover Letter","kb.a1.d":"A one-page letter to the editor, usually the first thing read, and a direct influence on whether the paper is sent for review.",
"kb.a1.c":"Dear [Editor Name],\n\nWe wish to submit our manuscript entitled \"[Title]\" for consideration as a [Article Type] in [Journal Name].\n\n[Para 1: background and the specific knowledge gap]\n[Para 2: what we did, key methods, main results with numbers]\n[Para 3: novelty and significance; fit with your Aims & Scope; why your readers will care]\n\nThis manuscript is original, has not been published previously, and is not under consideration by any other journal. All authors have read and approved the submission and declare no competing interests.\n\nThank you for your consideration.\n\nSincerely,\n[Corresponding Author], on behalf of all authors\n[Affiliation / Email / ORCID]",
"kb.a2.t":"Highlights","kb.a2.d":"A standalone bullet list used by search engines and databases; it increases the discoverability of your article.",
"kb.a2.c":"Rules (Elsevier journals):\n· 3–5 items (3–4 for some journals)\n· Max 85 characters each, including spaces\n· Core results and novelty only — no background, no method detail\n· One distinct finding per line; start with a verb, present tense\n· No uncommon abbreviations\n\nGood:\n· Ultrasound increased anthocyanin yield by 34.2%.\n· Pectin-protein complex stabilized the oil-in-water emulsion.\n· Cold plasma reduced Salmonella by 3.1 log CFU/g.\n\nBad:\n· We studied the effect of ultrasound on blueberry. (no result)\n· The samples were extracted with ethanol and analysed by HPLC-MS/MS. (methods, not findings)",
"kb.a3.t":"Abstract","kb.a3.d":"A single structured paragraph, typically 150–250 words, that drives database indexing and the reader's decision to download.",
"kb.a3.c":"Four elements:\n1) Objective (1–2 sentences): the knowledge gap and the aim of this study\n2) Methods (2–3 sentences): design, treatments, key characterisation, statistics\n3) Results (3–5 sentences): the most important quantitative findings with values and significance\n4) Conclusion (1–2 sentences): mechanistic interpretation plus application value\n\nHard prohibitions:\n· No paragraph breaks or subheadings (unless a structured abstract is required)\n· No references, no figure or table numbers\n· No first person; spell out abbreviations on first use\n· No unsupported claims such as \"for the first time\"",
"kb.a4.t":"Response to Reviewers","kb.a4.d":"The point-by-point reply that must accompany a revision; it decides whether the editor accepts your changes.",
"kb.a4.c":"Format:\n· Quote each comment verbatim (italic or block quote)\n· Answer underneath: accepted and revised / partly accepted / not accepted with justification\n· State exactly where the change is: page, line, section\n· Mark all changes in the manuscript (highlight or tracked changes)\n· Stay courteous even when a comment is clearly wrong\n\nTemplate:\nReviewer #1, Comment 3: \"The thermal treatment conditions are not reproducible.\"\nResponse: We thank the reviewer for this valuable comment. We have added the equipment model, heating rate and temperature calibration procedure in Section 2.3 (Page 6, Lines 142–151). The revised text reads: \"…\"\n\nDisagreeing politely:\nResponse: We respectfully disagree. As shown in the newly added Figure S4, … We have nevertheless clarified this point in the Discussion (Page 18, Lines 402–410).",
"kb.a5.t":"Manuscript status glossary","kb.a5.d":"The statuses you will meet in a submission system and what they really mean — so you know when not to panic.",
"kb.a5.c":"Submitted to Journal — received, not yet processed by the office\nWith Editor — assigned to an editor, initial screening under way\nEditor Invited — the journal is still looking for a handling editor\nUnder Review — sent out; reviewers are working on it\nReviewer(s) Invited — invitations sent, nobody has accepted yet\nRequired Reviews Completed — all reports in, decision pending\nDecision in Process — the editor is drafting the decision letter\nRevision Required / Author Revision — your turn; mind the deadline\nRevision Submitted — your revision is back in the system\nAccepted — accepted for publication\nIn Press — published online, awaiting a volume and issue\nPublished — formally published\nDeclined / Rejected — not accepted\nWithdrawn — withdrawn by the author\nUnsubmitted / Sent Back to Author — failed technical check, returned for correction (not yet formally submitted)\n\nNote: a status that does not change for weeks is normal. Most journals expect you to wait 6–8 weeks before writing a polite enquiry.",

 {zh:"引言未能清晰指出知识缺口。作者列举了大量已有研究，却没有说明本研究要解决的具体问题是什么。",en:"The introduction fails to articulate a clear knowledge gap. A large body of prior work is listed, but the specific question this study addresses is never stated."}]},
{rid:2,rec:{zh:"不建议发表",en:"Do not publish"},c:[
 {zh:"表征手段不足。仅报告了得率与总酚含量，缺少 HPLC-MS/MS 单体组成分析，无法支撑关于花青素降解途径的结论。",en:"Characterisation is insufficient. Only yield and total phenolics are reported; without HPLC-MS/MS monomer profiling the conclusions about anthocyanin degradation pathways cannot be supported."},
 {zh:"图 3 的分辨率过低，坐标轴标签不可辨识；表中数据未标注单位与显著性标记含义。",en:"Figure 3 is too low in resolution and the axis labels are illegible; table values lack units and the significance notation is not defined."}]},
{rid:3,rec:{zh:"不建议发表",en:"Do not publish"},c:[
 {zh:"实验未设置重复（每组 n=1），所有统计推断均不成立。请至少进行三次独立重复实验后重新考虑投稿。",en:"No replication was performed (n=1 per group), so none of the statistical inferences hold. At least three independent replicates are required before resubmission."},
 {zh:"对非正态分布数据使用了单因素方差分析与 Tukey 事后检验，方法选择不当。",en:"One-way ANOVA with a Tukey post-hoc test was applied to non-normally distributed data, which is inappropriate."}]}],
major:[
{rid:1,rec:{zh:"大修后再审",en:"Major revision"},c:[
 {zh:"热处理条件描述不具体（温度、时间、升温速率均未给出），实验无法重复。请在 2.3 节补充设备型号与温度校准方法。",en:"Thermal treatment conditions are insufficiently described (temperature, time and heating rate are all missing), so the work cannot be reproduced. Please add the equipment model and temperature calibration procedure in Section 2.3."},
 {zh:"讨论部分仅重复结果，未与已有文献进行对比。请说明本研究结果与前人报道的差异及其原因。",en:"The discussion merely restates the results without comparison to the literature. Please explain how your findings differ from previously reported values and why."},
 {zh:"缺少与传统方法的对照实验，无法证明所提处理方式具有优势。",en:"No comparison with a conventional method is provided, so the advantage of the proposed treatment cannot be established."}]},
{rid:2,rec:{zh:"大修后再审",en:"Major revision"},c:[
 {zh:"摘要过于笼统，未给出任何量化结果。请按目的—方法—结果—结论补充关键数据。",en:"The abstract is too general and reports no quantitative results. Please add the key figures following the objective–methods–results–conclusion structure."},
 {zh:"表 2 中相同字母标注在不同列之间含义不一致，请统一显著性标注方式并在表注中说明。",en:"In Table 2 the same superscript letters are used inconsistently across columns; please unify the significance notation and define it in the table footnote."},
 {zh:"建议补充微观结构表征（SEM 或 CLSM），以支撑关于网络结构形成的推断。",en:"Microstructural characterisation (SEM or CLSM) should be added to support the inferred network formation."}]},
{rid:3,rec:{zh:"大修后再审",en:"Major revision"},c:[
 {zh:"未说明数据是否满足正态性与方差齐性前提，请直接给出检验方法与结果。",en:"It is not stated whether normality and homogeneity of variance were tested. Please report the tests and their outcomes."},
 {zh:"响应面模型的失拟检验（lack of fit）结果未报告，模型可靠性无法判断。",en:"The lack-of-fit test for the response surface model is not reported, so model adequacy cannot be judged."}]}],
minor:[
{rid:1,rec:{zh:"小修后录用",en:"Minor revision"},c:[
 {zh:"研究方法清晰，结论有数据支撑。请在 2.4 节补充试剂纯度与供应商信息。",en:"The methodology is clear and the conclusions are supported by the data. Please add reagent purity and supplier information in Section 2.4."},
 {zh:"图 4 图例字号偏小，建议放大至与坐标轴标签一致。",en:"The legend in Figure 4 is too small; please enlarge it to match the axis labels."}]},
{rid:2,rec:{zh:"小修后录用",en:"Minor revision"},c:[
 {zh:"引言第 3 段有 4 处文献引用格式与本刊体例不一致，请统一。",en:"Four citations in the third paragraph of the introduction do not follow the journal's reference style; please unify them."},
 {zh:"结论部分建议增加一句关于工业化应用可行性的说明。",en:"Please add one sentence in the conclusion about industrial applicability."},
 {zh:"英文表达总体流畅，个别长句建议拆分（如第 12 页第 3 段）。",en:"The English is generally fluent; a few long sentences would read better if split (e.g. Page 12, third paragraph)."}]},
{rid:3,rec:{zh:"小修后录用",en:"Minor revision"},c:[
 {zh:"统计方法描述基本完整，请补充所用软件名称与版本号。",en:"The statistical description is largely complete; please add the software name and version used."}]}],
accept:[
{rid:1,rec:{zh:"接受发表",en:"Accept"},c:[
 {zh:"作者已充分回应全部审稿意见，补充的实验数据显著提升说服力。建议录用。",en:"The authors have fully addressed all reviewer comments, and the additional data substantially strengthen the paper. I recommend acceptance."}]},
{rid:2,rec:{zh:"接受发表",en:"Accept"},c:[
 {zh:"修改稿质量达到发表要求。请在校样阶段再次核对表 2 的单位标注。",en:"The revised manuscript meets the standard for publication. Please double-check the units in Table 2 at the proof stage."}]}]
