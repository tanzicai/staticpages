var LETTERS={
reject:{zh:"尊敬的作者：\n\n感谢您向本刊投稿。您的稿件已由编辑与 {n} 位同行专家评审完毕。\n\n经慎重考虑，我们遗憾地通知您，本稿件不符合本刊的发表要求，无法接受发表。主要原因为：研究内容与本刊收稿范围的匹配度不足，以及实验设计与统计方法存在实质性缺陷。\n\n详细的审稿意见附于下方，供您修改时参考。这些意见并不否定研究本身的价值——许多被本刊退稿的稿件在调整定位或补充实验后，成功发表于其他合适的期刊。\n\n若您认为编辑对本稿件存在明显误解，可在收到本信 14 日内提交书面申诉，并逐条说明理由。申诉成功率较低，但我们会认真对待每一份申诉。\n\n期待您的后续投稿。\n\n此致\n编辑部",
        en:"Dear Author,\n\nThank you for submitting your manuscript to this journal. Your paper has now been assessed by the editor and {n} peer reviewers.\n\nAfter careful consideration we regret to inform you that the manuscript does not meet our publication criteria and cannot be accepted. The main reasons are insufficient alignment with the journal's scope and substantive weaknesses in experimental design and statistical analysis.\n\nThe detailed reviewer reports are provided below for your reference. They do not negate the value of the work itself — many manuscripts declined here are successfully published elsewhere after repositioning or additional experiments.\n\nIf you believe the editorial assessment rests on a clear misunderstanding, you may submit a written appeal within 14 days of this letter, addressing each point. Appeals succeed infrequently, but every appeal is considered seriously.\n\nWe hope to receive future submissions from you.\n\nSincerely,\nThe Editorial Office"},
major:{zh:"尊敬的作者：\n\n感谢您向本刊投稿。您的稿件已由 {n} 位同行专家评审完毕。\n\n审稿人认为本研究选题有价值，但当前版本存在需要实质性修改的问题，主要集中在实验条件描述的可重复性、表征手段的完整性与统计方法的规范性上。\n\n编辑决定：大修（Major Revision）。\n\n请在 30 日内通过投稿系统提交修改稿，并务必附上一份逐条回复审稿意见的说明（Response to Reviewers），标明每处修改所在的页码与行号。修改稿将返回原审稿人复审。\n\n请注意：大修不等同于录用。若回复不充分或修改未解决核心问题，稿件仍可能被退稿。\n\n此致\n编辑部",
        en:"Dear Author,\n\nThank you for submitting your manuscript. Your paper has been reviewed by {n} peer reviewers.\n\nThe reviewers consider the topic valuable, but the present version requires substantial revision, chiefly concerning the reproducibility of the experimental conditions, the completeness of the characterisation and the rigour of the statistical analysis.\n\nEditorial decision: Major Revision.\n\nPlease return your revision through the submission system within 30 days, accompanied by a point-by-point Response to Reviewers indicating the page and line of every change. The revision will go back to the original reviewers.\n\nPlease note that a major revision is not an acceptance. If the response is inadequate or the core issues remain unresolved, the manuscript may still be rejected.\n\nSincerely,\nThe Editorial Office"},
minor:{zh:"尊敬的作者：\n\n感谢您向本刊投稿。您的稿件已由 {n} 位同行专家评审完毕。\n\n审稿人对研究设计与主要结论给予肯定，同时提出了若干需要完善的具体问题，主要涉及格式规范、图表清晰度与文献引用体例。\n\n编辑决定：小修（Minor Revision）。\n\n请在 14 日内提交修改稿及逐条回复说明。修改内容通常不再送原审稿人复审，由责任编辑核验后即可做出最终决定。\n\n祝贺您，稿件已接近录用阶段。\n\n此致\n编辑部",
        en:"Dear Author,\n\nThank you for submitting your manuscript. Your paper has been reviewed by {n} peer reviewers.\n\nThe reviewers are positive about the study design and the main conclusions, while raising a number of specific points that need refinement, mainly concerning formatting, figure clarity and reference style.\n\nEditorial decision: Minor Revision.\n\nPlease return the revised manuscript with a point-by-point response within 14 days. Minor revisions are normally not sent back to the original reviewers; the handling editor verifies them before the final decision.\n\nCongratulations — your manuscript is close to acceptance.\n\nSincerely,\nThe Editorial Office"},
accept:{zh:"尊敬的作者：\n\n我们很高兴地通知您，您的稿件已被本刊接受发表。\n\n审稿人与编辑认为，修改稿已充分回应全部意见，研究质量达到本刊发表标准。\n\n后续流程：\n1. 您将收到版权协议 / 开放获取许可协议（Copyright Transfer 或 License to Publish），请由通讯作者签署；\n2. 若选择开放获取，需支付文章处理费（APC）；\n3. 出版部门完成排版后发送清样（Proof），请在 48 小时内核对并返回，此阶段只允许更正排版错误，不得改动学术内容；\n4. 清样确认后分配 DOI 并在线发表（In Press），随后编入正式卷期。\n\n感谢您选择本刊。\n\n此致\n编辑部",
        en:"Dear Author,\n\nWe are pleased to inform you that your manuscript has been accepted for publication.\n\nThe reviewers and the editor consider that the revision has fully addressed all comments and that the work meets the journal's standard.\n\nWhat happens next:\n1. You will receive the publishing agreement (Copyright Transfer or Licence to Publish) for the corresponding author to sign;\n2. If you choose open access, the Article Processing Charge applies;\n3. After typesetting, production will send you the proof — please check and return it within 48 hours. Only typographical corrections are permitted at this stage; scientific content cannot be changed;\n4. Once the proof is approved, a DOI is assigned and the article appears online (In Press), later assigned to a volume and issue.\n\nThank you for choosing this journal.\n\nSincerely,\nThe Editorial Office"}
};

var GLOSSARY=[
["Manuscript ID","稿件编号",{zh:"投稿成功后系统生成的唯一编号，后续所有通信、查询进度都需引用它。格式常为 期刊缩写-年份-序号。",en:"The unique identifier generated on successful submission; quote it in all subsequent correspondence and progress enquiries. Usually formatted as journal-abbreviation–year–serial."}],
["Corresponding Author","通讯作者",{zh:"唯一与编辑部通信的作者，负责投稿、协调署名确认、提交最终版本、处理校样。通常为课题负责人。",en:"The single author who communicates with the editorial office: managing submission, confirming authorship, delivering the final version and handling proofs. Usually the project lead."}],
["ORCID iD","学者唯一标识",{zh:"跨出版商的持久学者标识（16 位数字），解决同名混淆问题。多数期刊要求通讯作者必须绑定。",en:"A persistent cross-publisher researcher identifier (16 digits) that resolves name ambiguity. Most journals require the corresponding author to link one."}],
["Cover Letter","投稿信",{zh:"写给编辑的一页纸说明，介绍研究做了什么、为何重要、为何适合该刊。常是编辑最先阅读的内容。",en:"A one-page letter to the editor explaining what the study did, why it matters and why it fits the journal. Often the first thing an editor reads."}],
["Highlights","研究亮点",{zh:"3–5 条要点，每条不超过 85 字符（含空格），独立于摘要，用于数据库与搜索引擎展示。",en:"3–5 bullet points, each within 85 characters including spaces, separate from the abstract and used by databases and search engines."}],
["Graphical Abstract","图形摘要",{zh:"一张图概括研究主线，在目录推送与在线页首屏展示，提升论文可见度与点击率。",en:"A single image summarising the study, shown in table-of-contents alerts and at the top of the article page; it improves visibility and click-through."}],
["Aims & Scope","宗旨与收稿范围",{zh:"期刊官网明确说明的收稿主题边界。超出范围的稿件会在编辑环节直接退稿（最常见的退稿原因）。",en:"The subject boundary stated on the journal website. Out-of-scope papers are rejected at the editorial stage — the single most common reason for rejection."}],
["Guide for Authors","作者指南",{zh:"期刊的格式与投稿规则总纲：字数、摘要、图表、参考文献体例、必需文件与声明。投稿前必读。",en:"The journal's master rulebook: word limits, abstract, figures, reference style, required files and declarations. Mandatory reading before submission."}],
["Desk Rejection","编辑直接退稿",{zh:"未经外审即由编辑退稿，通常因超出范围、创新性不足或格式严重不合规。约 30%–50% 的稿件止步于此。",en:"Rejection by the editor without external review, usually for scope mismatch, insufficient novelty or serious non-compliance. Roughly 30–50% of submissions end here."}],
["Technical Check","形式审查",{zh:"编辑部助理在送审前核查格式、字数、图表分辨率、查重率与声明完整性。不合格会退回作者补正。",en:"Pre-review verification by editorial staff of format, word count, figure resolution, similarity score and completeness of declarations. Failures are returned to the author."}],
["Peer Review","同行评议",{zh:"由同领域专家匿名评审稿件的学术质量。是期刊质量控制的核心机制。",en:"Assessment of scholarly quality by experts in the same field. The core quality-control mechanism of journals."}],
["Single Blind Review","单盲评审",{zh:"审稿人知道作者身份，作者不知道审稿人身份。食品类期刊中较常见。",en:"Reviewers know the authors' identities but authors do not know the reviewers. Common in food-science journals."}],
["Double Blind Review","双盲评审",{zh:"作者与审稿人互相不知身份。此时须单独上传去除作者信息的匿名稿件（Blinded Manuscript）。",en:"Neither side knows the other's identity. A separate anonymised manuscript file must then be uploaded."}],
["Open Peer Review","开放评审",{zh:"审稿人身份和/或审稿意见随论文一并公开，提升评审透明度。",en:"Reviewer identities and/or the review reports are published alongside the article to increase transparency."}],
["Suggested Reviewer","推荐审稿人",{zh:"作者向编辑推荐的潜在审稿人（通常 3–6 位）。编辑保留最终选择权，不必采用作者推荐。",en:"Potential reviewers nominated by the author (usually 3–6). The editor retains final discretion and is not obliged to use them."}],
["Opposed Reviewer","回避审稿人",{zh:"作者请求不要邀请的专家，须说明客观理由（如竞争关系）。不得恶意排除。",en:"Experts the author asks not to invite, with an objective justification such as a competing programme. Malicious exclusion is not permitted."}],
["Major Revision","大修",{zh:"需实质性修改（补实验、重做统计、重写讨论），修改稿返回原审稿人复审，仍可能被退稿。",en:"Substantial changes required (extra experiments, re-analysis, rewritten discussion). The revision returns to the original reviewers and can still be rejected."}],
["Minor Revision","小修",{zh:"仅需局部完善（格式、图表、文献、表述），通常由编辑核验后即可录用，不再送外审。",en:"Only local refinement needed (format, figures, references, wording). Usually verified by the editor and then accepted, without further external review."}],
["Response to Reviewers","审稿意见回复信",{zh:"逐条回应审稿意见的文件，须引用原意见、说明处理方式、标明修改位置。修改稿必备。",en:"The point-by-point reply quoting each comment, stating how it was handled and where the change appears. Mandatory with a revision."}],
["Rebuttal / Appeal","申诉",{zh:"作者认为退稿决定基于明显误解时，向编辑部提交的书面反驳。成功率低，须逐条举证。",en:"A written rebuttal to the editorial office when the author believes a rejection rests on a clear misunderstanding. Low success rate; every point must be evidenced."}],
["Withdrawal","撤稿",{zh:"作者主动撤回在投稿件，须向编辑说明理由，编辑部会留下记录。与发表后的 Retraction（撤回已发表论文）不同。",en:"The author's withdrawal of a live submission, with a reason given to the editor and a record kept. Distinct from retraction of an already published paper."}],
["Duplicate Submission","一稿多投",{zh:"同一稿件同时投递两家及以上期刊，属严重学术不端。须待收到明确退稿信后方可改投。",en:"Submitting the same manuscript to two or more journals simultaneously — serious misconduct. You may resubmit elsewhere only after receiving an explicit rejection."}],
["Salami Slicing","切香肠式发表",{zh:"把一项完整研究人为拆成多篇最小可发表单元，稀释学术贡献，属不当发表行为。",en:"Splitting one coherent study into the smallest publishable units, diluting the scholarly contribution — an improper publication practice."}],
["Conflict of Interest","利益冲突",{zh:"可能影响研究客观性的财务、商业、法律或专业关系。存在不等于不端，隐瞒才是。",en:"Financial, commercial, legal or professional relationships that could bias the research. Having one is not misconduct; concealing it is."}],
["Funding Declaration","基金声明",{zh:"列明资助机构名称与项目编号，须与论文致谢及任务书完全一致。",en:"Listing the funder names and grant numbers, which must match the acknowledgements and the award documents exactly."}],
["Data Availability Statement","数据可用性声明",{zh:"说明研究数据存放位置与获取方式：公共数据库编号、向通讯作者索取，或说明不可公开的原因。",en:"States where the data are and how to obtain them: a repository accession number, availability from the corresponding author, or why they cannot be shared."}],
["CRediT","贡献者角色分类",{zh:"国际通用的作者贡献分类标准（构思、数据、分析、写作、指导、经费等 14 类），用于明确署名依据。",en:"The international taxonomy of contributor roles (conceptualisation, data curation, analysis, writing, supervision, funding, and more) used to justify authorship."}],
["ICMJE Criteria","作者资格标准",{zh:"国际医学期刊编辑委员会制定的四条署名标准：实质贡献、参与撰写、批准终稿、对研究负责。须同时满足。",en:"The four authorship criteria of the International Committee of Medical Journal Editors: substantial contribution, drafting or revising, final approval, and accountability. All four must be met."}],
["Article Processing Charge (APC)","文章处理费",{zh:"选择开放获取时作者支付的费用，用于替代订阅收入。金额随期刊差异较大，投稿前须确认并落实经费。",en:"The fee paid by the author when choosing open access, replacing subscription revenue. Amounts vary widely; confirm and budget before submitting."}],
["Copyright Transfer","版权转让协议",{zh:"录用后签署，将论文版权转让给出版商。部分期刊改为 License to Publish（仅授予出版许可，作者保留版权）。",en:"Signed after acceptance, transferring copyright to the publisher. Some journals use a Licence to Publish instead, where the author retains copyright."}],
["Proof","校样",{zh:"排版完成后发给作者的最终核对稿，通常须在 24–72 小时内返回。此阶段只能更正排版错误。",en:"The typeset version sent for final checking, usually to be returned within 24–72 hours. Only typographical corrections are allowed."}],
["In Press","在线预出版",{zh:"已接受并完成排版、已分配 DOI 并在线可查，但尚未编入正式卷期的状态。",en:"Accepted, typeset, DOI-assigned and citable online, but not yet assigned to a volume and issue."}],
["DOI","数字对象唯一标识",{zh:"论文的永久网络地址标识，一经分配不再变更。引用与检索均以 DOI 为准。",en:"The permanent identifier for a digital object; once assigned it never changes. Citations and lookups rely on it."}],
["Impact Factor (JIF)","期刊影响因子",{zh:"某刊前两年发表论文在第三年的平均被引次数，每年由 JCR 发布。数值逐年变动，请以最新发布为准。",en:"The average number of citations in a given year to papers published in the journal in the previous two years, released annually in the JCR. Values change yearly — always use the latest release."}],
["CiteScore","引用分",{zh:"Scopus 数据库计算的期刊指标，统计口径为近 4 年，与影响因子（2 年）不可直接比较。",en:"A Scopus-based journal metric using a four-year window; not directly comparable with the two-year Impact Factor."}],
["JCR Quartile","JCR 分区",{zh:"按影响因子在同一学科内的排名分为 Q1–Q4，Q1 为前 25%。学科不同分区不可横向比较。",en:"Ranking within a subject category by impact factor, from Q1 (top 25%) to Q4. Quartiles from different categories are not comparable."}],
["CAS Tier","中科院分区",{zh:"中国科学院文献情报中心的期刊分区体系（1–4 区，含 Top 标识），与 JCR 分区标准不同，国内评价多采用此体系。",en:"The tiering system of the National Science Library, Chinese Academy of Sciences (Tiers 1–4 with a Top flag), differing from JCR quartiles and widely used in China."}],

var LS_KEY="fsw-submission-sim-v1";
var S=null;
var lang="zh";
var curView="journals";
var tagFilter="All";
var pubFilter="All";
var searchTerm="";
var glossTerm="";

var autoTimer=null;

function blankState(){
  return {
    lang:"zh", journalId:null, step:0, stepsDone:{},
    account:{full:"",email:"",inst:"",pos:"pos2",orcid:""},
    articleType:"",
    general:{title:"",abstract:"",keywords:"",highlights:["",""],ga:false},
    authors:[{name:"",email:"",inst:"",contrib:[],orcid:"",corresp:true}],
    declare:{fund:"",fundText:"",coi:"",coiText:"",decls:{},ethics:"",dataAvail:""},
    files:[], reviewers:[], opposed:[],
    coverLetter:"", checklist:{},
    submission:null, tracking:null
  };
}
function journalExists(id){
  if(!id) return false;
  for(var i=0;i<JOURNALS.length;i++){ if(JOURNALS[i].id===id) return true; }
  return false;
}
function load(){
  try{ var raw=localStorage.getItem(LS_KEY); if(raw){ var o=JSON.parse(raw); if(o && typeof o==="object"){ S=Object.assign(blankState(),o); } else { S=blankState(); } } else { S=blankState(); } }
  catch(e){ S=blankState(); }
  lang = (S.lang==="en")?"en":"zh";
  if(!journalExists(S.journalId)){
    S.journalId=null; S.articleType=""; S.step=0; S.stepsDone={};
    S.submission=null; S.tracking=null;
  } else if(S.submission && !journalExists(S.submission.journalId)){
    S.submission.journalId=S.journalId;
  }
}
function save(){ try{ S.lang=lang; localStorage.setItem(LS_KEY,JSON.stringify(S)); }catch(e){} }
function resetAll(){ S=blankState(); S.lang=lang; save(); }

function t(k){ var d=DICT[lang]; if(d && d[k]!=null) return d[k]; if(DICT.zh[k]!=null) return DICT.zh[k]; return k; }
function bt(o){ if(o==null) return ""; if(typeof o==="string") return o; return (o[lang]!=null)?o[lang]:(o.zh||""); }
function journal(){ for(var i=0;i<JOURNALS.length;i++){ if(JOURNALS[i].id===S.journalId) return JOURNALS[i]; } return null; }
function esc(s){ return String(s==null?"":s); }
function $(s,r){ return (r||document).querySelector(s); }
function $$(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }
function mk(html){ var tp=document.createElement("template"); tp.innerHTML=html.trim(); return tp.content.firstElementChild; }
function applyI18n(root){
  $$("[data-i18n]",root).forEach(function(n){ n.textContent=t(n.getAttribute("data-i18n")); });
  $$("[data-i18n-pre]",root).forEach(function(n){ n.style.whiteSpace="pre-line"; n.textContent=t(n.getAttribute("data-i18n-pre")); });
  $$("[data-i18n-ph]",root).forEach(function(n){ n.setAttribute("placeholder",t(n.getAttribute("data-i18n-ph"))); });
}
function countWords(s){
  if(!s) return 0;
  var cjk=(s.match(/[\u4e00-\u9fff\u3040-\u30ff]/g)||[]).length;
  var rest=s.replace(/[\u4e00-\u9fff\u3040-\u30ff]/g," ").trim();
  var latin=rest?rest.split(/\s+/).filter(Boolean).length:0;
  return cjk+latin;
}
function kwList(s){ return String(s||"").split(/[;；,，]/).map(function(x){return x.trim();}).filter(Boolean); }
function validEmail(s){ return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(s||"").trim()); }
function domainOf(s){ var m=/@([^>]+)$/.exec(String(s||"").trim()); return m?m[1].toLowerCase():""; }
function fmtSize(n){ if(n==null) return "—"; if(n<1024) return n+" B"; if(n<1048576) return (n/1024).toFixed(1)+" KB"; return (n/1048576).toFixed(2)+" MB"; }
function pad2(n){ return (n<10?"0":"")+n; }
function dateStr(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function toast(msg,kind){
  var old=$(".toast"); if(old) old.remove();
  var n=mk(`<div class="toast"><span></span></div>`);
  if(kind) n.classList.add(kind);
  $("span",n).textContent=msg;
  $("#toast-root").appendChild(n);
  setTimeout(function(){ if(n.parentNode) n.remove(); },2600);
}
function openModal(title,body,onOk,okLabel){
  var root=$("#modal-root"); root.innerHTML="";
  var m=mk(`
  <div class="mask">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-h"><h3 class="m-title"></h3></div>
      <div class="modal-b"><p class="m-body" style="white-space:pre-line"></p><div class="m-extra"></div></div>
      <div class="modal-f">
        <button class="btn m-cancel" type="button"></button>
        <button class="btn primary m-ok" type="button"></button>
      </div>
    </div>
  </div>`);
  $(".m-title",m).textContent=title;
  $(".m-body",m).textContent=body;
  $(".m-cancel",m).textContent=t("wz.cancel");
  $(".m-ok",m).textContent=okLabel||t("wz.confirm");
  function close(){ m.remove(); }
  $(".m-cancel",m).addEventListener("click",close);
  $(".m-ok",m).addEventListener("click",function(){ close(); if(onOk) onOk(m); });
  m.addEventListener("click",function(e){ if(e.target===m) close(); });
  root.appendChild(m);
  return m;
}

/* SECTION: views */
function switchView(v){
  curView=v;
  $$(".tab").forEach(function(b){ b.classList.toggle("on", b.getAttribute("data-view")===v); });
  $$(".view").forEach(function(s){ s.classList.toggle("on", s.id==="view-"+v); });
  if(v==="journals") renderJournals();
  if(v==="wizard") renderWizard();
  if(v==="tracking") renderTracking();
  if(v==="knowledge") renderKnowledge();
  window.scrollTo({top:0,behavior:"smooth"});
}

/* SECTION: journal hall */

  var chips=$("#j-chips"); chips.innerHTML="";
  TAGS.forEach(function(tg){
    var b=mk(`<button class="chip" type="button"></button>`);
    b.textContent=t("jh.tag"+tg.charAt(0).toUpperCase()+tg.slice(1));
    if(tg===tagFilter) b.classList.add("on");
    b.addEventListener("click",function(){ tagFilter=tg; renderJournals(); });
    chips.appendChild(b);
  });
  var pchips=$("#j-pubchips");
  if(pchips){
    pchips.innerHTML="";
    PUBS.forEach(function(p){
      var b=mk(`<button class="chip" type="button"></button>`);
      b.textContent=bt(p);
      if(p.id===pubFilter) b.classList.add("on");
      b.addEventListener("click",function(){ pubFilter=p.id; renderJournals(); });
      pchips.appendChild(b);
    });
  }

  var grid=$("#j-grid"); grid.innerHTML="";
  var q=searchTerm.toLowerCase();
  var shown=0;
  JOURNALS.forEach(function(j){
    if(tagFilter!=="All" && j.tags.indexOf(tagFilter)<0) return;
    if(pubFilter!=="All" && j.pub!==pubFilter) return;
    if(q){
      var hay=(j.name+" "+j.issn+" "+j.publisher+" "+bt(j.model)+" "+bt(j.sys)+" "+t("j."+j.id+".scope")+" "+t("j."+j.id+".fit")).toLowerCase();
      if(hay.indexOf(q)<0) return;
    }
    shown++;
    var picked=(S.journalId===j.id);
    var c=mk(`
    <article class="jcard">
      <div class="jtop">
        <div style="min-width:0">
          <div class="jname"></div>
          <div class="jpub"></div>
        </div>
        <span class="badge b-tier"></span>
      </div>
      <div class="jmeta"></div>
      <div class="sysbox">
        <span class="sysk"></span>
        <span class="sysv"></span>
      </div>
      <div>
        <div class="lbl" style="margin-bottom:3px"></div>
        <div class="jscope sc-scope"></div>
      </div>
      <div>
        <div class="lbl" style="margin-bottom:3px"></div>
        <div class="jscope sc-fit" style="font-size:12.8px;color:var(--ink-3)"></div>
      </div>
      <div class="jkv">
        <div><dt class="k-issn"></dt><dd class="v-issn"></dd></div>
        <div><dt class="k-model"></dt><dd class="v-model"></dd></div>
        <div><dt class="k-cycle"></dt><dd class="v-cycle"></dd></div>
        <div><dt class="k-abs"></dt><dd class="v-abs"></dd></div>
        <div><dt class="k-hl"></dt><dd class="v-hl"></dd></div>
      </div>
      <div class="jact"></div>
    </article>`);
    if(picked) c.classList.add("picked");
    $(".jname",c).textContent=j.name;
    $(".jpub",c).textContent=(typeof j.publisher==="string")?j.publisher:bt(j.publisher);
    $(".b-tier",c).textContent=bt(j.tier);
    var meta=$(".jmeta",c);
    var b1=mk(`<span class="badge"></span>`); b1.textContent=(j.lang==="zh"?"中文 Chinese":"English"); meta.appendChild(b1);
    var b2=mk(`<span class="badge gold"></span>`); b2.textContent=bt(j.model); meta.appendChild(b2);
    $(".sysk",c).textContent=(lang==="zh"?"投稿系统":"Submission system");
    $(".sysv",c).textContent=bt(j.sys);
    $$(".lbl",c)[0].textContent=t("jh.scope");
    $$(".lbl",c)[1].textContent=(lang==="zh"?"适合投什么":"Best suited for");
    $(".sc-scope",c).textContent=t("j."+j.id+".scope");
    $(".sc-fit",c).textContent=t("j."+j.id+".fit");
    $(".k-issn",c).textContent="ISSN"; $(".v-issn",c).textContent=j.issn;
    $(".k-model",c).textContent=t("jh.model"); $(".v-model",c).textContent=bt(j.model);
    $(".k-cycle",c).textContent=t("jh.cycle"); $(".v-cycle",c).textContent=j.cycle+" "+t("jh.weeks");
    $(".k-abs",c).textContent=t("jh.abs"); $(".v-abs",c).textContent=(j.lang==="zh"?j.absMax+" 字":j.absMax+" words");
    $(".k-hl",c).textContent=t("jh.hl"); $(".v-hl",c).textContent=(j.hl==="req"?t("jh.req"):(j.hl==="opt"?t("jh.opt"):t("jh.no")));
    var act=$(".jact",c);
    var bp=mk(`<button class="btn sm primary" type="button"></button>`);
    bp.textContent=picked?t("jh.picked"):t("jh.pick");
    if(picked){ bp.classList.remove("primary"); bp.classList.add("gold"); }
    bp.addEventListener("click",function(){ chooseJournal(j.id); });
    act.appendChild(bp);

    bs.textContent=t("jh.view");
    bs.addEventListener("click",function(){ showJournalDetail(j); });
    act.appendChild(bs);
    grid.appendChild(c);
  });
  $("#j-empty").hidden = (shown>0);

function chooseJournal(id){
  if(S.journalId && S.journalId!==id){
    var extra=(S.submission?(lang==="zh"?"\n\n注意：你已提交过一份稿件，更换期刊会清空该稿件的投稿进度与审稿记录（已填写的稿件内容保留），以便针对新期刊重新走一遍流程。":"\n\nNote: you have already submitted a manuscript. Changing the journal clears that submission's progress and review records (your filled-in content is kept) so you can run the workflow again for the new journal."):"");
    openModal(t("jh.confirmTitle"),t("jh.confirmBody")+extra,function(){ applyJournal(id); });
    return;
  }
  applyJournal(id);
}
function applyJournal(id){
  var prev=S.journalId;
  S.journalId=id;
  S.articleType="";
  var st=S.tracking?currentStage():null;
  var finished=(st==="rejected"||st==="withdrawn"||st==="press");
  var target="wizard";
  if(S.submission){
    if(finished || (prev && prev!==id)){
      S.submission=null; S.tracking=null; S.step=0; S.stepsDone={};
    } else {
      S.step=STEPS.length-1; target="tracking";
    }
  } else {
    if(prev && prev!==id) S.stepsDone={};
    S.step=(prev && prev!==id)?1:S.step;
  }
  save(); renderJournals(); updateChrome();
  var j=journal();
  toast((target==="tracking"
    ? (lang==="zh"?"稿件已在流程中，正在打开状态跟踪：":"Submission in progress, opening status tracking: ")
    : (lang==="zh"?"已选择，正在进入投稿流程：":"Selected, opening the submission workflow: "))+j.name,"ok");
  switchView(target);
}
function showJournalDetail(j){
  var rows=[
    [t("jh.pub"),(typeof j.publisher==="string")?j.publisher:bt(j.publisher)],
    [t("jh.sys"),bt(j.sys)],
    ["ISSN",j.issn],
    [t("jh.tier"),bt(j.tier)],
    [t("jh.model"),bt(j.model)],
    [t("jh.cycle"),j.cycle+" "+t("jh.weeks")],
    [t("jh.abs"),(j.lang==="zh"?j.absMax+" 字":j.absMax+" words")],
    [(lang==="zh"?"关键词上限":"Keyword limit"),j.kwMax],
    [t("jh.hl"),(j.hl==="req"?t("jh.req"):(j.hl==="opt"?t("jh.opt"):t("jh.no")))],
    [(lang==="zh"?"图形摘要":"Graphical abstract"),(j.ga==="req"?t("jh.req"):(j.ga==="opt"?t("jh.opt"):t("jh.no")))],
    [(lang==="zh"?"投稿信":"Cover letter"),(j.cl==="req"?t("jh.req"):(j.cl==="opt"?t("jh.opt"):t("jh.no")))],
    [(lang==="zh"?"最少推荐审稿人":"Min. suggested reviewers"),(j.revMin>0?String(j.revMin):(lang==="zh"?"不要求":"None"))],
    [(lang==="zh"?"文章类型":"Article types"),j.types.map(function(x){return bt(x);}).join(" · ")]
  ];
  var m=openModal(j.name, t("jh.notice"), null, t("ok"));
  $(".m-ok",m).textContent=t("ok");
  var ex=$(".m-extra",m);
  var box=mk(`<div style="margin-top:14px"><div class="jkv"></div><div style="margin-top:14px"><div class="lbl"></div><p class="jscope"></p></div><div style="margin-top:12px"><div class="lbl"></div><p class="jscope" style="font-size:12.8px;color:var(--ink-3)"></p></div></div>`);
  var kv=$(".jkv",box);
  rows.forEach(function(r){
    var d=mk(`<div><dt></dt><dd></dd></div>`);
    $("dt",d).textContent=r[0]; $("dd",d).textContent=r[1];
    kv.appendChild(d);
  });
  var lbls=$$(".lbl",box);
  lbls[0].textContent=t("jh.scope");
  lbls[1].textContent=(lang==="zh"?"适合投什么":"Best suited for");
  var ps=$$(".jscope",box);
  ps[0].textContent=t("j."+j.id+".scope");
  ps[1].textContent=t("j."+j.id+".fit");
  ex.appendChild(box);
  var f=$(".modal-f",m);
  var b2=mk(`<button class="btn primary" type="button"></button>`);
  b2.textContent=t("jh.pick");
  b2.addEventListener("click",function(){ m.remove(); chooseJournal(j.id); });
  f.insertBefore(b2,$(".m-ok",m));
}

/* SECTION: chrome */
function updateChrome(){
  $("#lang-zh").classList.toggle("on",lang==="zh");
  $("#lang-en").classList.toggle("on",lang==="en");
  document.documentElement.setAttribute("lang",lang==="zh"?"zh-CN":"en");
  var j=journal();
  var pill=$("#j-pill");
  if(j){ pill.hidden=false; $("#j-pill-txt").textContent=j.name; } else { pill.hidden=true; }
  var doneWiz = !!(S.submission);
  var doneJ = !!j;
  $$(".tab").forEach(function(b){
    var v=b.getAttribute("data-view");
    b.classList.toggle("done",(v==="journals"&&doneJ)||(v==="wizard"&&doneWiz)||(v==="tracking"&&doneWiz));
  });
}

/* SECTION: wizard */
var STEPS=["s0","s1","s2","s3","s4","s5","s6","s7"];

function renderWizard(){
  if(!S.journalId){
    $("#wizard").hidden=true;
    var ph=$("#wiz-placeholder"); ph.innerHTML="";
    var c=mk(`
    <div class="card pad" style="text-align:center;padding:46px 20px">
      <div class="notice info" style="max-width:640px;margin:0 auto 18px;text-align:left">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
        <div class="n-txt"></div>
      </div>
      <button class="btn primary" type="button" style="min-width:200px"><span class="b-txt"></span></button>
    </div>`);
    $(".n-txt",c).textContent=t("wz.needJournal");
    $(".b-txt",c).textContent=t("wz.goPick");
    $("button",c).addEventListener("click",function(){ switchView("journals"); });
    ph.appendChild(c);
    return;
  }
  $("#wiz-placeholder").innerHTML="";
  $("#wizard").hidden=false;
  if(S.submission){
    var c2=mk(`
    <div class="notice ok" style="margin-bottom:16px">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
      <div class="n2"></div>
    </div>`);
    $(".n2",c2).textContent=(lang==="zh"?"稿件已提交，流程进入编辑部处理阶段。你可以在“状态跟踪”页推进流程、查看模拟审稿意见；也可回到本页查阅已填写的投稿内容（只读）。":"The manuscript has been submitted and is now with the editorial office. Use the Track Status page to advance the workflow and read the simulated reviewer reports; this page remains available read-only.");
    $("#wiz-placeholder").appendChild(c2);
  }
  renderStepNav();
  renderStep();
}

function renderStepNav(){
  var ol=$("#step-list"); ol.innerHTML="";
  STEPS.forEach(function(sid,i){
    var li=mk(`<li><button class="snav" type="button"><span class="snum"></span><span class="stxt"></span></button></li>`);
    var b=$("button",li);
    $(".snum",b).textContent=String(i+1);
    var tx=$(".stxt",b);
    tx.textContent=t(sid+".t");
    if(i===S.step) b.classList.add("on");
    if(S.stepsDone[sid]) b.classList.add("done","ok");
    b.addEventListener("click",function(){ S.step=i; save(); renderWizard(); });
    ol.appendChild(li);
  });
}

function renderStep(){
  var sid=STEPS[S.step];
  var j=journal();
  $("#step-kicker").textContent=t("wz.step")+" "+(S.step+1)+" "+t("wz.of")+" "+STEPS.length;
  $("#step-title").textContent=t(sid+".t");
  $("#step-desc").textContent=t(sid+".d");
  var pct=Math.round(((S.step)/(STEPS.length))*100);
  if(S.submission) pct=100;
  $("#pbar-i").style.width=pct+"%";
  $("#pmeta-l").textContent=t("wz.progress")+" "+pct+"%";
  $("#pmeta-r").textContent=j.name+" · "+bt(j.sysShort);
  $("#btn-prev").disabled=(S.step===0);
  $("#btn-next").querySelector("span").textContent=(S.step===STEPS.length-1)?t("wz.submit"):t("wz.next");
  $("#step-errbox").hidden=true; $("#step-errbox").innerHTML="";

  var body=$("#step-body"); body.innerHTML="";
  var ro=!!S.submission;
  if(sid==="s0") stepAccount(body,ro);
  else if(sid==="s1") stepType(body,ro);
  else if(sid==="s2") stepGeneral(body,ro,j);
  else if(sid==="s3") stepAuthors(body,ro);
  else if(sid==="s4") stepDeclare(body,ro);
  else if(sid==="s5") stepFiles(body,ro,j);
  else if(sid==="s6") stepReviewers(body,ro,j);
  else if(sid==="s7") stepConfirm(body,ro,j);
  if(ro) $$("input,select,textarea,button[data-mut]",body).forEach(function(n){ n.disabled=true; });
  applyI18n(body);
  renderNote(sid);
}

function renderNote(sid){
  var card=$("#note-card"); card.innerHTML="";
  var h=mk(`
  <div>
    <h3>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg>

function fieldWrap(labelText,reqFlag,hintText,controlNode){

/* --- step 3: authors --- */
function stepAuthors(body,ro){
  var wrap=mk(`<div></div>`); body.appendChild(wrap);
  var contribKeys=["concep","data","analysis","draft","revise","superv","fund"];
  function draw(){
    wrap.innerHTML="";
    S.authors.forEach(function(au,i){
      var it=mk(`
      <div class="listitem">
        <div class="li-head">
          <div class="li-title"><span class="an"></span><span class="pill cp" hidden></span></div>
          <div class="li-acts">
            <button class="iconbtn bc" type="button"></button>
            <button class="iconbtn del rm" type="button">✕</button>
          </div>
        </div>
        <div class="grid2"></div>
        <div class="field cf" style="margin-bottom:10px">
          <label class="lbl"></label>
          <div class="chips cwrap"></div>
        </div>
        <div class="field" style="margin-bottom:0">
          <label class="lbl lo"></label>
          <input class="inp" type="text" name="orcid">
        </div>
        <div class="warnbox" hidden></div>
      </div>`);
      $(".an",it).textContent=t("s3.authorN")+" "+(i+1);
      var cp=$(".cp",it);
      if(au.corresp){ cp.hidden=false; cp.textContent=t("s3.corresp"); cp.classList.add("ok"); }
      var bc=$(".bc",it); bc.textContent=(lang==="zh"?"设为通讯作者":"Set as corresponding");
      if(!ro) bc.addEventListener("click",function(){
        S.authors.forEach(function(x,k){ x.corresp=(k===i); }); save(); draw();
      }); else bc.disabled=true;
      var rm=$(".rm",it);
      if(!ro) rm.addEventListener("click",function(){
        if(S.authors.length<=1){ toast(lang==="zh"?"至少需要一位作者":"At least one author is required","err"); return; }
        S.authors.splice(i,1); save(); draw();
      }); else rm.disabled=true;

      var g=$(".grid2",it);
      function addF(lb,ph,val,key,type){
        var inp=mk(`<input class="inp" type="text">`);
        if(type) inp.type=type;
        inp.value=val||""; inp.placeholder=ph;
        if(!ro) inp.addEventListener("input",function(){ au[key]=inp.value; save(); checkWarn(); });
        g.appendChild(fieldWrap(lb,true,null,inp));
        return inp;
      }
      var nInp=addF(t("s3.name"),t("s3.ph.name"),au.name,"name");
      var eInp=addF(t("s3.email"),t("s3.ph.email"),au.email,"email","email");
      var iInp=mk(`<input class="inp" type="text">`);
      iInp.value=au.inst||""; iInp.placeholder=t("s3.ph.inst");
      if(!ro) iInp.addEventListener("input",function(){ au.inst=iInp.value; save(); });
      g.appendChild(fieldWrap(t("s3.inst"),true,null,iInp));

      var cl=$(".lbl",$(".cf",it)); cl.textContent=t("s3.contrib");
      var cw2=$(".cwrap",it);
      contribKeys.forEach(function(k){
        var b=mk(`<button class="chip" type="button"></button>`);
        b.textContent=t("s3."+k);
        if(au.contrib && au.contrib.indexOf(k)>=0) b.classList.add("on");
        if(!ro) b.addEventListener("click",function(){
          au.contrib=au.contrib||[];
          var p=au.contrib.indexOf(k);
          if(p>=0) au.contrib.splice(p,1); else au.contrib.push(k);
          b.classList.toggle("on"); save();
        }); else b.disabled=true;
        cw2.appendChild(b);
      });

      $(".lo",it).textContent="ORCID";
      var oInp=$("input[name=orcid]",it);
      oInp.value=au.orcid||""; oInp.placeholder="0000-0000-0000-0000";
      if(!ro) oInp.addEventListener("input",function(){ au.orcid=oInp.value; save(); });

      var wb=$(".warnbox",it);
      function checkWarn(){
        var corr=null;
        S.authors.forEach(function(x){ if(x.corresp) corr=x; });
        var same=corr && au.email && au!==corr && domainOf(au.email) && au.email.trim().toLowerCase()===String(corr.email||"").trim().toLowerCase();
        if(same){ wb.hidden=false; wb.innerHTML=""; var n=mk(`<div class="notice warn" style="margin-top:10px"><span class="wt"></span></div>`); $(".wt",n).textContent=t("s3.warn.same"); wb.appendChild(n); }
        else { wb.hidden=true; wb.innerHTML=""; }
      }
      checkWarn();
      wrap.appendChild(it);
    });
    if(!ro){
      var add=mk(`<button class="btn sm" type="button" style="margin-top:4px"></button>`);
      add.textContent="+ "+t("s3.add");
      add.addEventListener("click",function(){
        S.authors.push({name:"",email:"",inst:"",contrib:[],orcid:"",corresp:false}); save(); draw();
      });
      wrap.appendChild(add);
    }
  }
  draw();
}

/* --- step 6: reviewers --- */
function stepReviewers(body,ro,j){
  function block(titleKey,listKey,addKey,isOpp){
    var h=mk(`<h4></h4>`); h.textContent=t(titleKey); body.appendChild(h);
    var w=mk(`<div></div>`); body.appendChild(w);
    function draw(){
      w.innerHTML="";
      var arr=S[listKey];
      if(!arr.length){
        var e=mk(`<div class="empty" style="padding:16px"></div>`);
        e.textContent=isOpp?(lang==="zh"?"（可选）未指定回避审稿人":"(Optional) No opposed reviewers listed"):(lang==="zh"?"尚未添加推荐审稿人（该刊要求至少 "+j.revMin+" 位）":"No suggested reviewers yet (this journal asks for at least "+j.revMin+")");
        w.appendChild(e);
      }
      arr.forEach(function(rv,i){
        var it=mk(`
        <div class="listitem">
          <div class="li-head">
            <div class="li-title"><span class="rn"></span><span class="pill dom" hidden></span></div>
            <div class="li-acts"><button class="iconbtn del rm" type="button">✕</button></div>
          </div>
          <div class="grid3"></div>
          <div class="field" style="margin-bottom:0"><label class="lbl lw"></label><input class="inp" type="text" name="why"></div>
          <div class="wb" hidden></div>
        </div>`);
        $(".rn",it).textContent=(isOpp?t("s6.oppN"):t("s6.sugN"))+" "+(i+1);
        var rm=$(".rm",it);
        if(!ro) rm.addEventListener("click",function(){ S[listKey].splice(i,1); save(); draw(); }); else rm.disabled=true;
        var g=$(".grid3",it);
        [["name",t("s6.name"),t("s6.ph.name"),true],["email",t("s6.email"),t("s6.ph.email"),true],["inst",t("s6.inst"),t("s6.ph.inst"),true]].forEach(function(spec){
          var inp=mk(`<input class="inp" type="text">`);
          if(spec[0]==="email") inp.type="email";
          inp.value=rv[spec[0]]||""; inp.placeholder=spec[2];
          if(!ro) inp.addEventListener("input",function(){ rv[spec[0]]=inp.value; save(); checkDom(); });
          g.appendChild(fieldWrap(spec[1],spec[3],null,inp));
        });
        $(".lw",it).textContent=t("s6.why");
        var wInp=$("input[name=why]",it);
        wInp.value=rv.why||""; wInp.placeholder=t("s6.ph.why");
        if(!ro) wInp.addEventListener("input",function(){ rv.why=wInp.value; save(); });
        var wb=$(".wb",it);
        var pill=$(".dom",it);
        function checkDom(){
          wb.innerHTML="";
          var dom=domainOf(rv.email);
          var authorDoms=S.authors.map(function(a){return domainOf(a.email);}).filter(Boolean);
          var self=(dom && authorDoms.indexOf(dom)>=0);
          pill.hidden=!self;
          if(self){
            pill.textContent=(lang==="zh"?"同域名":"Same domain"); pill.className="pill dom err";
            var n=mk(`<div class="notice err" style="margin-top:10px"><span class="wt"></span></div>`);
            $(".wt",n).textContent=t("s6.err.self"); wb.appendChild(n); wb.hidden=false;
          } else if(dom){
            pill.hidden=false; pill.textContent=dom; pill.className="pill dom";
            wb.hidden=true;
          } else { pill.hidden=true; wb.hidden=true; }
        }
        checkDom();
        w.appendChild(it);
      });
      if(!ro){
        var add=mk(`<button class="btn sm" type="button" style="margin-top:4px"></button>`);
        add.textContent="+ "+t(addKey);
        add.addEventListener("click",function(){ S[listKey].push({name:"",email:"",inst:"",why:""}); save(); draw(); });
        w.appendChild(add);
      }
    }
    draw();
    return w;
  }
  block("s6.sugTitle","reviewers","s6.add",false);
  body.appendChild(mk(`<div class="divider"></div>`));
  block("s6.oppTitle","opposed","s6.addOpp",true);
  var nn=mk(`<div class="notice warn" style="margin-top:12px"><span class="wt"></span></div>`);
  $(".wt",nn).textContent=t("s6.warn.opp"); body.appendChild(nn);
}

/* SECTION: scoring */
function computeScore(){
  var j=journal();
  var items=[];
  var max=0,score=0;
  function add(w,ok,zh,en){ max+=w; if(ok) score+=w; items.push({w:w,ok:!!ok,zh:zh,en:en}); }
  if(!j) return {score:0,max:100,items:[]};
  var absW=countWords(S.general.abstract);
  add(10,absW>0&&absW<=j.absMax,"摘要字数在期刊上限内（≤"+j.absMax+"）","Abstract within the journal limit (≤"+j.absMax+")");
  add(8,countWords(S.general.title)>=8,"标题信息完整（含对象、处理与指标）","Title is informative (object, treatment, response)");
  var kws=kwList(S.general.keywords);
  add(7,kws.length>=3&&kws.length<=j.kwMax,"关键词数量合规（3–"+j.kwMax+" 个）","Keyword count compliant (3–"+j.kwMax+")");
  var hls=S.general.highlights.map(function(x){return (x||"").trim();}).filter(Boolean);
  if(j.hl!=="no"){
    add(10,hls.length>=3&&hls.length<=5,"Highlights 条数合规（3–5 条）","Highlights count compliant (3–5)");
    add(8,hls.length>0&&hls.every(function(x){return x.length<=85;}),"每条 Highlight ≤ 85 字符","Every highlight ≤ 85 characters");
  }
  add(10,S.files.some(function(f){return f.type==="manuscript";}),"已上传稿件正文","Manuscript file uploaded");
  if(j.cl==="req") add(7,S.files.some(function(f){return f.type==="coverletter";}),"已上传投稿信文件","Cover letter file uploaded");
  if(j.hl==="req") add(5,S.files.some(function(f){return f.type==="highlights";}),"已上传 Highlights 文件","Highlights file uploaded");
  add(8,S.files.some(function(f){return f.type==="figure";})||S.files.length>=1,"图表文件已按要求准备","Artwork files prepared as required");
  var named=S.authors.filter(function(a){return a.name&&validEmail(a.email)&&a.inst;});
  add(8,named.length>=1,"作者姓名、邮箱与单位完整","Author names, emails and affiliations complete");
  add(5,S.authors.filter(function(a){return a.corresp;}).length===1,"已指定唯一通讯作者","Exactly one corresponding author designated");
  add(5,S.authors.every(function(a){return a.contrib&&a.contrib.length>0;}),"全部作者已填写 CRediT 贡献","CRediT contributions given for all authors");
  var fundOk=(S.declare.fund==="no")||(S.declare.fund==="yes"&&!!(S.declare.fundText||"").trim());
  add(6,fundOk,"基金情况已声明且编号完整","Funding position declared with grant numbers");
  add(5,!!S.declare.coi,"利益冲突已声明","Competing interests declared");
  var dn=0; for(var i=1;i<=7;i++){ if(S.declare.decls&&S.declare.decls["d"+i]) dn++; }
  add(7,dn===7,"7 项投稿声明全部确认","All 7 submission declarations confirmed");
  add(6,!!(S.declare.dataAvail||"").trim(),"已填写数据可用性声明","Data availability statement provided");
  var rv=S.reviewers.filter(function(r){return r.name&&validEmail(r.email)&&r.inst;});
  if(j.revMin>0) add(10,rv.length>=j.revMin,"推荐审稿人数量达标（≥"+j.revMin+" 位）","Sufficient suggested reviewers (≥"+j.revMin+")");
  add(5,rv.length>0&&rv.every(function(r){
    var d=domainOf(r.email);
    return d && S.authors.map(function(a){return domainOf(a.email);}).indexOf(d)<0;
  }),"推荐审稿人无同域名（非自我推荐）","No suggested reviewer shares the authors' domain");
  add(7,(S.coverLetter||"").length>=400,"投稿信内容充实（≥400 字符）","Cover letter substantive (≥400 characters)");
  var cn=0; for(var k=1;k<=10;k++){ if(S.checklist&&S.checklist["c"+k]) cn++; }
  add(5,cn===10,"提交前检查清单全部核对","Pre-submission checklist fully verified");
  return {score:score,max:max,items:items,pct:Math.round(score/max*100)};
}

/* SECTION: validation */
function validateStep(i){
  var errs=[];
  var j=journal();
  if(i===0){
    if(!S.account.full.trim()) errs.push(t("s0.err.full"));
    if(!validEmail(S.account.email)) errs.push(t("s0.err.email"));
    if(!S.account.inst.trim()) errs.push(t("s0.err.inst"));
    if(S.account.orcid.trim() && !/^\d{4}-\d{4}-\d{4}-\d{3}[\dX]$/.test(S.account.orcid.trim())) errs.push(t("s0.err.orcid"));
  } else if(i===1){
    if(!S.articleType) errs.push(t("s1.err"));
  } else if(i===2){
    if(countWords(S.general.title)<8) errs.push(t("s2.err.title"));
    var aw=countWords(S.general.abstract);
    if(!(aw>0&&aw<=j.absMax)) errs.push(t("s2.err.abstract"));
    var kw=kwList(S.general.keywords);
    if(!(kw.length>=3&&kw.length<=j.kwMax)) errs.push(t("s2.err.keywords"));
    if(j.hl!=="no"){
      var hls=S.general.highlights.map(function(x){return (x||"").trim();}).filter(Boolean);
      if(!(hls.length>=3&&hls.length<=5&&hls.every(function(x){return x.length<=85;}))) errs.push(t("s2.err.hl"));
    }
  } else if(i===3){
    var bad=false;
    S.authors.forEach(function(a){
      if(!a.name.trim()||!validEmail(a.email)||!a.inst.trim()) bad=true;
      if(!a.contrib||!a.contrib.length) bad=true;
    });
    if(bad) errs.push(t("s3.err.name")+" / "+t("s3.err.email")+" / "+t("s3.err.inst")+" / "+t("s3.err.contrib"));
    if(S.authors.filter(function(a){return a.corresp;}).length!==1) errs.push(t("s3.err.corresp"));
  } else if(i===4){
    if(!S.declare.fund) errs.push(t("s4.err.fund"));
    if(S.declare.fund==="yes" && !(S.declare.fundText||"").trim()) errs.push(t("s4.err.fund"));
    if(!S.declare.coi) errs.push(t("s4.err.coi"));
    var dn=0; for(var k=1;k<=7;k++){ if(S.declare.decls&&S.declare.decls["d"+k]) dn++; }
    if(dn!==7) errs.push(t("s4.err.decl"));
  } else if(i===5){
    if(!S.files.some(function(f){return f.type==="manuscript";})) errs.push(t("s5.err.manuscript"));
    if(j.cl==="req" && !S.files.some(function(f){return f.type==="coverletter";})) errs.push(t("s5.err.coverletter"));
    if(j.hl==="req" && !S.files.some(function(f){return f.type==="highlights";})) errs.push(t("s5.err.highlights"));
  } else if(i===6){
    if(j.revMin>0){
      var rv=S.reviewers.filter(function(r){return r.name&&validEmail(r.email)&&r.inst;});
      if(rv.length<j.revMin) errs.push(t("s6.err.min"));
      var bad2=false;
      S.reviewers.forEach(function(r){ if(!r.name.trim()||!validEmail(r.email)||!r.inst.trim()) bad2=true; });
      if(S.reviewers.length&&!bad2){} else if(S.reviewers.length) errs.push(t("s6.err.name")+" / "+t("s6.err.email")+" / "+t("s6.err.inst"));
      var doms=S.authors.map(function(a){return domainOf(a.email);}).filter(Boolean);
      var emails=S.reviewers.map(function(r){return String(r.email||"").trim().toLowerCase();});
      if(S.reviewers.some(function(r){ var d=domainOf(r.email); return d&&doms.indexOf(d)>=0; })) errs.push(t("s6.err.self"));
      if(new Set(emails.filter(Boolean)).size!==emails.filter(Boolean).length) errs.push(t("s6.err.same"));
    }
  } else if(i===7){
    if(j.cl==="req" && (S.coverLetter||"").length<400) errs.push(t("s7.err.cl"));
    var cn=0; for(var q=1;q<=10;q++){ if(S.checklist&&S.checklist["c"+q]) cn++; }
    if(cn!==10) errs.push(t("s7.err.chk"));
  }
  return errs;
}
function showErrors(errs){
  var box=$("#step-errbox");
  if(!errs.length){ box.hidden=true; box.innerHTML=""; return; }
  box.innerHTML="";
  var n=mk(`
  <div class="notice err">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
    <div style="min-width:0">
      <div style="font-weight:700;margin-bottom:5px" class="et"></div>
      <ul style="margin:0;padding-left:18px"></ul>
    </div>
  </div>`);
  $(".et",n).textContent=t("wz.errTitle");
  var ul=$("ul",n);
  errs.forEach(function(e){ var li=document.createElement("li"); li.textContent=e; li.style.marginBottom="3px"; ul.appendChild(li); });
  box.appendChild(n);

  box.scrollIntoView({behavior:"smooth",block:"nearest"});
}

/* SECTION: submit */
function doSubmit(){
  var sc=computeScore();
  var now=new Date();
  var id=(journal().id.substring(0,3).toUpperCase())+"-"+now.getFullYear()+"-"+String(Math.floor(Math.random()*89999)+10000);
  var pct=sc.pct;
  var outcome = pct<45 ? "reject" : (pct<70 ? "major" : (pct<90 ? "minor" : "accept"));
  S.submission={
    id:id, submittedAt:now.toISOString(), round:1, journalId:S.journalId,
    title:S.general.title, score:pct, scoreDetail:{score:sc.score,max:sc.max},
    outcome:outcome, revisions:[], withdrawn:false
  };
  S.tracking={ stageIndex:0, history:[{stage:"submitted",date:now.toISOString()}], decisionShown:false, published:false, rejectFinal:false };
  save();
  toast(t("wz.submitted"),"ok");
  switchView("tracking");
}

/* SECTION: tracking */
var STAGE_FLOW=["submitted","tech","editor","review","complete","decision"];
function stageLabel(k){
  var map={submitted:"st.submitted",tech:"st.tech",editor:"st.editor",review:"st.review",complete:"st.complete",decision:"st.decision",revision:"st.revision",rereview:"st.rereview",accept:"st.accept",press:"st.press",rejected:"st.rejected",withdrawn:"st.withdrawn"};
  return t(map[k]||k);
}
function stageDesc(k){
  var map={submitted:"st.submitted.d",tech:"st.tech.d",editor:"st.editor.d",review:"st.review.d",complete:"st.complete.d",decision:"st.decision.d",revision:"st.revision.d",rereview:"st.rereview.d",accept:"st.accept.d",press:"st.press.d",rejected:"st.rejected.d",withdrawn:"st.withdrawn.d"};
  return t(map[k]||"");
}
function currentStage(){
  if(!S.tracking) return null;
  var h=S.tracking.history;
  return h.length?h[h.length-1].stage:null;
}
function addStage(k){
  if(!S.tracking) return;
  S.tracking.history.push({stage:k,date:new Date().toISOString()});
  save();
}
function advanceStage(){
  if(!S.submission||!S.tracking) return;
  var st=currentStage();
  var idx=STAGE_FLOW.indexOf(st);
  if(st==="revision"||st==="rereview"){ addStage("decision"); S.tracking.decisionShown=true; renderTracking(); return; }
  if(idx>=0&&idx<STAGE_FLOW.length-1){
    var next=STAGE_FLOW[idx+1];
    addStage(next);
    if(next==="decision") S.tracking.decisionShown=true;
    renderTracking(); return;
  }
  if(st==="decision"){
    var oc=S.submission.outcome;
    if(oc==="reject"){ addStage("rejected"); S.tracking.rejectFinal=true; }
    else if(oc==="accept"){ addStage("accept"); }
    else { addStage("revision"); }
    renderTracking(); return;
  }
  if(st==="accept"){ addStage("press"); S.tracking.published=true; renderTracking(); return; }
  if(st==="press"||st==="rejected"||st==="withdrawn"){ toast(lang==="zh"?"流程已结束":"Workflow finished"); return; }
}
function autoPlay(){
  if(autoTimer){ clearInterval(autoTimer); autoTimer=null; return; }
  var guard=0;
  autoTimer=setInterval(function(){
    guard++;
    var st=currentStage();
    if(!st||st==="press"||st==="rejected"||st==="withdrawn"||st==="revision"||guard>16){
      clearInterval(autoTimer); autoTimer=null; renderTracking(); return;
    }
    advanceStage();
  },900);
}
function renderTracking(){
  if(!S.submission){
    $("#trk-content").hidden=true;
    var ph=$("#trk-placeholder"); ph.innerHTML="";
    var c=mk(`
    <div class="card pad" style="text-align:center;padding:46px 20px">
      <h3 class="h" style="font-size:19px;color:var(--brand);margin-bottom:8px"></h3>
      <p class="p" style="color:var(--ink-2);max-width:560px;margin:0 auto 20px"></p>
      <button class="btn primary" type="button" style="min-width:220px"><span class="b"></span></button>
    </div>`);
    $(".h",c).textContent=t("trk.noSub");
    $(".p",c).textContent=t("trk.noSubBody");
    $(".b",c).textContent=t("trk.goWizard");
    $("button",c).addEventListener("click",function(){ switchView(S.journalId?"wizard":"journals"); });
    ph.appendChild(c);
    return;
  }
  $("#trk-placeholder").innerHTML="";
  $("#trk-content").hidden=false;
  var sub=S.submission, trk=S.tracking;
  var j=journal();
  $("#ms-id").textContent=(lang==="zh"?"稿件编号 Manuscript ID":"Manuscript ID")+": "+sub.id;
  $("#ms-title").textContent=sub.title||"—";
  var st=currentStage();
  var ms=$("#ms-status"); ms.innerHTML="";
  var tag=mk(`<span class="status-tag"></span>`);
  tag.textContent=stageLabel(st);
  if(st==="accept"||st==="press") tag.classList.add("ok");
  if(st==="rejected") tag.classList.add("err");
  if(st==="decision"||st==="revision"||st==="rereview") tag.classList.add("warn");
  ms.appendChild(tag);
  if(sub.outcome && trk.decisionShown && st!=="rejected" && st!=="accept" && st!=="press" && st!=="revision" && st!=="rereview"){
    var d=mk(`<span class="pill"></span>`); d.textContent=t("dec."+sub.outcome); ms.appendChild(d);
  }
  var rd=mk(`<span class="pill"></span>`); rd.textContent=t("trk.round")+" "+sub.round; ms.appendChild(rd);
  var sd=mk(`<span class="pill"></span>`); sd.textContent=j.name; ms.appendChild(sd);
  var tm=mk(`<span class="pill"></span>`);
  tm.textContent=t("trk.submittedAt")+": "+dateStr(new Date(sub.submittedAt)); ms.appendChild(tm);

  /* timeline */
  var tl=$("#trk-timeline"); tl.innerHTML="";
  trk.history.forEach(function(h,i){
    var li=mk(`<li class="tl"><span class="tl-dot"></span><div class="tl-body"><b class="tb"></b><small class="td"></small><p class="tp"></p></div></li>`);
    li.classList.add("done");
    if(i===trk.history.length-1) li.classList.add("now");
    $(".tl-dot",li).textContent="✓";
    $(".tb",li).textContent=stageLabel(h.stage);
    $(".td",li).textContent=dateStr(new Date(h.date));
    $(".tp",li).textContent=stageDesc(h.stage);
    tl.appendChild(li);
  });

  /* actions */
  var acts=$("#trk-actions"); acts.innerHTML="";
  function ab(label,cls,fn){
    var b=mk(`<button class="btn" type="button"></button>`);
    if(cls) b.classList.add(cls);
    b.textContent=label; b.addEventListener("click",fn); acts.appendChild(b); return b;
  }
  if(st!=="withdrawn"&&st!=="rejected"&&st!=="press"){
    ab(t("trk.next"),"primary",function(){ advanceStage(); });
    ab(t("trk.auto"),null,function(){ autoPlay(); });
  }
  if(st==="revision"||st==="rereview"){ ab(t("trk.revise"),"gold",function(){ openRevision(); }); }
  if(st!=="withdrawn"&&st!=="rejected"&&st!=="press"&&st!=="accept"){
    ab(t("trk.withdraw"),"danger",function(){
      openModal(t("trk.withdrawTitle"),t("trk.withdrawBody"),function(){ addStage("withdrawn"); renderTracking(); });
    });
  }
  if(st==="rejected"||st==="withdrawn"||st==="press"){ ab(t("trk.resub"),null,function(){ switchView("journals"); }); }

  /* score */
  var sw=$("#trk-score"); sw.innerHTML="";
  var sc=computeScore();
  var pct=Math.round(sc.score/sc.max*100);
  var ring=mk(`
  <div class="score-ring">
    <svg width="96" height="96" viewBox="0 0 96 96">
      <circle cx="48" cy="48" r="40" fill="none" stroke="#eef1f6" stroke-width="9"/>
      <circle class="arc" cx="48" cy="48" r="40" fill="none" stroke="#1b3a6b" stroke-width="9" stroke-linecap="round" stroke-dasharray="251.2" stroke-dashoffset="251.2"/>
    </svg>
    <b class="pv"></b>
  </div>`);
  var arc=$(".arc",ring);
  arc.setAttribute("stroke-dashoffset",String(251.2*(1-pct/100)));
  arc.setAttribute("stroke",pct>=90?"#1f7a4d":(pct>=70?"#2f6fb5":(pct>=45?"#a9701a":"#a8342a")));
  $(".pv",ring).textContent=pct+"%";
  sw.appendChild(ring);
  var ul=mk(`<div style="flex:1 1 240px;min-width:0"><p class="subnote" style="margin-bottom:9px"></p><ul class="score-list"></ul></div>`);
  $(".subnote",ul).textContent=t("trk.scoreSub");
  var sl=$(".score-list",ul);
  sc.items.forEach(function(it){
    var li=mk(`<li class="y"><span class="m"></span><em class="x" style="font-style:normal;min-width:0"></em></li>`);
    li.className=it.ok?"y":"n";
    $(".m",li).textContent=it.ok?"✓":"✕";
    $(".x",li).textContent=(lang==="zh"?it.zh:it.en);
    sl.appendChild(li);
  });
  sw.appendChild(ul);

  /* reviews */
  var rw=$("#trk-review"); rw.innerHTML="";
  var reached=["review","complete","decision","revision","rereview","accept","press","rejected"].indexOf(st)>=0;
  var card=mk(`<div class="card pad"><h3 style="font-size:16px;color:var(--brand);margin-bottom:12px" class="rh"></h3><div class="rb"></div></div>`);
  $(".rh",card).textContent=t("trk.reviewTitle");
  var rb=$(".rb",card);
  if(!reached){
    var e=mk(`<div class="empty"></div>`); e.textContent=t("trk.reviewEmpty"); rb.appendChild(e);
  } else {
    var set=COMMENTS[sub.outcome]||COMMENTS.minor;
    set.forEach(function(r){
      var rev=null; REVIEWERS.forEach(function(x){ if(x.id===r.rid) rev=x; });
      var c=mk(`
      <div class="rev-card">
        <div class="rev-head">
          <b class="rn"></b>
          <span class="pill rf"></span>
          <span class="rev-rec rr"></span>
        </div>
        <div class="rev-body"><ol class="cl"></ol></div>
      </div>`);
      $(".rn",c).textContent=rev[lang].name;
      $(".rf",c).textContent=bt(rev[lang].field);
      $(".rr",c).textContent=bt(r.rec);
      var ol=$(".cl",c);
      r.c.forEach(function(cc){ var li=document.createElement("li"); li.textContent=bt(cc); ol.appendChild(li); });
      rb.appendChild(c);
    });

    if(trk.decisionShown || ["revision","rereview","accept","press","rejected"].indexOf(st)>=0){
      var lh=mk(`<h3 style="font-size:16px;color:var(--brand);margin:18px 0 10px" class="dh"></h3>`);
      lh.textContent=t("trk.decisionTitle")+" · "+t("dec."+sub.outcome);
      rb.appendChild(lh);
      var lt=mk(`<div class="letter"></div>`);
      lt.textContent=(lang==="zh"?LETTERS[sub.outcome].zh:LETTERS[sub.outcome].en).replace("{n}",String((COMMENTS[sub.outcome]||[]).length));
      rb.appendChild(lt);
    }

    if(sub.revisions && sub.revisions.length){
      var rh2=mk(`<h3 style="font-size:16px;color:var(--brand);margin:18px 0 10px"></h3>`);
      rh2.textContent=(lang==="zh"?"修改记录":"Revision history");
      rb.appendChild(rh2);
      sub.revisions.forEach(function(r,i){
        var it=mk(`<div class="listitem"><div class="li-head"><div class="li-title"><span class="rn"></span><span class="pill"></span></div></div><div class="rb2"></div></div>`);
        $(".rn",it).textContent=(lang==="zh"?"第 ":"Revision ")+(i+1)+(lang==="zh"?" 轮修改稿":"");
        $$(".pill",it)[0].textContent=dateStr(new Date(r.date));
        var b2=$(".rb2",it);
        r.files.forEach(function(fn){
          var p=mk(`<div style="font-size:13px;color:var(--ink-2);margin-bottom:3px"></div>`);
          p.textContent="· "+fn; b2.appendChild(p);
        });
        rb.appendChild(it);
      });
    }
  }
  rw.appendChild(card);
}

function openRevision(){
  var m=openModal(t("trk.revTitle"),t("trk.revHint"),function(){
    var hasResp=!!$("#rv-resp",m).checked;
    var hasFile=!!$("#rv-file",m).checked;
    if(!hasResp||!hasFile){ toast(t("trk.err.rev"),"err"); return; }
    S.submission.revisions=S.submission.revisions||[];
    var names=[];
    if(hasFile) names.push(t("trk.revFile"));
    if(hasResp) names.push(t("trk.revResp"));
    S.submission.revisions.push({date:new Date().toISOString(),files:names});
    S.submission.round=(S.submission.round||1)+1;
    if(hasResp&&hasFile){
      S.submission.outcome=(S.submission.outcome==="major")?"minor":"accept";
    }
    addStage("rereview");
    S.tracking.decisionShown=false;
    save(); renderTracking();
    toast((lang==="zh"?"修改稿已提交，进入第 ":"Revision submitted — round ")+S.submission.round+(lang==="zh"?" 轮":"") ,"ok");
  },t("wz.submit"));
  var ex=$(".m-extra",m);
  var box=mk(`
  <div style="margin-top:14px">
    <label class="check"><input type="checkbox" id="rv-file"><span class="ct"></span></label>
    <label class="check"><input type="checkbox" id="rv-resp"><span class="ct"></span></label>
  </div>`);
  $$(".ct",box)[0].textContent=t("trk.revFile")+" — Revised_Manuscript_marked.docx";
  $$(".ct",box)[1].textContent=t("trk.revResp")+" — Response_to_Reviewers.docx";
  ex.appendChild(box);
}

/* SECTION: knowledge base */
function renderKnowledge(){
  var map=$("#kb-map");
  if(!map.dataset.built){
    for(var i=1;i<=9;i++){
      (function(i){
        var c=mk(`<div class="kstep"><div class="n"></div><b class="kt"></b><p class="kd"></p></div>`);
        $(".n",c).textContent=String(i).padStart(2,"0");
        $(".kt",c).textContent=t("kb.map"+i+".t");
        $(".kd",c).textContent=t("kb.map"+i+".d");
        map.appendChild(c);
      })(i);
    }
    map.dataset.built="1";
  } else {
    var ks=$$(".kstep",map);
    for(var q=1;q<=9;q++){
      $(".kt",ks[q-1]).textContent=t("kb.map"+q+".t");
      $(".kd",ks[q-1]).textContent=t("kb.map"+q+".d");
    }
  }

  var sysTb=$("#kb-sys-body");
  if(sysTb){
    sysTb.innerHTML="";
    for(var si=1;si<=6;si++){
      var srow=mk(`<tr><td class="en sp"></td><td class="zh sn"></td><td class="nt sd"></td></tr>`);
      $(".sp",srow).textContent=t("kb.s"+si+".pub");
      $(".sn",srow).textContent=t("kb.s"+si+".name");
      $(".sd",srow).textContent=t("kb.s"+si+".note");
      sysTb.appendChild(srow);
    }
  }

  var tb=$("#kb-gloss-body"); tb.innerHTML="";
  var term=glossTerm.toLowerCase();
  var cnt=0;
  GLOSSARY.forEach(function(g){
    var hay=(g[0]+" "+g[1]+" "+g[2].zh+" "+g[2].en).toLowerCase();
    if(term && hay.indexOf(term)<0) return;
    cnt++;
    var tr=mk(`<tr><td class="en"></td><td class="zh"></td><td class="nt"></td></tr>`);
    $(".en",tr).textContent=g[0];
    $(".zh",tr).textContent=g[1];
    $(".nt",tr).textContent=bt(g[2]);
    tb.appendChild(tr);
  });
  $("#kb-gloss-empty").hidden=(cnt>0);

  var rj=$("#kb-reject");
  if(!rj.dataset.built){
    for(var r=1;r<=10;r++){
      (function(r){
        var a=mk(`
        <div class="acc">
          <button type="button"><span class="at" style="min-width:0"></span><svg class="caret" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
          <div class="body" hidden><p class="bd"></p></div>
        </div>`);
        var btn=$("button",a);
        btn.addEventListener("click",function(){
          var open=a.classList.toggle("open");
          $(".body",a).hidden=!open;
        });
        a.dataset.idx=String(r);
        rj.appendChild(a);
      })(r);
    }
    rj.dataset.built="1";
  }
  $$(".acc",rj).forEach(function(a){
    var r=a.dataset.idx;
    $(".at",a).textContent=r+". "+t("kb.r"+r+".t");
    $(".bd",a).textContent=t("kb.r"+r+".d");
  });

  var tl2=$("#kb-tools");
  if(!tl2.dataset.built){
    for(var s=1;s<=5;s++){
      (function(s){
        var a=mk(`
        <div class="acc">
          <button type="button"><span class="at" style="min-width:0"></span><svg class="caret" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
          <div class="body" hidden>
            <p class="bd"></p>
            <pre class="bp"></pre>
            <button class="btn sm cp" type="button"></button>
          </div>
        </div>`);
        var btn=$("button",a);
        btn.addEventListener("click",function(){
          var open=a.classList.toggle("open");
          $(".body",a).hidden=!open;
        });
        var cp=$(".cp",a);
        cp.addEventListener("click",function(e){
          e.stopPropagation();
          var txt=$(".bp",a).textContent;
          if(navigator.clipboard && navigator.clipboard.writeText){
            navigator.clipboard.writeText(txt).then(function(){ toast(lang==="zh"?"模板已复制到剪贴板":"Template copied to clipboard","ok"); },function(){ toast(lang==="zh"?"复制失败，请手动选择文本":"Copy failed — select the text manually","err"); });
          } else { toast(lang==="zh"?"当前浏览器不支持自动复制，请手动选择文本":"Automatic copy is unavailable in this browser","err"); }
        });
        a.dataset.idx=String(s);
        tl2.appendChild(a);
      })(s);
    }
    tl2.dataset.built="1";
  }
  $$(".acc",tl2).forEach(function(a){
    var s=a.dataset.idx;
    $(".at",a).textContent=t("kb.a"+s+".t");
    $(".bd",a).textContent=t("kb.a"+s+".d");
    $(".bp",a).textContent=t("kb.a"+s+".c");
    $(".cp",a).textContent=(lang==="zh"?"复制模板":"Copy template");
  });
}

/* SECTION: boot */
function setLang(l){
  lang=(l==="en")?"en":"zh";
  save();
  applyI18n(document);
  updateChrome();
  var mapW=$("#kb-map"), rj=$("#kb-reject"), tl=$("#kb-tools");
  if(mapW) delete mapW.dataset.built;
  if(rj) delete rj.dataset.built;
  if(tl) delete tl.dataset.built;
  switchView(curView);
}

function boot(){
  load();
  applyI18n(document);

  $("#lang-zh").addEventListener("click",function(){ setLang("zh"); });
  $("#lang-en").addEventListener("click",function(){ setLang("en"); });
  $$(".tab").forEach(function(b){
    b.addEventListener("click",function(){ switchView(b.getAttribute("data-view")); });
  });
  $("#j-search").addEventListener("input",function(e){ searchTerm=e.target.value; renderJournals(); });
  $("#kb-gloss-search").addEventListener("input",function(e){ glossTerm=e.target.value; renderKnowledge(); });

  $("#btn-prev").addEventListener("click",function(){
    if(S.step>0){ S.step--; save(); renderWizard(); window.scrollTo({top:0,behavior:"smooth"}); }
  });
  $("#btn-next").addEventListener("click",function(){
    if(!S.journalId){ switchView("journals"); return; }
    if(S.submission){
      switchView("tracking"); return;
    }
    var errs=validateStep(S.step);
    if(errs.length){ showErrors(errs); return; }
    S.stepsDone[STEPS[S.step]]=true;
    if(S.step===STEPS.length-1){
      openModal(t("s7.submitTitle"),t("s7.submitBody"),function(){ doSubmit(); },t("wz.submit"));
      return;
    }
    S.step++; save(); renderWizard(); window.scrollTo({top:0,behavior:"smooth"});
  });
  $("#btn-note").addEventListener("click",function(){
    var r=$("#note-rail"); r.hidden=!r.hidden;
    if(!r.hidden) r.scrollIntoView({behavior:"smooth",block:"nearest"});
  });
  $("#btn-reset").addEventListener("click",function(){
    openModal(t("wz.resetTitle"),t("wz.resetBody"),function(){
      resetAll(); updateChrome(); switchView("journals"); toast(t("reset.done"),"ok");
    },t("wz.confirm"));
  });

  updateChrome();
  if(S.submission) switchView("tracking");
  else if(S.journalId) switchView("wizard");
  else switchView("journals");
}
document.addEventListener("DOMContentLoaded",boot);
</script>
</body>
</html>
